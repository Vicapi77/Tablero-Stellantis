        const MAX_DOC_IMAGE_CHARS = 420000; // ~420 KB de texto base64 por imagen
        const compressImageToDataURL = (file) => new Promise((resolve, reject) => {
            const objectUrl = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                let best = null;
                const dimSteps = [1280, 960, 720, 520];
                outer:
                for (const maxDim of dimSteps) {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        const scale = maxDim / Math.max(width, height);
                        width = Math.max(1, Math.round(width * scale));
                        height = Math.max(1, Math.round(height * scale));
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    for (let q = 0.75; q >= 0.35; q -= 0.1) {
                        const dataUrl = canvas.toDataURL('image/jpeg', q);
                        best = dataUrl;
                        if (dataUrl.length <= MAX_DOC_IMAGE_CHARS) break outer;
                    }
                }
                URL.revokeObjectURL(objectUrl);
                resolve(best);
            };
            img.onerror = (e) => { URL.revokeObjectURL(objectUrl); reject(e); };
            img.src = objectUrl;
        });

            let acc = 0; const r = 40; const c = 50;

                const a1 = acc * 360; const a2 = (acc + p) * 360; acc += p;
                const x1 = c + r * Math.cos(Math.PI * a1 / 180); const y1 = c + r * Math.sin(Math.PI * a1 / 180);

                                <h2 className="font-bold flex gap-2 items-center"><Icons.Users /> {isNew ? 'Nuevo Empleado' : form.nombre || `Nómina ${form.nomina}`}</h2>
                                {!isNew && <p className="text-xs text-slate-400 mt-0.5">Nómina {form.nomina} · {AREA_META[form.plant] ? AREA_META[form.plant].code + ' · ' + AREA_META[form.plant].label : form.plant}</p>}
                            </div>
                            <div className="flex items-center gap-2">
                                {isAdmin && !isNew && !editMode && <button onClick={() => setEditMode(true)} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs flex items-center gap-1.5"><Icons.Edit />Editar</button>}
                                <button onClick={onClose}><Icons.X /></button>
                            </div>
                        </div>

                        <div className="p-6 overflow-y-auto space-y-5">
                            {!editMode ? (
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 col-span-2 sm:col-span-1"><p className="text-[10px] text-slate-500 uppercase font-bold">Nombre</p><p className="font-bold text-slate-700">{form.nombre}</p></div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Planta</p><p className="font-bold text-slate-700">{AREA_META[form.plant] ? AREA_META[form.plant].code : form.plant}</p></div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Status</p><p className="font-bold text-slate-700">{form.status}</p></div>
                                    <div className="rounded-lg p-3 border" style={{ backgroundColor: licStatus.color + '14', borderColor: licStatus.color + '44' }}>
                                        <p className="text-[10px] uppercase font-bold" style={{ color: licStatus.color }}>Licencia</p>
                                        <p className="font-bold" style={{ color: licStatus.color }}>{licStatus.label} <span className="text-[10px] font-normal">({fmtDate(form.licenciaVigencia)})</span></p>
                                    </div>
                                    <div className="rounded-lg p-3 border" style={{ backgroundColor: examStatus.color + '14', borderColor: examStatus.color + '44' }}>
                                        <p className="text-[10px] uppercase font-bold" style={{ color: examStatus.color }}>Examen Médico</p>
                                        <p className="font-bold" style={{ color: examStatus.color }}>{examStatus.label} <span className="text-[10px] font-normal">({fmtDate(form.examenVigencia)})</span></p>
                                    </div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-lg border">
                                    <div><label className="text-xs font-bold text-slate-500">Nómina</label><input type="number" name="nomina" required disabled={!isNew} value={form.nomina} onChange={change} className="w-full border rounded p-1.5 text-sm disabled:bg-slate-100" /></div>
                                    <div className="col-span-2"><label className="text-xs font-bold text-slate-500">Nombre</label><input type="text" name="nombre" required value={form.nombre} onChange={change} className="w-full border rounded p-1.5 text-sm uppercase" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Planta</label><select name="plant" value={form.plant} onChange={change} className="w-full border rounded p-1.5 text-sm">{PLANT_ORDER.map(p => <option key={p} value={p}>{AREA_META[p].code} · {AREA_META[p].label}</option>)}</select></div>
                                    <div><label className="text-xs font-bold text-slate-500">Status</label><input type="text" name="status" list="status-options" value={form.status} onChange={change} className="w-full border rounded p-1.5 text-sm" /><datalist id="status-options"><option value="OPERANDO" /><option value="BAJA" /><option value="INCAPACIDAD" /><option value="VACACIONES" /></datalist></div>
                                    <div><label className="text-xs font-bold text-slate-500">Vigencia Licencia</label><input type="date" name="licenciaVigencia" value={form.licenciaVigencia || ''} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Vigencia Examen Médico</label><input type="date" name="examenVigencia" value={form.examenVigencia || ''} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                </div>
                            )}

                            {!isNew && (
                                <div>
                                    <h4 className="text-sm font-bold text-slate-600 mb-2">Documentos</h4>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <DocSlot label="Licencia" icon={Icons.IdCard} url={docs.licenciaUrl} isAdmin={isAdmin} busy={busyDoc === 'licencia'}
                                            onUpload={f => uploadDoc(f, 'licencia')} onDelete={() => deleteDoc('licencia')} onView={() => setViewerUrl(docs.licenciaUrl)} />
                                        <DocSlot label="Examen Médico" icon={Icons.HeartPulse} url={docs.examenUrl} isAdmin={isAdmin} busy={busyDoc === 'examen'}
                                            onUpload={f => uploadDoc(f, 'examen')} onDelete={() => deleteDoc('examen')} onView={() => setViewerUrl(docs.examenUrl)} />
                                    </div>
                                </div>
                            )}
                            {isNew && <p className="text-xs text-slate-400 flex items-center gap-1.5"><Icons.Info />Guarda al empleado primero; después podrás cargar Licencia y Examen Médico.</p>}
                        </div>

                        {(editMode || isNew) && (
                            <div className="p-4 border-t bg-slate-50 flex justify-between items-center rounded-b-2xl">
                                {!isNew ? <button type="button" onClick={() => onDelete(employee)} className="text-xs text-red-500 hover:text-red-700 flex items-center gap-1.5"><Icons.Trash2 />Eliminar empleado</button> : <div></div>}
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => isNew ? onClose() : setEditMode(false)} className="px-4 py-2 rounded text-sm hover:bg-slate-200">Cancelar</button>
                                    <button type="button" disabled={saving} onClick={submit} className="px-4 py-2 rounded text-sm bg-indigo-600 text-white hover:bg-indigo-700 shadow disabled:opacity-60 flex items-center gap-2">{saving && <span className="loader-sm"></span>}{isNew ? 'Guardar' : 'Actualizar'}</button>
                                </div>
                            </div>
                        )}
                    </div>
                    <ImageViewer url={viewerUrl} onClose={() => setViewerUrl(null)} />
                </div>
            );
        };

        // --- COLUMNAS ORDENABLES (listado de personal) ---
        const STAFF_COLUMNS = (showPlant) => {
            const cols = [
                { key: 'nomina', label: 'Nómina', get: e => e.nomina },
                { key: 'nombre', label: 'Nombre', get: e => e.nombre || '' },
            ];
            if (showPlant) cols.push({ key: 'plant', label: 'Planta', get: e => AREA_META[e.plant] ? AREA_META[e.plant].label : (e.plant || '') });
            cols.push({ key: 'status', label: 'Status', get: e => e.status || '' });
            cols.push({ key: 'licencia', label: 'Licencia', get: e => docStatus(e.licenciaVigencia).label, center: true });
            cols.push({ key: 'examen', label: 'Examen Médico', get: e => docStatus(e.examenVigencia).label, center: true });
            return cols;
        };
        const sortStaff = (list, sort, columns) => {
            const col = columns.find(c => c.key === sort.key) || columns[0];
            const sorted = [...list].sort((a, b) => {
                const va = col.get(a), vb = col.get(b);
                if (typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' });
                return va - vb;
            });
            if (sort.dir === 'desc') sorted.reverse();
            return sorted;
        };

        const STATUS_BADGE = { vigente: 'bg-emerald-50 text-emerald-700', porVencer: 'bg-amber-50 text-amber-700', vencida: 'bg-rose-50 text-rose-700', sin: 'bg-slate-100 text-slate-500' };

        // --- TABLA DE PERSONAL (compartida entre el bloque "Personal Stellantis" y cada planta) ---
        const StaffListTable = ({ staff, showPlant, onOpenEmployee }) => {
            const columns = useMemo(() => STAFF_COLUMNS(showPlant), [showPlant]);
            const [sort, setSort] = useState({ key: 'nombre', dir: 'asc' });
            const sorted = useMemo(() => sortStaff(staff, sort, columns), [staff, sort, columns]);
            const toggleSort = key => setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });
            const arrow = key => sort.key === key ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '';
            return (
                <table className="w-full text-sm text-left">
                    <thead className="sticky top-0 bg-slate-50 text-slate-500 text-xs z-10">
                        <tr>
                            {columns.map(c => (
                                <th key={c.key} className={`p-3 cursor-pointer select-none hover:text-slate-700 hover:bg-slate-100 whitespace-nowrap ${c.center ? 'text-center' : ''}`} onClick={() => toggleSort(c.key)} title="Ordenar">
                                    {c.label}{arrow(c.key)}
                                </th>
                            ))}
                            <th className="p-3 text-center">Docs</th><th className="p-3"></th>
                        </tr>
                    </thead>
                    <tbody className="divide-y">
                        {sorted.length === 0 && <tr><td colSpan={columns.length + 2} className="p-6 text-center text-slate-400">Sin personal que coincida.</td></tr>}
                        {sorted.map(e => {
                            const lic = docStatus(e.licenciaVigencia);
                            const exam = docStatus(e.examenVigencia);
                            return (
                                <tr key={e.nomina} className="hover:bg-slate-50 row-btn cursor-pointer" onClick={() => onOpenEmployee(e)}>
                                    <td className="p-3 font-bold text-slate-700">{e.nomina}</td>
                                    <td className="p-3 text-slate-600">{e.nombre || '—'}</td>
                                    {showPlant && <td className="p-3 text-slate-500 text-xs">{AREA_META[e.plant] ? AREA_META[e.plant].code : e.plant}</td>}
                                    <td className="p-3 text-slate-500 text-xs">{e.status || '—'}</td>
                                    <td className="p-3 text-center"><span className={`text-xs font-bold px-2 py-0.5 rounded-full ${STATUS_BADGE[lic.key]}`}>{lic.label}</span></td>
                                    <td className="p-3 text-center"><span className={`text-xs font-bold px-2 py-0.5 rounded-full ${STATUS_BADGE[exam.key]}`}>{exam.label}</span></td>
                                    <td className="p-3 text-center"><span className="flex items-center justify-center gap-1">
                                        <span title="Licencia" className={e.licenciaUrl ? 'text-emerald-500' : 'text-slate-300'}><Icons.IdCard /></span>
                                        <span title="Examen Médico" className={e.examenUrl ? 'text-emerald-500' : 'text-slate-300'}><Icons.HeartPulse /></span>
                                    </span></td>
                                    <td className="p-3 text-right text-slate-300"><Icons.Eye /></td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            );
        };

        // --- PANEL DE PLANTA (acordeón) ---
        const PlantPanel = ({ plantKey, staff, search, defaultOpen, isAdmin, onOpenEmployee }) => {
            const [open, setOpen] = useState(defaultOpen);
            const meta = AREA_META[plantKey] || { code: plantKey, label: plantKey, color: '#64748b' };
            const filtered = useMemo(() => staff.filter(e => {
                if (!search) return true;
                const s = search.toLowerCase();
                return String(e.nomina).includes(s) || (e.nombre || '').toLowerCase().includes(s);
            }), [staff, search]);
            const completos = staff.filter(e => docStatus(e.licenciaVigencia).key === 'vigente' && docStatus(e.examenVigencia).key === 'vigente').length;
            const pct = staff.length > 0 ? (completos / staff.length * 100) : null;

            useEffect(() => { if (search) setOpen(true); }, [search]);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <button onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between p-4 hover:bg-slate-50 text-left">
                        <div className="flex items-center gap-3">
                            <span className="w-3 h-3 rounded-full inline-block" style={{ backgroundColor: meta.color }}></span>
                            <div><p className="font-bold text-slate-800">{meta.code} · {meta.label}</p><p className="text-xs text-slate-400">{staff.length} personas</p></div>
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-bold px-2.5 py-1 rounded-full" style={{ backgroundColor: completionColor(pct) + '1a', color: completionColor(pct) }}>{pct !== null ? pct.toFixed(0) + '% doc. completa' : 'Sin datos'}</span>
                            <span className={`text-slate-400 transition-transform ${open ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                        </div>
                    </button>
                    {open && (
                        <div className="border-t border-slate-100 slide-down">
                            <div className="max-h-96 overflow-y-auto">
                                <StaffListTable staff={filtered} showPlant={false} onOpenEmployee={onOpenEmployee} />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- BLOQUE "PERSONAL STELLANTIS" (un solo acordeón con todo el personal + columna de Planta) ---
        const AllStaffPanel = ({ staff, search, onOpenEmployee }) => {
            const [open, setOpen] = useState(false);
            const filtered = useMemo(() => staff.filter(e => {
                if (!search) return true;
                const s = search.toLowerCase();
                return String(e.nomina).includes(s) || (e.nombre || '').toLowerCase().includes(s);
            }), [staff, search]);
            useEffect(() => { if (search) setOpen(true); }, [search]);
            const completos = staff.filter(e => docStatus(e.licenciaVigencia).key === 'vigente' && docStatus(e.examenVigencia).key === 'vigente').length;
            const pct = staff.length > 0 ? (completos / staff.length * 100) : null;
            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <button onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between p-4 hover:bg-slate-50 text-left">
                        <div className="flex items-center gap-3">
                            <span className="w-3 h-3 rounded-full inline-block bg-slate-700"></span>
                            <div><p className="font-bold text-slate-800">Personal Stellantis</p><p className="text-xs text-slate-400">{staff.length} personas</p></div>
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-bold px-2.5 py-1 rounded-full" style={{ backgroundColor: completionColor(pct) + '1a', color: completionColor(pct) }}>{pct !== null ? pct.toFixed(0) + '% doc. completa' : 'Sin datos'}</span>
                            <span className={`text-slate-400 transition-transform ${open ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                        </div>
                    </button>
                    {open && (
                        <div className="border-t border-slate-100 slide-down">
                            <div className="max-h-96 overflow-y-auto">
                                <StaffListTable staff={filtered} showPlant={true} onOpenEmployee={onOpenEmployee} />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        const PlantillaDashboard = () => {
            const [staff, setStaff] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(false);
            const [search, setSearch] = useState('');
            const [plantFilter, setPlantFilter] = useState('Todas');
            const [modalEmployee, setModalEmployee] = useState(null);
            const [showNewModal, setShowNewModal] = useState(false);
            const [chartDetail, setChartDetail] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState(false);
            const [notification, setNotification] = useState(null);
            const [seeding, setSeeding] = useState(false);

            const showNotification = (type, message) => { setNotification({ type, message }); setTimeout(() => setNotification(null), 3000); };

            useEffect(() => {
                if (!db) { setIsLoading(false); setLoadError(true); return; }
                const unsub = db.collection(STAFF_COLLECTION).onSnapshot(
                    s => { setStaff(s.docs.map(d => d.data())); setIsLoading(false); },
                    err => { console.error(err); setIsLoading(false); setLoadError(true); }
                );
                return () => unsub();
            }, []);

            const handleLogin = e => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) { setIsAdmin(true); setShowLogin(false); setLoginError(false); setPasswordInput(''); showNotification('success', 'Modo Edición Activado'); }
                else setLoginError(true);
            };

            const runSeed = async () => {
                if (!db) return;
                setSeeding(true);
                try {
                    const chunks = []; for (let i = 0; i < PLANTILLA_SEED.length; i += 400) chunks.push(PLANTILLA_SEED.slice(i, i + 400));
                    for (const chunk of chunks) {
                        const batch = db.batch();
                        chunk.forEach(e => batch.set(db.collection(STAFF_COLLECTION).doc(String(e.nomina)), e, { merge: true }));
                        await batch.commit();
                    }
                    showNotification('success', `${PLANTILLA_SEED.length} empleados cargados desde el Excel`);
                } catch (e) { console.error(e); showNotification('error', 'Error al cargar datos'); }
                setSeeding(false);
            };

            const saveEmployee = async (payload, isNew) => {
                try {
                    await db.collection(STAFF_COLLECTION).doc(String(payload.nomina)).set(payload, { merge: true });
                    showNotification('success', isNew ? 'Empleado creado' : 'Empleado actualizado');
                    setModalEmployee(null); setShowNewModal(false);
                } catch (e) { console.error(e); showNotification('error', 'Error al guardar'); }
            };

            const deleteEmployee = async (e) => {
                if (!confirm(`¿Eliminar a ${e.nombre} (Nómina ${e.nomina})? Esta acción no se puede deshacer.`)) return;
                try {
                    await db.collection(STAFF_COLLECTION).doc(String(e.nomina)).delete();
                    showNotification('success', 'Empleado eliminado'); setModalEmployee(null);
                } catch (err) { console.error(err); showNotification('error', 'Error al eliminar'); }
            };

            const filteredStaff = useMemo(() => plantFilter === 'Todas' ? staff : staff.filter(e => e.plant === plantFilter), [staff, plantFilter]);

            const stats = useMemo(() => {
                const list = filteredStaff;
                const total = list.length;

                const byPlant = {}; PLANT_ORDER.forEach(p => byPlant[p] = 0);
                list.forEach(e => { byPlant[e.plant] = (byPlant[e.plant] || 0) + 1; });
                const plantData = PLANT_ORDER.map(p => ({ label: AREA_META[p].code, val: byPlant[p] || 0, color: AREA_META[p].color }));

                const licCounts = { vigente: 0, porVencer: 0, vencida: 0, sin: 0 };
                const examCounts = { vigente: 0, porVencer: 0, vencida: 0, sin: 0 };
                list.forEach(e => { licCounts[docStatus(e.licenciaVigencia).key]++; examCounts[docStatus(e.examenVigencia).key]++; });
                const licenciaData = Object.keys(STATUS_META).map(k => ({ label: STATUS_META[k].label, val: licCounts[k], color: STATUS_META[k].color }));
                const examenData = Object.keys(STATUS_META).map(k => ({ label: STATUS_META[k].label, val: examCounts[k], color: STATUS_META[k].color }));

                const completos = list.filter(e => docStatus(e.licenciaVigencia).key === 'vigente' && docStatus(e.examenVigencia).key === 'vigente').length;
                const vencidos = list.filter(e => docStatus(e.licenciaVigencia).key === 'vencida' || docStatus(e.examenVigencia).key === 'vencida').length;
                const porVencer = list.filter(e => {
                    const l = docStatus(e.licenciaVigencia).key, x = docStatus(e.examenVigencia).key;
                    return (l === 'porVencer' || x === 'porVencer') && l !== 'vencida' && x !== 'vencida';
                }).length;
                const sinDocs = list.filter(e => !e.licenciaUrl && !e.examenUrl).length;

                const docCompleteByPlant = PLANT_ORDER.map(p => {
                    const pl = list.filter(e => e.plant === p);
                    const comp = pl.filter(e => docStatus(e.licenciaVigencia).key === 'vigente' && docStatus(e.examenVigencia).key === 'vigente').length;
                    const pct = pl.length > 0 ? (comp / pl.length * 100) : null;
                    return { key: p, code: AREA_META[p].code, color: AREA_META[p].color, pct, n: pl.length };
                });

                // Vencimientos (licencia + examen) en los próximos 6 meses, agrupados por mes calendario.
                const now = new Date();
                const monthBuckets = [];
                for (let i = 0; i < 6; i++) {
                    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
                    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    monthBuckets.push({ key, label: `${MONTH_ABBR[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` });
                }
                const countsByMonth = {}; monthBuckets.forEach(b => countsByMonth[b.key] = 0);
                list.forEach(e => {
                    [e.licenciaVigencia, e.examenVigencia].forEach(dt => {
                        if (!dt) return;
                        const key = dt.slice(0, 7);
                        if (countsByMonth[key] !== undefined) countsByMonth[key]++;
                    });
                });
                const vencimientosData = monthBuckets.map(b => ({ label: b.label, val: countsByMonth[b.key], key: b.key }));

                const rank = k => k === 'vencida' ? 0 : k === 'porVencer' ? 1 : 2;
                const topAttention = list.filter(e => {
                    const l = docStatus(e.licenciaVigencia).key, x = docStatus(e.examenVigencia).key;
                    return l === 'vencida' || x === 'vencida' || l === 'porVencer' || x === 'porVencer';
                }).sort((a, b) => Math.min(rank(docStatus(a.licenciaVigencia).key), rank(docStatus(a.examenVigencia).key)) - Math.min(rank(docStatus(b.licenciaVigencia).key), rank(docStatus(b.examenVigencia).key)))
                    .slice(0, 8);

                return { total, plantData, licenciaData, examenData, completos, vencidos, porVencer, sinDocs, docCompleteByPlant, vencimientosData, topAttention };
            }, [filteredStaff]);

            const openVehicleFromChart = (e) => { setChartDetail(null); setModalEmployee(e); };

            const openPlantDocDetail = (bar) => {
                setChartDetail({
                    title: `Documentación — ${bar.code} (${AREA_META[bar.key].label})`,
                    employees: filteredStaff.filter(e => e.plant === bar.key),
                    metricLabel: 'Licencia / Examen',
                    metricGet: e => `${docStatus(e.licenciaVigencia).label} / ${docStatus(e.examenVigencia).label}`
                });
            };

            const openMonthDetail = (bar) => {
                setChartDetail({
                    title: `Vencimientos — ${bar.label}`,
                    employees: filteredStaff.filter(e => (e.licenciaVigencia && e.licenciaVigencia.slice(0, 7) === bar.key) || (e.examenVigencia && e.examenVigencia.slice(0, 7) === bar.key)),
                    metricLabel: 'Vence',
                    metricGet: e => {
                        const parts = [];
                        if (e.licenciaVigencia && e.licenciaVigencia.slice(0, 7) === bar.key) parts.push(`Licencia ${fmtDate(e.licenciaVigencia)}`);
                        if (e.examenVigencia && e.examenVigencia.slice(0, 7) === bar.key) parts.push(`Examen ${fmtDate(e.examenVigencia)}`);
                        return parts.join(' · ') || '—';
                    }
                });
            };

            const grouped = useMemo(() => {
                const g = {}; PLANT_ORDER.forEach(p => g[p] = []);
                filteredStaff.forEach(e => { if (g[e.plant]) g[e.plant].push(e); else g[e.plant] = [e]; });
                Object.keys(g).forEach(p => g[p].sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es')));
                return g;
            }, [filteredStaff]);

            const plantsToShow = plantFilter === 'Todas' ? PLANT_ORDER : [plantFilter];

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2.5">
                                <div className="p-1.5 bg-indigo-600 rounded-lg"><Icons.Users /></div>
                                <div><h1 className="text-lg font-bold flex items-center gap-2">Plantilla Stellantis {isLoading && <span className="loader"></span>}</h1><p className="text-[11px] text-slate-400">Norte · Van · Extensión · Camiones · Sur — licencias y exámenes médicos del personal</p></div>
                            </div>
                            <div className="flex gap-2 items-center flex-wrap justify-center">
                                <div className="flex items-center bg-slate-800 border border-slate-700 rounded overflow-hidden text-xs">
                                    <a href="index.html" title="Inicio" className="px-2 py-1 text-slate-300 hover:bg-slate-700 border-r border-slate-700 flex items-center"><Icons.Home /></a>
                                    <a href="Matriz_Cumplimiento_Transporte.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Table />Matriz</a>
                                    <a href="Flota_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Truck />Flota</a>
                                    <span className="px-2 py-1 bg-indigo-600 text-white flex items-center gap-1"><Icons.Users />Plantilla</span>
                                </div>
                                <div className="relative"><span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500"><Icons.Search /></span><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar nómina o nombre..." className="bg-slate-800 border border-slate-700 rounded pl-7 pr-2 py-1 text-xs w-40 outline-none focus:border-indigo-500" /></div>
                                <select className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs" value={plantFilter} onChange={e => setPlantFilter(e.target.value)}>
                                    <option value="Todas">Todas las plantas</option>
                                    {PLANT_ORDER.map(p => <option key={p} value={p}>{AREA_META[p].code} · {AREA_META[p].label}</option>)}
                                </select>
                                {isAdmin ? (
                                    <>
                                        <button onClick={() => setShowNewModal(true)} className="bg-indigo-600 hover:bg-indigo-700 px-2 py-1 rounded text-xs flex items-center gap-1.5"><Icons.Plus /> Empleado</button>
                                        <button onClick={() => { setIsAdmin(false); showNotification('success', 'Modo Vista Activado'); }} className="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs flex items-center gap-1.5" title="Salir modo admin"><Icons.LogOut /> Salir</button>
                                    </>
                                ) : (
                                    <button onClick={() => setShowLogin(true)} className="bg-slate-800 border border-slate-700 hover:bg-slate-700 px-2 py-1 rounded text-xs flex items-center gap-1.5 text-slate-300" title="Ingresar como Admin"><Icons.Lock /> Admin</button>
                                )}
                            </div>
                        </div>
                    </header>

                    {notification && <div className={`fixed top-20 right-4 p-4 rounded shadow-lg z-50 text-white ${notification.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>{notification.message}</div>}

                    {showLogin && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm fade-in">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg text-slate-800">Acceso Administrador</h3><button onClick={() => { setShowLogin(false); setLoginError(false); setPasswordInput(''); }} className="text-slate-400 hover:text-slate-600"><Icons.X /></button></div>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">Contraseña</label><input type="password" autoFocus value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="w-full border rounded p-2 outline-none focus:border-indigo-500" placeholder="••••••" />
                                    {loginError && <p className="text-xs text-red-500 mt-1">Contraseña incorrecta.</p>}</div>
                                    <button type="submit" className="w-full bg-slate-900 text-white py-2 rounded font-bold hover:bg-slate-800">Ingresar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-8 space-y-8">
                        {loadError && <div className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-2 rounded-lg">No fue posible conectar con la base de datos en vivo — verifica tu conexión.</div>}

                        {!isLoading && staff.length === 0 && !loadError && (
                            <div className="bg-white border border-dashed border-slate-300 rounded-xl p-8 text-center space-y-3">
                                <p className="text-slate-500 text-sm">Aún no hay personal cargado en la base de datos.</p>
                                <button onClick={runSeed} disabled={seeding} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm inline-flex items-center gap-2 disabled:opacity-60">{seeding && <span className="loader-sm"></span>}Cargar {PLANTILLA_SEED.length} empleados desde el Excel</button>
                            </div>
                        )}

                        {/* KPIs */}
                        <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                            <StatCard title="Total de personal" value={stats.total} icon={Icons.Users} color="#1e293b" />
                            <StatCard title="Documentación completa" value={stats.completos} icon={Icons.CheckCircle} color="#10b981" />
                            <StatCard title="Por vencer (≤60 días)" value={stats.porVencer} icon={Icons.Calendar} color="#f59e0b" />
                            <StatCard title="Documentos vencidos" value={stats.vencidos} icon={Icons.AlertTriangle} color="#e11d48" />
                            <StatCard title="Sin documentos cargados" value={stats.sinDocs} icon={Icons.Info} color="#94a3b8" />
                        </div>

                        {/* GRÁFICOS PRINCIPALES */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.BarChart2 /></span> Panorama de la plantilla{plantFilter !== 'Todas' ? ` — ${AREA_META[plantFilter].label}` : ''}</h3>
                            <div className="grid grid-cols-1 xl:grid-cols-4 gap-5">
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                    <DonutChart title="Personal por Planta" data={stats.plantData} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                    <DonutChart title="Estado de Licencia" data={stats.licenciaData} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                    <DonutChart title="Estado de Examen Médico" data={stats.examenData} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Documentación Completa por Planta</h5>
                                    <PlantMetricBars data={stats.docCompleteByPlant} onBarClick={openPlantDocDetail} />
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Vencimientos próximos (Licencia + Examen)</h5>
                                <BarChartOrdinal data={stats.vencimientosData} color="#4f46e5" onBarClick={openMonthDetail} />
                            </div>
                            <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 bg-slate-50 font-bold border-b flex justify-between items-center text-sm"><span className="flex gap-2 items-center"><span className="text-rose-500"><Icons.AlertTriangle /></span> Personal que requiere atención</span><span className="text-xs bg-rose-100 text-rose-700 px-2 py-1 rounded-full">{stats.topAttention.length}</span></div>
                                <div className="max-h-64 overflow-y-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 text-slate-500 text-xs"><tr><th className="p-3">Nómina</th><th className="p-3">Nombre</th><th className="p-3">Planta</th><th className="p-3 text-center">Licencia</th><th className="p-3 text-center">Examen</th></tr></thead>
                                        <tbody className="divide-y">
                                            {stats.topAttention.length === 0 && <tr><td colSpan="5" className="p-6 text-center text-slate-400">Sin pendientes críticos por el momento.</td></tr>}
                                            {stats.topAttention.map(e => {
                                                const lic = docStatus(e.licenciaVigencia), exam = docStatus(e.examenVigencia);
                                                return (
                                                    <tr key={e.nomina} className="hover:bg-slate-50 cursor-pointer" onClick={() => setModalEmployee(e)}>
                                                        <td className="p-3 font-bold text-slate-700">{e.nomina}</td>
                                                        <td className="p-3 text-slate-600">{e.nombre}</td>
                                                        <td className="p-3 text-slate-500 text-xs">{AREA_META[e.plant] ? AREA_META[e.plant].code : e.plant}</td>
                                                        <td className="p-3 text-center"><span className={`text-xs font-bold px-2 py-0.5 rounded-full ${STATUS_BADGE[lic.key]}`}>{lic.label}</span></td>
                                                        <td className="p-3 text-center"><span className={`text-xs font-bold px-2 py-0.5 rounded-full ${STATUS_BADGE[exam.key]}`}>{exam.label}</span></td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        {/* PERSONAL STELLANTIS (todos, un solo bloque con columna de Planta) */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Users /></span> Personal Stellantis</h3>
                            <AllStaffPanel staff={filteredStaff} search={search} onOpenEmployee={setModalEmployee} />
                        </div>

                        {/* LISTADO POR PLANTA */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Layers /></span> Personal por planta</h3>
                            <div className="space-y-3">
                                {plantsToShow.map(p => <PlantPanel key={p} plantKey={p} staff={grouped[p] || []} search={search} defaultOpen={plantsToShow.length === 1} isAdmin={isAdmin} onOpenEmployee={setModalEmployee} />)}
                            </div>
                        </div>
                    </main>

                    <ChartDetailModal info={chartDetail} onOpenEmployee={openVehicleFromChart} onClose={() => setChartDetail(null)} />

                    {modalEmployee && (
                        <EmployeeModal employee={modalEmployee} isAdmin={isAdmin} isNew={false}
                            onClose={() => setModalEmployee(null)} onSave={saveEmployee} onDelete={deleteEmployee} showNotification={showNotification} />
                    )}
                    {showNewModal && (
                        <EmployeeModal employee={null} isAdmin={isAdmin} isNew={true}
                            onClose={() => setShowNewModal(false)} onSave={saveEmployee} onDelete={() => {}} showNotification={showNotification} />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<PlantillaDashboard />);
    </script>
</body>
</html>
