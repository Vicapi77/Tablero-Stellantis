                                        <div><label className="text-xs font-bold text-slate-500 block">Km del odómetro</label><input type="number" value={km} onChange={e => setKm(e.target.value)} placeholder="Opcional" className="w-full border rounded p-1.5 text-sm" /></div>
                                    </div>
                                    <div><label className="text-xs font-bold text-slate-500 block">Observaciones</label><textarea value={obs} onChange={e => setObs(e.target.value)} rows="2" placeholder="Trabajos realizados, taller…" className="w-full border rounded p-1.5 text-sm"></textarea></div>
                                    <p className="text-[11px] text-slate-400">Con esta fecha inicia el siguiente ciclo y se programa su próximo preventivo.</p>
                                </div>
                            )}
                            {mode === 'no' && (
                                <div className="space-y-3">
                                    <div><label className="text-xs font-bold text-slate-500 block">Motivo</label><input value={motivo} onChange={e => setMotivo(e.target.value)} placeholder="Unidad en ruta, falta de refacción…" className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-slate-500 block">Reprogramar para (opcional)</label><input type="date" name="pvNueva" value={nueva} min={pvIso(pvToday())} onChange={e => setNueva(e.target.value)} className="w-full border rounded p-1.5 text-sm" />
                                        <p className="text-[11px] text-slate-400 mt-1">Si pones fecha, la falta queda en el historial y la unidad se programa de nuevo.</p></div>
                                </div>
                            )}
                            {err && <p className="text-xs text-rose-600">{err}</p>}
                        </div>
                        <div className="p-4 border-t bg-slate-50 flex justify-end gap-2 rounded-b-2xl">
                            <button onClick={mode === 'menu' ? onClose : () => setMode('menu')} className="px-4 py-2 rounded text-sm hover:bg-slate-200">{mode === 'menu' ? 'Cerrar' : 'Atrás'}</button>
                            {mode === 'ok' && <button data-action="pv-save-ok" disabled={busy} onClick={() => run(() => { if (!pvD(fecha)) throw new Error('Captura la fecha de atención'); return onAttend(item, { fecha, km: pvNum(km), obs: obs.trim() }); })} className="px-4 py-2 rounded text-sm bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-60 flex items-center gap-2">{busy && <span className="loader-sm"></span>}Registrar atención</button>}
                            {mode === 'no' && <button data-action="pv-save-no" disabled={busy} onClick={() => run(() => onMiss(item, { motivo: motivo.trim(), nueva }))} className="px-4 py-2 rounded text-sm bg-rose-600 text-white hover:bg-rose-700 disabled:opacity-60 flex items-center gap-2">{busy && <span className="loader-sm"></span>}Guardar</button>}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Parámetros del programa (solo afectan a lo que se programe de aquí en adelante) ---
        const PvConfigModal = ({ cfg, onClose, onSave, onReplan, pendingFuture }) => {
            const [f, setF] = useState({ ...cfg });
            const [busy, setBusy] = useState(false);
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md fade-in" onClick={e => e.stopPropagation()}>
                        <div className="bg-slate-900 p-4 flex justify-between items-center text-white rounded-t-2xl"><h2 className="font-bold">Parámetros del programa</h2><button onClick={onClose}><Icons.X /></button></div>
                        <div className="p-5 space-y-3 text-sm">
                            <div className="grid grid-cols-2 gap-3">
                                <div><label className="text-xs font-bold text-slate-500 block">Capacidad del taller / día</label><input type="number" min="1" max="50" value={f.cap} onChange={e => setF(x => ({ ...x, cap: Math.max(1, +e.target.value || 1) }))} className="w-full border rounded p-1.5" /></div>
                                <div><label className="text-xs font-bold text-slate-500 block">Anticipación (días)</label><input type="number" min="0" max="30" value={f.lead} onChange={e => setF(x => ({ ...x, lead: Math.max(0, +e.target.value || 0) }))} className="w-full border rounded p-1.5" /></div>
                                <div><label className="text-xs font-bold text-slate-500 block">Repartir vencidas en</label><select value={f.rep} onChange={e => setF(x => ({ ...x, rep: +e.target.value }))} className="w-full border rounded p-1.5">{[10, 15, 20, 30].map(n => <option key={n} value={n}>{n} días</option>)}</select></div>
                                <label className="flex items-center gap-2 text-sm mt-5"><input type="checkbox" checked={f.sab} onChange={e => setF(x => ({ ...x, sab: e.target.checked }))} /> Taller abre sábado</label>
                            </div>
                            <p className="text-[11px] text-slate-400">Se aplican a las unidades que se programen de aquí en adelante; lo ya programado no se mueve.</p>
                            <div className="border-t pt-3">
                                <p className="text-xs font-bold text-slate-600">Volver a programar lo pendiente</p>
                                <p className="text-[11px] text-slate-500 mb-2">Recalcula las {pendingFuture} fechas futuras pendientes con estos parámetros. Lo vencido, atendido o no atendido se conserva.</p>
                                <button disabled={busy} onClick={async () => { if (!confirm(`¿Volver a programar ${pendingFuture} fechas pendientes?`)) return; setBusy(true); await onReplan(f); setBusy(false); }} className="text-xs border border-slate-300 hover:bg-slate-100 px-3 py-1.5 rounded">Reprogramar pendientes</button>
                            </div>
                        </div>
                        <div className="p-4 border-t bg-slate-50 flex justify-end gap-2 rounded-b-2xl">
                            <button onClick={onClose} className="px-4 py-2 rounded text-sm hover:bg-slate-200">Cancelar</button>
                            <button disabled={busy} onClick={async () => { setBusy(true); await onSave(f); setBusy(false); }} className="px-4 py-2 rounded text-sm bg-rose-600 text-white hover:bg-rose-700">Guardar</button>
                        </div>
                    </div>
                </div>
            );
        };

        const PreventivoView = ({ isAdmin, plantFilter, search, showNotification }) => {
            const [tab, setTab] = useState('resumen');
            const [base, setBase] = useState(null);
            const [source, setSource] = useState('');
            const [plan, setPlan] = useState(null); // { config, entries }
            const [planErr, setPlanErr] = useState(false);
            const [attend, setAttend] = useState(null);
            const [showCfg, setShowCfg] = useState(false);
            const [stFilter, setStFilter] = useState('');
            const [hor, setHor] = useState(60);
            const [grp, setGrp] = useState('semana');
            const planRef = db ? db.collection(PREV_PLAN_COLLECTION).doc('main') : null;
            const savingRef = useRef(false);
            const hoy = pvToday();

            // Unidades: Google Sheet del tablero de preventivos (solo lectura) o datos iniciales
            useEffect(() => {
                let cancel = false;
                (async () => {
                    try {
                        const res = await fetch(PREV_SCRIPT_URL + '?action=list&t=' + Date.now());
                        const j = await res.json();
                        if (!j.ok || !j.unidades || !j.unidades.length) throw new Error('sin unidades');
                        if (!cancel) { setBase(pvBase(j.unidades)); setSource('Google Sheet'); }
                    } catch (e) { if (!cancel) { setBase(pvBase(PREV_SEED)); setSource('Datos iniciales'); } }
                })();
                return () => { cancel = true; };
            }, []);

            // Programa congelado (Firestore)
            useEffect(() => {
                if (!planRef) { setPlan({ config: PV_DEFAULT_CFG, entries: {} }); setPlanErr(true); return; }
                const un = planRef.onSnapshot(s => { const d = s.exists ? s.data() : {}; setPlan({ config: { ...PV_DEFAULT_CFG, ...(d.config || {}) }, entries: d.entries || {}, startedAt: d.startedAt || null }); setPlanErr(false); },
                    err => { console.error(err); setPlanErr(true); setPlan(p => p || { config: PV_DEFAULT_CFG, entries: {} }); });
                return () => un();
            }, []);

            const units = useMemo(() => base && plan ? pvProject(base, plan.entries) : [], [base, plan]);

            // Ciclos sin fecha → se programan una vez y se guardan
            const missing = useMemo(() => base && plan ? pvScheduleMissing(units, plan.entries, plan.config) : {}, [units, plan]);
            const entries = useMemo(() => plan ? { ...plan.entries, ...missing } : {}, [plan, missing]);
            useEffect(() => {
                const n = Object.keys(missing).length;
                if (!n || !planRef || planErr || savingRef.current) return;
                savingRef.current = true;
                const patch = { entries: missing, updatedAt: new Date().toISOString() };
                if (!plan.startedAt) { patch.startedAt = pvIso(hoy); patch.config = plan.config; }
                planRef.set(patch, { merge: true }).catch(e => console.error('No se pudo guardar el programa', e)).finally(() => { savingRef.current = false; });
            }, [missing, planErr]);

            const unitIds = useMemo(() => new Set(units.map(u => u.id)), [units]);
            const unitById = useMemo(() => { const m = {}; units.forEach(u => { m[u.id] = u; }); return m; }, [units]);
            // Partidas del programa: fecha vigente de cada ciclo + faltas que se reprogramaron (historial)
            const items = useMemo(() => {
                const out = [];
                Object.entries(entries).forEach(([key, e]) => {
                    if (!unitIds.has(e.id)) return;
                    (e.history || []).forEach((h, i) => out.push({ key, e, hist: i, prog: pvD(h.prog), st: 'no', motivo: h.motivo, current: false }));
                    const u = unitById[e.id];
                    out.push({ key, e, prog: pvD(e.prog), st: pvStatus(e, hoy), current: !!u && u.key === key });
                });
                return out;
            }, [entries, unitIds, unitById]);

            const plantOk = p => plantFilter === 'Todas' || p === plantFilter;
            const q = (search || '').trim().toUpperCase();
            const FI = useMemo(() => items.filter(it => plantOk(it.e.planta) && (!q || String(it.e.id).toUpperCase().includes(q))), [items, plantFilter, q]);
            const curItems = FI.filter(it => it.current);

            // --- acciones ---
            const savePatch = async (key, entry) => {
                if (!planRef) throw new Error('Base de datos no disponible');
                await planRef.set({ entries: { [key]: entry }, updatedAt: new Date().toISOString() }, { merge: true });
            };
            const syncSheet = async (u, fecha, km, obs, prog) => {
                // Mejor esfuerzo: actualiza también el Google Sheet del tablero de preventivos (fechas y registro de atención)
                if (source !== 'Google Sheet') return null;
                const r = base.find(x => x.id === u.id); if (!r) return null;
                const it = (r.kmProx !== null && r.kmUP !== null) ? r.kmProx - r.kmUP : 20000;
                let k = km; if (k === null && r.kmUP !== null) k = Math.round(r.kmUP + (r.kmRec || 0) + (u.rate || 0) * Math.max(0, pvDiff(fecha, r.refKm || r.ult)));
                const nr = { ...r, pen: r.ult, ult: fecha, kmUP: k, kmProx: k !== null ? k + it : it, kmRec: 0, kmFal: it, diasUP: 0, refKm: fecha, kmDia: Math.round(u.rate || r.kmDia || 0) || null, obs: obs || r.obs };
                const reg = { ACCION: 'ATENCION', ID: r.id, PLANTA: r.planta, FECHA_ATENCION: pvIso(fecha), FECHA_PROGRAMADA: prog || '', FECHA_PROYECTADA: pvIso(u.proy), OBSERVACIONES: obs || '' };
                try {
                    const res = await fetch(PREV_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'upsert', pin: ADMIN_PASSWORD, unidad: pvToRow(nr), prevId: r.id, registro: reg }) });
                    const j = await res.json(); if (!j.ok) throw new Error(j.error || 'error');
                    return true;
                } catch (e) { console.warn('Google Sheet no actualizado', e); return false; }
            };
            const onAttend = async (it, { fecha, km, obs }) => {
                const fd = pvD(fecha);
                const entry = { ...it.e, status: 'atendida', fechaAtencion: pvIso(fd), obs: obs || '', km: km ?? null, updatedAt: new Date().toISOString() };
                await savePatch(it.key, entry);
                const u = unitById[it.e.id];
                const sheet = u && u.key === it.key ? await syncSheet(u, fd, km, obs, it.e.prog) : null;
                setAttend(null);
                showNotification('success', `Unidad ${it.e.id} atendida` + (sheet === false ? ' (no se pudo actualizar el Google Sheet)' : ''));
            };
            const onMiss = async (it, { motivo, nueva }) => {
                const now = new Date().toISOString();
                const nd = pvD(nueva);
                const entry = nd
                    ? { ...it.e, history: [...(it.e.history || []), { prog: it.e.prog, motivo: motivo || it.e.motivo || '', at: now }], prog: pvIso(nd), status: 'pendiente', motivo: '', updatedAt: now }
                    : { ...it.e, status: 'no_atendida', motivo: motivo || '', updatedAt: now };
                await savePatch(it.key, entry);
                setAttend(null);
                showNotification('success', nd ? `Unidad ${it.e.id} reprogramada al ${pvF(nd)}` : `Unidad ${it.e.id} marcada como no atendida`);
            };
            const onUndo = async it => {
                const entry = { ...it.e, status: 'pendiente', motivo: '', updatedAt: new Date().toISOString() };
                await savePatch(it.key, entry); setAttend(null); showNotification('success', 'Registro deshecho');
            };
            const pendingFuture = Object.values(entries).filter(e => e.status === 'pendiente' && pvD(e.prog) >= hoy).length;
            const saveCfg = async c => { try { await planRef.set({ config: c }, { merge: true }); setShowCfg(false); showNotification('success', 'Parámetros guardados'); } catch (e) { showNotification('error', 'Error al guardar'); } };
            const replan = async c => {
                try {
                    const keep = {}; Object.entries(plan.entries).forEach(([k, e]) => { if (!(e.status === 'pendiente' && pvD(e.prog) >= hoy && !(e.history || []).length)) keep[k] = e; });
                    const fresh = pvScheduleMissing(units, keep, c);
                    await planRef.set({ config: c, entries: { ...keep, ...fresh }, startedAt: plan.startedAt || pvIso(hoy), updatedAt: new Date().toISOString() });
                    setShowCfg(false); showNotification('success', `${Object.keys(fresh).length} fechas reprogramadas`);
                } catch (e) { console.error(e); showNotification('error', 'Error al reprogramar'); }
            };

            if (!base || !plan) return <div className="bg-white border border-slate-200 rounded-xl p-10 text-center text-slate-400 text-sm"><span className="loader mr-2"></span> Cargando programa de preventivos…</div>;

            const openItem = it => { if (isAdmin) setAttend(it); };
            return (
                <div className="space-y-5" data-view="preventivo">
                    <div className="flex items-center justify-between flex-wrap gap-3">
                        <div className="flex items-center gap-1 border-b border-slate-200">
                            {[['resumen', 'Resumen'], ['gantt', 'Gantt de atención']].map(([k, l]) => (
                                <button key={k} data-pvtab={k} onClick={() => setTab(k)} className={`px-4 py-2 text-sm font-bold border-b-2 -mb-px ${tab === k ? 'border-rose-600 text-slate-800' : 'border-transparent text-slate-400 hover:text-slate-600'}`}>{l}</button>
                            ))}
                        </div>
                        <div className="flex items-center gap-2 flex-wrap text-xs">
                            <span className="text-slate-400">{units.length} unidades · fuente: {source}{plan.startedAt ? ` · programa desde ${pvF(pvD(plan.startedAt))}` : ''}</span>
                            {isAdmin && <button onClick={() => setShowCfg(true)} className="bg-white border border-slate-300 hover:bg-slate-100 px-2.5 py-1 rounded flex items-center gap-1.5 text-slate-600"><Icons.Wrench /> Parámetros</button>}
                        </div>
                    </div>
                    {planErr && <div className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-2 rounded-lg">No se pudo leer el programa guardado. Las fechas mostradas son provisionales y no se guardan hasta que se recupere la conexión.</div>}
                    {!isAdmin && <p className="text-[11px] text-slate-400 -mt-2 flex items-center gap-1.5"><Icons.Info /> Para marcar una fecha como atendida o no atendida entra como Admin.</p>}

                    {tab === 'resumen'
                        ? <PvResumen FI={FI} cur={curItems} entries={entries} cfg={plan.config} hoy={hoy} stFilter={stFilter} setStFilter={setStFilter} isAdmin={isAdmin} onOpen={openItem} />
                        : <PvGantt FI={FI} unitById={unitById} cfg={plan.config} hoy={hoy} hor={hor} setHor={setHor} grp={grp} setGrp={setGrp} isAdmin={isAdmin} onOpen={openItem} />}

                    {attend && <PvAttendModal item={attend} onClose={() => setAttend(null)} onAttend={onAttend} onMiss={onMiss} onUndo={onUndo} />}
                    {showCfg && <PvConfigModal cfg={plan.config} pendingFuture={pendingFuture} onClose={() => setShowCfg(false)} onSave={saveCfg} onReplan={replan} />}
                </div>
            );
        };

        // --- RESUMEN ---
        const PvResumen = ({ FI, cur, entries, cfg, hoy, stFilter, setStFilter, isAdmin, onOpen }) => {
            const cnt = k => cur.filter(it => it.st === k).length;
            const mes0 = new Date(hoy.getFullYear(), hoy.getMonth(), 1, 12);
            const atendidas = FI.filter(it => it.st === 'atendida');
            const atMes = atendidas.filter(it => pvD(it.e.fechaAtencion) >= mes0).length;
            const due = FI.filter(it => it.prog && it.prog < hoy && it.st !== 'atendida').length + atendidas.length;
            const cumpl = due ? atendidas.length / due * 100 : null;
            const kp = [
                { k: 'vencida', l: 'Sin registrar', v: cnt('vencida'), d: 'Fecha pasada sin marcar', c: PV_ST.vencida.color, icon: Icons.AlertTriangle },
                { k: 'no', l: 'No atendidas', v: cnt('no'), d: 'Pendientes de reprogramar', c: PV_ST.no.color, icon: Icons.X },
                { k: 'semana', l: 'Esta semana', v: cnt('semana'), d: 'Próximos 7 días', c: PV_ST.semana.color, icon: Icons.Calendar },
                { k: 'programada', l: 'Programadas', v: cnt('programada'), d: 'Más de 7 días', c: PV_ST.programada.color, icon: Icons.Layers },
                { k: '', l: 'Atendidas en el mes', v: atMes, d: `${PV_MES[hoy.getMonth()]} ${hoy.getFullYear()}`, c: PV_ST.atendida.color, icon: Icons.CheckCircle },
                { k: '', l: 'Cumplimiento del programa', v: cumpl === null ? '—' : Math.round(cumpl) + '%', d: `${atendidas.length} de ${due} fechas vencidas`, c: '#1e293b', icon: Icons.Wrench },
            ];
            // Semanas: 4 atrás y 8 adelante, por estatus de cada fecha programada
            const wk0 = pvAdd(pvWeekStart(hoy), -28);
            const weeks = Array.from({ length: 13 }, (_, i) => pvAdd(wk0, i * 7));
            const wkIdx = d => Math.floor(pvDiff(d, wk0) / 7);
            const weekRef = useRef(null), estRef = useRef(null), loadRef = useRef(null);
            const wData = PV_ST_ORDER.map(k => ({ k, data: weeks.map((_, i) => FI.filter(it => it.prog && it.st === k && wkIdx(it.prog) === i).length) }));
            useChartJs(weekRef, () => ({
                type: 'bar',
                data: { labels: weeks.map(w => `Sem ${pvIsoWeek(w)}`), datasets: wData.map(s => ({ label: PV_ST[s.k].label, data: s.data, backgroundColor: PV_ST[s.k].color, borderRadius: 3, borderSkipped: false, stack: 's' })) },
                options: { maintainAspectRatio: false, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } } }, plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { title: c => { const w = weeks[c[0].dataIndex]; return `Semana ${pvIsoWeek(w)} · ${pvFs(w)} – ${pvFs(pvAdd(w, 6))}`; } } } } }
            }), [JSON.stringify(wData)]);
            const estCounts = PV_ST_ORDER.filter(k => k !== 'atendida').map(k => cnt(k));
            useChartJs(estRef, () => ({
                type: 'doughnut',
                data: { labels: PV_ST_ORDER.filter(k => k !== 'atendida').map(k => PV_ST[k].label), datasets: [{ data: estCounts, backgroundColor: PV_ST_ORDER.filter(k => k !== 'atendida').map(k => PV_ST[k].color), borderWidth: 2, borderColor: '#fff' }] },
                options: { maintainAspectRatio: false, cutout: '64%', plugins: { legend: { position: 'bottom' } } }
            }), [estCounts.join(',')]);
            const days = Array.from({ length: 45 }, (_, i) => pvAdd(hoy, i));
            const ld = PV_ST_ORDER.map(k => ({ k, data: days.map(d => FI.filter(it => it.st === k && it.prog && pvIso(it.prog) === pvIso(d)).length) }));
            useChartJs(loadRef, () => ({
                type: 'bar',
                data: { labels: days.map(d => `${PV_DOW[d.getDay()]} ${d.getDate()}`), datasets: [
                    ...ld.filter(s => s.data.some(x => x)).map(s => ({ label: PV_ST[s.k].label, data: s.data, backgroundColor: PV_ST[s.k].color, stack: 's', borderRadius: 2 })),
                    { type: 'line', label: 'Capacidad', data: days.map(d => (d.getDay() === 0 || (!cfg.sab && d.getDay() === 6)) ? null : cfg.cap), borderColor: '#0f172a', borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5, stepped: 'middle' }] },
                options: { maintainAspectRatio: false, scales: { x: { stacked: true, grid: { display: false }, ticks: { maxRotation: 90, font: { size: 9 } } }, y: { stacked: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } } }, plugins: { legend: { position: 'bottom' } } }
            }), [JSON.stringify(ld), cfg.cap, cfg.sab]);

            const plantas = PLANT_ORDER.filter(p => FI.some(it => it.e.planta === p)).concat([...new Set(FI.map(it => it.e.planta))].filter(p => !PLANT_ORDER.includes(p)));
            const rowsP = plantas.map(p => {
                const a = FI.filter(it => it.e.planta === p), c = a.filter(it => it.current);
                const at = a.filter(it => it.st === 'atendida').length, du = a.filter(it => it.prog && it.prog < hoy && it.st !== 'atendida').length + at;
                return { p, n: c.length, v: c.filter(it => it.st === 'vencida').length, no: c.filter(it => it.st === 'no').length, s: c.filter(it => it.st === 'semana').length, at, pct: du ? at / du * 100 : null };
            });
            const rank = { vencida: 0, no: 1, semana: 2, programada: 3 };
            const list = cur.filter(it => it.st !== 'atendida' && (!stFilter || it.st === stFilter))
                .sort((a, b) => rank[a.st] - rank[b.st] || (a.prog - b.prog)).slice(0, stFilter ? 200 : 15);

            return (
                <div className="space-y-5">
                    <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
                        {kp.map(x => (
                            <button key={x.l} data-kpi={x.k || x.l} onClick={() => x.k && setStFilter(s => s === x.k ? '' : x.k)} className={`text-left bg-white p-4 rounded-xl border shadow-sm flex items-center gap-3 ${stFilter && stFilter === x.k ? 'border-slate-700 ring-1 ring-slate-700' : 'border-slate-200'} ${x.k ? 'hover:border-slate-400 cursor-pointer' : 'cursor-default'}`}>
                                <div className="p-2.5 rounded-lg shrink-0" style={{ backgroundColor: x.c + '1a', color: x.c }}><x.icon /></div>
                                <div className="min-w-0"><p className="text-[11px] text-slate-500 font-medium leading-tight">{x.l}</p><p className="text-xl font-bold text-slate-800 leading-tight">{x.v}</p><p className="text-[10px] text-slate-400 leading-tight">{x.d}</p></div>
                            </button>
                        ))}
                    </div>
                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-5">
                        <div className="xl:col-span-2 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">

                            <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider">Estatus de la flota</h5>
                            <p className="text-[11px] text-slate-400 mb-2">Siguiente preventivo de cada unidad.</p>
                            <div className="relative h-64"><canvas ref={estRef}></canvas></div>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-5">
                        <div className="xl:col-span-2 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                            <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider">Carga diaria del taller</h5>
                            <p className="text-[11px] text-slate-400 mb-2">Unidades programadas por día contra la capacidad ({cfg.cap}/día), próximos 45 días.</p>
                            <div className="relative h-64"><canvas ref={loadRef}></canvas></div>
                        </div>
                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="p-4 pb-2"><h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider">Resumen por planta</h5></div>
                            <table className="w-full text-sm text-left" data-table="pv-plantas">
                                <thead className="bg-slate-50 text-slate-500 text-[11px]"><tr><th className="p-2 pl-4">Planta</th><th className="p-2 text-center">Unid.</th><th className="p-2 text-center" title="Sin registrar">Sin reg.</th><th className="p-2 text-center">No at.</th><th className="p-2 text-center">7 días</th><th className="p-2 text-center pr-4">Cumpl.</th></tr></thead>
                                <tbody className="divide-y">
                                    {rowsP.map(r => (
                                        <tr key={r.p}>
                                            <td className="p-2 pl-4 font-bold text-slate-700 whitespace-nowrap"><span className="w-2.5 h-2.5 rounded-full inline-block mr-1.5" style={{ backgroundColor: pvPlantColor(r.p) }}></span>{pvPlantLabel(r.p)}</td>
                                            <td className="p-2 text-center text-slate-600">{r.n}</td>
                                            <td className="p-2 text-center font-bold" style={{ color: r.v ? PV_ST.vencida.text : '#cbd5e1' }}>{r.v}</td>
                                            <td className="p-2 text-center font-bold" style={{ color: r.no ? PV_ST.no.text : '#cbd5e1' }}>{r.no}</td>
                                            <td className="p-2 text-center text-slate-600">{r.s}</td>
                                            <td className="p-2 text-center pr-4 font-bold text-slate-700">{r.pct === null ? '—' : Math.round(r.pct) + '%'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-4 bg-slate-50 font-bold border-b flex justify-between items-center text-sm flex-wrap gap-2">
                            <span className="flex gap-2 items-center"><span className="text-rose-500"><Icons.Wrench /></span> {stFilter ? `Unidades: ${PV_ST[stFilter].label}` : 'Por atender'}</span>
                            <span className="flex items-center gap-2">{stFilter && <button onClick={() => setStFilter('')} className="text-xs font-normal text-slate-500 hover:text-slate-700 underline">Quitar filtro</button>}<span className="text-xs bg-rose-100 text-rose-700 px-2 py-1 rounded-full">{list.length}</span></span>
                        </div>
                        <div className="max-h-96 overflow-y-auto">
                            <table className="w-full text-sm text-left" data-table="pv-por-atender">
                                <thead className="bg-slate-50 text-slate-500 text-xs sticky top-0"><tr><th className="p-3">Unidad</th><th className="p-3">Planta</th><th className="p-3 hidden md:table-cell">Último prev.</th><th className="p-3">Programado</th><th className="p-3">Estatus</th>{isAdmin && <th className="p-3"></th>}</tr></thead>
                                <tbody className="divide-y">
                                    {list.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-slate-400">Sin unidades pendientes.</td></tr>}
                                    {list.map(it => (
                                        <tr key={it.key} className="hover:bg-slate-50">
                                            <td className="p-3 font-bold text-slate-700">{it.e.id}</td>
                                            <td className="p-3 text-slate-500 text-xs">{AREA_META[it.e.planta] ? AREA_META[it.e.planta].code : it.e.planta}</td>
                                            <td className="p-3 text-slate-500 text-xs hidden md:table-cell">{pvF(pvD(it.e.cycle))}</td>
                                            <td className="p-3 text-slate-700 text-xs font-bold whitespace-nowrap">{PV_DOW[it.prog.getDay()]} {pvF(it.prog)}</td>
                                            <td className="p-3"><PvBadge st={it.st} /></td>
                                            {isAdmin && <td className="p-3 text-right"><button data-mark={it.e.id} onClick={() => onOpen(it)} className="text-xs border border-slate-300 hover:bg-slate-100 px-2 py-1 rounded whitespace-nowrap">Marcar</button></td>}
                                        </tr>

            );
        };

        // --- GANTT DE ATENCIÓN ---
        const PvGantt = ({ FI, unitById, cfg, hoy, hor, setHor, grp, setGrp, isAdmin, onOpen }) => {
            const PX = hor > 90 ? 12 : hor > 60 ? 16 : 22;
            const start = pvAdd(hoy, -28), end = pvAdd(hoy, hor), N = pvDiff(end, start) + 1, Wd = N * PX;
            const x = d => Math.max(0, Math.min(Wd, pvDiff(d, start) * PX));
            const wrapRef = useRef(null);
            const [tip, setTip] = useState(null);
            // Una fila por unidad: su fecha vigente y su historial dentro de la ventana
            const byUnit = {};
            FI.forEach(it => { if (!it.prog || it.prog < start || it.prog > end) return; (byUnit[it.e.id] = byUnit[it.e.id] || []).push(it); });
            const rows = Object.entries(byUnit).map(([id, its]) => {
                its.sort((a, b) => a.prog - b.prog);
                const main = its.find(i => i.current) || its[its.length - 1];
                return { id, planta: main.e.planta, its, main, u: unitById[id] };
            }).sort((a, b) => (a.main.prog - b.main.prog) || String(a.id).localeCompare(String(b.id), 'es', { numeric: true }));
            let groups = [];
            if (grp === 'planta') { const ps = PLANT_ORDER.filter(p => rows.some(r => r.planta === p)).concat([...new Set(rows.map(r => r.planta))].filter(p => !PLANT_ORDER.includes(p))); groups = ps.map(p => { const r = rows.filter(z => z.planta === p); return { t: `${pvPlantLabel(p)} · ${r.length} unid.`, r }; }); }
            else { const m = new Map(); rows.forEach(r => { const w = pvWeekStart(r.main.prog); const k = pvIso(w); if (!m.has(k)) m.set(k, { w, r: [] }); m.get(k).r.push(r); }); groups = [...m.values()].map(g => ({ t: `Semana ${pvIsoWeek(g.w)} · ${pvFs(g.w)} – ${pvFs(pvAdd(g.w, 6))} · ${g.r.length} unid.`, r: g.r })); }
            const nonWork = d => d.getDay() === 0 || (!cfg.sab && d.getDay() === 6);
            const months = []; let cur = null;
            for (let i = 0; i < N; i++) { const d = pvAdd(start, i); if (!cur || d.getMonth() !== cur.m) { cur = { m: d.getMonth(), y: d.getFullYear(), w: 0 }; months.push(cur); } cur.w += PX; }
            const todayX = x(hoy) + PX / 2 - 1;
            useEffect(() => { if (wrapRef.current) wrapRef.current.scrollLeft = Math.max(0, x(pvAdd(pvWeekStart(hoy), -7))); }, [hor]); // muestra desde la semana anterior
            const showTip = (e, it, u) => setTip({ x: e.clientX, y: e.clientY, it, u });
            const LW = 210;
            return (
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-3">
                    <div className="flex items-center justify-between flex-wrap gap-3">
                        <div className="flex items-center gap-3 flex-wrap text-[11px] text-slate-500">
                            {PV_ST_ORDER.map(k => <span key={k} className="inline-flex items-center gap-1"><span className="w-3 h-3 rounded-sm inline-block" style={{ backgroundColor: PV_ST[k].color }}></span>{PV_ST[k].label}</span>)}
                            <span className="inline-flex items-center gap-1"><span className="w-4 h-1 rounded inline-block bg-slate-300"></span>ciclo</span>
                            <span className="inline-flex items-center gap-1"><span className="w-2.5 h-2.5 rotate-45 inline-block border-2 border-slate-400 bg-white"></span>fecha proyectada</span>
                        </div>
                        <div className="flex items-center gap-2 text-xs">
                            <div className="flex items-center bg-slate-100 rounded p-0.5">{[['semana', 'Por semana'], ['planta', 'Por planta']].map(([k, l]) => <button key={k} onClick={() => setGrp(k)} className={`px-2 py-1 rounded ${grp === k ? 'bg-white shadow-sm font-bold text-slate-700' : 'text-slate-500'}`}>{l}</button>)}</div>
                            <select value={hor} onChange={e => setHor(+e.target.value)} className="border border-slate-200 rounded px-2 py-1">{[30, 60, 90, 150].map(n => <option key={n} value={n}>{n} días</option>)}</select>
                        </div>
                    </div>
                    <p className="text-[11px] text-slate-400">{rows.length} unidades entre el {pvF(start)} y el {pvF(end)}. Las fechas programadas no se recorren: lo pasado se queda en su día.{isAdmin ? ' Haz clic en una fecha para marcarla.' : ''}</p>
                    <div ref={wrapRef} className="border border-slate-200 rounded-lg overflow-auto max-h-[680px] relative" data-gantt>
                        <div className="grid relative" style={{ gridTemplateColumns: `${LW}px ${Wd}px` }}>
                            <div className="sticky left-0 z-20 bg-white border-r border-slate-200">
                                <div className="sticky top-0 z-30 bg-slate-50 border-b border-slate-200 h-[46px] flex items-end px-3 pb-1.5 text-[10px] font-bold text-slate-400 uppercase">Unidad · Planta</div>
                                {groups.map(g => (
                                    <React.Fragment key={g.t}>
                                        <div className="h-6 bg-slate-100 border-b border-slate-200 text-[10.5px] font-bold text-slate-600 flex items-center px-3 uppercase tracking-wide whitespace-nowrap overflow-hidden">{g.t}</div>
                                        {g.r.map(r => (
                                            <div key={r.id} className="h-[26px] border-b border-slate-100 flex items-center gap-2 px-3 text-xs whitespace-nowrap">
                                                <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: pvPlantColor(r.planta) }}></span>
                                                <b className="text-slate-700 w-12">{r.id}</b>
                                                <span className="text-[10px] text-slate-400 truncate">{AREA_META[r.planta] ? AREA_META[r.planta].code : r.planta} · {PV_ST[r.main.st].label}</span>
                                            </div>
                                        ))}
                                    </React.Fragment>
                                ))}
                            </div>
                            <div className="relative">
                                <div className="sticky top-0 z-10 bg-slate-50 border-b border-slate-200 h-[46px]" style={{ width: Wd }}>
                                    <div className="flex h-6">{months.map((m, i) => <div key={i} className="text-[11px] font-bold text-slate-500 px-1.5 pt-1 border-l border-slate-200 whitespace-nowrap overflow-hidden shrink-0" style={{ width: m.w }}>{PV_MES[m.m].toUpperCase()} {m.y}</div>)}</div>
                                    <div className="flex h-[22px]">{Array.from({ length: N }, (_, i) => { const d = pvAdd(start, i); const isT = pvIso(d) === pvIso(hoy); return <div key={i} className={`text-[10px] text-center border-l border-slate-100 pt-0.5 shrink-0 ${isT ? 'bg-rose-600 text-white font-bold' : nonWork(d) ? 'bg-slate-100 text-slate-400' : 'text-slate-400'}`} style={{ width: PX }}>{PX >= 16 || d.getDate() % 2 ? d.getDate() : ''}</div>; })}</div>
                                </div>
                                <div className="relative">
                                    {Array.from({ length: N }, (_, i) => nonWork(pvAdd(start, i)) ? <div key={i} className="absolute top-0 bottom-0 bg-slate-50" style={{ left: i * PX, width: PX }}></div> : null)}
                                    <div className="absolute top-0 bottom-0 w-0.5 bg-rose-500 z-10 pointer-events-none" style={{ left: todayX }}></div>
                                    {groups.map(g => (
                                        <React.Fragment key={g.t}>
                                            <div className="h-6 bg-slate-100/70 border-b border-slate-200 relative"></div>
                                            {g.r.map(r => {
                                                const u = r.u, curIt = r.its.find(i => i.current);
                                                return (
                                                    <div key={r.id} className="h-[26px] border-b border-slate-100 relative" data-row={r.id}>
                                                        {u && curIt && u.ult && u.proy && x(u.proy) > x(u.ult) && <div className="absolute h-1 rounded top-[11px] opacity-40" style={{ left: x(u.ult), width: x(u.proy) - x(u.ult), backgroundColor: PV_ST[curIt.st].color }}></div>}
                                                        {u && curIt && u.proy && u.proy >= start && u.proy <= end && <div className="absolute w-2.5 h-2.5 rotate-45 bg-white border-2 top-[8px] z-[2]" style={{ left: x(u.proy) + PX / 2 - 5, borderColor: PV_ST[curIt.st].color }}></div>}
                                                        {r.its.map((it, j) => (
                                                            <div key={j} data-slot={`${r.id}|${pvIso(it.prog)}`} data-st={it.st}
                                                                className={`absolute top-1 h-[18px] rounded z-[3] shadow-sm ${isAdmin ? 'cursor-pointer hover:ring-2 hover:ring-slate-700' : 'cursor-default'}`}
                                                                style={{ left: x(it.prog) + 1, width: PX - 2, backgroundColor: PV_ST[it.st].color, opacity: it.current ? 1 : 0.85 }}
                                                                onMouseMove={e => showTip(e, it, u)} onMouseLeave={() => setTip(null)}
                                                                onClick={() => { setTip(null); if (it.hist === undefined) onOpen(it); }}>
                                                                {it.st === 'atendida' && PX >= 16 && <span className="text-white text-[10px] font-bold flex items-center justify-center h-full">✓</span>}
                                                                {it.st === 'no' && PX >= 16 && <span className="text-white text-[10px] font-bold flex items-center justify-center h-full">✗</span>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                );
                                            })}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>
                        </div>
                        {rows.length === 0 && <div className="p-8 text-center text-slate-400 text-sm">Sin unidades en este periodo.</div>}
                    </div>
                    {tip && (
                        <div className="fixed z-[60] bg-slate-900 text-white text-xs rounded-lg px-3 py-2 shadow-xl pointer-events-none max-w-[280px] leading-relaxed" style={{ left: Math.min(tip.x + 14, window.innerWidth - 290), top: tip.y + 14 }}>
                            <b>Unidad {tip.it.e.id}</b> · {pvPlantLabel(tip.it.e.planta)}<br />
                            Programado: <b>{PV_DOW[tip.it.prog.getDay()]} {pvF(tip.it.prog)}</b><br />
                            Estatus: <b style={{ color: PV_ST[tip.it.st].color }}>{PV_ST[tip.it.st].label}</b>
                            {tip.it.st === 'atendida' && <><br />Atendida: {pvF(pvD(tip.it.e.fechaAtencion))}</>}
                            {tip.it.hist !== undefined && <><br />Falta reprogramada{tip.it.motivo ? `: ${tip.it.motivo}` : ''}</>}
                            {tip.it.st === 'no' && tip.it.hist === undefined && tip.it.e.motivo && <><br />Motivo: {tip.it.e.motivo}</>}
                            {tip.it.current && tip.u && <><br />Último prev.: {pvF(tip.u.ult)} · Proyectado: {pvF(tip.u.proy)}</>}
                            {isAdmin && tip.it.hist === undefined && <><br /><i className="text-slate-400">Clic para marcar</i></>}
                        </div>
                    )}
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        const FleetDashboard = () => {
            const [vehicles, setVehicles] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(false);
            const [search, setSearch] = useState('');
            const [plantFilter, setPlantFilter] = useState('Todas');
            const [modalVehicle, setModalVehicle] = useState(null);
            const [showNewModal, setShowNewModal] = useState(false);
            const [chartDetail, setChartDetail] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState(false);
            const [notification, setNotification] = useState(null);
            const [seeding, setSeeding] = useState(false);
            const [showTireImport, setShowTireImport] = useState(false);
            // Vista: Flota o Mantenimiento preventivo (se recuerda en la URL: #preventivo)
            const [view, setView] = useState(() => (window.location.hash === '#preventivo' ? 'prev' : 'flota'));
            const changeView = v => { setView(v); try { history.replaceState(null, '', v === 'prev' ? '#preventivo' : window.location.pathname + window.location.search); } catch (e) {} };

            // --- FleetCheck (proyecto de inspección, solo lectura desde Flota) ---
            const [fcUnidades, setFcUnidades] = useState([]);
            const [fcApartados, setFcApartados] = useState([]);
            const [fcChecklist, setFcChecklist] = useState({});

            // --- Registro de Fallas Mecánicas (mismo proyecto que Flota, capturado en Matriz/Stellantis) ---
            const [incidents, setIncidents] = useState([]);

            const showNotification = (type, message) => { setNotification({ type, message }); setTimeout(() => setNotification(null), 3000); };

            useEffect(() => {
                if (!db) { setIsLoading(false); setLoadError(true); return; }
                const unsub = db.collection(FLEET_COLLECTION).onSnapshot(
                    s => { setVehicles(s.docs.map(d => d.data())); setIsLoading(false); },
                    err => { console.error(err); setIsLoading(false); setLoadError(true); }
                );
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!fcDb) return;
                (async () => {
                    try {
                        const [uSnap, aSnap, cSnap] = await Promise.all([
                            fcDb.collection('ste_unidades').get(),
                            fcDb.collection('ste_apartados').orderBy('orden').get(),
                            fcDb.collection('ste_checklist').get(),
                        ]);
                        setFcUnidades(uSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setFcApartados(aSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                        const cm = {}; cSnap.docs.forEach(d => { cm[d.id] = d.data(); });
                        setFcChecklist(cm);
                    } catch (e) { console.error('Error cargando FleetCheck:', e); }
                })();
            }, []);

            useEffect(() => {
                if (!db) return;
                const unsub = db.collection('incidents').onSnapshot(
                    s => setIncidents(s.docs.map(d => ({ id: d.id, ...d.data() }))),
                    err => console.error('Error cargando incidents:', err)
                );
                return () => unsub();
            }, []);

            // Mapa "ID de unidad" -> lista de fallas mecánicas registradas para esa unidad (más reciente primero)
            const failuresByVehicle = useMemo(() => {
                const m = {};
                const dmyKey = dmy => { // "DD/MM/YY" -> "YY-MM-DD" comparable
                    const [d, mo, y] = (dmy || '').split('/');
                    return `${y || '00'}-${mo || '00'}-${d || '00'}`;
                };
                incidents.forEach(inc => {
                    const arr = (inc.mechanicalFailuresDetails && inc.mechanicalFailuresDetails.length > 0)
                        ? inc.mechanicalFailuresDetails
                        : Array.from({ length: inc.mechanicalFailures || 0 }, () => null);
                    arr.forEach(d => {
                        if (!d || d.unitId === undefined || d.unitId === null || d.unitId === '') return;
                        const key = String(d.unitId);
                        if (!m[key]) m[key] = [];
                        m[key].push({ date: inc.date, shift: inc.shift, plant: inc.plant, route: d.route || '', description: d.description || '' });
                    });
                });
                Object.keys(m).forEach(key => m[key].sort((a, b) => dmyKey(b.date).localeCompare(dmyKey(a.date))));
                return m;
            }, [incidents]);

            const fcByVehicleId = useMemo(() => {
                const m = {};
                fcUnidades.forEach(u => { m[String(u.numero)] = u; });
                return m;
            }, [fcUnidades]);

            // Mapa vehicleId -> {unidadId, revisado, total, pctRevisado, score, tier} para no recalcular por celda
            const fcInfoByVehicle = useMemo(() => {
                const m = {};
                if (!fcApartados.length) return m;
                vehicles.forEach(v => {
                    const u = fcByVehicleId[String(v.vehicleId)];
                    if (!u) { m[v.vehicleId] = null; return; }
                    const s = fcUnitStats(fcApartados, fcChecklist, u.id);
                    const score = fcComputeScore(fcApartados, fcChecklist, u.id);
                    m[v.vehicleId] = { unidadId: u.id, ...s, score, tier: fcClassify(score) };
                });
                return m;
            }, [vehicles, fcByVehicleId, fcApartados, fcChecklist]);

            const handleLogin = e => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) { setIsAdmin(true); setShowLogin(false); setLoginError(false); setPasswordInput(''); showNotification('success', 'Modo Edición Activado'); }
                else setLoginError(true);
            };

            const runSeed = async () => {
                if (!db) return;
                setSeeding(true);
                try {
                    const chunks = []; for (let i = 0; i < FLEET_SEED.length; i += 400) chunks.push(FLEET_SEED.slice(i, i + 400));
                    for (const chunk of chunks) {
                        const batch = db.batch();
                        chunk.forEach(v => batch.set(db.collection(FLEET_COLLECTION).doc(String(v.vehicleId)), v, { merge: true }));
                        await batch.commit();
                    }
                    showNotification('success', `${FLEET_SEED.length} unidades cargadas desde el Excel`);
                } catch (e) { console.error(e); showNotification('error', 'Error al cargar datos'); }
                setSeeding(false);
            };

            const saveVehicle = async (payload, isNew) => {
                try {
                    await db.collection(FLEET_COLLECTION).doc(String(payload.vehicleId)).set(payload, { merge: true });
                    showNotification('success', isNew ? 'Unidad creada' : 'Unidad actualizada');
                    setModalVehicle(null); setShowNewModal(false);
                } catch (e) { console.error(e); showNotification('error', 'Error al guardar'); }
            };

            const deleteVehicle = async (v) => {
                if (!confirm(`¿Eliminar la unidad ${v.vehicleId} (${v.plate})? Esta acción no se puede deshacer.`)) return;
                try {
                    await db.collection(FLEET_COLLECTION).doc(String(v.vehicleId)).delete();
                    showNotification('success', 'Unidad eliminada'); setModalVehicle(null);
                } catch (e) { console.error(e); showNotification('error', 'Error al eliminar'); }
            };

            const filteredVehicles = useMemo(() => plantFilter === 'Todas' ? vehicles : vehicles.filter(v => v.plant === plantFilter), [vehicles, plantFilter]);

            const stats = useMemo(() => {
                const list = filteredVehicles;
                const total = list.length;
                const evaluated = list.filter(v => v.mecanix !== null && v.mecanix !== undefined);
                const sinEval = total - evaluated.length;
                const avgScore = evaluated.length > 0 ? evaluated.reduce((s, v) => s + v.mecanix, 0) / evaluated.length : null;
                const requierenRep = list.filter(v => (v.requiereReparacion || 0) > 0).length;
                const curYear = new Date().getFullYear();
                const avgAge = total > 0 ? list.reduce((s, v) => s + (curYear - (v.year || curYear)), 0) / total : 0;

                const byYear = {};
                list.forEach(v => { byYear[v.year] = (byYear[v.year] || 0) + 1; });
                const yearData = Object.keys(byYear).sort().map(y => ({ label: y, val: byYear[y] }));

                const byYearNoCumple = {};
                list.filter(v => (v.year || 0) <= NO_CUMPLE_YEAR_MAX).forEach(v => { byYearNoCumple[v.year] = (byYearNoCumple[v.year] || 0) + 1; });
                const noCumpleYearData = Object.keys(byYearNoCumple).sort().map(y => ({ label: y, val: byYearNoCumple[y] }));
                const noCumpleTotal = Object.values(byYearNoCumple).reduce((s, n) => s + n, 0);

                const byBucket = { exc: 0, bueno: 0, reg: 0, atn: 0, sin: 0 };
                list.forEach(v => { byBucket[scoreBucket(v.mecanix).key]++; });
                const bucketMeta = { exc: { label: 'Excelente', color: '#10b981' }, bueno: { label: 'Bueno', color: '#0ea5e9' }, reg: { label: 'Regular', color: '#f59e0b' }, atn: { label: 'Atención', color: '#e11d48' }, sin: { label: 'Sin evaluar', color: '#94a3b8' } };
                const bucketData = Object.keys(bucketMeta).map(k => ({ label: bucketMeta[k].label, val: byBucket[k], color: bucketMeta[k].color }));

                const byType = {};
                list.forEach(v => { byType[v.type] = (byType[v.type] || 0) + 1; });
                const typeColors = { 'Camion': '#e11d48', 'Camioneta': '#0ea5e9' };
                const typeData = Object.keys(byType).map(t => ({ label: t === 'Camion' ? 'Camión' : t, val: byType[t], color: typeColors[t] || '#94a3b8' }));

                // Evaluación promedio por planta según los criterios de FleetCheck (0-100, ponderado por categoría),
                // no Mecanix. Solo cuentan las unidades con al menos un punto revisado (fcInfoByVehicle[id].revisado > 0).
                const plantScoreData = PLANT_ORDER.map(p => {
                    const pl = list.filter(v => v.plant === p);
                    const ev = pl.filter(v => { const info = fcInfoByVehicle[v.vehicleId]; return info && info.revisado > 0; });
                    const score = ev.length > 0 ? ev.reduce((s, v) => s + fcInfoByVehicle[v.vehicleId].score, 0) / ev.length / 100 : null;
                    return { key: p, code: AREA_META[p].code, color: AREA_META[p].color, score, n: pl.length };
                });

                // Semáforo de llantas por unidad (estado = peor llanta)
                const tireByVid = {}; const tireCounts = { crit: 0, warn: 0, ok: 0, sin: 0 };
                list.forEach(v => { const s = tireSummary(v); tireByVid[v.vehicleId] = s; tireCounts[s.status.key]++; });
                const tireCrit = (v) => tireByVid[v.vehicleId] && tireByVid[v.vehicleId].status.key === 'crit';

                // Llanta crítica primero; después las que requieren reparación / Mecanix bajo
                const topAttention = [...list].filter(v => tireCrit(v) || (v.requiereReparacion || 0) > 0 || (v.mecanix !== null && v.mecanix < 0.9))
                    .sort((a, b) => (tireCrit(b) ? 1 : 0) - (tireCrit(a) ? 1 : 0) || (b.requiereReparacion || 0) - (a.requiereReparacion || 0) || (a.mecanix ?? 1) - (b.mecanix ?? 1)).slice(0, 5);

                return { total, sinEval, avgScore, requierenRep, avgAge, yearData, noCumpleYearData, noCumpleTotal, bucketData, typeData, plantScoreData, topAttention, tireByVid, tireCounts };
            }, [filteredVehicles, fcInfoByVehicle]);

            // --- Detalle al picarle a una barra de los gráficos ---
            const openYearBarDetail = (bar, onlyLabel) => {
                const year = parseInt(bar.label);
                setChartDetail({
                    title: `${onlyLabel || 'Unidades'} — Modelo ${bar.label}`,
                    vehicles: filteredVehicles.filter(v => v.year === year),
                    metricLabel: 'Planta',
                    metricGet: v => AREA_META[v.plant] ? AREA_META[v.plant].code : v.plant
                });
            };

            const openPlantEvalDetail = (bar) => {
                setChartDetail({
                    title: `Evaluación FleetCheck — ${bar.code} (${AREA_META[bar.key].label})`,
                    vehicles: filteredVehicles.filter(v => v.plant === bar.key),
                    metricLabel: '% Evaluación',
                    metricGet: v => { const info = fcInfoByVehicle[v.vehicleId]; return info && info.revisado > 0 ? info.score + '%' : (info ? 'Sin revisar' : 'Sin FleetCheck'); }
                });
            };

            const openTireDetail = (key) => {
                const s = TIRE_STATUS[key];
                const vs = filteredVehicles.filter(v => stats.tireByVid[v.vehicleId] && stats.tireByVid[v.vehicleId].status.key === key)
                    .sort((a, b) => (stats.tireByVid[a.vehicleId].worst ?? 99) - (stats.tireByVid[b.vehicleId].worst ?? 99) || a.vehicleId - b.vehicleId);
                setChartDetail({
                    title: `Semáforo de llantas — ${s.label}${key === 'crit' ? ` (≤ ${TIRE_CRIT_MM} mm)` : ''}`,
                    vehicles: vs,
                    metricLabel: 'Peor llanta',
                    metricGet: v => { const t = stats.tireByVid[v.vehicleId]; return t && t.hasData ? <span className="text-xs font-bold" style={{ color: t.status.text }}>#{t.worstPos} · {fmtMm(t.worst)} mm</span> : <span className="text-xs text-slate-400">Sin dato</span>; }
                });
            };

            const openVehicleFromChart = (v) => { setChartDetail(null); setModalVehicle(v); };

            const grouped = useMemo(() => {
                const g = {}; PLANT_ORDER.forEach(p => g[p] = []);
                filteredVehicles.forEach(v => { if (g[v.plant]) g[v.plant].push(v); else g[v.plant] = [v]; });
                Object.keys(g).forEach(p => g[p].sort((a, b) => a.vehicleId - b.vehicleId));
                return g;
            }, [filteredVehicles]);

            const plantsToShow = plantFilter === 'Todas' ? PLANT_ORDER : [plantFilter];

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2.5 min-w-0 xl:flex-1">
                                <div className="p-1.5 bg-rose-600 rounded-lg" style={{ flexShrink: 0 }}><Icons.Truck /></div>
                                <div className="min-w-0"><h1 className="text-lg font-bold flex items-center gap-2 whitespace-nowrap">Flota Stellantis {isLoading && <span className="loader"></span>}</h1><p className="text-[11px] text-slate-400 xl:truncate">Norte · Van · Extensión · Camiones · Sur — condición mecánica y documentación</p></div>
                            </div>
                            <div className="flex gap-2 items-center flex-wrap xl:flex-nowrap justify-center shrink-0">
                                <div className="flex items-center bg-slate-800 border border-slate-700 rounded overflow-hidden text-xs">
                                    <a href="index.html" title="Inicio" className="px-2 py-1 text-slate-300 hover:bg-slate-700 border-r border-slate-700 flex items-center"><Icons.Home /></a>
                                    <a href="Matriz_Cumplimiento_Transporte.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Table /><span className="hidden sm:inline">Matriz</span></a>
                                    <span className="px-2 py-1 bg-rose-600 text-white flex items-center gap-1"><Icons.Truck /><span className="hidden sm:inline">Flota</span></span>
                                    <a href="Plantilla_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Users /><span className="hidden sm:inline">Plantilla</span></a>
                                    <a href="Penalizaciones_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Receipt /><span className="hidden sm:inline">Penalizaciones</span></a>
                                </div>
                                <div className="relative"><span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500"><Icons.Search /></span><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar ID o placa..." className="bg-slate-800 border border-slate-700 rounded pl-7 pr-2 py-1 text-xs w-36 outline-none focus:border-rose-500" /></div>
                                <select className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs" value={plantFilter} onChange={e => setPlantFilter(e.target.value)}>
                                    <option value="Todas">Todas las plantas</option>
                                    {PLANT_ORDER.map(p => <option key={p} value={p}>{AREA_META[p].code} · {AREA_META[p].label}</option>)}
                                </select>
                                {isAdmin ? (
                                    <>
                                        <button onClick={() => setShowNewModal(true)} className="bg-rose-600 hover:bg-rose-700 px-2 py-1 rounded text-xs flex items-center gap-1.5"><Icons.Plus /> Unidad</button>
                                        <button onClick={() => setShowTireImport(true)} data-action="open-tire-import" className="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs flex items-center gap-1.5" title="Actualizar llantas desde Excel"><Icons.FileSheet /> Llantas</button>
                                        <button onClick={() => { setIsAdmin(false); showNotification('success', 'Modo Vista Activado'); }} className="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs flex items-center gap-1.5" title="Salir modo admin"><Icons.LogOut /> Salir</button>
                                    </>
                                ) : (
                                    <button onClick={() => setShowLogin(true)} className="bg-slate-800 border border-slate-700 hover:bg-slate-700 px-2 py-1 rounded text-xs flex items-center gap-1.5 text-slate-300" title="Ingresar como Admin"><Icons.Lock /> Admin</button>
                                )}
                            </div>
                        </div>
                    </header>

                    {notification && <div className={`fixed top-20 right-4 p-4 rounded shadow-lg z-50 text-white ${notification.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>{notification.message}</div>}

                    {showLogin && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm fade-in">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg text-slate-800">Acceso Administrador</h3><button onClick={() => { setShowLogin(false); setLoginError(false); setPasswordInput(''); }} className="text-slate-400 hover:text-slate-600"><Icons.X /></button></div>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">Contraseña</label><input type="password" autoFocus value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="w-full border rounded p-2 outline-none focus:border-rose-500" placeholder="••••••" />
                                    {loginError && <p className="text-xs text-red-500 mt-1">Contraseña incorrecta.</p>}</div>
                                    <button type="submit" className="w-full bg-slate-900 text-white py-2 rounded font-bold hover:bg-slate-800">Ingresar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-8 space-y-8">
                        {/* PESTAÑAS: Flota / Mantenimiento preventivo */}
                        <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-xl p-1 w-fit max-w-full shadow-sm overflow-x-auto" data-tabs="flota">
                            {[['flota', 'Flota', Icons.Truck], ['prev', 'Mantenimiento preventivo', Icons.Wrench]].map(([k, l, I]) => (
                                <button key={k} data-view-tab={k} onClick={() => changeView(k)} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap transition-colors ${view === k ? 'bg-slate-900 text-white shadow' : 'text-slate-500 hover:bg-slate-100'}`}><span className="scale-90 inline-flex"><I /></span>{l}</button>
                            ))}
                        </div>

                        {view === 'prev' ? <PreventivoView isAdmin={isAdmin} plantFilter={plantFilter} search={search} showNotification={showNotification} /> : (<>
                        {loadError && <div className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-2 rounded-lg">No fue posible conectar con la base de datos en vivo — verifica tu conexión.</div>}

                        {!isLoading && vehicles.length === 0 && !loadError && (
                            <div className="bg-white border border-dashed border-slate-300 rounded-xl p-8 text-center space-y-3">
                                <p className="text-slate-500 text-sm">Aún no hay unidades cargadas en la base de datos.</p>
                                <button onClick={runSeed} disabled={seeding} className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded text-sm inline-flex items-center gap-2 disabled:opacity-60">{seeding && <span className="loader-sm"></span>}Cargar {FLEET_SEED.length} unidades desde el Excel</button>
                            </div>
                        )}

                        {/* KPIs */}
                        <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
                            <StatCard title="Total de unidades" value={stats.total} icon={Icons.Truck} color="#1e293b" />
                            <StatCard title="Sin evaluación" value={stats.sinEval} icon={Icons.AlertTriangle} color="#94a3b8" />
                            <StatCard title="Score Mecanix promedio" value={stats.avgScore !== null ? (stats.avgScore * 100).toFixed(1) : '—'} suffix={stats.avgScore !== null ? '%' : ''} icon={Icons.Wrench} color="#10b981" />
                            <StatCard title="Requieren reparación" value={stats.requierenRep} icon={Icons.AlertTriangle} color="#e11d48" />
                            <StatCard title="Antigüedad promedio" value={stats.avgAge.toFixed(1)} suffix=" años" icon={Icons.Calendar} color="#0ea5e9" />
                            <StatCard title="Llanta crítica" value={stats.tireCounts.crit} suffix={stats.tireCounts.crit === 1 ? ' unidad' : ' unidades'} icon={Icons.Tire} color="#e11d48" onClick={() => openTireDetail('crit')} />
                        </div>

                        {/* GRÁFICOS PRINCIPALES */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.BarChart2 /></span> Panorama de la flota{plantFilter !== 'Todas' ? ` — ${AREA_META[plantFilter].label}` : ''}</h3>
                            <div className="grid grid-cols-1 xl:grid-cols-4 gap-5">
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Unidades por Modelo (Año)</h5>
                                    <BarChartOrdinal data={stats.yearData} color="#1e293b" onBarClick={bar => openYearBarDetail(bar, 'Unidades')} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider flex items-center justify-between">
                                        <span>Unidades que no cumplen por Modelo</span>
                                        <span className="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full normal-case font-bold">{stats.noCumpleTotal}</span>
                                    </h5>
                                    {stats.noCumpleYearData.length > 0
                                        ? <BarChartOrdinal data={stats.noCumpleYearData} color="#e11d48" onBarClick={bar => openYearBarDetail(bar, 'No cumplen')} />
                                        : <div className="h-[150px] flex items-center justify-center text-slate-300 text-xs text-center px-4">Todas las unidades cumplen (modelo {NO_CUMPLE_YEAR_MAX + 1}+)</div>}
                                    <p className="text-[10px] text-slate-400 mt-2">No cumplen: modelo {NO_CUMPLE_YEAR_MAX} o anterior.</p>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                    <DonutChart title="Calificación Mecanix" data={stats.bucketData} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Evaluación Promedio por Planta (FleetCheck)</h5>
                                    <PlantScoreBars data={stats.plantScoreData} onBarClick={openPlantEvalDetail} />
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                <DonutChart title="Tipo de Vehículo" data={stats.typeData} />
                            </div>
                            <TireSemaforoCard counts={stats.tireCounts} total={stats.total} onPick={openTireDetail} />
                            <div className="md:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 bg-slate-50 font-bold border-b flex justify-between items-center text-sm"><span className="flex gap-2 items-center"><span className="text-rose-500"><Icons.AlertTriangle /></span> Unidades que requieren atención</span><span className="text-xs bg-rose-100 text-rose-700 px-2 py-1 rounded-full">{stats.topAttention.length}</span></div>
                                <div className="max-h-64 overflow-y-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 text-slate-500 text-xs"><tr><th className="p-3">ID</th><th className="p-3">Placas</th><th className="p-3">Planta</th><th className="p-3 text-center">Mecanix</th><th className="p-3 text-center">Llantas</th><th className="p-3 text-center">Req. Rep.</th></tr></thead>
                                        <tbody className="divide-y">
                                            {stats.topAttention.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-slate-400">Sin unidades críticas por el momento.</td></tr>}
                                            {stats.topAttention.map(v => {
                                                const b = scoreBucket(v.mecanix);
                                                return (
                                                    <tr key={v.vehicleId} className="hover:bg-slate-50 cursor-pointer" onClick={() => setModalVehicle(v)}>
                                                        <td className="p-3 font-bold text-slate-700">{v.vehicleId}</td>
                                                        <td className="p-3 text-slate-600">{v.plate}</td>
                                                        <td className="p-3 text-slate-500 text-xs">{AREA_META[v.plant] ? AREA_META[v.plant].code : v.plant}</td>
                                                        <td className="p-3 text-center"><span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: b.color + '1a', color: b.color }}>{fmtPct(v.mecanix)}</span></td>
                                                        <td className="p-3 text-center"><TireBadge summary={stats.tireByVid[v.vehicleId]} /></td>
                                                        <td className="p-3 text-center font-bold text-rose-600">{v.requiereReparacion || 0}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        {/* UNIDADES STELLANTIS (todas, un solo bloque con columna de Planta) */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Truck /></span> Unidades Stellantis</h3>
                            <AllUnitsPanel vehicles={filteredVehicles} search={search} onOpenVehicle={setModalVehicle} fcInfoMap={fcInfoByVehicle} />
                        </div>

                        {/* LISTADO POR PLANTA */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Layers /></span> Unidades por planta</h3>
                            <div className="space-y-3">
                                {plantsToShow.map(p => <PlantPanel key={p} plantKey={p} vehicles={grouped[p] || []} search={search} defaultOpen={plantsToShow.length === 1} isAdmin={isAdmin} onOpenVehicle={setModalVehicle} fcInfoMap={fcInfoByVehicle} />)}
                            </div>
                        </div>
                        </>)}
                    </main>

                    <ChartDetailModal info={chartDetail} onOpenVehicle={openVehicleFromChart} onClose={() => setChartDetail(null)} />

                    {modalVehicle && (
                        <VehicleModal vehicle={vehicles.find(x => x.vehicleId === modalVehicle.vehicleId) || modalVehicle} isAdmin={isAdmin} isNew={false}
                            fcApartados={fcApartados} fcChecklist={fcChecklist} fcUnidad={fcByVehicleId[String(modalVehicle.vehicleId)] || null} fcDb={fcDb}
                            failures={failuresByVehicle[String(modalVehicle.vehicleId)] || []}
                            onClose={() => setModalVehicle(null)} onSave={saveVehicle} onDelete={deleteVehicle} showNotification={showNotification} />
                    )}
                    {showTireImport && <TireImportModal vehicles={vehicles} onClose={() => setShowTireImport(false)} showNotification={showNotification} />}
                    {showNewModal && (
                        <VehicleModal vehicle={null} isAdmin={isAdmin} isNew={true}
                            fcApartados={fcApartados} fcChecklist={fcChecklist} fcUnidad={null} fcDb={fcDb}
                            failures={[]}
                            onClose={() => setShowNewModal(false)} onSave={saveVehicle} onDelete={() => {}} showNotification={showNotification} />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<FleetDashboard />);
    </script>
</body>
</html>
