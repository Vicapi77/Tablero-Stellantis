        // --- IMPORTAR LLANTAS DESDE EXCEL ---
        // Columnas esperadas (mismo formato que llantas_stellantis.xlsx): UNIDAD, NUMERO DE LLANTA, Region desgaste,
        // Profundidad mas baja, Profundidad interior, Profundidad central, Profundidad exterior. CLIENTE es opcional.
        const normTireTxt = s => String(s === null || s === undefined ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
        const canonRegion = r => {
            const n = normTireTxt(r);
            if (!n) return '';
            const hit = TIRE_REGIONS.find(x => normTireTxt(x) === n);
            return hit || String(r).trim();
        };
        const parseTireSheet = rows => {
            let h = -1, cols = null;
            for (let i = 0; i < Math.min(rows.length, 15); i++) {
                const r = (rows[i] || []).map(normTireTxt);
                const iu = r.findIndex(x => x === 'unidad' || x.startsWith('unidad') || x === 'eco' || x === 'economico');
                const ip = r.findIndex(x => x.includes('llanta') || x === 'posicion');
                if (iu >= 0 && ip >= 0) {
                    const f = pred => r.findIndex(pred);
                    cols = { unit: iu, pos: ip, region: f(x => x.includes('region') || x.includes('desgaste')), min: f(x => x.includes('mas baja') || x.includes('minima')), interior: f(x => x.includes('interior')), central: f(x => x.includes('central') || x.includes('centro')), exterior: f(x => x.includes('exterior')), client: f(x => x.includes('cliente') || x.includes('planta')) };
                    h = i; break;
                }
            }
            if (h < 0) return { error: 'No encontré las columnas UNIDAD y NUMERO DE LLANTA en la primera hoja.' };
            if (cols.interior < 0 && cols.central < 0 && cols.exterior < 0 && cols.min < 0) return { error: 'No encontré columnas de profundidad (interior, central, exterior o más baja).' };
            const units = {}; const skipped = []; let rowsRead = 0;
            const cell = (r, c) => c >= 0 ? r[c] : null;
            for (let i = h + 1; i < rows.length; i++) {
                const r = rows[i] || [];
                if (r.every(x => x === null || x === '')) continue;
                const unit = parseInt(String(cell(r, cols.unit) ?? '').replace(/\D/g, ''));
                const pos = parseInt(cell(r, cols.pos));
                if (!unit || !(pos >= 1 && pos <= 6)) { skipped.push(i + 1); continue; }
                rowsRead++;
                const t = { region: canonRegion(cell(r, cols.region)), interior: numOrNull(cell(r, cols.interior)), central: numOrNull(cell(r, cols.central)), exterior: numOrNull(cell(r, cols.exterior)) };
                const mn = tireMin(t);
                t.min = mn !== null ? mn : numOrNull(cell(r, cols.min));
                if (!units[unit]) units[unit] = { tires: {}, client: cell(r, cols.client) || '' };
                units[unit].tires[String(pos)] = t;
            }
            Object.values(units).forEach(u => {
                const maxPos = Math.max(...Object.keys(u.tires).map(Number));
                u.count = maxPos > 4 ? 6 : 4;
                for (let p = 1; p <= u.count; p++) if (!u.tires[String(p)]) u.tires[String(p)] = { region: '', interior: null, central: null, exterior: null, min: null };
            });
            return { units, rowsRead, skipped };
        };

        const TireImportModal = ({ vehicles, onClose, showNotification }) => {
            const [parsed, setParsed] = useState(null);
            const [error, setError] = useState('');
            const [fileName, setFileName] = useState('');
            const [measuredAt, setMeasuredAt] = useState(todayISO());
            const [busy, setBusy] = useState(false);
            const existing = useMemo(() => { const m = new Map(); vehicles.forEach(v => m.set(String(v.vehicleId), v)); return m; }, [vehicles]);

            const onFile = async f => {
                if (!f) return;
                setError(''); setParsed(null); setFileName(f.name);
                if (typeof XLSX === 'undefined') { setError('No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página.'); return; }
                try {
                    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const res = parseTireSheet(XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true }));
                    if (res.error) { setError(res.error); return; }
                    setParsed(res);
                } catch (e) { console.error(e); setError('No se pudo leer el archivo. ¿Es un Excel válido?'); }
            };

            const summary = useMemo(() => {
                if (!parsed) return null;
                const ids = Object.keys(parsed.units);
                const matched = ids.filter(id => existing.has(id));
                const missing = ids.filter(id => !existing.has(id));
                // Las posiciones que no vengan en el Excel conservan su valor actual
                const merged = {};
                matched.forEach(id => {
                    const u = parsed.units[id]; const cur = getVehicleTires(existing.get(id));
                    const tires = { ...(cur ? cur.tires : {}) };
                    Object.entries(u.tires).forEach(([p, t]) => { if (!cur || t.min !== null || t.region || !tires[p]) tires[p] = t; });
                    merged[id] = { tires, count: Math.max(u.count, cur ? cur.count : 0) };
                });
                const byStatus = { crit: 0, warn: 0, ok: 0, sin: 0 };
                matched.forEach(id => { byStatus[summarizeTires(merged[id]).status.key]++; });
                return { ids, matched, missing, byStatus, merged };
            }, [parsed, existing]);

            const apply = async () => {
                if (!db || !summary || summary.matched.length === 0) return;
                setBusy(true);
                try {
                    const now = new Date().toISOString();
                    for (let i = 0; i < summary.matched.length; i += 400) {
                        const batch = db.batch();
                        summary.matched.slice(i, i + 400).forEach(id => {
                            const u = summary.merged[id];
                            batch.update(db.collection(FLEET_COLLECTION).doc(id), { tires: u.tires, tireCount: u.count, tiresSource: 'excel', tiresUpdatedAt: now, tiresMeasuredAt: measuredAt || null });
                        });
                        await batch.commit();
                    }
                    showNotification('success', `Llantas actualizadas en ${summary.matched.length} unidades`);
                    onClose();
                } catch (e) { console.error(e); showNotification('error', 'Error al guardar las llantas'); }
                setBusy(false);
            };

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div data-modal="tire-import" className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col fade-in">
                        <div className="bg-slate-900 p-4 flex justify-between items-center text-white rounded-t-2xl">
                            <h2 className="font-bold flex gap-2 items-center"><Icons.Tire /> Actualizar llantas desde Excel</h2>
                            <button onClick={onClose}><Icons.X /></button>
                        </div>
                        <div className="p-5 overflow-y-auto space-y-4 text-sm">
                            <div className="text-xs text-slate-500 bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-1">
                                <p>Usa el mismo formato del Excel de llantas: una fila por llanta.</p>
                                <p className="font-mono text-[11px] text-slate-600">UNIDAD · NUMERO DE LLANTA · Region desgaste · Profundidad interior · Profundidad central · Profundidad exterior</p>
                                <p>Sólo se actualizan las llantas que vengan en el archivo con medición; las demás unidades y posiciones conservan sus datos.</p>
                            </div>
                            <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg p-4 cursor-pointer hover:bg-slate-50 text-slate-600">
                                <Icons.FileSheet /> <span className="truncate">{fileName || 'Elegir archivo .xlsx'}</span>
                                <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={e => onFile(e.target.files[0])} />
                            </label>
                            {error && <p className="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded p-2">{error}</p>}
                            {summary && (
                                <div className="space-y-3" data-import-summary>
                                    <div className="grid grid-cols-3 gap-2 text-center">
                                        <div className="bg-slate-50 rounded-lg p-2"><p className="text-[10px] text-slate-500 uppercase font-bold">Unidades</p><p className="font-bold text-slate-800">{summary.ids.length}</p></div>
                                        <div className="bg-emerald-50 rounded-lg p-2"><p className="text-[10px] text-emerald-700 uppercase font-bold">Se actualizan</p><p className="font-bold text-emerald-800" data-matched>{summary.matched.length}</p></div>
                                        <div className="bg-slate-50 rounded-lg p-2"><p className="text-[10px] text-slate-500 uppercase font-bold">No están en Flota</p><p className="font-bold text-slate-800">{summary.missing.length}</p></div>
                                    </div>
                                    <div className="flex flex-wrap gap-2 text-xs">
                                        {TIRE_STATUS_ORDER.map(k => <span key={k} className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-bold" style={{ backgroundColor: TIRE_STATUS[k].bg, color: TIRE_STATUS[k].text }}><span className="w-2 h-2 rounded-full" style={{ backgroundColor: TIRE_STATUS[k].color }}></span>{TIRE_STATUS[k].label}: {summary.byStatus[k]}</span>)}
                                    </div>
                                    {summary.missing.length > 0 && <p className="text-[11px] text-slate-500">Unidades del Excel que no existen en Flota (no se cargan): {summary.missing.join(', ')}. Dalas de alta primero si deben aparecer.</p>}
                                    {parsed.skipped.length > 0 && <p className="text-[11px] text-amber-700">Filas ignoradas por unidad o posición inválida: {parsed.skipped.slice(0, 15).join(', ')}{parsed.skipped.length > 15 ? '…' : ''}</p>}
                                    <div><label className="text-xs font-bold text-slate-500 block">Fecha de medición</label><input type="date" value={measuredAt} onChange={e => setMeasuredAt(e.target.value)} className="border rounded p-1.5 text-sm" /></div>
                                </div>
                            )}
                        </div>
                        <div className="p-4 border-t bg-slate-50 flex justify-end gap-2 rounded-b-2xl">
                            <button type="button" onClick={onClose} className="px-4 py-2 rounded text-sm hover:bg-slate-200">Cancelar</button>
                            <button type="button" data-action="apply-tires" disabled={busy || !summary || summary.matched.length === 0} onClick={apply} className="px-4 py-2 rounded text-sm bg-rose-600 text-white hover:bg-rose-700 shadow disabled:opacity-50 flex items-center gap-2">{busy && <span className="loader-sm"></span>}Actualizar {summary ? summary.matched.length : ''} unidades</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- TARJETA DEL SEMÁFORO DE LLANTAS (panorama) ---
        const TireSemaforoCard = ({ counts, total, onPick }) => (
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm" data-card="tire-semaforo">
                <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Semáforo de llantas</h5>
                <div className="space-y-2.5">
                    {TIRE_STATUS_ORDER.map(k => {
                        const s = TIRE_STATUS[k]; const n = counts[k] || 0; const pct = total ? n / total : 0;
                        return (
                            <button key={k} type="button" data-tire-bucket={k} onClick={() => onPick(k)} className="w-full text-left group" title="Ver unidades">
                                <div className="flex justify-between text-xs mb-1">
                                    <span className="flex items-center gap-1.5 text-slate-600"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: s.color }}></span>{s.label}<span className="text-slate-400">{k === 'crit' ? `≤ ${TIRE_CRIT_MM} mm` : k === 'warn' ? `${TIRE_CRIT_MM}–${TIRE_WARN_MM} mm` : k === 'ok' ? `> ${TIRE_WARN_MM} mm` : ''}</span></span>
                                    <span className="font-bold text-slate-800">{n} <span className="text-slate-400 font-normal">({(pct * 100).toFixed(0)}%)</span></span>
                                </div>
                                <div className="h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full rounded-full group-hover:opacity-80" style={{ width: `${Math.max(n ? 2 : 0, pct * 100)}%`, backgroundColor: s.color }}></div></div>
                            </button>
                        );
                    })}
                </div>
                <p className="text-[10px] text-slate-400 mt-3">Unidades según su peor llanta. Haz clic para ver el detalle.</p>
            </div>
        );

        // --- APP PRINCIPAL ---
        const FleetDashboard = () => {
            const [vehicles, setVehicles] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(false);
            const [search, setSearch] = useState('');
            const [plantFilter, setPlantFilter] = useState('Todas');
            const [modalVehicle, setModalVehicle] = useState(null);
            const [showNewModal, setShowNewModal] = useState(false);
            const [chartDetail, setChartDetail] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState(false);
            const [notification, setNotification] = useState(null);
            const [seeding, setSeeding] = useState(false);
            const [showTireImport, setShowTireImport] = useState(false);

            // --- FleetCheck (proyecto de inspección, solo lectura desde Flota) ---
            const [fcUnidades, setFcUnidades] = useState([]);
            const [fcApartados, setFcApartados] = useState([]);
            const [fcChecklist, setFcChecklist] = useState({});

            // --- Registro de Fallas Mecánicas (mismo proyecto que Flota, capturado en Matriz/Stellantis) ---
            const [incidents, setIncidents] = useState([]);

            const showNotification = (type, message) => { setNotification({ type, message }); setTimeout(() => setNotification(null), 3000); };

            useEffect(() => {
                if (!db) { setIsLoading(false); setLoadError(true); return; }
                const unsub = db.collection(FLEET_COLLECTION).onSnapshot(
                    s => { setVehicles(s.docs.map(d => d.data())); setIsLoading(false); },
                    err => { console.error(err); setIsLoading(false); setLoadError(true); }
                );
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!fcDb) return;
                (async () => {
                    try {
                        const [uSnap, aSnap, cSnap] = await Promise.all([
                            fcDb.collection('ste_unidades').get(),
                            fcDb.collection('ste_apartados').orderBy('orden').get(),
                            fcDb.collection('ste_checklist').get(),
                        ]);
                        setFcUnidades(uSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setFcApartados(aSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                        const cm = {}; cSnap.docs.forEach(d => { cm[d.id] = d.data(); });
                        setFcChecklist(cm);
                    } catch (e) { console.error('Error cargando FleetCheck:', e); }
                })();
            }, []);

            useEffect(() => {
                if (!db) return;
                const unsub = db.collection('incidents').onSnapshot(
                    s => setIncidents(s.docs.map(d => ({ id: d.id, ...d.data() }))),
                    err => console.error('Error cargando incidents:', err)
                );
                return () => unsub();
            }, []);

            // Mapa "ID de unidad" -> lista de fallas mecánicas registradas para esa unidad (más reciente primero)
            const failuresByVehicle = useMemo(() => {
                const m = {};
                const dmyKey = dmy => { // "DD/MM/YY" -> "YY-MM-DD" comparable
                    const [d, mo, y] = (dmy || '').split('/');
                    return `${y || '00'}-${mo || '00'}-${d || '00'}`;
                };
                incidents.forEach(inc => {
                    const arr = (inc.mechanicalFailuresDetails && inc.mechanicalFailuresDetails.length > 0)
                        ? inc.mechanicalFailuresDetails
                        : Array.from({ length: inc.mechanicalFailures || 0 }, () => null);
                    arr.forEach(d => {
                        if (!d || d.unitId === undefined || d.unitId === null || d.unitId === '') return;
                        const key = String(d.unitId);
                        if (!m[key]) m[key] = [];
                        m[key].push({ date: inc.date, shift: inc.shift, plant: inc.plant, route: d.route || '', description: d.description || '' });
                    });
                });
                Object.keys(m).forEach(key => m[key].sort((a, b) => dmyKey(b.date).localeCompare(dmyKey(a.date))));
                return m;
            }, [incidents]);

            const fcByVehicleId = useMemo(() => {
                const m = {};
                fcUnidades.forEach(u => { m[String(u.numero)] = u; });
                return m;
            }, [fcUnidades]);

            // Mapa vehicleId -> {unidadId, revisado, total, pctRevisado, score, tier} para no recalcular por celda
            const fcInfoByVehicle = useMemo(() => {
                const m = {};
                if (!fcApartados.length) return m;
                vehicles.forEach(v => {
                    const u = fcByVehicleId[String(v.vehicleId)];
                    if (!u) { m[v.vehicleId] = null; return; }
                    const s = fcUnitStats(fcApartados, fcChecklist, u.id);
                    const score = fcComputeScore(fcApartados, fcChecklist, u.id);
                    m[v.vehicleId] = { unidadId: u.id, ...s, score, tier: fcClassify(score) };
                });
                return m;
            }, [vehicles, fcByVehicleId, fcApartados, fcChecklist]);

            const handleLogin = e => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) { setIsAdmin(true); setShowLogin(false); setLoginError(false); setPasswordInput(''); showNotification('success', 'Modo Edición Activado'); }
                else setLoginError(true);
            };

            const runSeed = async () => {
                if (!db) return;
                setSeeding(true);
                try {
                    const chunks = []; for (let i = 0; i < FLEET_SEED.length; i += 400) chunks.push(FLEET_SEED.slice(i, i + 400));
                    for (const chunk of chunks) {
                        const batch = db.batch();
                        chunk.forEach(v => batch.set(db.collection(FLEET_COLLECTION).doc(String(v.vehicleId)), v, { merge: true }));
                        await batch.commit();
                    }
                    showNotification('success', `${FLEET_SEED.length} unidades cargadas desde el Excel`);
                } catch (e) { console.error(e); showNotification('error', 'Error al cargar datos'); }
                setSeeding(false);
            };

            const saveVehicle = async (payload, isNew) => {
                try {
                    await db.collection(FLEET_COLLECTION).doc(String(payload.vehicleId)).set(payload, { merge: true });
                    showNotification('success', isNew ? 'Unidad creada' : 'Unidad actualizada');
                    setModalVehicle(null); setShowNewModal(false);
                } catch (e) { console.error(e); showNotification('error', 'Error al guardar'); }
            };

            const deleteVehicle = async (v) => {
                if (!confirm(`¿Eliminar la unidad ${v.vehicleId} (${v.plate})? Esta acción no se puede deshacer.`)) return;
                try {
                    await db.collection(FLEET_COLLECTION).doc(String(v.vehicleId)).delete();
                    showNotification('success', 'Unidad eliminada'); setModalVehicle(null);
                } catch (e) { console.error(e); showNotification('error', 'Error al eliminar'); }
            };

            const filteredVehicles = useMemo(() => plantFilter === 'Todas' ? vehicles : vehicles.filter(v => v.plant === plantFilter), [vehicles, plantFilter]);

            const stats = useMemo(() => {
                const list = filteredVehicles;
                const total = list.length;
                const evaluated = list.filter(v => v.mecanix !== null && v.mecanix !== undefined);
                const sinEval = total - evaluated.length;
                const avgScore = evaluated.length > 0 ? evaluated.reduce((s, v) => s + v.mecanix, 0) / evaluated.length : null;
                const requierenRep = list.filter(v => (v.requiereReparacion || 0) > 0).length;
                const curYear = new Date().getFullYear();
                const avgAge = total > 0 ? list.reduce((s, v) => s + (curYear - (v.year || curYear)), 0) / total : 0;

                const byYear = {};
                list.forEach(v => { byYear[v.year] = (byYear[v.year] || 0) + 1; });
                const yearData = Object.keys(byYear).sort().map(y => ({ label: y, val: byYear[y] }));

                const byYearNoCumple = {};
                list.filter(v => (v.year || 0) <= NO_CUMPLE_YEAR_MAX).forEach(v => { byYearNoCumple[v.year] = (byYearNoCumple[v.year] || 0) + 1; });
                const noCumpleYearData = Object.keys(byYearNoCumple).sort().map(y => ({ label: y, val: byYearNoCumple[y] }));
                const noCumpleTotal = Object.values(byYearNoCumple).reduce((s, n) => s + n, 0);

                const byBucket = { exc: 0, bueno: 0, reg: 0, atn: 0, sin: 0 };
                list.forEach(v => { byBucket[scoreBucket(v.mecanix).key]++; });
                const bucketMeta = { exc: { label: 'Excelente', color: '#10b981' }, bueno: { label: 'Bueno', color: '#0ea5e9' }, reg: { label: 'Regular', color: '#f59e0b' }, atn: { label: 'Atención', color: '#e11d48' }, sin: { label: 'Sin evaluar', color: '#94a3b8' } };
                const bucketData = Object.keys(bucketMeta).map(k => ({ label: bucketMeta[k].label, val: byBucket[k], color: bucketMeta[k].color }));

                const byType = {};
                list.forEach(v => { byType[v.type] = (byType[v.type] || 0) + 1; });
                const typeColors = { 'Camion': '#e11d48', 'Camioneta': '#0ea5e9' };
                const typeData = Object.keys(byType).map(t => ({ label: t === 'Camion' ? 'Camión' : t, val: byType[t], color: typeColors[t] || '#94a3b8' }));

                // Evaluación promedio por planta según los criterios de FleetCheck (0-100, ponderado por categoría),
                // no Mecanix. Solo cuentan las unidades con al menos un punto revisado (fcInfoByVehicle[id].revisado > 0).
                const plantScoreData = PLANT_ORDER.map(p => {
                    const pl = list.filter(v => v.plant === p);
                    const ev = pl.filter(v => { const info = fcInfoByVehicle[v.vehicleId]; return info && info.revisado > 0; });
                    const score = ev.length > 0 ? ev.reduce((s, v) => s + fcInfoByVehicle[v.vehicleId].score, 0) / ev.length / 100 : null;
                    return { key: p, code: AREA_META[p].code, color: AREA_META[p].color, score, n: pl.length };
                });

                // Semáforo de llantas por unidad (estado = peor llanta)
                const tireByVid = {}; const tireCounts = { crit: 0, warn: 0, ok: 0, sin: 0 };
                list.forEach(v => { const s = tireSummary(v); tireByVid[v.vehicleId] = s; tireCounts[s.status.key]++; });
                const tireCrit = (v) => tireByVid[v.vehicleId] && tireByVid[v.vehicleId].status.key === 'crit';

                // Llanta crítica primero; después las que requieren reparación / Mecanix bajo
                const topAttention = [...list].filter(v => tireCrit(v) || (v.requiereReparacion || 0) > 0 || (v.mecanix !== null && v.mecanix < 0.9))
                    .sort((a, b) => (tireCrit(b) ? 1 : 0) - (tireCrit(a) ? 1 : 0) || (b.requiereReparacion || 0) - (a.requiereReparacion || 0) || (a.mecanix ?? 1) - (b.mecanix ?? 1)).slice(0, 5);

                return { total, sinEval, avgScore, requierenRep, avgAge, yearData, noCumpleYearData, noCumpleTotal, bucketData, typeData, plantScoreData, topAttention, tireByVid, tireCounts };
            }, [filteredVehicles, fcInfoByVehicle]);

            // --- Detalle al picarle a una barra de los gráficos ---
            const openYearBarDetail = (bar, onlyLabel) => {
                const year = parseInt(bar.label);
                setChartDetail({
                    title: `${onlyLabel || 'Unidades'} — Modelo ${bar.label}`,
                    vehicles: filteredVehicles.filter(v => v.year === year),
                    metricLabel: 'Planta',
                    metricGet: v => AREA_META[v.plant] ? AREA_META[v.plant].code : v.plant
                });
            };

            const openPlantEvalDetail = (bar) => {
                setChartDetail({
                    title: `Evaluación FleetCheck — ${bar.code} (${AREA_META[bar.key].label})`,
                    vehicles: filteredVehicles.filter(v => v.plant === bar.key),
                    metricLabel: '% Evaluación',
                    metricGet: v => { const info = fcInfoByVehicle[v.vehicleId]; return info && info.revisado > 0 ? info.score + '%' : (info ? 'Sin revisar' : 'Sin FleetCheck'); }
                });
            };

            const openTireDetail = (key) => {
                const s = TIRE_STATUS[key];
                const vs = filteredVehicles.filter(v => stats.tireByVid[v.vehicleId] && stats.tireByVid[v.vehicleId].status.key === key)
                    .sort((a, b) => (stats.tireByVid[a.vehicleId].worst ?? 99) - (stats.tireByVid[b.vehicleId].worst ?? 99) || a.vehicleId - b.vehicleId);
                setChartDetail({
                    title: `Semáforo de llantas — ${s.label}${key === 'crit' ? ` (≤ ${TIRE_CRIT_MM} mm)` : ''}`,
                    vehicles: vs,
                    metricLabel: 'Peor llanta',
                    metricGet: v => { const t = stats.tireByVid[v.vehicleId]; return t && t.hasData ? <span className="text-xs font-bold" style={{ color: t.status.text }}>#{t.worstPos} · {fmtMm(t.worst)} mm</span> : <span className="text-xs text-slate-400">Sin dato</span>; }
                });
            };

            const openVehicleFromChart = (v) => { setChartDetail(null); setModalVehicle(v); };

            const grouped = useMemo(() => {
                const g = {}; PLANT_ORDER.forEach(p => g[p] = []);
                filteredVehicles.forEach(v => { if (g[v.plant]) g[v.plant].push(v); else g[v.plant] = [v]; });
                Object.keys(g).forEach(p => g[p].sort((a, b) => a.vehicleId - b.vehicleId));
                return g;
            }, [filteredVehicles]);

            const plantsToShow = plantFilter === 'Todas' ? PLANT_ORDER : [plantFilter];

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2.5 min-w-0 xl:flex-1">
                                <div className="p-1.5 bg-rose-600 rounded-lg" style={{ flexShrink: 0 }}><Icons.Truck /></div>
                                <div className="min-w-0"><h1 className="text-lg font-bold flex items-center gap-2 whitespace-nowrap">Flota Stellantis {isLoading && <span className="loader"></span>}</h1><p className="text-[11px] text-slate-400 xl:truncate">Norte · Van · Extensión · Camiones · Sur — condición mecánica y documentación</p></div>
                            </div>
                            <div className="flex gap-2 items-center flex-wrap xl:flex-nowrap justify-center shrink-0">
                                <div className="flex items-center bg-slate-800 border border-slate-700 rounded overflow-hidden text-xs">
                                    <a href="index.html" title="Inicio" className="px-2 py-1 text-slate-300 hover:bg-slate-700 border-r border-slate-700 flex items-center"><Icons.Home /></a>
                                    <a href="Matriz_Cumplimiento_Transporte.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Table /><span className="hidden sm:inline">Matriz</span></a>
                                    <span className="px-2 py-1 bg-rose-600 text-white flex items-center gap-1"><Icons.Truck /><span className="hidden sm:inline">Flota</span></span>
                                    <a href="Plantilla_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Users /><span className="hidden sm:inline">Plantilla</span></a>
                                    <a href="Penalizaciones_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Receipt /><span className="hidden sm:inline">Penalizaciones</span></a>
                                </div>
                                <div className="relative"><span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500"><Icons.Search /></span><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar ID o placa..." className="bg-slate-800 border border-slate-700 rounded pl-7 pr-2 py-1 text-xs w-36 outline-none focus:border-rose-500" /></div>
                                <select className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs" value={plantFilter} onChange={e => setPlantFilter(e.target.value)}>
                                    <option value="Todas">Todas las plantas</option>
                                    {PLANT_ORDER.map(p => <option key={p} value={p}>{AREA_META[p].code} · {AREA_META[p].label}</option>)}
                                </select>
                                {isAdmin ? (
                                    <>
                                        <button onClick={() => setShowNewModal(true)} className="bg-rose-600 hover:bg-rose-700 px-2 py-1 rounded text-xs flex items-center gap-1.5"><Icons.Plus /> Unidad</button>
                                        <button onClick={() => setShowTireImport(true)} data-action="open-tire-import" className="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs flex items-center gap-1.5" title="Actualizar llantas desde Excel"><Icons.FileSheet /> Llantas</button>
                                        <button onClick={() => { setIsAdmin(false); showNotification('success', 'Modo Vista Activado'); }} className="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs flex items-center gap-1.5" title="Salir modo admin"><Icons.LogOut /> Salir</button>
                                    </>
                                ) : (
                                    <button onClick={() => setShowLogin(true)} className="bg-slate-800 border border-slate-700 hover:bg-slate-700 px-2 py-1 rounded text-xs flex items-center gap-1.5 text-slate-300" title="Ingresar como Admin"><Icons.Lock /> Admin</button>
                                )}
                            </div>
                        </div>
                    </header>

                    {notification && <div className={`fixed top-20 right-4 p-4 rounded shadow-lg z-50 text-white ${notification.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>{notification.message}</div>}

                    {showLogin && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm fade-in">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg text-slate-800">Acceso Administrador</h3><button onClick={() => { setShowLogin(false); setLoginError(false); setPasswordInput(''); }} className="text-slate-400 hover:text-slate-600"><Icons.X /></button></div>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">Contraseña</label><input type="password" autoFocus value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="w-full border rounded p-2 outline-none focus:border-rose-500" placeholder="••••••" />
                                    {loginError && <p className="text-xs text-red-500 mt-1">Contraseña incorrecta.</p>}</div>
                                    <button type="submit" className="w-full bg-slate-900 text-white py-2 rounded font-bold hover:bg-slate-800">Ingresar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-8 space-y-8">
                        {loadError && <div className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-2 rounded-lg">No fue posible conectar con la base de datos en vivo — verifica tu conexión.</div>}

                        {!isLoading && vehicles.length === 0 && !loadError && (
                            <div className="bg-white border border-dashed border-slate-300 rounded-xl p-8 text-center space-y-3">
                                <p className="text-slate-500 text-sm">Aún no hay unidades cargadas en la base de datos.</p>
                                <button onClick={runSeed} disabled={seeding} className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded text-sm inline-flex items-center gap-2 disabled:opacity-60">{seeding && <span className="loader-sm"></span>}Cargar {FLEET_SEED.length} unidades desde el Excel</button>
                            </div>
                        )}

                        {/* KPIs */}
                        <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
                            <StatCard title="Total de unidades" value={stats.total} icon={Icons.Truck} color="#1e293b" />
                            <StatCard title="Sin evaluación" value={stats.sinEval} icon={Icons.AlertTriangle} color="#94a3b8" />
                            <StatCard title="Score Mecanix promedio" value={stats.avgScore !== null ? (stats.avgScore * 100).toFixed(1) : '—'} suffix={stats.avgScore !== null ? '%' : ''} icon={Icons.Wrench} color="#10b981" />
                            <StatCard title="Requieren reparación" value={stats.requierenRep} icon={Icons.AlertTriangle} color="#e11d48" />
                            <StatCard title="Antigüedad promedio" value={stats.avgAge.toFixed(1)} suffix=" años" icon={Icons.Calendar} color="#0ea5e9" />
                            <StatCard title="Llanta crítica" value={stats.tireCounts.crit} suffix={stats.tireCounts.crit === 1 ? ' unidad' : ' unidades'} icon={Icons.Tire} color="#e11d48" onClick={() => openTireDetail('crit')} />
                        </div>

                        {/* GRÁFICOS PRINCIPALES */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.BarChart2 /></span> Panorama de la flota{plantFilter !== 'Todas' ? ` — ${AREA_META[plantFilter].label}` : ''}</h3>
                            <div className="grid grid-cols-1 xl:grid-cols-4 gap-5">
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Unidades por Modelo (Año)</h5>
                                    <BarChartOrdinal data={stats.yearData} color="#1e293b" onBarClick={bar => openYearBarDetail(bar, 'Unidades')} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider flex items-center justify-between">
                                        <span>Unidades que no cumplen por Modelo</span>
                                        <span className="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full normal-case font-bold">{stats.noCumpleTotal}</span>
                                    </h5>
                                    {stats.noCumpleYearData.length > 0
                                        ? <BarChartOrdinal data={stats.noCumpleYearData} color="#e11d48" onBarClick={bar => openYearBarDetail(bar, 'No cumplen')} />
                                        : <div className="h-[150px] flex items-center justify-center text-slate-300 text-xs text-center px-4">Todas las unidades cumplen (modelo {NO_CUMPLE_YEAR_MAX + 1}+)</div>}
                                    <p className="text-[10px] text-slate-400 mt-2">No cumplen: modelo {NO_CUMPLE_YEAR_MAX} o anterior.</p>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                    <DonutChart title="Calificación Mecanix" data={stats.bucketData} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Evaluación Promedio por Planta (FleetCheck)</h5>
                                    <PlantScoreBars data={stats.plantScoreData} onBarClick={openPlantEvalDetail} />
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                <DonutChart title="Tipo de Vehículo" data={stats.typeData} />
                            </div>
                            <TireSemaforoCard counts={stats.tireCounts} total={stats.total} onPick={openTireDetail} />
                            <div className="md:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 bg-slate-50 font-bold border-b flex justify-between items-center text-sm"><span className="flex gap-2 items-center"><span className="text-rose-500"><Icons.AlertTriangle /></span> Unidades que requieren atención</span><span className="text-xs bg-rose-100 text-rose-700 px-2 py-1 rounded-full">{stats.topAttention.length}</span></div>
                                <div className="max-h-64 overflow-y-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 text-slate-500 text-xs"><tr><th className="p-3">ID</th><th className="p-3">Placas</th><th className="p-3">Planta</th><th className="p-3 text-center">Mecanix</th><th className="p-3 text-center">Llantas</th><th className="p-3 text-center">Req. Rep.</th></tr></thead>
                                        <tbody className="divide-y">
                                            {stats.topAttention.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-slate-400">Sin unidades críticas por el momento.</td></tr>}
                                            {stats.topAttention.map(v => {
                                                const b = scoreBucket(v.mecanix);
                                                return (
                                                    <tr key={v.vehicleId} className="hover:bg-slate-50 cursor-pointer" onClick={() => setModalVehicle(v)}>
                                                        <td className="p-3 font-bold text-slate-700">{v.vehicleId}</td>
                                                        <td className="p-3 text-slate-600">{v.plate}</td>
                                                        <td className="p-3 text-slate-500 text-xs">{AREA_META[v.plant] ? AREA_META[v.plant].code : v.plant}</td>
                                                        <td className="p-3 text-center"><span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: b.color + '1a', color: b.color }}>{fmtPct(v.mecanix)}</span></td>
                                                        <td className="p-3 text-center"><TireBadge summary={stats.tireByVid[v.vehicleId]} /></td>
                                                        <td className="p-3 text-center font-bold text-rose-600">{v.requiereReparacion || 0}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        {/* UNIDADES STELLANTIS (todas, un solo bloque con columna de Planta) */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Truck /></span> Unidades Stellantis</h3>
                            <AllUnitsPanel vehicles={filteredVehicles} search={search} onOpenVehicle={setModalVehicle} fcInfoMap={fcInfoByVehicle} />
                        </div>

                        {/* LISTADO POR PLANTA */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Layers /></span> Unidades por planta</h3>
                            <div className="space-y-3">
                                {plantsToShow.map(p => <PlantPanel key={p} plantKey={p} vehicles={grouped[p] || []} search={search} defaultOpen={plantsToShow.length === 1} isAdmin={isAdmin} onOpenVehicle={setModalVehicle} fcInfoMap={fcInfoByVehicle} />)}
                            </div>
                        </div>
                    </main>

                    <ChartDetailModal info={chartDetail} onOpenVehicle={openVehicleFromChart} onClose={() => setChartDetail(null)} />

                    {modalVehicle && (
                        <VehicleModal vehicle={vehicles.find(x => x.vehicleId === modalVehicle.vehicleId) || modalVehicle} isAdmin={isAdmin} isNew={false}
                            fcApartados={fcApartados} fcChecklist={fcChecklist} fcUnidad={fcByVehicleId[String(modalVehicle.vehicleId)] || null} fcDb={fcDb}
                            failures={failuresByVehicle[String(modalVehicle.vehicleId)] || []}
                            onClose={() => setModalVehicle(null)} onSave={saveVehicle} onDelete={deleteVehicle} showNotification={showNotification} />
                    )}
                    {showTireImport && <TireImportModal vehicles={vehicles} onClose={() => setShowTireImport(false)} showNotification={showNotification} />}
                    {showNewModal && (
                        <VehicleModal vehicle={null} isAdmin={isAdmin} isNew={true}
                            fcApartados={fcApartados} fcChecklist={fcChecklist} fcUnidad={null} fcDb={fcDb}
                            failures={[]}
                            onClose={() => setShowNewModal(false)} onSave={saveVehicle} onDelete={() => {}} showNotification={showNotification} />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<FleetDashboard />);
    </script>
</body>
</html>
