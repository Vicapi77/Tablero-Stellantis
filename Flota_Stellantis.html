        const FC_CATEGORY_ORDER = ["Seguridad", "Mecánica", "Llantas", "Eléctrico", "Equipo de seguridad", "limpieza y documentación", "Confort y carrocería"];

                const items = apartados.filter(a => a.categoria === cat);
                if (!items.length) return;
                const hasFail = items.some(a => fcGetItem(checklist, unidadId, a.id).cumple === false);

        // --- COMPRESIÓN DE IMÁGENES A BASE64 (se guardan directo en Firestore, sin Storage) ---
        // Reduce cada imagen a un JPEG pequeño y la devuelve como data URL, probando primero
        // dimensiones/calidad altas y bajando ambas hasta que quepa cómodamente en un documento
        // de Firestore (límite duro de 1 MiB por documento; aquí dejamos margen para 2 imágenes + campos).
        const MAX_DOC_IMAGE_CHARS = 420000; // ~420 KB de texto base64 por imagen
        const compressImageToDataURL = (file) => new Promise((resolve, reject) => {
            const objectUrl = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                let best = null;
                const dimSteps = [1280, 960, 720, 520];
                outer:
                for (const maxDim of dimSteps) {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        const scale = maxDim / Math.max(width, height);
                        width = Math.max(1, Math.round(width * scale));
                        height = Math.max(1, Math.round(height * scale));
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    for (let q = 0.75; q >= 0.35; q -= 0.1) {
                        const dataUrl = canvas.toDataURL('image/jpeg', q);
                        best = dataUrl;
                        if (dataUrl.length <= MAX_DOC_IMAGE_CHARS) break outer;
                    }
                }
                URL.revokeObjectURL(objectUrl);
                resolve(best);
            };
            img.onerror = (e) => { URL.revokeObjectURL(objectUrl); reject(e); };
            img.src = objectUrl;
        });

        // --- CUADRO DE DETALLE AL PICARLE A UNA BARRA DE LOS GRÁFICOS ---

        // --- WIDGET DE DOCUMENTO (Póliza / Tarjeta de Circulación) ---
        const DocSlot = ({ label, icon: Icon, url, isAdmin, onUpload, onDelete, onView, busy }) => {
            const inputRef = useRef(null);

        // --- MODAL VISOR DE IMAGEN ---
        const ImageViewer = ({ url, onClose }) => {
            if (!url) return null;
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-6" onClick={onClose}>
                    <img src={url} className="max-w-full max-h-full rounded-lg shadow-2xl" onClick={e => e.stopPropagation()} />
                    <button onClick={onClose} className="absolute top-5 right-5 text-white bg-white/10 hover:bg-white/20 rounded-full p-2"><Icons.X /></button>
                </div>

        // --- MODAL DE UNIDAD (ver / editar / crear) ---
        // --- SEMÁFORO DE LLANTAS (dentro del detalle de la unidad) ---
        const TireTile = ({ pos, t, selected, onSelect }) => {
            const mm = tireMin(t); const s = tireStatusOf(mm);
            return (
                <button type="button" onClick={() => onSelect(pos)} data-tire={pos} data-status={s.key}
                    className={`w-12 h-[68px] rounded-lg border-2 flex flex-col items-center justify-center shrink-0 transition-transform hover:scale-105 ${selected ? 'ring-2 ring-offset-1 ring-slate-700' : ''}`}
                    style={{ backgroundColor: s.bg, borderColor: s.color }} title={`Llanta ${pos}: ${mm === null ? 'sin dato' : fmtMm(mm) + ' mm'} · ${s.label}`}>
                    <span className="text-[9px] font-bold text-slate-500 leading-none">#{pos}</span>
                    <span className="text-sm font-extrabold text-slate-800 leading-tight mt-0.5">{fmtMm(mm)}</span>
                    <span className="text-[8px] font-bold uppercase leading-none mt-0.5" style={{ color: s.text }}>{s.label}</span>
                </button>
            );
        };

        const TireDiagram = ({ data, selected, onSelect }) => {
            const six = data.count === 6;
            const tile = p => <TireTile key={p} pos={p} t={data.tires[String(p)]} selected={selected === p} onSelect={onSelect} />;
            const sideW = six ? 100 : 48;
            const Axle = ({ left, right }) => (
                <div className="relative flex items-center justify-between">
                    <div className="flex gap-1" style={{ width: sideW }}>{left}</div>

                </div>

            return (

                    <p className="relative text-center text-[10px] font-bold text-slate-400 uppercase tracking-wider">▲ Frente</p>
                    <div className="relative mt-3"><Axle left={tile(1)} right={tile(2)} /></div>
                    <div className="h-14"></div>
                    <div className="relative mb-3">{six ? <Axle left={[tile(3), tile(4)]} right={[tile(5), tile(6)]} /> : <Axle left={tile(3)} right={tile(4)} />}</div>
                </div>

        const TireSection = ({ vehicle, isAdmin, showNotification }) => {
            const [data, setData] = useState(() => getVehicleTires(vehicle));
            const [editing, setEditing] = useState(false);
            const [draft, setDraft] = useState(null);
            const [saving, setSaving] = useState(false);
            const [selected, setSelected] = useState(null);

            // Si la unidad cambia en la base de datos (p. ej. importación de Excel), refleja el cambio cuando no se está editando
            useEffect(() => { if (!editing) setData(getVehicleTires(vehicle)); }, [vehicle.tiresUpdatedAt]);

            const summary = useMemo(() => summarizeTires(data), [data]);

            const startEdit = () => {
                const rows = {};
                for (let p = 1; p <= 6; p++) {
                    const t = (data && data.tires[String(p)]) || {};
                    const v = k => t[k] === null || t[k] === undefined ? '' : String(t[k]);
                    rows[p] = { region: t.region || '', interior: v('interior'), central: v('central'), exterior: v('exterior') };
                }
                setDraft({ count: data ? data.count : defaultTireCount(vehicle), rows, measuredAt: (data && data.measuredAt) || todayISO() });
                setEditing(true);
            };
            const setRow = (p, k, val) => setDraft(d => ({ ...d, rows: { ...d.rows, [p]: { ...d.rows[p], [k]: val } } }));

            const save = async () => {
                const tires = {};
                for (let p = 1; p <= draft.count; p++) {
                    const r = draft.rows[p];
                    const t = { region: r.region || '', interior: numOrNull(r.interior), central: numOrNull(r.central), exterior: numOrNull(r.exterior) };
                    for (const k of ['interior', 'central', 'exterior']) {
                        if (r[k] !== '' && t[k] === null) { showNotification('error', `Llanta ${p}: valor ${k} no es un número`); return; }
                        if (t[k] !== null && (t[k] < 0 || t[k] > 30)) { showNotification('error', `Llanta ${p}: ${k} fuera de rango (0 a 30 mm)`); return; }
                    }
                    t.min = tireMin(t);
                    tires[String(p)] = t;
                }
                const patch = { tires, tireCount: draft.count, tiresSource: 'manual', tiresUpdatedAt: new Date().toISOString(), tiresMeasuredAt: draft.measuredAt || null };
                if (!db) { showNotification('error', 'Base de datos no disponible'); return; }
                setSaving(true);
                try {
                    await db.collection(FLEET_COLLECTION).doc(String(vehicle.vehicleId)).update(patch);
                    setData({ tires, count: draft.count, source: 'manual', updatedAt: patch.tiresUpdatedAt, measuredAt: patch.tiresMeasuredAt });
                    setEditing(false);
                    showNotification('success', 'Llantas actualizadas');
                } catch (e) { console.error(e); showNotification('error', 'Error al guardar las llantas'); }
                setSaving(false);
            };

            const count = editing ? draft.count : (data ? data.count : defaultTireCount(vehicle));
            const labels = TIRE_POS_LABELS[count];
            const sourceText = !data ? 'Sin datos de llantas para esta unidad.'
                : data.source === 'seed' ? 'Fuente: Excel inicial de llantas.'
                : `${data.source === 'excel' ? 'Importado de Excel' : 'Capturado manualmente'}${data.measuredAt ? ' · medición ' + fmtDate(data.measuredAt) : ''}${data.updatedAt ? ' · guardado ' + new Date(data.updatedAt).toLocaleDateString('es-MX') : ''}`;
            const st = summary.status;

            return (
                <div data-section="tires" className="border border-slate-200 rounded-xl overflow-hidden">
                    <div className="flex items-center justify-between gap-2 px-4 py-3 bg-slate-50 border-b border-slate-200 flex-wrap">
                        <div className="flex items-center gap-2 min-w-0">
                            <span className="text-slate-400"><Icons.Tire /></span>
                            <h4 className="text-sm font-bold text-slate-700">Semáforo de llantas</h4>
                            <span data-unit-tire-status={st.key} className="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: st.bg, color: st.text }}>
                                <span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: st.color }}></span>{st.label}
                            </span>
                        </div>
                        {isAdmin && !editing && <button type="button" onClick={startEdit} className="text-xs bg-white border border-slate-300 hover:bg-slate-100 px-2.5 py-1 rounded flex items-center gap-1.5 text-slate-600"><Icons.Edit />Editar llantas</button>}
                    </div>

                    {!editing && summary.crit.length > 0 && (
                        <div className="mx-4 mt-3 text-xs bg-rose-50 border border-rose-200 text-rose-700 rounded-lg px-3 py-2 flex items-start gap-2">
                            <span className="shrink-0 mt-0.5"><Icons.AlertTriangle /></span>
                            <span><b>Cambio inmediato:</b> {summary.crit.map(c => `llanta #${c.pos} (${labels ? labels[c.pos] : ''}) con ${fmtMm(c.mm)} mm`).join(', ')}. Crítico = {TIRE_CRIT_MM} mm o menos.</span>
                        </div>
                    )}

                    {!editing ? (
                        <div className="p-4 grid grid-cols-1 md:grid-cols-[auto_1fr] gap-5 items-start">
                            {data ? <TireDiagram data={data} selected={selected} onSelect={p => setSelected(s => s === p ? null : p)} /> : <p className="text-sm text-slate-400 py-6 text-center md:w-56">Sin datos de llantas.{isAdmin ? ' Usa “Editar llantas” para capturarlas.' : ''}</p>}
                            {data && (
                                <div className="min-w-0">
                                    <div className="overflow-x-auto border border-slate-200 rounded-lg">
                                        <table className="w-full text-xs text-left">
                                            <thead className="bg-slate-50 text-slate-500"><tr><th className="p-2">#</th><th className="p-2 hidden sm:table-cell">Posición</th><th className="p-2">Región</th><th className="p-2 text-center">Int.</th><th className="p-2 text-center">Cen.</th><th className="p-2 text-center">Ext.</th><th className="p-2 text-center">Mín.</th><th className="p-2 hidden sm:table-cell">Estado</th></tr></thead>
                                            <tbody className="divide-y">
                                                {Array.from({ length: data.count }, (_, i) => i + 1).map(p => {
                                                    const t = data.tires[String(p)] || {}; const mm = tireMin(t); const s = tireStatusOf(mm);
                                                    return (
                                                        <tr key={p} data-tire-row={p} className={`cursor-pointer ${selected === p ? 'bg-slate-100' : 'hover:bg-slate-50'}`} onClick={() => setSelected(x => x === p ? null : p)}>
                                                            <td className="p-2 font-bold text-slate-700">{p}</td>
                                                            <td className="p-2 text-slate-500 whitespace-nowrap hidden sm:table-cell" title={labels[p]}>{TIRE_POS_SHORT[data.count][p]}</td>
                                                            <td className="p-2 text-slate-600 whitespace-nowrap">{t.region || '—'}</td>
                                                            <td className="p-2 text-center text-slate-600">{fmtMm(numOrNull(t.interior))}</td>
                                                            <td className="p-2 text-center text-slate-600">{fmtMm(numOrNull(t.central))}</td>
                                                            <td className="p-2 text-center text-slate-600">{fmtMm(numOrNull(t.exterior))}</td>
                                                            <td className="p-2 text-center font-bold text-slate-800 whitespace-nowrap"><span className="w-2 h-2 rounded-full inline-block mr-1 sm:hidden" style={{ backgroundColor: s.color }}></span>{fmtMm(mm)}</td>
                                                            <td className="p-2 hidden sm:table-cell"><span className="inline-flex items-center gap-1 font-bold whitespace-nowrap" style={{ color: s.text }}><span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: s.color }}></span>{s.label}</span></td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2 text-[10px] text-slate-500">
                                        {['crit', 'warn', 'ok', 'sin'].map(k => <span key={k} className="inline-flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: TIRE_STATUS[k].color }}></span>{TIRE_STATUS[k].label}{k === 'crit' ? ` ≤ ${TIRE_CRIT_MM} mm` : k === 'warn' ? ` ${TIRE_CRIT_MM}–${TIRE_WARN_MM} mm` : k === 'ok' ? ` > ${TIRE_WARN_MM} mm` : ''}</span>)}
                                    </div>
                                    <p className="text-[10px] text-slate-400 mt-1">Profundidad de piso en mm. Mín. = punto más bajo de la llanta. {sourceText}</p>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="p-4 space-y-3">
                            <div className="flex flex-wrap gap-3 items-end">
                                <div><label className="text-xs font-bold text-slate-500 block">Llantas</label>
                                    <select value={draft.count} onChange={e => setDraft(d => ({ ...d, count: parseInt(e.target.value) }))} className="border rounded p-1.5 text-sm"><option value={6}>6 (eje trasero doble)</option><option value={4}>4</option></select></div>
                                <div><label className="text-xs font-bold text-slate-500 block">Fecha de medición</label>
                                    <input type="date" value={draft.measuredAt || ''} onChange={e => setDraft(d => ({ ...d, measuredAt: e.target.value }))} className="border rounded p-1.5 text-sm" /></div>
                            </div>
                            <div className="overflow-x-auto border border-slate-200 rounded-lg">
                                <table className="w-full text-xs text-left">
                                    <thead className="bg-slate-50 text-slate-500"><tr><th className="p-2">#</th><th className="p-2">Posición</th><th className="p-2">Región</th><th className="p-2">Interior</th><th className="p-2">Central</th><th className="p-2">Exterior</th><th className="p-2 text-center">Mín.</th></tr></thead>
                                    <tbody className="divide-y">
                                        {Array.from({ length: draft.count }, (_, i) => i + 1).map(p => {
                                            const r = draft.rows[p]; const mm = tireMin({ interior: r.interior, central: r.central, exterior: r.exterior }); const s = tireStatusOf(mm);

                                                <tr key={p} data-edit-row={p}>
                                                    <td className="p-2 font-bold text-slate-700">{p}</td>
                                                    <td className="p-2 text-slate-500 whitespace-nowrap" title={TIRE_POS_LABELS[draft.count][p]}>{TIRE_POS_SHORT[draft.count][p]}</td>
                                                    <td className="p-2"><select name={`region${p}`} value={r.region} onChange={e => setRow(p, 'region', e.target.value)} className="border rounded p-1 text-xs">

                                                        {TIRE_REGIONS.map(x => <option key={x} value={x}>{x}</option>)}

                                                    </select></td>
                                                    {['interior', 'central', 'exterior'].map(k => (
                                                        <td key={k} className="p-2"><input name={`${k}${p}`} type="number" step="0.1" min="0" max="30" inputMode="decimal" value={r[k]} onChange={e => setRow(p, k, e.target.value)} className="w-16 border rounded p-1 text-xs" placeholder="mm" /></td>
                                                    ))}
                                                    <td className="p-2 text-center"><span className="inline-flex items-center gap-1 font-bold" style={{ color: s.text }}><span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: s.color }}></span>{fmtMm(mm)}</span></td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            <p className="text-[10px] text-slate-400">Deja vacío lo que no se midió. El mínimo y el semáforo se calculan solos.</p>
                            <div className="flex justify-end gap-2">
                                <button type="button" onClick={() => setEditing(false)} className="px-3 py-1.5 rounded text-xs hover:bg-slate-200">Cancelar</button>

                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const VehicleModal = ({ vehicle, isAdmin, isNew, fcApartados, fcChecklist, fcUnidad, fcDb, failures, onClose, onSave, onDelete, showNotification }) => {
            const [form, setForm] = useState({
                vehicleId: vehicle ? vehicle.vehicleId : '',
                year: vehicle ? vehicle.year : new Date().getFullYear(),
                type: vehicle ? vehicle.type : 'Camion',
                plate: vehicle ? vehicle.plate : '',
                plant: vehicle ? vehicle.plant : PLANT_ORDER[0],
                mecanix: vehicle && vehicle.mecanix !== null && vehicle.mecanix !== undefined ? (vehicle.mecanix * 100).toFixed(1) : '',
                buenEstado: vehicle ? vehicle.buenEstado || 0 : 0,
                atenderPronto: vehicle ? vehicle.atenderPronto || 0 : 0,
                requiereReparacion: vehicle ? vehicle.requiereReparacion || 0 : 0,
                ultimoPreventivo: vehicle && vehicle.ultimoPreventivo ? vehicle.ultimoPreventivo : '',
            });
            const [editMode, setEditMode] = useState(isNew);
            const [saving, setSaving] = useState(false);
            const [busyDoc, setBusyDoc] = useState(null);
            const [viewerUrl, setViewerUrl] = useState(null);
            const [docs, setDocs] = useState({
                polizaUrl: vehicle ? vehicle.polizaUrl || null : null,
                tarjetaUrl: vehicle ? vehicle.tarjetaUrl || null : null,
            });

            // --- Registro de Fallas Mecánicas (capturadas en Reporte diario, ligadas por ID de unidad) ---
            const [failOpen, setFailOpen] = useState(false);
            const unitFailures = failures || [];

            // --- Inspección FleetCheck (solo lectura, misma unidad por número) ---
            const [fcOpen, setFcOpen] = useState(false);
            const [fcPhotos, setFcPhotos] = useState(null);
            const [fcPhotosLoading, setFcPhotosLoading] = useState(false);
            const fcStats = fcUnidad ? fcUnitStats(fcApartados, fcChecklist, fcUnidad.id) : null;
            const fcScore = fcUnidad ? fcComputeScore(fcApartados, fcChecklist, fcUnidad.id) : null;
            const fcTier = fcScore !== null ? fcClassify(fcScore) : null;
            const fcBadgeColor = fcUnidad && fcStats && fcStats.revisado > 0 ? fcTier.color : '#94a3b8';
            const fcBadgeText = !fcUnidad ? 'Sin FleetCheck' : (fcStats.revisado > 0 ? fcScore + '%' : 'Sin revisar');

            useEffect(() => {
                if (fcOpen && fcUnidad && fcPhotos === null && !fcPhotosLoading && fcDb) {
                    setFcPhotosLoading(true);
                    fcDb.collection('ste_unidad_fotos').doc(fcUnidad.id).get()
                        .then(snap => setFcPhotos(snap.exists ? snap.data() : {}))
                        .catch(e => { console.error(e); setFcPhotos({}); })
                        .finally(() => setFcPhotosLoading(false));
                }
            }, [fcOpen, fcUnidad]);

            const fcGroupedApartados = useMemo(() => {
                const groups = []; const idx = {};
                fcApartados.forEach(a => {
                    if (!(a.categoria in idx)) { idx[a.categoria] = groups.length; groups.push({ categoria: a.categoria, items: [] }); }
                    groups[idx[a.categoria]].items.push(a);
                });
                return groups;
            }, [fcApartados]);

            const change = e => setForm(p => ({ ...p, [e.target.name]: e.target.value }));

            // Las imágenes se guardan como base64 directo en el documento de Firestore
            // (no se usa Firebase Storage), comprimidas en el navegador antes de subirlas.
            const uploadDoc = async (file, kind) => {
                const vid = form.vehicleId || vehicle?.vehicleId;
                if (!vid) { showNotification('error', 'Asigna primero un ID de unidad'); return; }
                if (!db) { showNotification('error', 'Base de datos no disponible'); return; }
                setBusyDoc(kind);
                try {
                    const dataUrl = await compressImageToDataURL(file);
                    if (!dataUrl || dataUrl.length > MAX_DOC_IMAGE_CHARS) {
                        showNotification('error', 'La imagen sigue siendo muy pesada; prueba con una foto más simple o de menor resolución');
                        setBusyDoc(null); return;
                    }
                    const patch = kind === 'poliza' ? { polizaUrl: dataUrl } : { tarjetaUrl: dataUrl };
                    await db.collection(FLEET_COLLECTION).doc(String(vid)).set({ ...patch, [kind + 'UpdatedAt']: new Date().toISOString() }, { merge: true });
                    setDocs(d => ({ ...d, ...patch }));
                    showNotification('success', 'Documento cargado');
                } catch (e) { console.error(e); showNotification('error', 'Error al procesar/guardar el documento'); }
                setBusyDoc(null);
            };

            const deleteDoc = async (kind) => {
                if (!confirm('¿Eliminar este documento?')) return;
                const patch = kind === 'poliza' ? { polizaUrl: null } : { tarjetaUrl: null };
                try {
                    const vid = form.vehicleId || vehicle?.vehicleId;
                    if (db && vid) await db.collection(FLEET_COLLECTION).doc(String(vid)).set(patch, { merge: true });
                    setDocs(d => ({ ...d, ...patch }));
                    showNotification('success', 'Documento eliminado');
                } catch (e) { console.error(e); showNotification('error', 'Error al eliminar'); }
            };

            const submit = async e => {
                e.preventDefault();
                if (!form.vehicleId || !form.plate || !form.plant) { showNotification('error', 'Completa ID, placas y planta'); return; }
                setSaving(true);
                const payload = {
                    vehicleId: parseInt(form.vehicleId), year: parseInt(form.year) || null, type: form.type,
                    plate: form.plate.toUpperCase(), plant: form.plant,
                    mecanix: form.mecanix === '' ? null : Math.max(0, Math.min(100, parseFloat(form.mecanix))) / 100,
                    buenEstado: parseInt(form.buenEstado) || 0, atenderPronto: parseInt(form.atenderPronto) || 0, requiereReparacion: parseInt(form.requiereReparacion) || 0,
                    ultimoPreventivo: form.ultimoPreventivo || null,
                };
                await onSave(payload, isNew);
                setSaving(false);
            };

            const bucket = scoreBucket(form.mecanix === '' ? null : parseFloat(form.mecanix) / 100);

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col max-h-[92vh] fade-in">
                        <div className="bg-slate-900 p-4 flex justify-between items-center text-white rounded-t-2xl">
                            <div>
                                <h2 className="font-bold flex gap-2 items-center"><Icons.Truck /> {isNew ? 'Nueva Unidad' : `Unidad ${form.vehicleId}`}</h2>
                                {!isNew && <p className="text-xs text-slate-400 mt-0.5">{form.plate} · {AREA_META[form.plant] ? AREA_META[form.plant].code + ' · ' + AREA_META[form.plant].label : form.plant}</p>}
                            </div>
                            <div className="flex items-center gap-2">
                                {isAdmin && !isNew && !editMode && <button onClick={() => setEditMode(true)} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs flex items-center gap-1.5"><Icons.Edit />Editar</button>}
                                <button onClick={onClose}><Icons.X /></button>
                            </div>
                        </div>

                        <div className="p-6 overflow-y-auto space-y-5">
                            {!editMode ? (
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Modelo</p><p className="font-bold text-slate-700">{form.year}</p></div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Tipo</p><p className="font-bold text-slate-700">{form.type}</p></div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Placas</p><p className="font-bold text-slate-700">{form.plate}</p></div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Planta</p><p className="font-bold text-slate-700">{AREA_META[form.plant] ? AREA_META[form.plant].code : form.plant}</p></div>
                                    <div className="rounded-lg p-3 border" style={{ backgroundColor: bucket.color + '14', borderColor: bucket.color + '44' }}>
                                        <p className="text-[10px] uppercase font-bold" style={{ color: bucket.color }}>Calificación Mecanix</p>
                                        <p className="font-bold" style={{ color: bucket.color }}>{form.mecanix === '' ? 'Sin evaluar' : form.mecanix + '%'} <span className="text-[10px] font-normal">({bucket.label})</span></p>
                                    </div>
                                    <div className="rounded-lg p-3 border" style={{ backgroundColor: fcBadgeColor + '14', borderColor: fcBadgeColor + '44' }}>
                                        <p className="text-[10px] uppercase font-bold" style={{ color: fcBadgeColor }}>% Evaluación (FleetCheck)</p>
                                        <p className="font-bold" style={{ color: fcBadgeColor }}>{fcBadgeText} {fcUnidad && fcStats.revisado > 0 && <span className="text-[10px] font-normal">({fcTier.label})</span>}</p>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Último Preventivo</p><p className="font-bold text-slate-700">{fmtDate(form.ultimoPreventivo)}</p></div>
                                    <div className="bg-emerald-50 border border-emerald-100 rounded-lg p-3"><p className="text-[10px] text-emerald-600 uppercase font-bold">Buen Estado</p><p className="font-bold text-emerald-700">{form.buenEstado}</p></div>
                                    <div className="bg-amber-50 border border-amber-100 rounded-lg p-3"><p className="text-[10px] text-amber-600 uppercase font-bold">Atender Pronto</p><p className="font-bold text-amber-700">{form.atenderPronto}</p></div>
                                    <div className="bg-rose-50 border border-rose-100 rounded-lg p-3"><p className="text-[10px] text-rose-600 uppercase font-bold">Requiere Reparación</p><p className="font-bold text-rose-700">{form.requiereReparacion}</p></div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-lg border">
                                    <div><label className="text-xs font-bold text-slate-500">ID Unidad</label><input type="number" name="vehicleId" required disabled={!isNew} value={form.vehicleId} onChange={change} className="w-full border rounded p-1.5 text-sm disabled:bg-slate-100" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Modelo (Año)</label><input type="number" name="year" value={form.year} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Tipo</label><select name="type" value={form.type} onChange={change} className="w-full border rounded p-1.5 text-sm">{VEHICLE_TYPES.map(t => <option key={t}>{t}</option>)}</select></div>
                                    <div><label className="text-xs font-bold text-slate-500">Placas</label><input type="text" name="plate" required value={form.plate} onChange={change} className="w-full border rounded p-1.5 text-sm uppercase" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Planta</label><select name="plant" value={form.plant} onChange={change} className="w-full border rounded p-1.5 text-sm">{PLANT_ORDER.map(p => <option key={p} value={p}>{AREA_META[p].code} · {AREA_META[p].label}</option>)}</select></div>
                                    <div><label className="text-xs font-bold text-slate-500">Mecanix % (vacío = sin evaluar)</label><input type="number" step="0.1" min="0" max="100" name="mecanix" value={form.mecanix} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-emerald-600">Buen Estado</label><input type="number" name="buenEstado" value={form.buenEstado} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-amber-600">Atender Pronto</label><input type="number" name="atenderPronto" value={form.atenderPronto} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-rose-600">Requiere Reparación</label><input type="number" name="requiereReparacion" value={form.requiereReparacion} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Último Preventivo</label><input type="date" name="ultimoPreventivo" value={form.ultimoPreventivo || ''} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                </div>
                            )}

                            {!isNew && <TireSection vehicle={vehicle} isAdmin={isAdmin} showNotification={showNotification} />}

                            {!isNew && (
                                <div>
                                    <h4 className="text-sm font-bold text-slate-600 mb-2">Documentos</h4>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <DocSlot label="Póliza" icon={Icons.FileText} url={docs.polizaUrl} isAdmin={isAdmin} busy={busyDoc === 'poliza'}
                                            onUpload={f => uploadDoc(f, 'poliza')} onDelete={() => deleteDoc('poliza')} onView={() => setViewerUrl(docs.polizaUrl)} />
                                        <DocSlot label="Tarjeta de Circulación" icon={Icons.IdCard} url={docs.tarjetaUrl} isAdmin={isAdmin} busy={busyDoc === 'tarjeta'}
                                            onUpload={f => uploadDoc(f, 'tarjeta')} onDelete={() => deleteDoc('tarjeta')} onView={() => setViewerUrl(docs.tarjetaUrl)} />
                                    </div>
                                </div>
                            )}
                            {isNew && <p className="text-xs text-slate-400 flex items-center gap-1.5"><Icons.Info />Guarda la unidad primero; después podrás cargar Póliza y Tarjeta de Circulación.</p>}

                            {!isNew && (
                                <div>
                                    <button type="button" onClick={() => setFcOpen(o => !o)} className="w-full flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-lg hover:bg-slate-100 text-left">
                                        <span className="text-sm font-bold text-slate-600 flex items-center gap-2">
                                            <span className="text-slate-400"><Icons.CheckCircle /></span>
                                            Inspección FleetCheck
                                            {fcUnidad && fcStats && <span className="text-xs font-normal text-slate-400">({fcStats.revisado}/{fcStats.total} puntos)</span>}
                                        </span>
                                        <span className={`text-slate-400 transition-transform ${fcOpen ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                                    </button>
                                    {fcOpen && (
                                        <div className="mt-3 border border-slate-200 rounded-lg p-4 slide-down space-y-4">
                                            {!fcUnidad ? (
                                                <p className="text-sm text-slate-400 text-center py-6">Esta unidad aún no tiene inspección registrada en FleetCheck.</p>
                                            ) : (
                                                <>
                                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pb-3 border-b border-slate-200">
                                                        <div className="bg-slate-50 rounded-lg p-2.5"><p className="text-[10px] text-slate-500 uppercase font-bold">Avance</p><p className="font-bold text-slate-700 text-sm">{fcStats.revisado}/{fcStats.total} ({fcStats.pctRevisado}%)</p></div>
                                                        <div className="rounded-lg p-2.5" style={{ backgroundColor: (fcStats.revisado ? fcTier.color : '#94a3b8') + '14' }}>
                                                            <p className="text-[10px] uppercase font-bold" style={{ color: fcStats.revisado ? fcTier.color : '#94a3b8' }}>Calificación</p>
                                                            <p className="font-bold text-sm" style={{ color: fcStats.revisado ? fcTier.color : '#94a3b8' }}>{fcStats.revisado ? fcScore + ' · ' + fcTier.label : 'Sin revisar'}</p>
                                                        </div>
                                                        {fcUnidad.fechaAtencion && <div className="bg-slate-50 rounded-lg p-2.5"><p className="text-[10px] text-slate-500 uppercase font-bold">Fecha atención</p><p className="font-bold text-slate-700 text-sm">{fmtDate(fcUnidad.fechaAtencion)}</p></div>}
                                                    </div>

                                                    <div>
                                                        <p className="text-xs font-bold text-slate-500 uppercase mb-2">Evidencia fotográfica</p>
                                                        {fcPhotosLoading ? (
                                                            <div className="text-xs text-slate-400 flex items-center gap-2"><span className="loader-sm"></span>Cargando fotos…</div>
                                                        ) : (
                                                            <div className="flex flex-wrap gap-2">
                                                                {Array.from({ length: 10 }, (_, i) => i + 1).map(i => {
                                                                    const url = fcPhotos && fcPhotos['foto' + i];
                                                                    return url
                                                                        ? <div key={i} className="w-16 h-16 rounded-lg overflow-hidden border-2 border-emerald-400 cursor-pointer bg-cover bg-center" style={{ backgroundImage: `url(${url})` }} onClick={() => setViewerUrl(url)} title={`Foto ${i}`}></div>
                                                                        : <div key={i} className="w-16 h-16 rounded-lg border border-dashed border-slate-300 flex items-center justify-center text-[10px] text-slate-300">Foto {i}</div>;
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="space-y-3">
                                                        {fcGroupedApartados.map(g => (
                                                            <div key={g.categoria}>
                                                                <p className="text-[11px] font-bold text-slate-500 uppercase tracking-wide border-b border-slate-200 pb-1 mb-1.5">{g.categoria}{FC_CATEGORY_WEIGHTS[g.categoria] !== undefined ? ` (${FC_CATEGORY_WEIGHTS[g.categoria]}%)` : ''}</p>
                                                                <div className="divide-y divide-slate-100">
                                                                    {g.items.map(a => {
                                                                        const c = fcGetItem(fcChecklist, fcUnidad.id, a.id).cumple;
                                                                        return (
                                                                            <div key={a.id} className="flex items-center justify-between py-1 text-xs">
                                                                                <span className="text-slate-600">{a.nombre}</span>
                                                                                <span className={`font-bold ${c === true ? 'text-emerald-500' : c === false ? 'text-red-500' : 'text-slate-300'}`}>{c === true ? '✓ Cumple' : c === false ? '✗ No cumple' : '— Sin revisar'}</span>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {!isNew && (
                            <div>
                                <button type="button" onClick={() => setFailOpen(o => !o)} className="w-full flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-lg hover:bg-slate-100 text-left">
                                    <span className="text-sm font-bold text-slate-600 flex items-center gap-2">
                                        <span className="text-slate-400"><Icons.Wrench /></span>
                                        Registro de Fallas
                                        <span className="text-xs font-normal text-slate-400">({unitFailures.length})</span>
                                    </span>
                                    <span className={`text-slate-400 transition-transform ${failOpen ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                                </button>
                                {failOpen && (
                                    <div className="mt-3 border border-slate-200 rounded-lg p-4 slide-down">
                                        {unitFailures.length === 0 ? (
                                            <p className="text-sm text-slate-400 text-center py-6">Esta unidad no tiene fallas mecánicas registradas.</p>
                                        ) : (
                                            <div className="space-y-2">
                                                {unitFailures.map((f, i) => (
                                                    <div key={i} className="border border-indigo-100 bg-indigo-50/30 rounded-lg p-2.5 text-xs">
                                                        <div className="flex justify-between text-indigo-600 font-bold mb-1">
                                                            <span>{f.date} · {f.shift}</span>
                                                            <span>{f.route || 'Sin ruta'}</span>
                                                        </div>
                                                        <p className="text-slate-700">{f.description || 'Sin descripción'}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {(editMode || isNew) && (
                            <div className="p-4 border-t bg-slate-50 flex justify-between items-center rounded-b-2xl">
                                {!isNew ? <button type="button" onClick={() => onDelete(vehicle)} className="text-xs text-red-500 hover:text-red-700 flex items-center gap-1.5"><Icons.Trash2 />Eliminar unidad</button> : <div></div>}
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => isNew ? onClose() : setEditMode(false)} className="px-4 py-2 rounded text-sm hover:bg-slate-200">Cancelar</button>
                                    <button type="button" disabled={saving} onClick={submit} className="px-4 py-2 rounded text-sm bg-rose-600 text-white hover:bg-rose-700 shadow disabled:opacity-60 flex items-center gap-2">{saving && <span className="loader-sm"></span>}{isNew ? 'Guardar' : 'Actualizar'}</button>
                                </div>
                            </div>
                        )}
                    </div>
                    <ImageViewer url={viewerUrl} onClose={() => setViewerUrl(null)} />
                </div>
            );
        };

        // --- COLUMNAS ORDENABLES (listado de unidades) ---
        const VEHICLE_COLUMNS = (showPlant) => {
            const cols = [
                { key: 'vehicleId', label: 'ID', get: v => v.vehicleId },
                { key: 'plate', label: 'Placas', get: v => v.plate || '' },
                { key: 'year', label: 'Modelo', get: v => v.year || 0 },
                { key: 'type', label: 'Tipo', get: v => v.type || '' },
            ];
            if (showPlant) cols.push({ key: 'plant', label: 'Planta', get: v => AREA_META[v.plant] ? AREA_META[v.plant].label : (v.plant || '') });
            cols.push({ key: 'mecanix', label: 'Mecanix', get: v => v.mecanix === null || v.mecanix === undefined ? -1 : v.mecanix, center: true });
            cols.push({ key: 'fcScore', label: '% Eval.', get: (v, fcMap) => { const info = fcMap[v.vehicleId]; return info && info.revisado ? info.score : -1; }, center: true });
            cols.push({ key: 'fcTier', label: 'Criterio', get: (v, fcMap) => { const info = fcMap[v.vehicleId]; return info && info.revisado ? info.tier.label : (info ? 'Sin revisar' : 'Sin FleetCheck'); }, center: true });
            cols.push({ key: 'tires', label: 'Llantas', get: v => { const s = tireSummary(v); return s.hasData ? s.worst : 999; }, center: true });
            cols.push({ key: 'ultimoPreventivo', label: 'Últ. Preventivo', get: v => v.ultimoPreventivo || '' });
            return cols;
        };
        const sortVehicles = (list, sort, columns, fcInfoMap) => {
            const col = columns.find(c => c.key === sort.key) || columns[0];
            const sorted = [...list].sort((a, b) => {
                const va = col.get(a, fcInfoMap), vb = col.get(b, fcInfoMap);
                if (typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' });
                return va - vb;
            });
            if (sort.dir === 'desc') sorted.reverse();
            return sorted;
        };

        // --- TABLA DE UNIDADES (compartida entre el bloque "Unidades Stellantis" y cada planta) ---
        const VehicleListTable = ({ vehicles, showPlant, fcInfoMap, onOpenVehicle }) => {
            const columns = useMemo(() => VEHICLE_COLUMNS(showPlant), [showPlant]);
            const [sort, setSort] = useState({ key: 'vehicleId', dir: 'asc' });
            const sorted = useMemo(() => sortVehicles(vehicles, sort, columns, fcInfoMap), [vehicles, sort, columns, fcInfoMap]);
            const toggleSort = key => setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });
            const arrow = key => sort.key === key ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '';
            return (
                <table className="w-full text-sm text-left">
                    <thead className="sticky top-0 bg-slate-50 text-slate-500 text-xs z-10">
                        <tr>
                            {columns.map(c => (
                                <th key={c.key} className={`p-3 cursor-pointer select-none hover:text-slate-700 hover:bg-slate-100 whitespace-nowrap ${c.center ? 'text-center' : ''}`} onClick={() => toggleSort(c.key)} title="Ordenar">
                                    {c.label}{arrow(c.key)}
                                </th>
                            ))}
                            <th className="p-3 text-center">Docs</th><th className="p-3"></th>
                        </tr>
                    </thead>
                    <tbody className="divide-y">
                        {sorted.length === 0 && <tr><td colSpan={columns.length + 2} className="p-6 text-center text-slate-400">Sin unidades que coincidan.</td></tr>}
                        {sorted.map(v => {
                            const b = scoreBucket(v.mecanix);
                            const info = fcInfoMap[v.vehicleId];
                            return (
                                <tr key={v.vehicleId} className="hover:bg-slate-50 row-btn cursor-pointer" onClick={() => onOpenVehicle(v)}>
                                    <td className="p-3 font-bold text-slate-700">{v.vehicleId}</td>
                                    <td className="p-3 text-slate-600">{v.plate || '—'}</td>
                                    <td className="p-3 text-slate-600">{v.year}</td>

        // --- PANEL DE PLANTA (acordeón) ---

        // --- BLOQUE "UNIDADES STELLANTIS" (un solo acordeón con todas las unidades + columna de Planta) ---
        const AllUnitsPanel = ({ vehicles, search, onOpenVehicle, fcInfoMap }) => {
            const [open, setOpen] = useState(false);
            const filtered = useMemo(() => vehicles.filter(v => {
