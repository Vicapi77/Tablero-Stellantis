        // --- COMPRESIÓN DE IMÁGENES A BASE64 (se guardan directo en Firestore, sin Storage) ---
        // Reduce cada imagen a un JPEG pequeño y la devuelve como data URL, probando primero
        // dimensiones/calidad altas y bajando ambas hasta que quepa cómodamente en un documento
        // de Firestore (límite duro de 1 MiB por documento; aquí dejamos margen para 2 imágenes + campos).
        const MAX_DOC_IMAGE_CHARS = 420000; // ~420 KB de texto base64 por imagen
        const compressImageToDataURL = (file) => new Promise((resolve, reject) => {
            const objectUrl = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                let best = null;
                const dimSteps = [1280, 960, 720, 520];
                outer:
                for (const maxDim of dimSteps) {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        const scale = maxDim / Math.max(width, height);
                        width = Math.max(1, Math.round(width * scale));
                        height = Math.max(1, Math.round(height * scale));
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    for (let q = 0.75; q >= 0.35; q -= 0.1) {
                        const dataUrl = canvas.toDataURL('image/jpeg', q);
                        best = dataUrl;
                        if (dataUrl.length <= MAX_DOC_IMAGE_CHARS) break outer;
                    }
                }
                URL.revokeObjectURL(objectUrl);
                resolve(best);
            };
            img.onerror = (e) => { URL.revokeObjectURL(objectUrl); reject(e); };
            img.src = objectUrl;
        });

                        <div key={d.key} className={`flex-1 flex flex-col items-center h-full justify-end ${onBarClick ? 'cursor-pointer' : ''}`} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} onClick={() => onBarClick && onBarClick(d)} title={onBarClick ? 'Ver detalle de estas unidades' : undefined}>

                            <div className="w-full max-w-[40px] rounded-t-[4px] transition-transform" style={{ height: `${d.score !== null ? Math.max(6, ((d.score - 0.7) / 0.3) * 100) : 4}%`, backgroundColor: d.color, opacity: hover === null || hover === i ? 1 : 0.5, transform: onBarClick && hover === i ? 'scaleX(1.1)' : 'none' }}></div>
                            <span className="mt-2 text-[10px] font-bold text-slate-600 text-center">{d.code}</span>
                            <span className="text-[9px] text-slate-400">{d.n} un.</span>
                        </div>
                    ))}
                </div>
            );
        };

        // --- CUADRO DE DETALLE AL PICARLE A UNA BARRA DE LOS GRÁFICOS ---
        const ChartDetailModal = ({ info, onOpenVehicle, onClose }) => {
            if (!info) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col fade-in" onClick={e => e.stopPropagation()}>
                        <div className="bg-slate-900 p-4 flex justify-between items-start text-white rounded-t-2xl">
                            <div><h2 className="font-bold text-base">{info.title}</h2><p className="text-xs text-slate-400 mt-0.5">{info.vehicles.length} unidad{info.vehicles.length === 1 ? '' : 'es'}</p></div>
                            <button onClick={onClose} className="text-slate-300 hover:text-white"><Icons.X /></button>
                        </div>
                        <div className="overflow-y-auto">
                            {info.vehicles.length === 0 ? (
                                <div className="text-center text-slate-400 text-sm py-10">Sin unidades para este dato.</div>
                            ) : (
                                <table className="w-full text-sm text-left">
                                    <thead className="sticky top-0 bg-slate-50 text-slate-500 text-xs">
                                        <tr><th className="p-3">ID</th><th className="p-3">Placas</th><th className="p-3">Modelo</th><th className="p-3 text-center">{info.metricLabel}</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {info.vehicles.map(v => (
                                            <tr key={v.vehicleId} className="hover:bg-slate-50 cursor-pointer" onClick={() => onOpenVehicle(v)}>
                                                <td className="p-3 font-bold text-slate-700">{v.vehicleId}</td>
                                                <td className="p-3 text-slate-600">{v.plate || '—'}</td>
                                                <td className="p-3 text-slate-500">{v.year}</td>
                                                <td className="p-3 text-center">{info.metricGet(v)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                        <p className="text-[11px] text-slate-400 p-3 border-t flex items-center gap-1.5"><Icons.Info /> Haz clic en una unidad para ver su detalle completo.</p>
                    </div>
                </div>
            );
        };

        // --- TARJETA KPI ---
        const StatCard = ({ title, value, suffix = '', icon: Icon, color }) => (
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                <div className="p-2.5 rounded-lg shrink-0" style={{ backgroundColor: color + '1a', color }}><Icon /></div>
                <div className="min-w-0"><p className="text-[11px] text-slate-500 font-medium leading-tight truncate">{title}</p><p className="text-xl font-bold text-slate-800 leading-tight">{value}<span className="text-sm text-slate-400 ml-0.5">{suffix}</span></p></div>
            </div>
        );

        // --- WIDGET DE DOCUMENTO (Póliza / Tarjeta de Circulación) ---
        const DocSlot = ({ label, icon: Icon, url, isAdmin, onUpload, onDelete, onView, busy }) => {
            const inputRef = useRef(null);
            return (
                <div className="border border-slate-200 rounded-lg p-3 bg-slate-50">
                    <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold text-slate-600 flex items-center gap-1.5"><span className="text-slate-400"><Icon /></span>{label}</span>
                        {url ? <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-full font-bold">Cargado</span> : <span className="text-[10px] bg-slate-200 text-slate-500 px-1.5 py-0.5 rounded-full font-bold">Sin documento</span>}
                    </div>
                    {url && (
                        <div className="w-full h-24 rounded-md overflow-hidden bg-white border border-slate-200 mb-2 cursor-pointer" onClick={onView}>
                            <img src={url} alt={label} className="w-full h-full object-cover" />
                        </div>
                    )}
                    <div className="flex gap-1.5 flex-wrap">
                        {url && <button type="button" onClick={onView} className="flex-1 text-[11px] bg-white border border-slate-300 hover:bg-slate-100 rounded px-2 py-1.5 flex items-center justify-center gap-1 text-slate-600"><Icons.Eye />Ver</button>}
                        {isAdmin && (
                            <>
                                <button type="button" disabled={busy} onClick={() => inputRef.current && inputRef.current.click()} className="flex-1 text-[11px] bg-slate-800 hover:bg-slate-900 text-white rounded px-2 py-1.5 flex items-center justify-center gap-1 disabled:opacity-50">
                                    {busy ? <span className="loader-sm"></span> : <Icons.Upload />}{url ? 'Reemplazar' : 'Subir'}
                                </button>
                                {url && <button type="button" onClick={onDelete} className="text-[11px] bg-white border border-red-200 hover:bg-red-50 text-red-500 rounded px-2 py-1.5 flex items-center justify-center"><Icons.Trash2 /></button>}
                                <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={e => { if (e.target.files[0]) onUpload(e.target.files[0]); e.target.value = ''; }} />
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // --- MODAL VISOR DE IMAGEN ---
        const ImageViewer = ({ url, onClose }) => {
            if (!url) return null;
            return (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-6" onClick={onClose}>
                    <img src={url} className="max-w-full max-h-full rounded-lg shadow-2xl" onClick={e => e.stopPropagation()} />
                    <button onClick={onClose} className="absolute top-5 right-5 text-white bg-white/10 hover:bg-white/20 rounded-full p-2"><Icons.X /></button>
                </div>
            );
        };

        // --- MODAL DE UNIDAD (ver / editar / crear) ---
        const VehicleModal = ({ vehicle, isAdmin, isNew, fcApartados, fcChecklist, fcUnidad, fcDb, failures, onClose, onSave, onDelete, showNotification }) => {
            const [form, setForm] = useState({
                vehicleId: vehicle ? vehicle.vehicleId : '',
                year: vehicle ? vehicle.year : new Date().getFullYear(),
                type: vehicle ? vehicle.type : 'Camion',
                plate: vehicle ? vehicle.plate : '',
                plant: vehicle ? vehicle.plant : PLANT_ORDER[0],
                mecanix: vehicle && vehicle.mecanix !== null && vehicle.mecanix !== undefined ? (vehicle.mecanix * 100).toFixed(1) : '',
                buenEstado: vehicle ? vehicle.buenEstado || 0 : 0,
                atenderPronto: vehicle ? vehicle.atenderPronto || 0 : 0,
                requiereReparacion: vehicle ? vehicle.requiereReparacion || 0 : 0,
                ultimoPreventivo: vehicle && vehicle.ultimoPreventivo ? vehicle.ultimoPreventivo : '',
            });
            const [editMode, setEditMode] = useState(isNew);
            const [saving, setSaving] = useState(false);
            const [busyDoc, setBusyDoc] = useState(null);
            const [viewerUrl, setViewerUrl] = useState(null);
            const [docs, setDocs] = useState({
                polizaUrl: vehicle ? vehicle.polizaUrl || null : null,
                tarjetaUrl: vehicle ? vehicle.tarjetaUrl || null : null,
            });

            // --- Registro de Fallas Mecánicas (capturadas en Reporte diario, ligadas por ID de unidad) ---
            const [failOpen, setFailOpen] = useState(false);
            const unitFailures = failures || [];

            // --- Inspección FleetCheck (solo lectura, misma unidad por número) ---
            const [fcOpen, setFcOpen] = useState(false);
            const [fcPhotos, setFcPhotos] = useState(null);
            const [fcPhotosLoading, setFcPhotosLoading] = useState(false);
            const fcStats = fcUnidad ? fcUnitStats(fcApartados, fcChecklist, fcUnidad.id) : null;
            const fcScore = fcUnidad ? fcComputeScore(fcApartados, fcChecklist, fcUnidad.id) : null;
            const fcTier = fcScore !== null ? fcClassify(fcScore) : null;
            const fcBadgeColor = fcUnidad && fcStats && fcStats.revisado > 0 ? fcTier.color : '#94a3b8';
            const fcBadgeText = !fcUnidad ? 'Sin FleetCheck' : (fcStats.revisado > 0 ? fcScore + '%' : 'Sin revisar');

            useEffect(() => {
                if (fcOpen && fcUnidad && fcPhotos === null && !fcPhotosLoading && fcDb) {
                    setFcPhotosLoading(true);
                    fcDb.collection('ste_unidad_fotos').doc(fcUnidad.id).get()
                        .then(snap => setFcPhotos(snap.exists ? snap.data() : {}))
                        .catch(e => { console.error(e); setFcPhotos({}); })
                        .finally(() => setFcPhotosLoading(false));
                }
            }, [fcOpen, fcUnidad]);

            const fcGroupedApartados = useMemo(() => {
                const groups = []; const idx = {};
                fcApartados.forEach(a => {
                    if (!(a.categoria in idx)) { idx[a.categoria] = groups.length; groups.push({ categoria: a.categoria, items: [] }); }
                    groups[idx[a.categoria]].items.push(a);
                });
                return groups;
            }, [fcApartados]);

            const change = e => setForm(p => ({ ...p, [e.target.name]: e.target.value }));

            // Las imágenes se guardan como base64 directo en el documento de Firestore
            // (no se usa Firebase Storage), comprimidas en el navegador antes de subirlas.
            const uploadDoc = async (file, kind) => {
                const vid = form.vehicleId || vehicle?.vehicleId;
                if (!vid) { showNotification('error', 'Asigna primero un ID de unidad'); return; }
                if (!db) { showNotification('error', 'Base de datos no disponible'); return; }
                setBusyDoc(kind);
                try {
                    const dataUrl = await compressImageToDataURL(file);
                    if (!dataUrl || dataUrl.length > MAX_DOC_IMAGE_CHARS) {
                        showNotification('error', 'La imagen sigue siendo muy pesada; prueba con una foto más simple o de menor resolución');
                        setBusyDoc(null); return;
                    }
                    const patch = kind === 'poliza' ? { polizaUrl: dataUrl } : { tarjetaUrl: dataUrl };
                    await db.collection(FLEET_COLLECTION).doc(String(vid)).set({ ...patch, [kind + 'UpdatedAt']: new Date().toISOString() }, { merge: true });
                    setDocs(d => ({ ...d, ...patch }));
                    showNotification('success', 'Documento cargado');
                } catch (e) { console.error(e); showNotification('error', 'Error al procesar/guardar el documento'); }
                setBusyDoc(null);
            };

            const deleteDoc = async (kind) => {
                if (!confirm('¿Eliminar este documento?')) return;
                const patch = kind === 'poliza' ? { polizaUrl: null } : { tarjetaUrl: null };
                try {
                    const vid = form.vehicleId || vehicle?.vehicleId;
                    if (db && vid) await db.collection(FLEET_COLLECTION).doc(String(vid)).set(patch, { merge: true });
                    setDocs(d => ({ ...d, ...patch }));
                    showNotification('success', 'Documento eliminado');
                } catch (e) { console.error(e); showNotification('error', 'Error al eliminar'); }
            };

            const submit = async e => {
                e.preventDefault();
                if (!form.vehicleId || !form.plate || !form.plant) { showNotification('error', 'Completa ID, placas y planta'); return; }
                setSaving(true);
                const payload = {
                    vehicleId: parseInt(form.vehicleId), year: parseInt(form.year) || null, type: form.type,
                    plate: form.plate.toUpperCase(), plant: form.plant,
                    mecanix: form.mecanix === '' ? null : Math.max(0, Math.min(100, parseFloat(form.mecanix))) / 100,
                    buenEstado: parseInt(form.buenEstado) || 0, atenderPronto: parseInt(form.atenderPronto) || 0, requiereReparacion: parseInt(form.requiereReparacion) || 0,
                    ultimoPreventivo: form.ultimoPreventivo || null,
                };
                await onSave(payload, isNew);
                setSaving(false);
            };

            const bucket = scoreBucket(form.mecanix === '' ? null : parseFloat(form.mecanix) / 100);

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl flex flex-col max-h-[92vh] fade-in">
                        <div className="bg-slate-900 p-4 flex justify-between items-center text-white rounded-t-2xl">
                            <div>
                                <h2 className="font-bold flex gap-2 items-center"><Icons.Truck /> {isNew ? 'Nueva Unidad' : `Unidad ${form.vehicleId}`}</h2>
                                {!isNew && <p className="text-xs text-slate-400 mt-0.5">{form.plate} · {AREA_META[form.plant] ? AREA_META[form.plant].code + ' · ' + AREA_META[form.plant].label : form.plant}</p>}
                            </div>
                            <div className="flex items-center gap-2">
                                {isAdmin && !isNew && !editMode && <button onClick={() => setEditMode(true)} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs flex items-center gap-1.5"><Icons.Edit />Editar</button>}
                                <button onClick={onClose}><Icons.X /></button>
                            </div>
                        </div>

                        <div className="p-6 overflow-y-auto space-y-5">
                            {!editMode ? (
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Modelo</p><p className="font-bold text-slate-700">{form.year}</p></div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Tipo</p><p className="font-bold text-slate-700">{form.type}</p></div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Placas</p><p className="font-bold text-slate-700">{form.plate}</p></div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Planta</p><p className="font-bold text-slate-700">{AREA_META[form.plant] ? AREA_META[form.plant].code : form.plant}</p></div>
                                    <div className="rounded-lg p-3 border" style={{ backgroundColor: bucket.color + '14', borderColor: bucket.color + '44' }}>
                                        <p className="text-[10px] uppercase font-bold" style={{ color: bucket.color }}>Calificación Mecanix</p>
                                        <p className="font-bold" style={{ color: bucket.color }}>{form.mecanix === '' ? 'Sin evaluar' : form.mecanix + '%'} <span className="text-[10px] font-normal">({bucket.label})</span></p>
                                    </div>
                                    <div className="rounded-lg p-3 border" style={{ backgroundColor: fcBadgeColor + '14', borderColor: fcBadgeColor + '44' }}>
                                        <p className="text-[10px] uppercase font-bold" style={{ color: fcBadgeColor }}>% Evaluación (FleetCheck)</p>
                                        <p className="font-bold" style={{ color: fcBadgeColor }}>{fcBadgeText} {fcUnidad && fcStats.revisado > 0 && <span className="text-[10px] font-normal">({fcTier.label})</span>}</p>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3"><p className="text-[10px] text-slate-500 uppercase font-bold">Último Preventivo</p><p className="font-bold text-slate-700">{fmtDate(form.ultimoPreventivo)}</p></div>
                                    <div className="bg-emerald-50 border border-emerald-100 rounded-lg p-3"><p className="text-[10px] text-emerald-600 uppercase font-bold">Buen Estado</p><p className="font-bold text-emerald-700">{form.buenEstado}</p></div>
                                    <div className="bg-amber-50 border border-amber-100 rounded-lg p-3"><p className="text-[10px] text-amber-600 uppercase font-bold">Atender Pronto</p><p className="font-bold text-amber-700">{form.atenderPronto}</p></div>
                                    <div className="bg-rose-50 border border-rose-100 rounded-lg p-3"><p className="text-[10px] text-rose-600 uppercase font-bold">Requiere Reparación</p><p className="font-bold text-rose-700">{form.requiereReparacion}</p></div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-lg border">
                                    <div><label className="text-xs font-bold text-slate-500">ID Unidad</label><input type="number" name="vehicleId" required disabled={!isNew} value={form.vehicleId} onChange={change} className="w-full border rounded p-1.5 text-sm disabled:bg-slate-100" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Modelo (Año)</label><input type="number" name="year" value={form.year} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Tipo</label><select name="type" value={form.type} onChange={change} className="w-full border rounded p-1.5 text-sm">{VEHICLE_TYPES.map(t => <option key={t}>{t}</option>)}</select></div>
                                    <div><label className="text-xs font-bold text-slate-500">Placas</label><input type="text" name="plate" required value={form.plate} onChange={change} className="w-full border rounded p-1.5 text-sm uppercase" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Planta</label><select name="plant" value={form.plant} onChange={change} className="w-full border rounded p-1.5 text-sm">{PLANT_ORDER.map(p => <option key={p} value={p}>{AREA_META[p].code} · {AREA_META[p].label}</option>)}</select></div>
                                    <div><label className="text-xs font-bold text-slate-500">Mecanix % (vacío = sin evaluar)</label><input type="number" step="0.1" min="0" max="100" name="mecanix" value={form.mecanix} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-emerald-600">Buen Estado</label><input type="number" name="buenEstado" value={form.buenEstado} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-amber-600">Atender Pronto</label><input type="number" name="atenderPronto" value={form.atenderPronto} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-rose-600">Requiere Reparación</label><input type="number" name="requiereReparacion" value={form.requiereReparacion} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                    <div><label className="text-xs font-bold text-slate-500">Último Preventivo</label><input type="date" name="ultimoPreventivo" value={form.ultimoPreventivo || ''} onChange={change} className="w-full border rounded p-1.5 text-sm" /></div>
                                </div>
                            )}

                            {!isNew && (
                                <div>
                                    <h4 className="text-sm font-bold text-slate-600 mb-2">Documentos</h4>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <DocSlot label="Póliza" icon={Icons.FileText} url={docs.polizaUrl} isAdmin={isAdmin} busy={busyDoc === 'poliza'}
                                            onUpload={f => uploadDoc(f, 'poliza')} onDelete={() => deleteDoc('poliza')} onView={() => setViewerUrl(docs.polizaUrl)} />
                                        <DocSlot label="Tarjeta de Circulación" icon={Icons.IdCard} url={docs.tarjetaUrl} isAdmin={isAdmin} busy={busyDoc === 'tarjeta'}
                                            onUpload={f => uploadDoc(f, 'tarjeta')} onDelete={() => deleteDoc('tarjeta')} onView={() => setViewerUrl(docs.tarjetaUrl)} />
                                    </div>
                                </div>
                            )}
                            {isNew && <p className="text-xs text-slate-400 flex items-center gap-1.5"><Icons.Info />Guarda la unidad primero; después podrás cargar Póliza y Tarjeta de Circulación.</p>}

                            {!isNew && (
                                <div>
                                    <button type="button" onClick={() => setFcOpen(o => !o)} className="w-full flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-lg hover:bg-slate-100 text-left">
                                        <span className="text-sm font-bold text-slate-600 flex items-center gap-2">
                                            <span className="text-slate-400"><Icons.CheckCircle /></span>
                                            Inspección FleetCheck
                                            {fcUnidad && fcStats && <span className="text-xs font-normal text-slate-400">({fcStats.revisado}/{fcStats.total} puntos)</span>}
                                        </span>
                                        <span className={`text-slate-400 transition-transform ${fcOpen ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                                    </button>
                                    {fcOpen && (
                                        <div className="mt-3 border border-slate-200 rounded-lg p-4 slide-down space-y-4">
                                            {!fcUnidad ? (
                                                <p className="text-sm text-slate-400 text-center py-6">Esta unidad aún no tiene inspección registrada en FleetCheck.</p>
                                            ) : (
                                                <>
                                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 pb-3 border-b border-slate-200">
                                                        <div className="bg-slate-50 rounded-lg p-2.5"><p className="text-[10px] text-slate-500 uppercase font-bold">Avance</p><p className="font-bold text-slate-700 text-sm">{fcStats.revisado}/{fcStats.total} ({fcStats.pctRevisado}%)</p></div>
                                                        <div className="rounded-lg p-2.5" style={{ backgroundColor: (fcStats.revisado ? fcTier.color : '#94a3b8') + '14' }}>
                                                            <p className="text-[10px] uppercase font-bold" style={{ color: fcStats.revisado ? fcTier.color : '#94a3b8' }}>Calificación</p>
                                                            <p className="font-bold text-sm" style={{ color: fcStats.revisado ? fcTier.color : '#94a3b8' }}>{fcStats.revisado ? fcScore + ' · ' + fcTier.label : 'Sin revisar'}</p>
                                                        </div>
                                                        {fcUnidad.fechaAtencion && <div className="bg-slate-50 rounded-lg p-2.5"><p className="text-[10px] text-slate-500 uppercase font-bold">Fecha atención</p><p className="font-bold text-slate-700 text-sm">{fmtDate(fcUnidad.fechaAtencion)}</p></div>}
                                                    </div>

                                                    <div>
                                                        <p className="text-xs font-bold text-slate-500 uppercase mb-2">Evidencia fotográfica</p>
                                                        {fcPhotosLoading ? (
                                                            <div className="text-xs text-slate-400 flex items-center gap-2"><span className="loader-sm"></span>Cargando fotos…</div>
                                                        ) : (
                                                            <div className="flex flex-wrap gap-2">
                                                                {Array.from({ length: 10 }, (_, i) => i + 1).map(i => {
                                                                    const url = fcPhotos && fcPhotos['foto' + i];
                                                                    return url
                                                                        ? <div key={i} className="w-16 h-16 rounded-lg overflow-hidden border-2 border-emerald-400 cursor-pointer bg-cover bg-center" style={{ backgroundImage: `url(${url})` }} onClick={() => setViewerUrl(url)} title={`Foto ${i}`}></div>
                                                                        : <div key={i} className="w-16 h-16 rounded-lg border border-dashed border-slate-300 flex items-center justify-center text-[10px] text-slate-300">Foto {i}</div>;
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="space-y-3">
                                                        {fcGroupedApartados.map(g => (
                                                            <div key={g.categoria}>

                        {(editMode || isNew) && (

                                <div className="flex gap-2">

                    <ImageViewer url={viewerUrl} onClose={() => setViewerUrl(null)} />

            );
        };

        // --- COLUMNAS ORDENABLES (listado de unidades) ---
        const VEHICLE_COLUMNS = (showPlant) => {
            const cols = [
                { key: 'vehicleId', label: 'ID', get: v => v.vehicleId },
                { key: 'plate', label: 'Placas', get: v => v.plate || '' },
                { key: 'year', label: 'Modelo', get: v => v.year || 0 },
                { key: 'type', label: 'Tipo', get: v => v.type || '' },
            ];
            if (showPlant) cols.push({ key: 'plant', label: 'Planta', get: v => AREA_META[v.plant] ? AREA_META[v.plant].label : (v.plant || '') });
            cols.push({ key: 'mecanix', label: 'Mecanix', get: v => v.mecanix === null || v.mecanix === undefined ? -1 : v.mecanix, center: true });
            cols.push({ key: 'fcScore', label: '% Eval.', get: (v, fcMap) => { const info = fcMap[v.vehicleId]; return info && info.revisado ? info.score : -1; }, center: true });
            cols.push({ key: 'fcTier', label: 'Criterio', get: (v, fcMap) => { const info = fcMap[v.vehicleId]; return info && info.revisado ? info.tier.label : (info ? 'Sin revisar' : 'Sin FleetCheck'); }, center: true });
            cols.push({ key: 'ultimoPreventivo', label: 'Últ. Preventivo', get: v => v.ultimoPreventivo || '' });
            return cols;
        };
        const sortVehicles = (list, sort, columns, fcInfoMap) => {
            const col = columns.find(c => c.key === sort.key) || columns[0];
            const sorted = [...list].sort((a, b) => {
                const va = col.get(a, fcInfoMap), vb = col.get(b, fcInfoMap);
                if (typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' });
                return va - vb;
            });
            if (sort.dir === 'desc') sorted.reverse();
            return sorted;
        };

        // --- TABLA DE UNIDADES (compartida entre el bloque "Unidades Stellantis" y cada planta) ---
        const VehicleListTable = ({ vehicles, showPlant, fcInfoMap, onOpenVehicle }) => {
            const columns = useMemo(() => VEHICLE_COLUMNS(showPlant), [showPlant]);
            const [sort, setSort] = useState({ key: 'vehicleId', dir: 'asc' });
            const sorted = useMemo(() => sortVehicles(vehicles, sort, columns, fcInfoMap), [vehicles, sort, columns, fcInfoMap]);
            const toggleSort = key => setSort(s => s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' });
            const arrow = key => sort.key === key ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '';
            return (
                <table className="w-full text-sm text-left">
                    <thead className="sticky top-0 bg-slate-50 text-slate-500 text-xs z-10">
                        <tr>
                            {columns.map(c => (
                                <th key={c.key} className={`p-3 cursor-pointer select-none hover:text-slate-700 hover:bg-slate-100 whitespace-nowrap ${c.center ? 'text-center' : ''}`} onClick={() => toggleSort(c.key)} title="Ordenar">
                                    {c.label}{arrow(c.key)}
                                </th>
                            ))}
                            <th className="p-3 text-center">Docs</th><th className="p-3"></th>
                        </tr>
                    </thead>
                    <tbody className="divide-y">
                        {sorted.length === 0 && <tr><td colSpan={columns.length + 2} className="p-6 text-center text-slate-400">Sin unidades que coincidan.</td></tr>}
                        {sorted.map(v => {
                            const b = scoreBucket(v.mecanix);
                            const info = fcInfoMap[v.vehicleId];
                            return (
                                <tr key={v.vehicleId} className="hover:bg-slate-50 row-btn cursor-pointer" onClick={() => onOpenVehicle(v)}>
                                    <td className="p-3 font-bold text-slate-700">{v.vehicleId}</td>
                                    <td className="p-3 text-slate-600">{v.plate || '—'}</td>
                                    <td className="p-3 text-slate-600">{v.year}</td>
                                    <td className="p-3 text-slate-500 text-xs">{v.type}</td>
                                    {showPlant && <td className="p-3 text-slate-500 text-xs">{AREA_META[v.plant] ? AREA_META[v.plant].code : v.plant}</td>}
                                    <td className="p-3 text-center"><span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: b.color + '1a', color: b.color }}>{fmtPct(v.mecanix)}</span></td>
                                    <td className="p-3 text-center">
                                        {info
                                            ? (info.revisado
                                                ? <span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: info.tier.color + '1a', color: info.tier.color }} title={info.tier.label}>{info.score}%</span>
                                                : <span className="text-xs text-slate-400">Sin revisar</span>)
                                            : <span className="text-xs text-slate-300">—</span>}
                                    </td>
                                    <td className="p-3 text-center">
                                        {info
                                            ? (info.revisado
                                                ? <span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: info.tier.color + '1a', color: info.tier.color }}>{info.tier.label}</span>
                                                : <span className="text-xs text-slate-400">Sin revisar</span>)
                                            : <span className="text-xs text-slate-300">—</span>}

                                    <td className="p-3 text-center"><span className="flex items-center justify-center gap-1">
                                        <span title="Póliza" className={v.polizaUrl ? 'text-emerald-500' : 'text-slate-300'}><Icons.FileText /></span>
                                        <span title="Tarjeta de Circulación" className={v.tarjetaUrl ? 'text-emerald-500' : 'text-slate-300'}><Icons.IdCard /></span>
                                    </span></td>
                                    <td className="p-3 text-right text-slate-300"><Icons.Eye /></td>
                                </tr>
                            );
                        })}
                    </tbody>
                </table>
            );
        };

        // --- PANEL DE PLANTA (acordeón) ---
        const PlantPanel = ({ plantKey, vehicles, search, defaultOpen, isAdmin, onOpenVehicle, fcInfoMap }) => {
            const [open, setOpen] = useState(defaultOpen);
            const meta = AREA_META[plantKey] || { code: plantKey, label: plantKey, color: '#64748b' };
            const filtered = useMemo(() => vehicles.filter(v => {
                if (!search) return true;
                const s = search.toLowerCase();
                return String(v.vehicleId).includes(s) || (v.plate || '').toLowerCase().includes(s);
            }), [vehicles, search]);
            const evaluated = vehicles.filter(v => v.mecanix !== null && v.mecanix !== undefined);
            const avgScore = evaluated.length > 0 ? evaluated.reduce((s, v) => s + v.mecanix, 0) / evaluated.length : null;

            useEffect(() => { if (search) setOpen(true); }, [search]);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <button onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between p-4 hover:bg-slate-50 text-left">
                        <div className="flex items-center gap-3">
                            <span className="w-3 h-3 rounded-full inline-block" style={{ backgroundColor: meta.color }}></span>
                            <div><p className="font-bold text-slate-800">{meta.code} · {meta.label}</p><p className="text-xs text-slate-400">{vehicles.length} unidades</p></div>
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-bold px-2.5 py-1 rounded-full" style={{ backgroundColor: (avgScore !== null ? scoreBucket(avgScore).color : '#94a3b8') + '1a', color: avgScore !== null ? scoreBucket(avgScore).color : '#94a3b8' }}>{avgScore !== null ? (avgScore * 100).toFixed(1) + '% prom.' : 'Sin evaluación'}</span>
                            <span className={`text-slate-400 transition-transform ${open ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                        </div>
                    </button>
                    {open && (
                        <div className="border-t border-slate-100 slide-down">
                            <div className="max-h-96 overflow-y-auto">
                                <VehicleListTable vehicles={filtered} showPlant={false} fcInfoMap={fcInfoMap} onOpenVehicle={onOpenVehicle} />

                    )}
                </div>
            );
        };

        // --- BLOQUE "UNIDADES STELLANTIS" (un solo acordeón con todas las unidades + columna de Planta) ---
        const AllUnitsPanel = ({ vehicles, search, onOpenVehicle, fcInfoMap }) => {
            const [open, setOpen] = useState(false);
            const filtered = useMemo(() => vehicles.filter(v => {
                if (!search) return true;
                const s = search.toLowerCase();
                return String(v.vehicleId).includes(s) || (v.plate || '').toLowerCase().includes(s);
            }), [vehicles, search]);
            useEffect(() => { if (search) setOpen(true); }, [search]);
            const evaluated = vehicles.filter(v => v.mecanix !== null && v.mecanix !== undefined);
            const avgScore = evaluated.length > 0 ? evaluated.reduce((s, v) => s + v.mecanix, 0) / evaluated.length : null;
            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <button onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between p-4 hover:bg-slate-50 text-left">
                        <div className="flex items-center gap-3">
                            <span className="w-3 h-3 rounded-full inline-block bg-slate-700"></span>
                            <div><p className="font-bold text-slate-800">Unidades Stellantis</p><p className="text-xs text-slate-400">{vehicles.length} unidades</p></div>
                        </div>
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-bold px-2.5 py-1 rounded-full" style={{ backgroundColor: (avgScore !== null ? scoreBucket(avgScore).color : '#94a3b8') + '1a', color: avgScore !== null ? scoreBucket(avgScore).color : '#94a3b8' }}>{avgScore !== null ? (avgScore * 100).toFixed(1) + '% prom.' : 'Sin evaluación'}</span>
                            <span className={`text-slate-400 transition-transform ${open ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                        </div>
                    </button>
                    {open && (
                        <div className="border-t border-slate-100 slide-down">
                            <div className="max-h-96 overflow-y-auto">
                                <VehicleListTable vehicles={filtered} showPlant={true} fcInfoMap={fcInfoMap} onOpenVehicle={onOpenVehicle} />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        const FleetDashboard = () => {
            const [vehicles, setVehicles] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(false);
            const [search, setSearch] = useState('');
            const [plantFilter, setPlantFilter] = useState('Todas');
            const [modalVehicle, setModalVehicle] = useState(null);
            const [showNewModal, setShowNewModal] = useState(false);
            const [chartDetail, setChartDetail] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState(false);
            const [notification, setNotification] = useState(null);
            const [seeding, setSeeding] = useState(false);

            // --- FleetCheck (proyecto de inspección, solo lectura desde Flota) ---
            const [fcUnidades, setFcUnidades] = useState([]);
            const [fcApartados, setFcApartados] = useState([]);
            const [fcChecklist, setFcChecklist] = useState({});

            // --- Registro de Fallas Mecánicas (mismo proyecto que Flota, capturado en Matriz/Stellantis) ---
            const [incidents, setIncidents] = useState([]);

            const showNotification = (type, message) => { setNotification({ type, message }); setTimeout(() => setNotification(null), 3000); };

            useEffect(() => {
                if (!db) { setIsLoading(false); setLoadError(true); return; }
                const unsub = db.collection(FLEET_COLLECTION).onSnapshot(
                    s => { setVehicles(s.docs.map(d => d.data())); setIsLoading(false); },
                    err => { console.error(err); setIsLoading(false); setLoadError(true); }
                );
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!fcDb) return;
                (async () => {
                    try {
                        const [uSnap, aSnap, cSnap] = await Promise.all([
                            fcDb.collection('ste_unidades').get(),
                            fcDb.collection('ste_apartados').orderBy('orden').get(),
                            fcDb.collection('ste_checklist').get(),
                        ]);
                        setFcUnidades(uSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setFcApartados(aSnap.docs.map(d => ({ id: d.id, ...d.data() })));
                        const cm = {}; cSnap.docs.forEach(d => { cm[d.id] = d.data(); });
                        setFcChecklist(cm);
                    } catch (e) { console.error('Error cargando FleetCheck:', e); }
                })();
            }, []);

            useEffect(() => {
                if (!db) return;
                const unsub = db.collection('incidents').onSnapshot(
                    s => setIncidents(s.docs.map(d => ({ id: d.id, ...d.data() }))),
                    err => console.error('Error cargando incidents:', err)
                );
                return () => unsub();
            }, []);

            // Mapa "ID de unidad" -> lista de fallas mecánicas registradas para esa unidad (más reciente primero)
            const failuresByVehicle = useMemo(() => {
                const m = {};
                const dmyKey = dmy => { // "DD/MM/YY" -> "YY-MM-DD" comparable
                    const [d, mo, y] = (dmy || '').split('/');
                    return `${y || '00'}-${mo || '00'}-${d || '00'}`;
                };
                incidents.forEach(inc => {
                    const arr = (inc.mechanicalFailuresDetails && inc.mechanicalFailuresDetails.length > 0)
                        ? inc.mechanicalFailuresDetails
                        : Array.from({ length: inc.mechanicalFailures || 0 }, () => null);
                    arr.forEach(d => {
                        if (!d || d.unitId === undefined || d.unitId === null || d.unitId === '') return;
                        const key = String(d.unitId);
                        if (!m[key]) m[key] = [];
                        m[key].push({ date: inc.date, shift: inc.shift, plant: inc.plant, route: d.route || '', description: d.description || '' });
                    });
                });
                Object.keys(m).forEach(key => m[key].sort((a, b) => dmyKey(b.date).localeCompare(dmyKey(a.date))));
                return m;
            }, [incidents]);

            const fcByVehicleId = useMemo(() => {
                const m = {};
                fcUnidades.forEach(u => { m[String(u.numero)] = u; });
                return m;
            }, [fcUnidades]);

            // Mapa vehicleId -> {unidadId, revisado, total, pctRevisado, score, tier} para no recalcular por celda
            const fcInfoByVehicle = useMemo(() => {
                const m = {};
                if (!fcApartados.length) return m;
                vehicles.forEach(v => {
                    const u = fcByVehicleId[String(v.vehicleId)];
                    if (!u) { m[v.vehicleId] = null; return; }
                    const s = fcUnitStats(fcApartados, fcChecklist, u.id);
                    const score = fcComputeScore(fcApartados, fcChecklist, u.id);
                    m[v.vehicleId] = { unidadId: u.id, ...s, score, tier: fcClassify(score) };
                });
                return m;
            }, [vehicles, fcByVehicleId, fcApartados, fcChecklist]);

            const handleLogin = e => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) { setIsAdmin(true); setShowLogin(false); setLoginError(false); setPasswordInput(''); showNotification('success', 'Modo Edición Activado'); }
                else setLoginError(true);
            };

            const runSeed = async () => {
                if (!db) return;
                setSeeding(true);
                try {
                    const chunks = []; for (let i = 0; i < FLEET_SEED.length; i += 400) chunks.push(FLEET_SEED.slice(i, i + 400));
                    for (const chunk of chunks) {
                        const batch = db.batch();
                        chunk.forEach(v => batch.set(db.collection(FLEET_COLLECTION).doc(String(v.vehicleId)), v, { merge: true }));
                        await batch.commit();
                    }
                    showNotification('success', `${FLEET_SEED.length} unidades cargadas desde el Excel`);
                } catch (e) { console.error(e); showNotification('error', 'Error al cargar datos'); }
                setSeeding(false);
            };

            const saveVehicle = async (payload, isNew) => {
                try {
                    await db.collection(FLEET_COLLECTION).doc(String(payload.vehicleId)).set(payload, { merge: true });
                    showNotification('success', isNew ? 'Unidad creada' : 'Unidad actualizada');
                    setModalVehicle(null); setShowNewModal(false);
                } catch (e) { console.error(e); showNotification('error', 'Error al guardar'); }
            };

            const deleteVehicle = async (v) => {
                if (!confirm(`¿Eliminar la unidad ${v.vehicleId} (${v.plate})? Esta acción no se puede deshacer.`)) return;
                try {
                    await db.collection(FLEET_COLLECTION).doc(String(v.vehicleId)).delete();
                    showNotification('success', 'Unidad eliminada'); setModalVehicle(null);
                } catch (e) { console.error(e); showNotification('error', 'Error al eliminar'); }
            };

            const filteredVehicles = useMemo(() => plantFilter === 'Todas' ? vehicles : vehicles.filter(v => v.plant === plantFilter), [vehicles, plantFilter]);

            const stats = useMemo(() => {
                const list = filteredVehicles;
                const total = list.length;
                const evaluated = list.filter(v => v.mecanix !== null && v.mecanix !== undefined);
                const sinEval = total - evaluated.length;
                const avgScore = evaluated.length > 0 ? evaluated.reduce((s, v) => s + v.mecanix, 0) / evaluated.length : null;
                const requierenRep = list.filter(v => (v.requiereReparacion || 0) > 0).length;
                const curYear = new Date().getFullYear();
                const avgAge = total > 0 ? list.reduce((s, v) => s + (curYear - (v.year || curYear)), 0) / total : 0;

                const byYear = {};
                list.forEach(v => { byYear[v.year] = (byYear[v.year] || 0) + 1; });
                const yearData = Object.keys(byYear).sort().map(y => ({ label: y, val: byYear[y] }));

                const byYearNoCumple = {};
                list.filter(v => (v.year || 0) <= NO_CUMPLE_YEAR_MAX).forEach(v => { byYearNoCumple[v.year] = (byYearNoCumple[v.year] || 0) + 1; });
                const noCumpleYearData = Object.keys(byYearNoCumple).sort().map(y => ({ label: y, val: byYearNoCumple[y] }));
                const noCumpleTotal = Object.values(byYearNoCumple).reduce((s, n) => s + n, 0);

                const byBucket = { exc: 0, bueno: 0, reg: 0, atn: 0, sin: 0 };
                list.forEach(v => { byBucket[scoreBucket(v.mecanix).key]++; });
                const bucketMeta = { exc: { label: 'Excelente', color: '#10b981' }, bueno: { label: 'Bueno', color: '#0ea5e9' }, reg: { label: 'Regular', color: '#f59e0b' }, atn: { label: 'Atención', color: '#e11d48' }, sin: { label: 'Sin evaluar', color: '#94a3b8' } };
                const bucketData = Object.keys(bucketMeta).map(k => ({ label: bucketMeta[k].label, val: byBucket[k], color: bucketMeta[k].color }));

                const byType = {};
                list.forEach(v => { byType[v.type] = (byType[v.type] || 0) + 1; });
                const typeColors = { 'Camion': '#e11d48', 'Camioneta': '#0ea5e9' };
                const typeData = Object.keys(byType).map(t => ({ label: t === 'Camion' ? 'Camión' : t, val: byType[t], color: typeColors[t] || '#94a3b8' }));

                // Evaluación promedio por planta según los criterios de FleetCheck (0-100, ponderado por categoría),
                // no Mecanix. Solo cuentan las unidades con al menos un punto revisado (fcInfoByVehicle[id].revisado > 0).
                const plantScoreData = PLANT_ORDER.map(p => {
                    const pl = list.filter(v => v.plant === p);
                    const ev = pl.filter(v => { const info = fcInfoByVehicle[v.vehicleId]; return info && info.revisado > 0; });
                    const score = ev.length > 0 ? ev.reduce((s, v) => s + fcInfoByVehicle[v.vehicleId].score, 0) / ev.length / 100 : null;
                    return { key: p, code: AREA_META[p].code, color: AREA_META[p].color, score, n: pl.length };
                });

                const topAttention = [...list].filter(v => (v.requiereReparacion || 0) > 0 || (v.mecanix !== null && v.mecanix < 0.9))
                    .sort((a, b) => (b.requiereReparacion || 0) - (a.requiereReparacion || 0) || (a.mecanix ?? 1) - (b.mecanix ?? 1)).slice(0, 5);

                return { total, sinEval, avgScore, requierenRep, avgAge, yearData, noCumpleYearData, noCumpleTotal, bucketData, typeData, plantScoreData, topAttention };
            }, [filteredVehicles, fcInfoByVehicle]);

            // --- Detalle al picarle a una barra de los gráficos ---
            const openYearBarDetail = (bar, onlyLabel) => {
                const year = parseInt(bar.label);
                setChartDetail({
                    title: `${onlyLabel || 'Unidades'} — Modelo ${bar.label}`,
                    vehicles: filteredVehicles.filter(v => v.year === year),
                    metricLabel: 'Planta',
                    metricGet: v => AREA_META[v.plant] ? AREA_META[v.plant].code : v.plant
                });
            };

            const openPlantEvalDetail = (bar) => {
                setChartDetail({
                    title: `Evaluación FleetCheck — ${bar.code} (${AREA_META[bar.key].label})`,
                    vehicles: filteredVehicles.filter(v => v.plant === bar.key),
                    metricLabel: '% Evaluación',
                    metricGet: v => { const info = fcInfoByVehicle[v.vehicleId]; return info && info.revisado > 0 ? info.score + '%' : (info ? 'Sin revisar' : 'Sin FleetCheck'); }
                });
            };

            const openVehicleFromChart = (v) => { setChartDetail(null); setModalVehicle(v); };

            const grouped = useMemo(() => {
                const g = {}; PLANT_ORDER.forEach(p => g[p] = []);
                filteredVehicles.forEach(v => { if (g[v.plant]) g[v.plant].push(v); else g[v.plant] = [v]; });
                Object.keys(g).forEach(p => g[p].sort((a, b) => a.vehicleId - b.vehicleId));
                return g;
            }, [filteredVehicles]);

            const plantsToShow = plantFilter === 'Todas' ? PLANT_ORDER : [plantFilter];

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2.5">
                                <div className="p-1.5 bg-rose-600 rounded-lg"><Icons.Truck /></div>
                                <div><h1 className="text-lg font-bold flex items-center gap-2">Flota Stellantis {isLoading && <span className="loader"></span>}</h1><p className="text-[11px] text-slate-400">Norte · Van · Extensión · Camiones · Sur — condición mecánica y documentación</p></div>
                            </div>
                            <div className="flex gap-2 items-center flex-wrap justify-center">
                                <div className="flex items-center bg-slate-800 border border-slate-700 rounded overflow-hidden text-xs">
                                    <a href="index.html" title="Inicio" className="px-2 py-1 text-slate-300 hover:bg-slate-700 border-r border-slate-700 flex items-center"><Icons.Home /></a>
                                    <a href="Matriz_Cumplimiento_Transporte.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Table />Matriz</a>
                                    <span className="px-2 py-1 bg-rose-600 text-white flex items-center gap-1"><Icons.Truck />Flota</span>
                                    <a href="Plantilla_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Users />Plantilla</a>
                                </div>
                                <div className="relative"><span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-500"><Icons.Search /></span><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar ID o placa..." className="bg-slate-800 border border-slate-700 rounded pl-7 pr-2 py-1 text-xs w-36 outline-none focus:border-rose-500" /></div>
                                <select className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs" value={plantFilter} onChange={e => setPlantFilter(e.target.value)}>
                                    <option value="Todas">Todas las plantas</option>
                                    {PLANT_ORDER.map(p => <option key={p} value={p}>{AREA_META[p].code} · {AREA_META[p].label}</option>)}
                                </select>
                                {isAdmin ? (
                                    <>
                                        <button onClick={() => setShowNewModal(true)} className="bg-rose-600 hover:bg-rose-700 px-2 py-1 rounded text-xs flex items-center gap-1.5"><Icons.Plus /> Unidad</button>
                                        <button onClick={() => { setIsAdmin(false); showNotification('success', 'Modo Vista Activado'); }} className="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs flex items-center gap-1.5" title="Salir modo admin"><Icons.LogOut /> Salir</button>
                                    </>
                                ) : (
                                    <button onClick={() => setShowLogin(true)} className="bg-slate-800 border border-slate-700 hover:bg-slate-700 px-2 py-1 rounded text-xs flex items-center gap-1.5 text-slate-300" title="Ingresar como Admin"><Icons.Lock /> Admin</button>
                                )}
                            </div>
                        </div>
                    </header>

                    {notification && <div className={`fixed top-20 right-4 p-4 rounded shadow-lg z-50 text-white ${notification.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>{notification.message}</div>}

                    {showLogin && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm fade-in">
                                <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-lg text-slate-800">Acceso Administrador</h3><button onClick={() => { setShowLogin(false); setLoginError(false); setPasswordInput(''); }} className="text-slate-400 hover:text-slate-600"><Icons.X /></button></div>
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">Contraseña</label><input type="password" autoFocus value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="w-full border rounded p-2 outline-none focus:border-rose-500" placeholder="••••••" />
                                    {loginError && <p className="text-xs text-red-500 mt-1">Contraseña incorrecta.</p>}</div>
                                    <button type="submit" className="w-full bg-slate-900 text-white py-2 rounded font-bold hover:bg-slate-800">Ingresar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <main className="max-w-7xl mx-auto px-4 py-8 space-y-8">
                        {loadError && <div className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-2 rounded-lg">No fue posible conectar con la base de datos en vivo — verifica tu conexión.</div>}

                        {!isLoading && vehicles.length === 0 && !loadError && (
                            <div className="bg-white border border-dashed border-slate-300 rounded-xl p-8 text-center space-y-3">
                                <p className="text-slate-500 text-sm">Aún no hay unidades cargadas en la base de datos.</p>
                                <button onClick={runSeed} disabled={seeding} className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded text-sm inline-flex items-center gap-2 disabled:opacity-60">{seeding && <span className="loader-sm"></span>}Cargar {FLEET_SEED.length} unidades desde el Excel</button>
                            </div>
                        )}

                        {/* KPIs */}
                        <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                            <StatCard title="Total de unidades" value={stats.total} icon={Icons.Truck} color="#1e293b" />
                            <StatCard title="Sin evaluación" value={stats.sinEval} icon={Icons.AlertTriangle} color="#94a3b8" />
                            <StatCard title="Score Mecanix promedio" value={stats.avgScore !== null ? (stats.avgScore * 100).toFixed(1) : '—'} suffix={stats.avgScore !== null ? '%' : ''} icon={Icons.Wrench} color="#10b981" />
                            <StatCard title="Requieren reparación" value={stats.requierenRep} icon={Icons.AlertTriangle} color="#e11d48" />
                            <StatCard title="Antigüedad promedio" value={stats.avgAge.toFixed(1)} suffix=" años" icon={Icons.Calendar} color="#0ea5e9" />
                        </div>

                        {/* GRÁFICOS PRINCIPALES */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.BarChart2 /></span> Panorama de la flota{plantFilter !== 'Todas' ? ` — ${AREA_META[plantFilter].label}` : ''}</h3>
                            <div className="grid grid-cols-1 xl:grid-cols-4 gap-5">
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Unidades por Modelo (Año)</h5>
                                    <BarChartOrdinal data={stats.yearData} color="#1e293b" onBarClick={bar => openYearBarDetail(bar, 'Unidades')} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider flex items-center justify-between">
                                        <span>Unidades que no cumplen por Modelo</span>
                                        <span className="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full normal-case font-bold">{stats.noCumpleTotal}</span>
                                    </h5>
                                    {stats.noCumpleYearData.length > 0
                                        ? <BarChartOrdinal data={stats.noCumpleYearData} color="#e11d48" onBarClick={bar => openYearBarDetail(bar, 'No cumplen')} />
                                        : <div className="h-[150px] flex items-center justify-center text-slate-300 text-xs text-center px-4">Todas las unidades cumplen (modelo {NO_CUMPLE_YEAR_MAX + 1}+)</div>}
                                    <p className="text-[10px] text-slate-400 mt-2">No cumplen: modelo {NO_CUMPLE_YEAR_MAX} o anterior.</p>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                    <DonutChart title="Calificación Mecanix" data={stats.bucketData} />
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                    <h5 className="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">Evaluación Promedio por Planta (FleetCheck)</h5>
                                    <PlantScoreBars data={stats.plantScoreData} onBarClick={openPlantEvalDetail} />
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                <DonutChart title="Tipo de Vehículo" data={stats.typeData} />
                            </div>
                            <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 bg-slate-50 font-bold border-b flex justify-between items-center text-sm"><span className="flex gap-2 items-center"><span className="text-rose-500"><Icons.AlertTriangle /></span> Unidades que requieren atención</span><span className="text-xs bg-rose-100 text-rose-700 px-2 py-1 rounded-full">{stats.topAttention.length}</span></div>
                                <div className="max-h-64 overflow-y-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 text-slate-500 text-xs"><tr><th className="p-3">ID</th><th className="p-3">Placas</th><th className="p-3">Planta</th><th className="p-3 text-center">Mecanix</th><th className="p-3 text-center">Req. Rep.</th></tr></thead>
                                        <tbody className="divide-y">
                                            {stats.topAttention.length === 0 && <tr><td colSpan="5" className="p-6 text-center text-slate-400">Sin unidades críticas por el momento.</td></tr>}
                                            {stats.topAttention.map(v => {
                                                const b = scoreBucket(v.mecanix);
                                                return (
                                                    <tr key={v.vehicleId} className="hover:bg-slate-50 cursor-pointer" onClick={() => setModalVehicle(v)}>
                                                        <td className="p-3 font-bold text-slate-700">{v.vehicleId}</td>
                                                        <td className="p-3 text-slate-600">{v.plate}</td>
                                                        <td className="p-3 text-slate-500 text-xs">{AREA_META[v.plant] ? AREA_META[v.plant].code : v.plant}</td>
                                                        <td className="p-3 text-center"><span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{ backgroundColor: b.color + '1a', color: b.color }}>{fmtPct(v.mecanix)}</span></td>
                                                        <td className="p-3 text-center font-bold text-rose-600">{v.requiereReparacion || 0}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        {/* UNIDADES STELLANTIS (todas, un solo bloque con columna de Planta) */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Truck /></span> Unidades Stellantis</h3>
                            <AllUnitsPanel vehicles={filteredVehicles} search={search} onOpenVehicle={setModalVehicle} fcInfoMap={fcInfoByVehicle} />
                        </div>

                        {/* LISTADO POR PLANTA */}
                        <div>
                            <h3 className="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Layers /></span> Unidades por planta</h3>
                            <div className="space-y-3">
                                {plantsToShow.map(p => <PlantPanel key={p} plantKey={p} vehicles={grouped[p] || []} search={search} defaultOpen={plantsToShow.length === 1} isAdmin={isAdmin} onOpenVehicle={setModalVehicle} fcInfoMap={fcInfoByVehicle} />)}
                            </div>
                        </div>
                    </main>

                    <ChartDetailModal info={chartDetail} onOpenVehicle={openVehicleFromChart} onClose={() => setChartDetail(null)} />

                    {modalVehicle && (
                        <VehicleModal vehicle={modalVehicle} isAdmin={isAdmin} isNew={false}
                            fcApartados={fcApartados} fcChecklist={fcChecklist} fcUnidad={fcByVehicleId[String(modalVehicle.vehicleId)] || null} fcDb={fcDb}
                            failures={failuresByVehicle[String(modalVehicle.vehicleId)] || []}
                            onClose={() => setModalVehicle(null)} onSave={saveVehicle} onDelete={deleteVehicle} showNotification={showNotification} />
                    )}
                    {showNewModal && (
                        <VehicleModal vehicle={null} isAdmin={isAdmin} isNew={true}
                            fcApartados={fcApartados} fcChecklist={fcChecklist} fcUnidad={null} fcDb={fcDb}
                            failures={[]}
                            onClose={() => setShowNewModal(false)} onSave={saveVehicle} onDelete={() => {}} showNotification={showNotification} />
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<FleetDashboard />);
    </script>
</body>
</html>
