                                                    const sd = r.shiftsData.find(x => x.key === shDef.key);
                                                    return (
                                                        <React.Fragment key={shDef.key}>
                                                            <MatrixCell value={sd.arranques} hasData={sd.list.length > 0} onClick={() => openArranquesDetail(r.area, shDef)} />
                                                            <MatrixCell value={sd.llegadas} hasData={sd.list.length > 0} onClick={() => openLlegadasDetail(r.area, shDef)} />
                                                        </React.Fragment>
                                                    );
                                                })}
                                                {ACC_COLS.map(c => <MatrixCell key={c.key} value={r.acc[c.key]} hasData={areaHasData} onClick={() => openAccDetail(r.area, c)} />)}
                                            </tr>
                                            );
                                        })}
                                        <tr className="font-bold">
                                            <td className="p-1 bg-slate-800 text-white sticky left-0 z-10 text-xs">Total</td>
                                            {visibleShifts.map(shDef => {
                                                const t = matrix.totals.shifts.find(x => x.key === shDef.key);
                                                const shiftHasData = matrix.rows.some(r => r.shiftsData.find(x => x.key === shDef.key).list.length > 0);
                                                return (
                                                    <React.Fragment key={shDef.key}>
                                                        {shiftHasData ? (
                                                            <>
                                                                <td className="p-0 text-center bg-slate-100"><button onClick={() => openTotalsDetail('arranques', shDef.key)} className="cell-btn w-full h-full py-1 text-xs text-slate-800">{t.arranques}</button></td>
                                                                <td className="p-0 text-center bg-slate-100"><button onClick={() => openTotalsDetail('llegadas', shDef.key)} className="cell-btn w-full h-full py-1 text-xs text-slate-800">{t.llegadas}</button></td>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <td className="p-0 text-center bg-slate-100"><span className="block w-full h-full py-1 text-xs text-slate-300 select-none" title="Sin datos capturados aún">—</span></td>
                                                                <td className="p-0 text-center bg-slate-100"><span className="block w-full h-full py-1 text-xs text-slate-300 select-none" title="Sin datos capturados aún">—</span></td>
                                                            </>
                                                        )}
                                                    </React.Fragment>
                                                );
                                            })}
                                            {(() => {
                                                const anyDataToday = matrix.rows.some(r => r.shiftsData.some(sd => sd.list.length > 0));
                                                return ACC_COLS.map(c => (
                                                    <td key={c.key} className="p-0 text-center bg-slate-100">
                                                        {anyDataToday
                                                            ? <button onClick={() => openTotalsDetail('acc', c.key)} className="cell-btn w-full h-full py-1 text-xs text-slate-800">{matrix.totals.acc[c.key]}</button>
                                                            : <span className="block w-full h-full py-1 text-xs text-slate-300 select-none" title="Sin datos capturados aún">—</span>}
                                                    </td>
                                                ));
                                            })()}
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <p className="text-[11px] text-slate-400 mt-3 flex items-center gap-1.5"><Icons.Info /> Haz clic en cualquier celda para ver el detalle de las incidencias que la componen. Celdas en verde = sin novedad, en rosa = con incidencias, "—" = sin reporte capturado aún.</p>
                            <p className="text-[11px] text-slate-400 mt-1 flex items-center gap-1.5"><Icons.AlertOctagon /> A = Accidente grave · B = Accidente moderado · C = Falla mecánica.</p>
                            </div>
                        </div>

                        {/* RESUMEN SEMANAL (mismo rango de fecha que el filtro de "Tendencias semanales", justo abajo; respeta el filtro de planta) */}
                        <div>
                            <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                                <h3 className="text-lg font-bold text-slate-700 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Layers /></span> Resumen semanal</h3>
                                <p className="text-[11px] text-slate-400">{trendWeek.label} · {selectedPlant === 'Todas' ? 'Todas las áreas' : selectedPlant}</p>
                            </div>
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
                                <StatCard title="Arranques fuera de tiempo" value={weekSummary.totals.arranques} icon={Icons.Clock} color="#0284c7" />
                                <StatCard title="Llegadas tarde" value={weekSummary.totals.llegadas} icon={Icons.AlertOctagon} color="#e11d48" />
                                <StatCard title="Fallas mecánicas" value={weekSummary.totals.mech} icon={Icons.Wrench} color="#7c3aed" />
                                <StatCard title="Percances" value={weekSummary.totals.accidents} icon={Icons.Activity} color="#ea580c" />
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5">
                                <GroupedBarChart title="Arranques y llegadas tarde por planta" icon={Icons.BarChart2}
                                    data={weekSummary.perPlant} seriesAKey="arranques" seriesALabel="Arranques" colorA="#0284c7"
                                    seriesBKey="llegadas" seriesBLabel="Llegadas tarde" colorB="#e11d48" />
                                <GroupedBarChart title="Fallas mecánicas y percances por planta" icon={Icons.BarChart2}
                                    data={weekSummary.perPlant} seriesAKey="mech" seriesALabel="Fallas mecánicas" colorA="#7c3aed"
                                    seriesBKey="accidents" seriesBLabel="Percances" colorB="#ea580c" />
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                <PieChart title="Causas de llegadas tarde" icon={Icons.PieChart} data={weekCauseSummary.pieData} />
                                <StackedBarChart title="Causas de llegadas tarde por planta" icon={Icons.Layers} data={weekCauseSummary.byPlant} legend={weekCauseSummary.legend} />
                            </div>
                        </div>

                        {/* TENDENCIAS SEMANALES (filtro de semana independiente al de la matriz; respeta el filtro de planta) */}
                        <div>
                            <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                                <h3 className="text-lg font-bold text-slate-700 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.BarChart2 /></span> Tendencias semanales</h3>
                                <div className="flex items-center gap-2 flex-wrap">
                                    <div className="flex items-center bg-white border border-slate-200 rounded overflow-hidden text-xs">
                                        <span className="pl-2.5 pr-1 text-slate-400">Del</span>
                                        <input type="date" value={weekRangeStart} onChange={e => setWeekRangeStart(e.target.value)} className="px-1 py-1.5 text-xs outline-none" />
                                        <span className="px-1 text-slate-400">al</span>
                                        <input type="date" value={weekRangeEnd} onChange={e => setWeekRangeEnd(e.target.value)} className="px-1 py-1.5 text-xs outline-none" />
                                    </div>
                                    <button onClick={resetWeekRange} className="bg-white border border-slate-200 hover:bg-slate-100 px-3 py-1.5 rounded text-xs text-slate-500 font-semibold">Semana actual</button>
                                </div>
                            </div>
                            <p className="text-[11px] text-slate-400 -mt-2.5 mb-3">{trendWeek.label} · {trendWeek.days.length} día(s)</p>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                <MultiTrendLine title="Arranques fuera de tiempo" icon={Icons.Clock} metricKey="arranques" days={trendWeek.days} plants={plantsToShow} colorSingle="#0284c7" compact={trendWeek.days.length > 12} />
                                <MultiTrendLine title="Llegadas fuera de tiempo" icon={Icons.AlertOctagon} metricKey="llegadas" days={trendWeek.days} plants={plantsToShow} colorSingle="#e11d48" compact={trendWeek.days.length > 12} />
                                <MultiTrendLine title="Percances" icon={Icons.Activity} metricKey="accidents" days={trendWeek.days} plants={plantsToShow} colorSingle="#ea580c" compact={trendWeek.days.length > 12} />
                                <MultiTrendLine title="Fallas Mecánicas" icon={Icons.Wrench} metricKey="mech" days={trendWeek.days} plants={plantsToShow} colorSingle="#7c3aed" compact={trendWeek.days.length > 12} />
                            </div>
                        </div>

                        {/* TENDENCIAS MENSUALES (rango de fecha independiente al de la matriz; respeta el filtro de planta) */}
                        <div>
                            <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                                <h3 className="text-lg font-bold text-slate-700 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.BarChart2 /></span> Tendencias mensuales <span className="text-[11px] font-normal text-slate-400">(agrupado por semana)</span></h3>
                                <div className="flex items-center gap-2 flex-wrap">
                                    <div className="flex items-center bg-white border border-slate-200 rounded overflow-hidden text-xs">
                                        <span className="pl-2.5 pr-1 text-slate-400">Del</span>
                                        <input type="date" value={monthRangeStart} onChange={e => setMonthRangeStart(e.target.value)} className="px-1 py-1.5 text-xs outline-none" />
                                        <span className="px-1 text-slate-400">al</span>
                                        <input type="date" value={monthRangeEnd} onChange={e => setMonthRangeEnd(e.target.value)} className="px-1 py-1.5 text-xs outline-none" />
                                    </div>
                                    <button onClick={resetMonthRange} className="bg-white border border-slate-200 hover:bg-slate-100 px-3 py-1.5 rounded text-xs text-slate-500 font-semibold">Mes actual</button>
                                </div>
                            </div>
                            <p className="text-[11px] text-slate-400 -mt-2.5 mb-3">{trendMonth.label} · {trendMonth.days.length} semana(s)</p>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                                <MultiTrendLine title="Arranques fuera de tiempo" icon={Icons.Clock} metricKey="arranques" days={trendMonth.days} plants={plantsToShow} colorSingle="#0284c7" compact={trendMonth.days.length > 12} />
                                <MultiTrendLine title="Llegadas fuera de tiempo" icon={Icons.AlertOctagon} metricKey="llegadas" days={trendMonth.days} plants={plantsToShow} colorSingle="#e11d48" compact={trendMonth.days.length > 12} />
                                <MultiTrendLine title="Percances" icon={Icons.Activity} metricKey="accidents" days={trendMonth.days} plants={plantsToShow} colorSingle="#ea580c" compact={trendMonth.days.length > 12} />
                                <MultiTrendLine title="Fallas Mecánicas" icon={Icons.Wrench} metricKey="mech" days={trendMonth.days} plants={plantsToShow} colorSingle="#7c3aed" compact={trendMonth.days.length > 12} />
                            </div>
                        </div>
                    </main>

                    <DetailModal info={detailInfo} onClose={() => setDetailInfo(null)} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<MatrixDashboard />);
    </script>
</body>
</html>
