<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Cumplimiento - Transporte</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #e11d48; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        .loader-sm { border: 2px solid #f3f3f3; border-top: 2px solid #ffffff; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .cell-btn { transition: transform .12s ease, box-shadow .12s ease; }
        .cell-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 2; }
        .matrix-tbl th, .matrix-tbl td { border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; display: flex; align-items: center; justify-content: center; color: #64748b;">
            Cargando Matriz...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const { createRoot } = ReactDOM;

        // --- ICONOS ---
        const Icons = {
            Truck: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="13" x="1" y="5" rx="2" /><polygon points="16 8 20 8 23 11 23 16 16 16 16 8" /><circle cx="5.5" cy="18.5" r="2.5" /><circle cx="18.5" cy="18.5" r="2.5" /></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            BarChart2: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>,
            PieChart: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            AlertOctagon: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>,
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            ArrowUpRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>,
            ArrowDownRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M7 7 17 17"/><path d="M17 7v10H7"/></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            ChevronLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
            Info: () => <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
            Layers: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.84l8.57 3.91a2 2 0 0 0 1.66 0l8.57-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>,
            Table: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>,
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Receipt: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Wrench: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>,
        };

        // --- FIREBASE (misma base de datos que el dashboard operativo) ---
        const firebaseConfig = {
            apiKey: "AIzaSyB5OvYG9qGFrwQGCIIk2ps6R7tBDrhHqrY",
            authDomain: "kpis-stellantis.firebaseapp.com",
            projectId: "kpis-stellantis",
            storageBucket: "kpis-stellantis.firebasestorage.app",
            messagingSenderId: "618714680596",
            appId: "1:618714680596:web:8b7d14cb1dd4e6a9dd0601",
            measurementId: "G-WDXSRLJ6VB"
        };

        let db;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (error) { console.error("Error Firebase:", error); }

        // --- MAPEO DE ÁREAS (código matriz -> planta del dashboard) ---
        const AREA_ROWS = [
            { code: 'SNEP', plant: 'Norte', color: '#0ea5e9' },
            { code: 'SVAP', plant: 'Van', color: '#8b5cf6' },
            { code: 'LD', plant: 'Extensión', color: '#14b8a6' },
            { code: 'HD', plant: 'Camiones', color: '#f43f5e' },
            { code: 'SSEP', plant: 'Sur', color: '#f59e0b' },
        ];
        const PLANTS = ['Todas', 'Camiones', 'Extensión', 'Van', 'Norte', 'Sur'];
        const SHIFTS = [
            { key: 'T1', label: '1er turno', head: 'bg-sky-100 text-sky-800 border-sky-200', type: 'fijo' },
            { key: 'MM', label: 'Mixto de Mañana', head: 'bg-indigo-100 text-indigo-800 border-indigo-200', type: 'mixto' },
            { key: 'T2', label: '2do turno', head: 'bg-orange-100 text-orange-800 border-orange-200', type: 'fijo' },
            { key: 'MT', label: 'Mixto de Tarde', head: 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-200', type: 'mixto' },
            { key: 'T3', label: '3er turno', head: 'bg-cyan-100 text-cyan-800 border-cyan-200', type: 'fijo' },
        ];
        const SHIFT_TYPE_FILTERS = ['Todos', 'Fijos', 'Mixtos'];
        const ACC_COLS = [
            { key: 'A', label: 'A', head: 'bg-red-600', name: 'Accidente Grave' },
            { key: 'B', label: 'B', head: 'bg-orange-500', name: 'Accidente Moderado' },
            { key: 'C', label: 'C', head: 'bg-amber-400', name: 'Falla Mecánica' },
        ];

        const CAUSE_LABELS_IMP = [
            ['causeImpSleep', 'Op. Dormido'], ['causeImpAccident', 'Siniestro'], ['causeImpRoute', 'Desvío Ruta'], ['causeImpMech', 'Falla Mec.'],
            ['causeImpSupervisor', 'Supervisor'], ['causeImpAttitude', 'Actitud de Op'], ['causeImpDriving', 'Mal Manejo'], ['causeImpFlatTire', 'Ponchadura'],
            ['causeImpAlcohol', 'Alcoholemia'], ['causeImpDiesel', 'Diesel'], ['causeImpOpTheme', 'Tema de Op.']
        ];
        const CAUSE_LABELS_NOIMP = [
            ['causeNoImpTraffic', 'Tráfico'], ['causeNoImpClosed', 'Calle Cerrada'], ['causeNoImpWeather', 'Clima'], ['causeNoImpOther', 'Otros'],
            ['causeNoImpCrashNoResp', 'Percance S/R'], ['causeNoImpTrain', 'Tren'], ['causeNoImpVandalism', 'Vandalismo'], ['causeNoImpOvercapacity', 'Sobreaforo'],
            ['causeNoImpPublicEvent', 'Evento Público'], ['causeNoImpProtest', 'Manifestación'], ['causeNoImpPublicWork', 'Obra Pública'], ['causeNoImpThirdPartyCrash', 'Acc. Terceros']
        ];
        // Paleta fija para las hasta 6 causas principales del resumen semanal (pastel + barras apiladas);
        // "Otras causas" siempre usa el gris neutro, sin importar en qué posición caiga.
        const CAUSE_COLORS = ['#0284c7', '#f59e0b', '#10b981', '#e11d48', '#7c3aed', '#ea580c'];
        const CAUSE_OTHER_COLOR = '#94a3b8';

        // --- HELPERS DE FECHA (evitando corrimientos por zona horaria) ---
        const pad2 = n => n.toString().padStart(2, '0');
        const isoToParts = iso => { const [y, m, d] = iso.split('-').map(Number); return { y, m, d }; };
        const isoToDMY = iso => { const { y, m, d } = isoToParts(iso); return `${pad2(d)}/${pad2(m)}/${y.toString().slice(-2)}`; };
        // Convierte una fecha "dd/mm/yy" (como se guardan los incidentes) a ISO "yyyy-mm-dd" para comparar rangos.
        const dmyToIso = dmy => { const [d, m, y] = dmy.split('/'); return `20${y}-${m}-${d}`; };
        const isoAddDays = (iso, delta) => {
            const { y, m, d } = isoToParts(iso);
            const dt = new Date(Date.UTC(y, m - 1, d));
            dt.setUTCDate(dt.getUTCDate() + delta);
            return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
        };
        const isoWeekdayShort = iso => {
            const { y, m, d } = isoToParts(iso);
            const dt = new Date(Date.UTC(y, m - 1, d));
            return dt.toLocaleDateString('es-ES', { weekday: 'short', timeZone: 'UTC' }).toUpperCase().replace('.', '');
        };
        const isoLongLabel = iso => {
            const { y, m, d } = isoToParts(iso);
            const dt = new Date(Date.UTC(y, m - 1, d));
            const s = dt.toLocaleDateString('es-ES', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' });
            return s.charAt(0).toUpperCase() + s.slice(1);
        };
        const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
        // Lunes = 1 ... Domingo = 7
        const isoWeekdayNum = iso => { const { y, m, d } = isoToParts(iso); const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return wd === 0 ? 7 : wd; };
        const isoWeekStart = iso => isoAddDays(iso, -(isoWeekdayNum(iso) - 1));
        const isoShortDayMonth = iso => { const { y, m, d } = isoToParts(iso); const s = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', timeZone: 'UTC' }); return s.replace('.', ''); };

        // --- GRÁFICA DE TENDENCIA MULTI-PLANTA (semanal o mensual, hasta 5 líneas — una por planta) ---
        // Cuando el filtro global de planta = "Todas" dibuja una línea por cada una de las 5 plantas;
        // si hay una sola planta seleccionada, dibuja una sola línea con el color propio de la métrica.
        const MultiTrendLine = ({ title, icon: Icon, metricKey, days, plants, colorSingle, suffix = '', compact = false }) => {
            const multi = plants.length > 1;
            const series = plants.map(p => ({
                code: p.code, color: p.color, plant: p.plant,
                values: days.map(d => (d.perPlant[p.plant] ? d.perPlant[p.plant][metricKey] : 0) || 0)
            }));
            const allValues = series.flatMap(s => s.values);
            const min = Math.min(...allValues, 0); const max = Math.max(...allValues, 1);
            const pad = (max - min) * 0.25 || 1; const domainMin = Math.max(0, min - pad); const domainMax = max + pad; const range = (domainMax - domainMin) || 1;
            const width = 620; const height = 170; const marginY = 28;
            // Margen izquierdo más ancho para dejar espacio a las etiquetas numéricas del eje Y.
            const marginL = compact ? 26 : 30; const marginR = 14;
            const n = days.length;
            const xAt = i => marginL + (n <= 1 ? 0 : (i / (n - 1)) * (width - marginL - marginR));
            const yAt = v => height - marginY - ((v - domainMin) / range) * (height - 2 * marginY);
            const [hoverIdx, setHoverIdx] = useState(null);
            const labelEvery = compact ? Math.max(1, Math.ceil(n / 10)) : 1;
            const lineColor = multi ? null : colorSingle;
            // Eje Y visual: línea vertical + marcas con su valor numérico en 5 niveles (incluye tope y base).
            const yTicks = [0, 0.25, 0.5, 0.75, 1].map(f => ({ y: marginY + f * (height - 2 * marginY), value: Math.round(domainMax - f * range) }));
            return (
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div className="flex items-center justify-between mb-1 flex-wrap gap-1.5">
                        <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">{Icon && <span style={{ color: multi ? '#64748b' : colorSingle }}><Icon /></span>}{title}</h5>
                        {multi && (
                            <div className="flex items-center gap-2 flex-wrap">
                                {series.map(s => <span key={s.code} className="flex items-center gap-1 text-[9px] font-semibold text-slate-500"><span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: s.color }}></span>{s.code}</span>)}
                            </div>
                        )}
                    </div>
                    <p className="text-[10px] text-slate-400 mb-2">{multi ? 'Todas las áreas' : plants[0].plant}</p>
                    <div className="relative w-full flex justify-center">
                        <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
                            {yTicks.map((t, i) => <line key={i} x1={marginL} x2={width - marginR} y1={t.y} y2={t.y} stroke="#f1f5f9" strokeWidth="1" />)}
                            {/* Eje Y: línea vertical + etiqueta numérica en cada marca */}
                            <line x1={marginL} x2={marginL} y1={marginY} y2={height - marginY} stroke="#cbd5e1" strokeWidth="1" />
                            {yTicks.map((t, i) => (i === 0 || t.value !== yTicks[i - 1].value) && <text key={i} x={marginL - 5} y={t.y + 3} textAnchor="end" fontSize={compact ? 7.5 : 8.5} fill="#94a3b8">{t.value}</text>)}
                            {hoverIdx !== null && <line x1={xAt(hoverIdx)} x2={xAt(hoverIdx)} y1={marginY} y2={height - marginY} stroke="#cbd5e1" strokeWidth="1" strokeDasharray="3,2" />}
                            {series.map(s => {
                                const pts = s.values.map((v, i) => `${xAt(i)},${yAt(v)}`).join(' ');
                                return (
                                    <g key={s.code}>
                                        <polyline points={pts} fill="none" stroke={lineColor || s.color} strokeWidth={multi ? 2 : 2.5} strokeLinecap="round" strokeLinejoin="round" />
                                        {s.values.map((v, i) => (
                                            <g key={i} onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)} style={{ cursor: 'pointer' }}>
                                                <circle cx={xAt(i)} cy={yAt(v)} r={hoverIdx === i ? 5 : (compact ? 2 : 3.5)} fill="white" stroke={lineColor || s.color} strokeWidth={hoverIdx === i ? 2.5 : 1.5} />
                                                <rect x={xAt(i) - 8} y={marginY} width="16" height={height - 2 * marginY} fill="transparent" />
                                                <title>{`${multi ? s.code + ' · ' : ''}${days[i].dayName} ${days[i].date}: ${v}${suffix}`}</title>
                                            </g>
                                        ))}
                                    </g>
                                );
                            })}
                            {days.map((d, i) => (i % labelEvery === 0 || i === n - 1) && (
                                <text key={i} x={xAt(i)} y={height - marginY + 16} textAnchor="middle" fontSize={compact ? 8 : 9.5} fill="#94a3b8">{d.dayName}</text>
                            ))}
                            {hoverIdx !== null && (() => {
                                const lines = [
                                    `${days[hoverIdx].dayName} ${days[hoverIdx].date}`,
                                    ...(multi ? series.map(s => `${s.code}: ${s.values[hoverIdx]}${suffix}`) : [`${series[0].values[hoverIdx]}${suffix}`])
                                ];
                                const lineH = 11;
                                const boxW = Math.max(64, Math.max(...lines.map(l => l.length)) * 5.4 + 12);
                                const boxH = lines.length * lineH + 8;
                                const topY = Math.min(...series.map(s => yAt(s.values[hoverIdx])));
                                let boxX = xAt(hoverIdx) - boxW / 2;
                                boxX = Math.max(marginL + 2, Math.min(width - boxW - 2, boxX));
                                let boxY = topY - boxH - 9;
                                if (boxY < 1) boxY = topY + 11;
                                return (
                                    <g pointerEvents="none">
                                        <rect x={boxX} y={boxY} width={boxW} height={boxH} rx="4" fill="#1e293b" fillOpacity="0.95" />
                                        {lines.map((l, li) => (
                                            <text key={li} x={boxX + boxW / 2} y={boxY + 12 + li * lineH} textAnchor="middle" fontSize={li === 0 ? 8 : 8.8} fontWeight={li === 0 ? 400 : 700} fill={li === 0 ? '#cbd5e1' : '#ffffff'}>{l}</text>
                                        ))}
                                    </g>
                                );
                            })()}
                        </svg>
                    </div>
                    {hoverIdx !== null && (
                        <p className="text-[10px] text-slate-500 text-center mt-1 border-t border-slate-100 pt-1.5">
                            <b className="text-slate-600">{days[hoverIdx].dayName} {days[hoverIdx].date}:</b> {series.map(s => `${multi ? s.code + ' ' : ''}${s.values[hoverIdx]}${suffix}`).join(' · ')}
                        </p>
                    )}
                </div>
            );
        };

        // --- GRÁFICA DE BARRAS AGRUPADAS POR PLANTA (2 métricas, una barra de cada una por planta) ---
        const GroupedBarChart = ({ title, icon: Icon, data, seriesAKey, seriesALabel, colorA, seriesBKey, seriesBLabel, colorB, suffix = '' }) => {
            const width = 620; const height = 170; const marginTop = 18; const marginBottom = 34; const marginL = 30; const marginR = 14;
            const [hover, setHover] = useState(null); // { idx, s: 'A' | 'B' }
            const maxVal = Math.max(1, ...data.flatMap(d => [d[seriesAKey], d[seriesBKey]]));
            const domainMax = maxVal * 1.15;
            const plotH = height - marginTop - marginBottom;
            const yAt = v => height - marginBottom - (v / domainMax) * plotH;
            const n = Math.max(1, data.length);
            const slotW = (width - marginL - marginR) / n;
            const barW = Math.min(26, slotW * 0.32);
            const yTicks = [0, 0.25, 0.5, 0.75, 1].map(f => ({ y: marginTop + f * plotH, value: Math.round(domainMax * (1 - f)) }));
            return (
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div className="flex items-center justify-between mb-1 flex-wrap gap-1.5">
                        <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">{Icon && <span className="text-slate-500"><Icon /></span>}{title}</h5>
                        <div className="flex items-center gap-3">
                            <span className="flex items-center gap-1 text-[9px] font-semibold text-slate-500"><span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: colorA }}></span>{seriesALabel}</span>
                            <span className="flex items-center gap-1 text-[9px] font-semibold text-slate-500"><span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: colorB }}></span>{seriesBLabel}</span>
                        </div>
                    </div>
                    <div className="relative w-full flex justify-center">
                        <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
                            {yTicks.map((t, i) => <line key={i} x1={marginL} x2={width - marginR} y1={t.y} y2={t.y} stroke="#f1f5f9" strokeWidth="1" />)}
                            <line x1={marginL} x2={marginL} y1={marginTop} y2={height - marginBottom} stroke="#cbd5e1" strokeWidth="1" />
                            {yTicks.map((t, i) => (i === 0 || t.value !== yTicks[i - 1].value) && <text key={i} x={marginL - 5} y={t.y + 3} textAnchor="end" fontSize="8.5" fill="#94a3b8">{t.value}</text>)}
                            {data.map((d, i) => {
                                const cx = marginL + slotW * i + slotW / 2;
                                const ax = cx - barW - 2, bx = cx + 2;
                                const ay = yAt(d[seriesAKey]), by = yAt(d[seriesBKey]);
                                const base = height - marginBottom;
                                return (
                                    <g key={d.code}>
                                        <rect x={ax} y={ay} width={barW} height={Math.max(0, base - ay)} rx="2" fill={colorA}
                                            stroke={hover && hover.idx === i && hover.s === 'A' ? '#0f172a' : 'none'} strokeWidth="1.5"
                                            onMouseEnter={() => setHover({ idx: i, s: 'A' })} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }} />
                                        <rect x={bx} y={by} width={barW} height={Math.max(0, base - by)} rx="2" fill={colorB}
                                            stroke={hover && hover.idx === i && hover.s === 'B' ? '#0f172a' : 'none'} strokeWidth="1.5"
                                            onMouseEnter={() => setHover({ idx: i, s: 'B' })} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }} />
                                        <text x={cx} y={height - marginBottom + 14} textAnchor="middle" fontSize="9.5" fill="#94a3b8">{d.code}</text>
                                    </g>
                                );
                            })}
                        </svg>
                    </div>
                    {hover && (
                        <p className="text-[10px] text-slate-500 text-center mt-1 border-t border-slate-100 pt-1.5">
                            <b className="text-slate-600">{data[hover.idx].plant}:</b> {seriesALabel} {data[hover.idx][seriesAKey]}{suffix} · {seriesBLabel} {data[hover.idx][seriesBKey]}{suffix}
                        </p>
                    )}
                </div>
            );
        };

        // --- GRÁFICA DE PASTEL (distribución por categoría, con leyenda directa) ---
        const PieChart = ({ title, icon: Icon, data, suffix = '' }) => {
            const size = 170; const cx = size / 2; const cy = size / 2; const r = 62;
            const total = data.reduce((s, d) => s + d.value, 0);
            const [hoverIdx, setHoverIdx] = useState(null);
            let angle = -90;
            const toXY = (a, radius) => [cx + radius * Math.cos(a * Math.PI / 180), cy + radius * Math.sin(a * Math.PI / 180)];
            const slices = total === 0 ? [] : data.map((d, i) => {
                const frac = d.value / total;
                const startAngle = angle;
                const endAngle = angle + frac * 360;
                angle = endAngle;
                const large = (endAngle - startAngle) > 180 ? 1 : 0;
                const outerR = hoverIdx === i ? r + 4 : r;
                const [x1, y1] = toXY(startAngle, outerR);
                const [x2, y2] = toXY(endAngle, outerR);
                const path = frac >= 0.999
                    ? `M ${cx} ${cy - outerR} A ${outerR} ${outerR} 0 1 1 ${cx - 0.01} ${cy - outerR} Z`
                    : `M ${cx} ${cy} L ${x1} ${y1} A ${outerR} ${outerR} 0 ${large} 1 ${x2} ${y2} Z`;
                return { ...d, path, pct: frac * 100 };
            });
            return (
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5 mb-3">{Icon && <span className="text-slate-500"><Icon /></span>}{title}</h5>
                    {total === 0 ? (
                        <p className="text-[11px] text-slate-400 py-8 text-center">Sin llegadas tarde con causa capturada en el rango seleccionado.</p>
                    ) : (
                        <div className="flex items-center gap-4 flex-wrap">
                            <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0 overflow-visible">
                                {slices.map((s, i) => (
                                    <path key={s.key} d={s.path} fill={s.color} stroke="#fff" strokeWidth="2"
                                        onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)} style={{ cursor: 'pointer' }}>
                                        <title>{`${s.label}: ${s.value}${suffix} (${s.pct.toFixed(1)}%)`}</title>
                                    </path>
                                ))}
                            </svg>
                            <div className="flex-1 min-w-[150px] space-y-1">
                                {slices.map((s, i) => (
                                    <div key={s.key} onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)}
                                        className={`flex items-center justify-between gap-2 text-[10px] px-1 py-0.5 rounded ${hoverIdx === i ? 'bg-slate-50' : ''}`}>
                                        <span className="flex items-center gap-1.5 text-slate-600"><span className="w-2 h-2 rounded-full inline-block shrink-0" style={{ backgroundColor: s.color }}></span>{s.label}</span>
                                        <span className="font-bold text-slate-700 whitespace-nowrap">{s.value} <span className="text-slate-400 font-normal">({s.pct.toFixed(0)}%)</span></span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- GRÁFICA DE BARRAS APILADAS POR PLANTA (desglose por causa) ---
        const StackedBarChart = ({ title, icon: Icon, data, legend, suffix = '' }) => {
            const width = 620; const height = 190; const marginTop = 18; const marginBottom = 34; const marginL = 30; const marginR = 14;
            const [hover, setHover] = useState(null); // { plantIdx, segKey }
            const maxTotal = Math.max(1, ...data.map(d => d.total));
            const domainMax = maxTotal * 1.15;
            const plotH = height - marginTop - marginBottom;
            const yAt = v => height - marginBottom - (v / domainMax) * plotH;
            const n = Math.max(1, data.length);
            const slotW = (width - marginL - marginR) / n;
            const barW = Math.min(46, slotW * 0.5);
            const yTicks = [0, 0.25, 0.5, 0.75, 1].map(f => ({ y: marginTop + f * plotH, value: Math.round(domainMax * (1 - f)) }));
            const anyData = data.some(d => d.total > 0);
            return (
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5 mb-1.5">{Icon && <span className="text-slate-500"><Icon /></span>}{title}</h5>
                    <div className="flex flex-wrap gap-x-2.5 gap-y-1 mb-2">
                        {legend.map(l => <span key={l.key} className="flex items-center gap-1 text-[9px] font-semibold text-slate-500"><span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: l.color }}></span>{l.label}</span>)}
                    </div>
                    {!anyData ? (
                        <p className="text-[11px] text-slate-400 py-8 text-center">Sin llegadas tarde con causa capturada en el rango seleccionado.</p>
                    ) : (
                        <div className="relative w-full flex justify-center">
                            <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
                                {yTicks.map((t, i) => <line key={i} x1={marginL} x2={width - marginR} y1={t.y} y2={t.y} stroke="#f1f5f9" strokeWidth="1" />)}
                                <line x1={marginL} x2={marginL} y1={marginTop} y2={height - marginBottom} stroke="#cbd5e1" strokeWidth="1" />
                                {yTicks.map((t, i) => (i === 0 || t.value !== yTicks[i - 1].value) && <text key={i} x={marginL - 5} y={t.y + 3} textAnchor="end" fontSize="8.5" fill="#94a3b8">{t.value}</text>)}
                                {data.map((d, i) => {
                                    const cx = marginL + slotW * i + slotW / 2;
                                    const x = cx - barW / 2;
                                    let cum = 0;
                                    return (
                                        <g key={d.code}>
                                            {d.segs.filter(s => s.value > 0).map(s => {
                                                const y0 = yAt(cum); cum += s.value; const y1 = yAt(cum);
                                                const isHover = hover && hover.plantIdx === i && hover.segKey === s.key;
                                                return (
                                                    <rect key={s.key} x={x} y={y1} width={barW} height={Math.max(0, y0 - y1 - 2)} fill={s.color}
                                                        stroke={isHover ? '#0f172a' : 'none'} strokeWidth="1.5"
                                                        onMouseEnter={() => setHover({ plantIdx: i, segKey: s.key })} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }} />
                                                );
                                            })}
                                            <text x={cx} y={height - marginBottom + 14} textAnchor="middle" fontSize="9.5" fill="#94a3b8">{d.code}</text>
                                        </g>
                                    );
                                })}
                            </svg>
                        </div>
                    )}
                    {hover && (() => {
                        const d = data[hover.plantIdx]; const s = d.segs.find(x => x.key === hover.segKey);
                        return <p className="text-[10px] text-slate-500 text-center mt-1 border-t border-slate-100 pt-1.5"><b className="text-slate-600">{d.plant} · {s.label}:</b> {s.value}{suffix} de {d.total}{suffix} total</p>;
                    })()}
                </div>
            );
        };

        // --- TARJETA KPI COMPACTA ---
        const StatCard = ({ title, value, suffix = '', icon: Icon, color }) => (
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                <div className="p-2.5 rounded-lg" style={{ backgroundColor: color + '1a', color }}><Icon /></div>
                <div><p className="text-[11px] text-slate-500 font-medium leading-tight">{title}</p><p className="text-xl font-bold text-slate-800 leading-tight">{value}<span className="text-sm text-slate-400 ml-0.5">{suffix}</span></p></div>
            </div>
        );

        // --- CELDA DE MATRIZ (clicable) ---
        // hasData = ¿existe al menos un reporte capturado para este cruce área/turno? Si no, la celda se deja
        // vacía (no se asume "0") hasta que capturen datos. Si sí hay reporte, se muestra el valor real
        // (que puede legítimamente ser 0 si el reporte confirma que no hubo incidencias).
        const MatrixCell = ({ value, onClick, hasData = true, tone = 'auto' }) => {
            if (!hasData) {
                return (
                    <td className="p-0 text-center align-middle">
                        <span className="block w-full h-full py-1 text-xs text-slate-300 select-none" title="Sin datos capturados aún">—</span>
                    </td>
                );
            }
            const zero = value === 0;
            const cls = zero ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-100 text-rose-700';
            return (
                <td className="p-0 text-center align-middle">
                    <button onClick={onClick} className={`cell-btn w-full h-full py-1 font-bold text-xs ${cls}`} title="Ver detalle">
                        {value}
                    </button>
                </td>
            );
        };

        // --- MODAL DE DETALLE ---
        const DetailModal = ({ info, onClose }) => {
            if (!info) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col fade-in" onClick={e => e.stopPropagation()}>
                        <div className="bg-slate-900 p-4 flex justify-between items-start text-white rounded-t-2xl">
                            <div><h2 className="font-bold text-base">{info.title}</h2><p className="text-xs text-slate-400 mt-0.5">{info.subtitle}</p></div>
                            <button onClick={onClose} className="text-slate-300 hover:text-white"><Icons.X /></button>
                        </div>
                        <div className="p-5 overflow-y-auto space-y-4">
                            {info.note && <div className="text-xs bg-amber-50 text-amber-700 border border-amber-200 rounded-lg p-3 flex gap-2 items-start"><span className="mt-0.5"><Icons.Info /></span>{info.note}</div>}
                            {info.summary && info.summary.length > 0 && (
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    {info.summary.map((s, i) => <div key={i} className="bg-slate-50 border border-slate-200 rounded-lg p-2 text-center"><p className="text-[10px] text-slate-500">{s.label}</p><p className="text-lg font-bold text-slate-800">{s.value}</p></div>)}
                                </div>
                            )}
                            {info.rows && info.rows.length > 0 ? (
                                <table className="w-full text-xs text-left border-collapse">
                                    <thead className="bg-slate-50 text-slate-500"><tr>{info.columns.map((c, i) => <th key={i} className="p-2 border-b border-slate-200">{c}</th>)}</tr></thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {info.rows.map((r, i) => <tr key={i} className="hover:bg-slate-50">{r.map((c, j) => <td key={j} className="p-2">{c}</td>)}</tr>)}
                                    </tbody>
                                </table>
                            ) : (
                                <div className="text-center text-slate-400 text-sm py-8">Sin incidencias registradas para este cruce.</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD PRINCIPAL: MATRIZ DE CUMPLIMIENTO ---
        const MatrixDashboard = () => {
            const [incidents, setIncidents] = useState([]);
            const [dailyMetrics, setDailyMetrics] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(false);
            const [selectedDate, setSelectedDate] = useState(todayISO());
            const [selectedPlant, setSelectedPlant] = useState('Todas');
            const [shiftTypeFilter, setShiftTypeFilter] = useState('Todos');
            const [detailInfo, setDetailInfo] = useState(null);
            const [downloadingImg, setDownloadingImg] = useState(false);
            const [downloadImgError, setDownloadImgError] = useState(false);
            const matrixCaptureRef = useRef(null);
            const matrixScrollRef = useRef(null);

            // Filtros independientes de la matriz diaria: controlan las tendencias semanal y mensual
            // (no afectan la fecha de la matriz ni viceversa). Cada bloque tiene su propio rango de
            // fecha de inicio/fin (en vez de navegación fija por semana/mes) para poder ampliar el
            // rango de la gráfica; por defecto arrancan en la semana y el mes corrientes.
            const currentMonthRange = () => {
                const d = new Date();
                const y = d.getFullYear(), m = d.getMonth() + 1;
                const lastDay = new Date(y, m, 0).getDate();
                return { start: `${y}-${pad2(m)}-01`, end: `${y}-${pad2(m)}-${pad2(lastDay)}` };
            };
            const [weekRangeStart, setWeekRangeStart] = useState(() => isoWeekStart(todayISO()));
            const [weekRangeEnd, setWeekRangeEnd] = useState(() => isoAddDays(isoWeekStart(todayISO()), 6));
            const [monthRangeStart, setMonthRangeStart] = useState(() => currentMonthRange().start);
            const [monthRangeEnd, setMonthRangeEnd] = useState(() => currentMonthRange().end);
            const resetWeekRange = () => { const s = isoWeekStart(todayISO()); setWeekRangeStart(s); setWeekRangeEnd(isoAddDays(s, 6)); };
            const resetMonthRange = () => { const r = currentMonthRange(); setMonthRangeStart(r.start); setMonthRangeEnd(r.end); };

            const visibleShifts = useMemo(() => SHIFTS.filter(sh => shiftTypeFilter === 'Todos' ? true : shiftTypeFilter === 'Fijos' ? sh.type === 'fijo' : sh.type === 'mixto'), [shiftTypeFilter]);
            const plantsToShow = useMemo(() => selectedPlant === 'Todas' ? AREA_ROWS : AREA_ROWS.filter(a => a.plant === selectedPlant), [selectedPlant]);

            // Descarga solo el bloque de la matriz (tabla + leyenda) como imagen PNG, sin el resto del dashboard.
            // Importante: la tabla vive dentro de un contenedor con scroll horizontal (overflow-x-auto), así que
            // el ancho "visible" del contenedor NO es el ancho real de la tabla completa. Para no capturar solo
            // lo que se ve en pantalla, se mide el scrollWidth real de la tabla/contenedor de scroll y, dentro de
            // onclone, se fuerza ese contenedor a overflow:visible con su ancho completo antes de tomar la foto.
            const downloadMatrizImage = async () => {
                const el = matrixCaptureRef.current;
                const scrollBox = matrixScrollRef.current;
                if (!el || typeof html2canvas === 'undefined') { setDownloadImgError(true); setTimeout(() => setDownloadImgError(false), 3000); return; }
                setDownloadingImg(true); setDownloadImgError(false);
                try {
                    const tableEl = scrollBox ? scrollBox.querySelector('table') : null;
                    const fullWidth = Math.max(el.scrollWidth, scrollBox ? scrollBox.scrollWidth : 0, tableEl ? tableEl.scrollWidth : 0);
                    const canvas = await html2canvas(el, {
                        backgroundColor: '#ffffff',
                        scale: 2,
                        useCORS: true,
                        scrollX: 0,
                        scrollY: -window.scrollY,
                        width: fullWidth,
                        height: el.scrollHeight,
                        windowWidth: fullWidth,
                        onclone: (clonedDoc, clonedEl) => {
                            const root = clonedEl || clonedDoc.querySelector('[data-matrix-capture]');
                            if (root) { root.style.width = fullWidth + 'px'; root.style.maxWidth = 'none'; }
                            const box = clonedDoc.querySelector('[data-matrix-scroll]');
                            if (box) { box.style.overflow = 'visible'; box.style.width = fullWidth + 'px'; box.style.maxWidth = 'none'; }
                        },
                    });
                    const link = document.createElement('a');
                    const plantSlug = (selectedPlant === 'Todas' ? 'Todas' : selectedPlant).replace(/\s+/g, '_');
                    link.download = `Matriz_${plantSlug}_${selectedDate}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    console.error('Error al generar la imagen de la matriz:', e);
                    setDownloadImgError(true); setTimeout(() => setDownloadImgError(false), 3000);
                }
                setDownloadingImg(false);
            };

            useEffect(() => {
                if (!db) { setIsLoading(false); setLoadError(true); return; }
                const unsub = db.collection("incidents").onSnapshot(
                    s => { setIncidents(s.docs.map(d => ({ id: d.id, ...d.data() }))); setIsLoading(false); },
                    err => { console.error(err); setIsLoading(false); setLoadError(true); }
                );
                const unsub2 = db.collection("daily_metrics").onSnapshot(s => { setDailyMetrics(s.docs.map(d => ({ id: d.id, ...d.data() }))); });
                return () => { unsub(); unsub2(); };
            }, []);

            // Nivel de servicio por fecha+planta: prioriza la colección nueva "daily_metrics"
            // (carga por día) y cae en el valor legado embebido en el incidente si no hay dato nuevo.
            const metricsMap = useMemo(() => {
                const map = {};
                dailyMetrics.forEach(m => { map[`${m.date}_${m.plant}`] = m; });
                return map;
            }, [dailyMetrics]);
            const serviceLevelFor = (date, plant) => {
                const dm = metricsMap[`${date}_${plant}`];
                return dm ? dm.serviceLevel : null;
            };

            // ---- MATRIZ DEL DÍA SELECCIONADO (siempre todas las áreas) ----
            const matrix = useMemo(() => {
                const dmy = isoToDMY(selectedDate);
                const dayIncidents = incidents.filter(i => i.date === dmy);
                const rows = AREA_ROWS.map(area => {
                    const areaIncidents = dayIncidents.filter(i => i.plant === area.plant);
                    const shiftsData = SHIFTS.map(sh => {
                        const list = areaIncidents.filter(i => i.shift === sh.key);
                        // Solo se suman los arranques CON afectación; "sin afectación" se sigue capturando
                        // y se puede ver desglosado dentro del detalle, pero ya no infla este total.
                        const arranques = list.reduce((s, i) => s + (i.lateStarts || 0), 0);
                        const llegadas = list.reduce((s, i) => s + (i.imp || 0) + (i.noImp || 0), 0);
                        return { key: sh.key, arranques, llegadas, list };
                    });
                    // Accidentes clasificados por severidad (grave/moderado). Los registros cargados antes de esta
                    // clasificación no traen accidentsDetails; se asumen "moderado" para no perder el conteo histórico.
                    let accGrave = 0, accMod = 0;
                    areaIncidents.forEach(i => {
                        const det = (i.accidentsDetails && i.accidentsDetails.length > 0) ? i.accidentsDetails : Array.from({ length: i.accidents || 0 }, () => ({ severity: 'moderado' }));
                        det.forEach(d => { if ((d.severity || 'moderado') === 'grave') accGrave++; else accMod++; });
                    });
                    const mechCount = areaIncidents.reduce((s, i) => s + (i.mechanicalFailures || 0), 0);
                    return {
                        area, shiftsData, acc: { A: accGrave, B: accMod, C: mechCount },
                        accList: areaIncidents.filter(i => (i.accidents || 0) > 0),
                        mechList: areaIncidents.filter(i => (i.mechanicalFailures || 0) > 0)
                    };
                });
                const totals = {
                    shifts: SHIFTS.map(sh => ({
                        key: sh.key,
                        arranques: rows.reduce((s, r) => s + r.shiftsData.find(x => x.key === sh.key).arranques, 0),
                        llegadas: rows.reduce((s, r) => s + r.shiftsData.find(x => x.key === sh.key).llegadas, 0)
                    })),
                    acc: {
                        A: rows.reduce((s, r) => s + r.acc.A, 0),
                        B: rows.reduce((s, r) => s + r.acc.B, 0),
                        C: rows.reduce((s, r) => s + r.acc.C, 0)
                    }
                };
                return { dmy, rows, totals, dayIncidents };
            }, [incidents, selectedDate]);

            // ---- Agrega arranques/llegadas/percances/fallas mecánicas por planta para UN día (todos los turnos) ----
            const dayBucket = (iso) => {
                const dmy = isoToDMY(iso);
                const dayIncidents = incidents.filter(i => i.date === dmy);
                const perPlant = {};
                AREA_ROWS.forEach(a => {
                    const list = dayIncidents.filter(i => i.plant === a.plant);
                    perPlant[a.plant] = {
                        arranques: list.reduce((s, i) => s + (i.lateStarts || 0), 0),
                        llegadas: list.reduce((s, i) => s + (i.imp || 0) + (i.noImp || 0), 0),
                        accidents: list.reduce((s, i) => s + (i.accidents || 0), 0),
                        mech: list.reduce((s, i) => s + (i.mechanicalFailures || 0), 0),
                    };
                });
                return perPlant;
            };

            // ---- TENDENCIA SEMANAL (un punto por día entre la fecha de inicio y fin elegidas; rango independiente del de la matriz) ----
            const trendWeek = useMemo(() => {
                let start = weekRangeStart, end = weekRangeEnd;
                if (!start || !end) return { days: [], label: '—' };
                if (end < start) { const t = start; start = end; end = t; }
                const days = [];
                let cur = start, guard = 0;
                while (guard < 370) { // tope de seguridad (~1 año de días) por si el usuario elige un rango enorme
                    days.push({ date: isoToDMY(cur), dayName: isoWeekdayShort(cur), iso: cur, perPlant: dayBucket(cur) });
                    if (cur === end) break;
                    cur = isoAddDays(cur, 1);
                    guard++;
                }
                return { days, label: `${isoShortDayMonth(start)} – ${isoShortDayMonth(end)} ${isoToParts(end).y}` };
            }, [incidents, weekRangeStart, weekRangeEnd]);

            // ---- RESUMEN SEMANAL (mismo rango que "Tendencias semanales"; totales y desglose por planta) ----
            const weekSummary = useMemo(() => {
                const perPlant = plantsToShow.map(p => {
                    const totals = trendWeek.days.reduce((acc, d) => {
                        const v = (d.perPlant && d.perPlant[p.plant]) || { arranques: 0, llegadas: 0, accidents: 0, mech: 0 };
                        acc.arranques += v.arranques; acc.llegadas += v.llegadas; acc.accidents += v.accidents; acc.mech += v.mech;
                        return acc;
                    }, { arranques: 0, llegadas: 0, accidents: 0, mech: 0 });
                    return { code: p.code, plant: p.plant, color: p.color, ...totals };
                });
                const totals = perPlant.reduce((acc, p) => ({
                    arranques: acc.arranques + p.arranques, llegadas: acc.llegadas + p.llegadas,
                    accidents: acc.accidents + p.accidents, mech: acc.mech + p.mech
                }), { arranques: 0, llegadas: 0, accidents: 0, mech: 0 });
                return { perPlant, totals };
            }, [trendWeek, plantsToShow]);

            // ---- CAUSAS DE LLEGADAS TARDE DE LA SEMANA (top 6 causas + "Otras"; mismo rango y filtro de planta) ----
            const weekCauseSummary = useMemo(() => {
                let start = weekRangeStart, end = weekRangeEnd;
                if (!start || !end) return { pieData: [], byPlant: [], legend: [] };
                if (end < start) { const t = start; start = end; end = t; }
                const plantSet = new Set(plantsToShow.map(p => p.plant));
                const relevant = incidents.filter(i => {
                    if (!i.date || !plantSet.has(i.plant)) return false;
                    const iso = dmyToIso(i.date);
                    return iso >= start && iso <= end;
                });
                const allCauses = [...CAUSE_LABELS_IMP, ...CAUSE_LABELS_NOIMP];
                const causeTotals = allCauses
                    .map(([key, label]) => ({ key, label, value: relevant.reduce((s, i) => s + (i[key] || 0), 0) }))
                    .filter(c => c.value > 0)
                    .sort((a, b) => b.value - a.value);

                const TOP_N = 6;
                const top = causeTotals.slice(0, TOP_N).map((c, i) => ({ ...c, color: CAUSE_COLORS[i % CAUSE_COLORS.length] }));
                const topKeys = new Set(top.map(c => c.key));
                const restTotal = causeTotals.filter(c => !topKeys.has(c.key)).reduce((s, c) => s + c.value, 0);
                const legend = restTotal > 0 ? [...top, { key: '__other', label: 'Otras causas', value: restTotal, color: CAUSE_OTHER_COLOR }] : top;

                const byPlant = plantsToShow.map(p => {
                    const plantIncidents = relevant.filter(i => i.plant === p.plant);
                    const segs = legend.map(l => ({
                        key: l.key, label: l.label, color: l.color,
                        value: l.key === '__other'
                            ? allCauses.filter(([k]) => !topKeys.has(k)).reduce((s, [k]) => s + plantIncidents.reduce((s2, i) => s2 + (i[k] || 0), 0), 0)
                            : plantIncidents.reduce((s, i) => s + (i[l.key] || 0), 0)
                    }));
                    const total = segs.reduce((s, x) => s + x.value, 0);
                    return { code: p.code, plant: p.plant, segs, total };
                });

                return { pieData: legend, byPlant, legend };
            }, [incidents, weekRangeStart, weekRangeEnd, plantsToShow]);

            // ---- TENDENCIA MENSUAL (un punto por semana lunes-domingo entre la fecha de inicio y fin elegidas; rango independiente del de la matriz) ----
            const trendMonth = useMemo(() => {
                let start = monthRangeStart, end = monthRangeEnd;
                if (!start || !end) return { days: [], label: '—' };
                if (end < start) { const t = start; start = end; end = t; }
                const days = [];
                let weekStart = isoWeekStart(start), weekIdx = 1, guard = 0;
                while (weekStart <= end && guard < 80) { // tope de seguridad (~80 semanas) por si el usuario elige un rango enorme
                    const weekEnd = isoAddDays(weekStart, 6);
                    const perPlant = {};
                    AREA_ROWS.forEach(a => { perPlant[a.plant] = { arranques: 0, llegadas: 0, accidents: 0, mech: 0 }; });
                    let anyDayInRange = false;
                    for (let off = 0; off <= 6; off++) {
                        const iso = isoAddDays(weekStart, off);
                        if (iso < start || iso > end) continue;
                        anyDayInRange = true;
                        const b = dayBucket(iso);
                        AREA_ROWS.forEach(a => {
                            perPlant[a.plant].arranques += b[a.plant].arranques;
                            perPlant[a.plant].llegadas += b[a.plant].llegadas;
                            perPlant[a.plant].accidents += b[a.plant].accidents;
                            perPlant[a.plant].mech += b[a.plant].mech;
                        });
                    }
                    if (anyDayInRange) {
                        days.push({ date: `${isoShortDayMonth(weekStart)} - ${isoShortDayMonth(weekEnd)}`, dayName: `Sem ${weekIdx}`, iso: weekStart, perPlant });
                        weekIdx++;
                    }
                    weekStart = isoAddDays(weekStart, 7);
                    guard++;
                }
                return { days, label: `${isoShortDayMonth(start)} – ${isoShortDayMonth(end)} ${isoToParts(end).y}` };
            }, [incidents, monthRangeStart, monthRangeEnd]);

            const dayStats = useMemo(() => {
                const list = matrix.dayIncidents;
                const arranques = list.reduce((s, i) => s + (i.lateStarts || 0), 0);
                const llegadas = list.reduce((s, i) => s + (i.imp || 0) + (i.noImp || 0), 0);
                const accidents = list.reduce((s, i) => s + (i.accidents || 0), 0);
                const cruces = AREA_ROWS.length * SHIFTS.length;
                const crucesLimpios = matrix.rows.reduce((s, r) => s + r.shiftsData.filter(sd => sd.arranques === 0 && sd.llegadas === 0).length, 0);
                const cumplimiento = cruces > 0 ? ((crucesLimpios / cruces) * 100).toFixed(0) : 100;
                return { arranques, llegadas, accidents, cumplimiento };
            }, [matrix]);

            const causeSummary = (list, causeDefs) => {
                const sums = causeDefs.map(([key, label]) => ({ label, val: list.reduce((s, i) => s + (i[key] || 0), 0) }));
                return sums.filter(s => s.val > 0).sort((a, b) => b.val - a.val).slice(0, 6);
            };

            // Aplana el detalle por ocurrencia (ruta + minutos tarde) capturado en el reporte.
            // Si un registro no trae el arreglo de detalle (reportes cargados antes de esta función),
            // se generan filas vacías para no perder el conteo total.
            const minutesOrDash = d => (d && d.minutes !== '' && d.minutes !== undefined && d.minutes !== null) ? d.minutes : '-';
            const routeOrDash = d => (d && d.route) ? d.route : '-';

            const flattenLateStarts = (list) => {
                const rows = [];
                list.forEach(i => {
                    const cAff = (i.lateStartsDetails && i.lateStartsDetails.length > 0) ? i.lateStartsDetails : Array.from({ length: i.lateStarts || 0 }, () => null);
                    cAff.forEach(d => rows.push([i.date, i.shift, 'C/Afect.', routeOrDash(d), minutesOrDash(d)]));
                    const sAff = (i.lateStartsNoAffDetails && i.lateStartsNoAffDetails.length > 0) ? i.lateStartsNoAffDetails : Array.from({ length: i.lateStartsNoAff || 0 }, () => null);
                    sAff.forEach(d => rows.push([i.date, i.shift, 'S/Afect.', routeOrDash(d), minutesOrDash(d)]));
                });
                return rows;
            };

            const flattenCauses = (list, causeDefs, tag) => {
                const rows = [];
                list.forEach(i => {
                    causeDefs.forEach(([key, label]) => {
                        const arr = (i[key + 'Details'] && i[key + 'Details'].length > 0) ? i[key + 'Details'] : Array.from({ length: i[key] || 0 }, () => null);
                        arr.forEach(d => rows.push([i.date, i.shift, tag, label, routeOrDash(d), minutesOrDash(d)]));
                    });
                });
                return rows;
            };

            const openArranquesDetail = (area, sh) => {
                const list = matrix.rows.find(r => r.area.code === area.code).shiftsData.find(s => s.key === sh.key).list;
                setDetailInfo({
                    title: `Arranques fuera de tiempo — ${area.code} (${area.plant})`,
                    subtitle: `${sh.label} · ${isoLongLabel(selectedDate)}`,
                    summary: [
                        { label: 'Con afectación', value: list.reduce((s, i) => s + (i.lateStarts || 0), 0) },
                        { label: 'Sin afectación', value: list.reduce((s, i) => s + (i.lateStartsNoAff || 0), 0) },
                        { label: 'Registros', value: list.length }
                    ],
                    columns: ['Fecha', 'Turno', 'Tipo', 'Ruta', 'Min. Tarde'],
                    rows: flattenLateStarts(list)
                });
            };

            const openLlegadasDetail = (area, sh) => {
                const list = matrix.rows.find(r => r.area.code === area.code).shiftsData.find(s => s.key === sh.key).list;
                const impList = causeSummary(list, CAUSE_LABELS_IMP);
                const noImpList = causeSummary(list, CAUSE_LABELS_NOIMP);
                setDetailInfo({
                    title: `Llegadas fuera de tiempo — ${area.code} (${area.plant})`,
                    subtitle: `${sh.label} · ${isoLongLabel(selectedDate)} · Fallas imputables + no imputables`,
                    summary: [
                        { label: 'Imputables', value: list.reduce((s, i) => s + (i.imp || 0), 0) },
                        { label: 'No imputables', value: list.reduce((s, i) => s + (i.noImp || 0), 0) },
                        { label: 'Registros', value: list.length }
                    ],
                    note: (impList.length > 0 || noImpList.length > 0) ? (
                        'Principales causas: ' +
                        [...impList, ...noImpList].map(c => `${c.label} (${c.val})`).join(', ')
                    ) : null,
                    columns: ['Fecha', 'Turno', 'Tipo', 'Causa', 'Ruta', 'Min. Tarde'],
                    rows: [...flattenCauses(list, CAUSE_LABELS_IMP, 'Imputable'), ...flattenCauses(list, CAUSE_LABELS_NOIMP, 'No Imp.')]
                });
            };

            const openAccDetail = (area, col) => {
                const row = matrix.rows.find(r => r.area.code === area.code);

                if (col.key === 'C') {
                    const rows = [];
                    (row.mechList || []).forEach(i => {
                        const arr = (i.mechanicalFailuresDetails && i.mechanicalFailuresDetails.length > 0) ? i.mechanicalFailuresDetails : Array.from({ length: i.mechanicalFailures || 0 }, () => null);
                        arr.forEach(d => rows.push([i.date, i.shift, (d && d.route) || '-', (d && d.unitId) || '-', (d && d.description) || '-']));
                    });
                    setDetailInfo({
                        title: `Fallas Mecánicas — ${area.code} (${area.plant})`,
                        subtitle: isoLongLabel(selectedDate),
                        summary: [{ label: 'Fallas mecánicas', value: row.acc.C }, { label: 'Registros', value: (row.mechList || []).length }],
                        columns: ['Fecha', 'Turno', 'Ruta', 'ID Unidad', 'Falla'],
                        rows
                    });
                    return;
                }

                const severityKey = col.key === 'A' ? 'grave' : 'moderado';
                const rows = [];
                (row.accList || []).forEach(i => {
                    const det = (i.accidentsDetails && i.accidentsDetails.length > 0) ? i.accidentsDetails : Array.from({ length: i.accidents || 0 }, () => ({ severity: 'moderado', description: '' }));
                    det.filter(d => (d.severity || 'moderado') === severityKey).forEach(d => rows.push([i.date, i.shift, d.description || '-']));
                });
                setDetailInfo({
                    title: `Accidentes tipo ${col.key} (${col.name}) — ${area.code} (${area.plant})`,
                    subtitle: isoLongLabel(selectedDate),
                    summary: [{ label: col.name, value: row.acc[col.key] }, { label: 'Registros', value: (row.accList || []).length }],
                    columns: ['Fecha', 'Turno', 'Descripción'],
                    rows
                });
            };

            const openTotalsDetail = (type, shKey) => {
                if (type === 'acc') {
                    const col = ACC_COLS.find(c => c.key === shKey);

                    if (col.key === 'C') {
                        const rows = [];
                        matrix.rows.forEach(r => {
                            (r.mechList || []).forEach(i => {
                                const arr = (i.mechanicalFailuresDetails && i.mechanicalFailuresDetails.length > 0) ? i.mechanicalFailuresDetails : Array.from({ length: i.mechanicalFailures || 0 }, () => null);
                                arr.forEach(d => rows.push([`${r.area.code} (${r.area.plant})`, i.date, i.shift, (d && d.route) || '-', (d && d.unitId) || '-', (d && d.description) || '-']));
                            });
                        });
                        setDetailInfo({
                            title: `Total Fallas Mecánicas — Todas las áreas`,
                            subtitle: isoLongLabel(selectedDate),
                            columns: ['Área', 'Fecha', 'Turno', 'Ruta', 'ID Unidad', 'Falla'],
                            rows
                        });
                        return;
                    }

                    const severityKey = col.key === 'A' ? 'grave' : 'moderado';
                    const rows = [];
                    matrix.rows.forEach(r => {
                        (r.accList || []).forEach(i => {
                            const det = (i.accidentsDetails && i.accidentsDetails.length > 0) ? i.accidentsDetails : Array.from({ length: i.accidents || 0 }, () => ({ severity: 'moderado', description: '' }));
                            det.filter(d => (d.severity || 'moderado') === severityKey).forEach(d => rows.push([`${r.area.code} (${r.area.plant})`, i.date, i.shift, d.description || '-']));
                        });
                    });
                    setDetailInfo({
                        title: `Total Accidentes tipo ${col.key} (${col.name}) — Todas las áreas`,
                        subtitle: isoLongLabel(selectedDate),
                        columns: ['Área', 'Fecha', 'Turno', 'Descripción'],
                        rows
                    });
                    return;
                }
                const sh = SHIFTS.find(s => s.key === shKey);

                if (type === 'llegadas') {
                    const allList = matrix.rows.flatMap(r => r.shiftsData.find(s => s.key === shKey).list);
                    const impList = causeSummary(allList, CAUSE_LABELS_IMP);
                    const noImpList = causeSummary(allList, CAUSE_LABELS_NOIMP);
                    setDetailInfo({
                        title: `Total Llegadas fuera de tiempo — Todas las áreas`,
                        subtitle: `${sh.label} · ${isoLongLabel(selectedDate)}`,
                        note: (impList.length > 0 || noImpList.length > 0) ? (
                            'Principales causas: ' + [...impList, ...noImpList].map(c => `${c.label} (${c.val})`).join(', ')
                        ) : null,
                        columns: ['Área', 'Llegadas'],
                        rows: matrix.rows.map(r => [`${r.area.code} (${r.area.plant})`, r.shiftsData.find(s => s.key === shKey).llegadas]).filter(r => r[1] > 0)
                    });
                    return;
                }

                setDetailInfo({
                    title: `Total Arranques fuera de tiempo — Todas las áreas`,
                    subtitle: `${sh.label} · ${isoLongLabel(selectedDate)}`,
                    columns: ['Área', 'Arranques'],
                    rows: matrix.rows.map(r => [`${r.area.code} (${r.area.plant})`, r.shiftsData.find(s => s.key === shKey).arranques]).filter(r => r[1] > 0)
                });
            };

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2.5 min-w-0 xl:flex-1">
                                <div className="p-1.5 bg-rose-600 rounded-lg" style={{ flexShrink: 0 }}><Icons.Truck /></div>
                                <div className="min-w-0"><h1 className="text-lg font-bold flex items-center gap-2 whitespace-nowrap">Matriz de Cumplimiento {isLoading && <span className="loader"></span>}</h1><p className="text-[11px] text-slate-400 xl:truncate">Norte · Van · Extensión · Camiones · Sur — datos en vivo del Dashboard de Transporte</p></div>
                            </div>
                            <div className="flex gap-2 items-center flex-wrap xl:flex-nowrap justify-center shrink-0">
                                <div className="flex items-center bg-slate-800 border border-slate-700 rounded overflow-hidden text-xs">
                                    <a href="index.html" title="Inicio" className="px-2 py-1 text-slate-300 hover:bg-slate-700 border-r border-slate-700 flex items-center"><Icons.Home /></a>
                                    <span className="px-2 py-1 bg-rose-600 text-white flex items-center gap-1"><Icons.Table /><span className="hidden sm:inline">Matriz</span></span>
                                    <a href="Flota_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Truck /><span className="hidden sm:inline">Flota</span></a>
                                    <a href="Plantilla_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Users /><span className="hidden sm:inline">Plantilla</span></a>
                                    <a href="Penalizaciones_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Receipt /><span className="hidden sm:inline">Penalizaciones</span></a>
                                </div>
                                <div className="flex items-center bg-slate-800 border border-slate-700 rounded overflow-hidden text-xs">
                                    <button onClick={() => setSelectedDate(d => isoAddDays(d, -1))} className="px-1.5 py-1 hover:bg-slate-700"><Icons.ChevronLeft /></button>
                                    <div className="flex items-center gap-1 px-1"><span className="text-slate-400"><Icons.Calendar /></span>
                                        <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} className="bg-slate-800 text-white text-xs px-1 py-1 outline-none" />
                                    </div>
                                    <button onClick={() => setSelectedDate(d => isoAddDays(d, 1))} className="px-1.5 py-1 hover:bg-slate-700"><Icons.ChevronRight /></button>
                                </div>
                                <button onClick={() => setSelectedDate(todayISO())} className="bg-slate-800 border border-slate-700 hover:bg-slate-700 px-2 py-1 rounded text-xs text-slate-300">Hoy</button>
                                <select className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs" value={selectedPlant} onChange={e => setSelectedPlant(e.target.value)}>
                                    {PLANTS.map(p => <option key={p} value={p}>{p === 'Todas' ? 'Todas las áreas' : p}</option>)}
                                </select>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-8 space-y-8">
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <h2 className="text-lg font-bold text-slate-700">{isoLongLabel(selectedDate)}</h2>
                            {loadError && <span className="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-full">No fue posible conectar con la base de datos en vivo — verifica tu conexión.</span>}
                        </div>

                        {/* KPIs DEL DÍA */}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <StatCard title="Arranques fuera de tiempo" value={dayStats.arranques} icon={Icons.Clock} color="#0284c7" />
                            <StatCard title="Llegadas fuera de tiempo" value={dayStats.llegadas} icon={Icons.AlertOctagon} color="#e11d48" />
                            <StatCard title="Percances del día" value={dayStats.accidents} icon={Icons.AlertOctagon} color="#ea580c" />
                            <StatCard title="Cruces área-turno sin novedad" value={dayStats.cumplimiento} suffix="%" icon={Icons.CheckCircle} color="#10b981" />
                        </div>

                        {/* LEYENDA DE ÁREAS */}
                        <div className="flex flex-wrap gap-3 bg-white border border-slate-200 rounded-xl p-3 text-xs">
                            {AREA_ROWS.map(a => (
                                <span key={a.code} className="flex items-center gap-1.5 text-slate-600"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ backgroundColor: a.color }}></span><b>{a.code}</b> = {a.plant}</span>
                            ))}
                        </div>

                        {/* MATRIZ */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6">
                            <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
                                <h3 className="font-bold flex gap-2 items-center"><span className="text-slate-500"><Icons.Table /></span> Matriz diaria por área y turno</h3>
                                <div className="flex items-center gap-2 flex-wrap">
                                    <div className="flex items-center bg-slate-100 border border-slate-200 rounded overflow-hidden text-xs">
                                        {SHIFT_TYPE_FILTERS.map(opt => (
                                            <button key={opt} onClick={() => setShiftTypeFilter(opt)} className={`px-2.5 py-1.5 font-bold ${shiftTypeFilter === opt ? 'bg-slate-800 text-white' : 'text-slate-500 hover:bg-slate-200'}`}>{opt}</button>
                                        ))}
                                    </div>
                                    {downloadImgError && <span className="text-[11px] text-red-500">No se pudo generar la imagen</span>}
                                    <button onClick={downloadMatrizImage} disabled={downloadingImg} className="text-xs font-bold bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded flex items-center gap-1.5 disabled:opacity-60">
                                        {downloadingImg ? <span className="loader-sm"></span> : <Icons.Download />}Descargar imagen
                                    </button>
                                </div>
                            </div>
                            <div ref={matrixCaptureRef} data-matrix-capture="true" className="bg-white">
                            <div className="flex items-center gap-2 mb-2">
                                <span className="text-slate-500"><Icons.Table /></span>
                                <h4 className="font-bold text-slate-800 text-sm">Matriz diaria por área y turno</h4>
                                <span className="text-xs text-slate-400">— {isoLongLabel(selectedDate)} · {selectedPlant === 'Todas' ? 'Todas las áreas' : selectedPlant} · {shiftTypeFilter}</span>
                            </div>
                            <div ref={matrixScrollRef} data-matrix-scroll="true" className="overflow-x-auto">
                                <table className={`matrix-tbl w-full text-[11px] border-collapse ${visibleShifts.length > 3 ? 'min-w-[920px]' : 'min-w-[600px]'}`}>
                                    <thead>
                                        <tr>
                                            <th rowSpan="2" className="bg-slate-800 text-white p-1 sticky left-0 z-10">Área</th>
                                            {visibleShifts.map(sh => <th key={sh.key} colSpan="2" className={`p-1 font-bold text-[10px] leading-tight ${sh.head}`}>{sh.label}</th>)}
                                            <th colSpan="3" className="bg-slate-900 text-white p-1 font-bold text-[10px]">ACC. Y FALLAS MEC.</th>
                                        </tr>
                                        <tr>
                                            {visibleShifts.map(sh => (
                                                <React.Fragment key={sh.key}>
                                                    <th className="bg-white p-0.5 font-semibold text-slate-500 text-[10px]" title="Arranques fuera de tiempo"><span className="flex items-center justify-center gap-0.5 text-sky-600"><Icons.ArrowUpRight />Arranques</span></th>
                                                    <th className="bg-white p-0.5 font-semibold text-slate-500 text-[10px]" title="Llegadas fuera de tiempo"><span className="flex items-center justify-center gap-0.5 text-rose-500"><Icons.ArrowDownRight />Llegadas</span></th>
                                                </React.Fragment>
                                            ))}
                                            {ACC_COLS.map(c => <th key={c.key} className={`${c.head} text-white p-1 font-bold text-[10px]`}>{c.key}</th>)}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {matrix.rows.map(r => {
                                            // ¿Se capturó al menos un reporte para esta área en algún turno hoy?
                                            // Los accidentes/fallas mecánicas se registran a nivel área (no por turno),
                                            // así que su "hay datos" depende de si hubo algún reporte ese día.
                                            const areaHasData = r.shiftsData.some(sd => sd.list.length > 0);
                                            return (
                                            <tr key={r.area.code}>
                                                <td className="p-1 font-bold text-slate-700 bg-slate-50 sticky left-0 z-10">
                                                    <div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full inline-block" style={{ backgroundColor: r.area.color }}></span>{r.area.code}</div>
                                                </td>
                                                {visibleShifts.map(shDef => {
