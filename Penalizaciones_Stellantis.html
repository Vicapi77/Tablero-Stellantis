                        <label className="text-[11px] text-slate-500 flex items-center gap-1">Mes <input type="month" value={month} onChange={e => e.target.value && setMonth(e.target.value)} className="border rounded px-1.5 py-1 text-xs" /></label>
                        <button onClick={downloadScoreTemplate} className="text-[11px] px-2 py-1 rounded border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center gap-1"><Icons.Download />Plantilla Excel</button>
                        <button onClick={onOpenUpload} className="text-[11px] px-2 py-1 rounded bg-slate-900 text-white flex items-center gap-1">{isAdmin ? <Icons.Upload /> : <Icons.Lock />}Subir Excel del mes</button>
                        {isAdmin && ev && <button onClick={() => onDeleteMonth(month)} className="text-[11px] px-2 py-1 rounded border border-slate-200 text-slate-500 hover:text-red-600 flex items-center gap-1"><Icons.Trash />Eliminar mes</button>}
                        {ev && <span className="text-[11px] text-slate-400 ml-auto">{ev.count} operadores · {ev.fileName || 'Excel'}{ev.uploadedAt ? ` · cargado ${isoToDMY(ev.uploadedAt.slice(0, 10))}` : ''}{!ev.hasPrev ? ' · sin Excel del mes anterior (no se puede evaluar reincidencia)' : ''}</span>}
                    </div>
                    {!ev ? (
                        <p className="text-xs text-slate-400 text-center py-8 border border-dashed border-slate-200 rounded-lg">No hay Excel de score para {monthKeyLabel(month)}. Sube uno con Nombre, Planta y Score para evaluar la regla del 20%.</p>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
                            <div className="lg:col-span-2 space-y-2.5">
                                <p className="text-[11px] text-slate-500">% de operadores bajo 90% por planta · la línea marca el límite de 20%</p>
                                {plantsToShow.map(p => {
                                    const pp = ev.plants[p.plant];
                                    const [st, lbl] = SC_STATUS_MAP[pp.status];
                                    return (
                                        <div key={p.plant}>
                                            <div className="flex items-center justify-between gap-2 text-[11px]">
                                                <span className="font-semibold text-slate-700"><span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{ backgroundColor: p.color }}></span>{p.code} <span className="font-normal text-slate-400">{p.plant}</span></span>
                                                <span className="flex items-center gap-2"><span className="num text-slate-600">{pp.total ? `${pp.below}/${pp.total} · ` : ''}<b className="text-slate-800">{fmtPct(pp.pct)}</b></span><StatusChip small status={st} label={lbl} /></span>
                                            </div>
                                            <div className="relative h-2.5 bg-slate-100 rounded mt-1">
                                                <div className="h-full rounded" style={{ width: `${Math.min(100, (pp.pct || 0) / 50 * 100)}%`, backgroundColor: RULES.score.color }}></div>
                                                <div className="absolute top-[-3px] bottom-[-3px] w-0.5 bg-slate-700" style={{ left: `${TARGETS.safetyOps / 50 * 100}%` }} title="Límite 20%"></div>
                                            </div>
                                            <p className="text-[10px] text-slate-400 mt-0.5">{pp.prevPct !== null ? `Mes anterior: ${fmtPct(pp.prevPct)}${pp.prevExceeds ? ' (pasó del 20%)' : ''}` : 'Sin dato del mes anterior'}{pp.avg !== null ? ` · promedio ${pp.avg.toFixed(1)}%` : ''}</p>
                                        </div>
                                    );
                                })}
                                <p className="text-[10px] text-slate-400 flex justify-between"><span>0%</span><span>escala 0–50%</span><span>50%</span></p>
                            </div>
                            <div className="lg:col-span-3">
                                <p className="text-[11px] text-slate-500 mb-1.5">Operadores con score menor a 90% ({opsBelow.length})</p>
                                <div className="overflow-x-auto max-h-[330px] overflow-y-auto border border-slate-100 rounded-lg">
                                    <table className="tbl w-full text-xs">
                                        <thead className="text-slate-500"><tr>{['Operador', 'Planta', 'Score', 'Ruta', 'Resultado', 'Monto', ''].map((h, i) => <th key={i} className={`p-2 bg-slate-50 ${['Score', 'Monto'].includes(h) ? 'text-right' : 'text-left'}`}>{h}</th>)}</tr></thead>
                                        <tbody>
                                            {opsBelow.map(e => (
                                                <tr key={e.id} className={`border-t border-slate-100 ${e.status === 'descartada' ? 'text-slate-400' : ''}`}>
                                                    <td className="p-2 font-semibold">{e.operator}</td>
                                                    <td className="p-2 whitespace-nowrap">{PLANT_CODE[e.plant]} <span className="text-slate-400">{e.plant}</span></td>
                                                    <td className="p-2 text-right num font-bold">{e.score.toFixed(1)}%</td>
                                                    <td className="p-2 whitespace-nowrap">{e.route || <span className="text-slate-400">—</span>}</td>
                                                    <td className="p-2">{e.pct > 0 ? <StatusChip small status="bad" label="Descuento 10%" /> : e.tier === 'Plan' ? <StatusChip small status="warn" label="Plan de acción" /> : e.tier === 'Desc.' ? <StatusChip small status="na" label="Descartado" /> : e.tier === 'Dup.' ? <span className="text-[10px] text-slate-400">Ruta ya descontada</span> : <span className="text-[10px] text-slate-400">Sin penalización</span>}</td>
                                                    <td className="p-2 text-right num font-bold whitespace-nowrap">{fmtMoney2(e.amount)}{e.pct > 0 && e.costSource === 'defecto' && <span className="block text-[9px] font-normal text-amber-600">costo por defecto</span>}</td>
                                                    <td className="p-2"><button onClick={() => onReview(e)} className="text-slate-400 hover:text-rose-600 flex items-center gap-0.5 text-[11px]"><Icons.Edit />Revisar</button></td>
                                                </tr>
                                            ))}
                                            {opsBelow.length === 0 && <tr><td colSpan="7" className="p-5 text-center text-slate-400">Ningún operador por debajo de 90%.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                    {months.length > 0 && (
                        <div>
                            <p className="text-[11px] text-slate-500 mb-1.5">Historial de meses cargados</p>
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs min-w-[560px]">
                                    <thead className="bg-slate-50 text-slate-500"><tr><th className="p-2 text-left">Mes</th><th className="p-2 text-right">Operadores</th><th className="p-2 text-right">Bajo 90%</th><th className="p-2 text-left">Plantas con plan de acción</th><th className="p-2 text-left">Plantas que penalizan</th><th className="p-2 text-right">Descuento</th></tr></thead>
                                    <tbody>
                                        {months.slice(0, 12).map(mk => {
                                            const e = scoreEval[mk];
                                            const ps = plantsToShow.map(p => ({ ...p, ...e.plants[p.plant] }));
                                            const tot = ps.reduce((s, p) => s + p.total, 0), bel = ps.reduce((s, p) => s + p.below, 0);
                                            const pen = penOf(mk);
                                            return (
                                                <tr key={mk} onClick={() => setMonth(mk)} className={`border-t border-slate-100 cursor-pointer hover:bg-slate-50 ${mk === month ? 'bg-sky-50/60' : ''}`}>
                                                    <td className="p-2 font-semibold text-slate-700 capitalize">{monthKeyLabel(mk)}</td>
                                                    <td className="p-2 text-right num">{tot}</td>
                                                    <td className="p-2 text-right num">{bel} <span className="text-slate-400">({tot ? fmtPct(bel / tot * 100) : '—'})</span></td>
                                                    <td className="p-2">{ps.filter(p => p.status === 'plan').map(p => p.code).join(', ') || <span className="text-slate-400">—</span>}</td>
                                                    <td className="p-2">{ps.filter(p => p.status === 'penaliza').map(p => p.code).join(', ') || <span className="text-slate-400">—</span>}</td>
                                                    <td className="p-2 text-right num font-bold">{fmtU(pen.reduce((s, x) => s + (unit === 'money' ? x.amount : x.pct / 100), 0))}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // =====================================================================================
        //  TABLERO PRINCIPAL
        // =====================================================================================
        const PenaltiesDashboard = () => {
            const [incidents, setIncidents] = useState([]);
            const [dailyMetrics, setDailyMetrics] = useState([]);
            const [routeCosts, setRouteCosts] = useState([]);
            const [configDoc, setConfigDoc] = useState(null);
            const [reviews, setReviews] = useState({});
            const [safetyScores, setSafetyScores] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(false);

            const thisWeek = isoWeekStart(todayISO());
            const [rangeStart, setRangeStart] = useState(thisWeek);
            const [rangeEnd, setRangeEnd] = useState(isoAddDays(thisWeek, 6));
            const [selectedPlant, setSelectedPlant] = useState('Todas');
            const [unit, setUnit] = useState('money');

            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [pwd, setPwd] = useState('');
            const [pwdError, setPwdError] = useState(false);
            const [reviewEv, setReviewEv] = useState(null);
            const [showConfig, setShowConfig] = useState(false);
            const [showRules, setShowRules] = useState(false);
            const [showScore, setShowScore] = useState(true);
            const [showUpload, setShowUpload] = useState(false);
            const [scoreMonthSel, setScoreMonthSel] = useState(null);
            const [notification, setNotification] = useState(null);

            const [evRule, setEvRule] = useState('all');
            const [onlyPenalized, setOnlyPenalized] = useState(true);
            const [onlyReview, setOnlyReview] = useState(false);
            const [search, setSearch] = useState('');
            const [visibleRows, setVisibleRows] = useState(60);
            const [expandedRoute, setExpandedRoute] = useState(null);

            useEffect(() => {
                if (!db) { setIsLoading(false); setLoadError(true); return; }
                const onErr = err => { console.error(err); setLoadError(true); setIsLoading(false); };
                const u1 = db.collection('incidents').onSnapshot(s => { setIncidents(s.docs.map(d => ({ id: d.id, ...d.data() }))); setIsLoading(false); }, onErr);
                const u2 = db.collection('daily_metrics').onSnapshot(s => setDailyMetrics(s.docs.map(d => ({ id: d.id, ...d.data() }))), onErr);
                const u3 = db.collection('route_costs').onSnapshot(s => setRouteCosts(s.docs.map(d => ({ id: d.id, ...d.data() }))), onErr);
                const u4 = db.collection('penalty_config').onSnapshot(s => { const d = s.docs.find(x => x.id === 'main'); setConfigDoc(d ? d.data() : null); }, onErr);
                const u6 = db.collection('safety_scores').onSnapshot(s => setSafetyScores(s.docs.map(d => ({ id: d.id, month: d.id, ...d.data() }))), onErr);
                const u5 = db.collection('penalty_reviews').onSnapshot(s => { const m = {}; s.docs.forEach(d => { const v = d.data(); m[v.eventId || d.id] = { docId: d.id, ...v }; }); setReviews(m); }, onErr);
                return () => { u1(); u2(); u3(); u4(); u5(); u6(); };
            }, []);

            const notify = (type, message) => { setNotification({ type, message }); setTimeout(() => setNotification(null), 2800); };

            const engine = useMemo(() => computeEngine(incidents, reviews, configDoc, routeCosts, safetyScores), [incidents, reviews, configDoc, routeCosts, safetyScores]);
            const metricRecords = useMemo(() => buildMetricRecords(dailyMetrics, incidents), [dailyMetrics, incidents]);

            const plantsToShow = useMemo(() => selectedPlant === 'Todas' ? AREA_ROWS : AREA_ROWS.filter(a => a.plant === selectedPlant), [selectedPlant]);
            const plantSet = useMemo(() => new Set(plantsToShow.map(p => p.plant)), [plantsToShow]);
            const [start, end] = rangeStart <= rangeEnd ? [rangeStart, rangeEnd] : [rangeEnd, rangeStart];
            const weekStarts = useMemo(() => { const out = []; let w = isoWeekStart(start); while (w <= end && out.length < 60) { out.push(w); w = isoAddDays(w, 7); } return out; }, [start, end]);

            const evRange = useMemo(() => engine.events.filter(e => e.iso >= start && e.iso <= end && plantSet.has(e.plant)), [engine, start, end, plantSet]);
            const penalized = useMemo(() => evRange.filter(e => e.pct > 0), [evRange]);
            const val = e => unit === 'money' ? e.amount : e.pct / 100;
            const fmtU = unitFmt(unit);

            // ---- Totales ----
            const totals = useMemo(() => {
                const amount = penalized.reduce((s, e) => s + e.amount, 0);
                const eq = penalized.reduce((s, e) => s + e.pct / 100, 0);
                const routes = new Set(penalized.map(e => e.routeKey || `__${e.id}`));
                const noRoute = penalized.filter(e => !e.routeKey).length;
                const pending = evRange.filter(e => e.needsReview && e.status !== 'descartada').length;
                const defaultCost = penalized.filter(e => e.costSource === 'defecto').length;
                return { amount, eq, routes: routes.size, noRoute, pending, defaultCost, count: penalized.length };
            }, [penalized, evRange]);

            // ---- Indicadores del contrato ----
            // Mes del score: el último mes cuyo cierre cae dentro del periodo (ahí se registra el descuento); si ninguno, el mes del fin del periodo.
            const periodMonth = useMemo(() => {
                let mk = monthKeyOf(start), pick = null, guard = 0;
                while (mk <= monthKeyOf(end) && guard++ < 36) { const me = monthKeyEnd(mk); if (me >= start && me <= end) pick = mk; const [y, m] = mk.split('-').map(Number); mk = m === 12 ? `${y + 1}-01` : `${y}-${pad2(m + 1)}`; }
                return pick || monthKeyOf(end);
            }, [start, end]);
            const scoreEvalMonth = engine.scoreEval[periodMonth] || null;
            const scoreMonth = scoreMonthSel || periodMonth;
            useEffect(() => setScoreMonthSel(null), [end]);
            const indicators = useMemo(() => {
                const recRange = metricRecords.filter(r => r.iso >= start && r.iso <= end && plantSet.has(r.plant));
                const perPlant = plantsToShow.map(p => {
                    const sl = avgOf(recRange.filter(r => r.plant === p.plant), 'serviceLevel');
                    const sc = scoreEvalMonth ? scoreEvalMonth.plants[p.plant] : null;
                    const perc = evRange.filter(e => e.plant === p.plant && e.rule === 'percance' && e.status !== 'descartada');
                    const lateImp = evRange.filter(e => e.plant === p.plant && e.rule === 'llegada' && e.imputable && e.status !== 'descartada').length;
                    const P = weekStarts.length * num(engine.cfg.tripsPerWeek[p.plant]);
                    const n = weekStarts.reduce((s, w) => s + ((engine.weekCalidad[`${p.plant}|${w}`] || {}).n || 0), 0);
                    const cal = P > 0 ? Math.max(0, (P - n) / P * 100) : null;
                    const pen = penalized.filter(e => e.plant === p.plant);
                    return { ...p, sl, sc, percances: perc.length, percCR: perc.filter(e => e.responsibility === 'CR').length, graves: perc.filter(e => e.severity === 'grave').length, lateImp, calidad: cal, calN: n, calP: P,
                        penValue: pen.reduce((s, e) => s + val(e), 0), penCount: pen.length };
                });
                const P = perPlant.reduce((s, p) => s + p.calP, 0), n = perPlant.reduce((s, p) => s + p.calN, 0);
                const perc = evRange.filter(e => e.rule === 'percance' && e.status !== 'descartada');
                const lateAll = evRange.filter(e => e.rule === 'llegada');
                return {
                    sl: avgOf(recRange, 'serviceLevel'), slDays: new Set(recRange.map(r => r.iso)).size,
                    scoreOps: perPlant.reduce((s, p) => s + (p.sc ? p.sc.total : 0), 0), scoreBelow: perPlant.reduce((s, p) => s + (p.sc ? p.sc.below : 0), 0),
                    scorePlan: perPlant.filter(p => p.sc && p.sc.status === 'plan').length, scorePen: perPlant.filter(p => p.sc && p.sc.status === 'penaliza').length,
                    scoreEvaluated: perPlant.filter(p => p.sc && p.sc.status !== 'na').length,
                    percances: perc.length, graves: perc.filter(e => e.severity === 'grave' && e.responsibility === 'CR').length,
                    percCR: perc.filter(e => e.responsibility === 'CR').length, percSR: perc.filter(e => e.responsibility === 'SR').length, percPend: perc.filter(e => !e.responsibility).length,
                    calidad: P > 0 ? Math.max(0, (P - n) / P * 100) : null, calN: n, calP: P,
                    lateImp: lateAll.filter(e => e.imputable && e.status !== 'descartada').length, lateNoImp: lateAll.filter(e => !e.imputable).length,
                    perPlant, monthLabel: monthLabel(end),
                };
            }, [metricRecords, start, end, plantSet, plantsToShow, evRange, penalized, engine, weekStarts, unit, scoreEvalMonth]);

            // ---- Composición por indicador, por planta, por ruta, tendencia ----
            const byRule = RULE_ORDER.map(r => { const l = penalized.filter(e => e.rule === r); return { key: r, label: RULES[r].label, color: RULES[r].color, value: l.reduce((s, e) => s + val(e), 0), count: l.length }; });
            const segsFor = list => RULE_ORDER.map(r => { const l = list.filter(e => e.rule === r); return { key: r, label: RULES[r].short, color: RULES[r].color, value: l.reduce((s, e) => s + val(e), 0), count: l.length }; });
            const plantRows = plantsToShow.map(p => { const l = penalized.filter(e => e.plant === p.plant); const segs = segsFor(l); return { key: p.plant, label: p.plant, sub: p.code, segs, total: segs.reduce((s, x) => s + x.value, 0) }; });

            const routeGroups = useMemo(() => {
                const g = {};
                penalized.forEach(e => {
                    const k = e.routeKey || (e.rule === 'score' ? `__op|${normName(e.operator)}` : '__sin');
                    if (!g[k]) g[k] = { key: k, route: e.routeKey ? e.route : (e.rule === 'score' ? `Op. ${e.operator}` : 'Sin ruta capturada'), noRoute: !e.routeKey, plants: new Set(), events: [], amount: 0, eq: 0, costSource: e.costSource, tripValue: e.tripValue };
                    g[k].plants.add(e.plant); g[k].events.push(e); g[k].amount += e.amount; g[k].eq += e.pct / 100;
                });
                return Object.values(g).map(x => ({ ...x, plants: [...x.plants], segs: segsFor(x.events) }))
                    .sort((a, b) => (unit === 'money' ? b.amount - a.amount : b.eq - a.eq) || b.events.length - a.events.length);
            }, [penalized, unit]);
            const topRouteRows = routeGroups.slice(0, 10).map(g => ({ key: g.key, label: g.route, sub: g.plants.map(p => PLANT_CODE[p] || p).join(' · '), segs: g.segs, total: g.segs.reduce((s, x) => s + x.value, 0) }));

            const trendWeeks = useMemo(() => {
                const last = isoWeekStart(end);
                return Array.from({ length: 8 }, (_, i) => isoAddDays(last, -7 * (7 - i))).map(w => {
                    const l = engine.events.filter(e => e.weekStart === w && e.pct > 0 && plantSet.has(e.plant));
                    const segs = segsFor(l);
                    return { key: w, label: `Sem ${isoWeekNumber(w)}`, sub: isoShort(w), range: `${isoShort(w)} – ${isoShort(isoAddDays(w, 6))}`, segs, total: segs.reduce((s, x) => s + x.value, 0), current: w >= isoWeekStart(start) && w <= last };
                });
            }, [engine, end, start, plantSet, unit]);

            const tramoCounts = useMemo(() => {
                const c = { A: 0, B: 0, C: 0, SM: 0 };
                evRange.filter(e => e.rule === 'llegada' && e.imputable && e.status !== 'descartada').forEach(e => { const k = e.tier === 'S/M' ? 'SM' : e.tier; if (c[k] !== undefined) c[k]++; });
                return c;
            }, [evRange]);

            const missingRoutes = useMemo(() => {
                const m = {};
                engine.events.filter(e => e.pct > 0 && e.routeKey && e.costSource === 'defecto').forEach(e => { if (!m[e.routeKey]) m[e.routeKey] = { routeKey: e.routeKey, route: e.route, plant: e.plant }; });
                return Object.values(m).sort((a, b) => a.route.localeCompare(b.route, 'es', { numeric: true }));
            }, [engine]);

            // ---- Tabla de eventos ----
            const tableEvents = useMemo(() => {
                const q = normRoute(search);
                return evRange.filter(e => (evRule === 'all' || e.rule === evRule)
                        && (!onlyPenalized || e.pct > 0)
                        && (!onlyReview || (e.needsReview && e.status !== 'descartada'))
                        && (!q || normRoute(e.route).includes(q) || normRoute(e.causeLabel).includes(q) || normRoute(e.plant).includes(q) || normName(e.operator).includes(normName(search))))
                    .sort((a, b) => b.iso.localeCompare(a.iso) || a.plant.localeCompare(b.plant) || (a.shift || '').localeCompare(b.shift || ''));
            }, [evRange, evRule, onlyPenalized, onlyReview, search]);
            useEffect(() => setVisibleRows(60), [evRule, onlyPenalized, onlyReview, search, start, end, selectedPlant]);

            const exportCSV = () => {
                const head = ['Fecha', 'Semana', 'Planta', 'Área', 'Turno', 'Ruta', 'Operador', 'Indicador', 'Causa', 'Imputable', 'Minutos', 'Severidad / Responsabilidad', 'Tramo/Regla', '% penalización', 'Valor base (viaje o mensual)', 'Monto penalización', 'Fuente de costo', 'Estado', 'Detalle'];
                const esc = v => { const s = (v === null || v === undefined) ? '' : String(v); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
                const rows = tableEvents.map(e => [isoToDMY(e.iso), isoWeekNumber(e.iso), e.plant, PLANT_CODE[e.plant] || '', SHIFT_LABELS[e.shift] || e.shift, e.route || 'Sin ruta', e.operator || '', RULES[e.rule].label, e.causeLabel, e.imputable ? 'Sí' : 'No',
                    e.minutes ?? '', e.rule === 'percance' ? `${e.severity === 'grave' ? 'Grave' : 'No grave'} · ${e.responsibility === 'CR' ? 'C/R' : e.responsibility === 'SR' ? 'S/R' : 'Por clasificar'}` : '', e.tier, e.pct, e.tripValue.toFixed(2), e.amount.toFixed(2), e.costSource === 'catalogo' ? 'Catálogo' : 'Por defecto',
                    e.status === 'descartada' ? 'Descartada' : (e.review ? 'Revisada' : 'Automática'), e.reason]);
                const csv = '﻿' + [head, ...rows].map(r => r.map(esc).join(',')).join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Penalizaciones_${selectedPlant === 'Todas' ? 'Todas' : selectedPlant}_${start}_a_${end}.csv`;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            };

            // ---- Escrituras (admin) ----
            const requireAdmin = fn => (...args) => { if (!isAdmin) { setShowLogin(true); return; } fn(...args); };
            const saveReview = requireAdmin((ev, data) => {
                const docId = ev.id.replace(/\//g, '_');
                const payload = { eventId: ev.id, incidentId: ev.incidentId, rule: ev.rule, status: data.status, note: data.note, updatedAt: new Date().toISOString() };
                if (data.route && data.route !== ev.originalRoute) payload.route = data.route;
                if (ev.rule === 'llegada' && data.minutes !== null && data.minutes !== undefined && !isNaN(data.minutes)) payload.minutes = data.minutes;
                if (ev.rule === 'percance') { payload.severity = data.severity; if (data.responsibility) payload.responsibility = data.responsibility; }
                db.collection('penalty_reviews').doc(docId).set(payload).then(() => notify('success', 'Revisión guardada')).catch(() => notify('error', 'No se pudo guardar la revisión'));
                setReviewEv(null);
            });
            const clearReview = requireAdmin(ev => {
                const docId = (ev.review && ev.review.docId) || ev.id.replace(/\//g, '_');
                db.collection('penalty_reviews').doc(docId).delete().then(() => notify('success', 'Revisión eliminada'));
                setReviewEv(null);
            });
            const saveConfig = requireAdmin(d => {
                const payload = { tripsPerWeek: Object.fromEntries(AREA_ROWS.map(a => [a.plant, num(d.tripsPerWeek[a.plant])])),
                    defaultFixedMonthly: num(d.defaultFixedMonthly), defaultTripsPerMonth: num(d.defaultTripsPerMonth) || 1, defaultKmPerTrip: num(d.defaultKmPerTrip), defaultCostPerKm: num(d.defaultCostPerKm), updatedAt: new Date().toISOString() };
                db.collection('penalty_config').doc('main').set(payload, { merge: true }).then(() => notify('success', 'Parámetros guardados')).catch(() => notify('error', 'No se pudieron guardar los parámetros'));
            });
            const saveRoute = requireAdmin(r => {
                const route = (r.route || '').trim();
                if (!route) return;
                const dup = routeCosts.find(x => normRoute(x.route) === normRoute(route) && x.id !== r.id);
                if (dup) { notify('error', `La ruta "${route}" ya existe en el catálogo`); return; }
                const payload = { route, plant: r.plant, fixedMonthly: num(r.fixedMonthly), tripsPerMonth: num(r.tripsPerMonth) || 1, kmPerTrip: num(r.kmPerTrip), costPerKm: num(r.costPerKm), updatedAt: new Date().toISOString() };
                const ref = r.id ? db.collection('route_costs').doc(r.id) : db.collection('route_costs').doc();
                ref.set(payload).then(() => notify('success', r.id ? 'Ruta actualizada' : 'Ruta agregada')).catch(() => notify('error', 'No se pudo guardar la ruta'));
            });
            const deleteRoute = requireAdmin(r => {
                if (!window.confirm(`¿Eliminar la ruta "${r.route}" del catálogo?`)) return;
                db.collection('route_costs').doc(r.id).delete().then(() => notify('success', 'Ruta eliminada'));
            });
            const saveScoreMonth = requireAdmin(({ month, operators, fileName }) => {
                db.collection('safety_scores').doc(month).set({ month, operators, fileName, count: operators.length, uploadedAt: new Date().toISOString() })
                    .then(() => notify('success', `Score de ${monthKeyLabel(month)} guardado (${operators.length} operadores)`)).catch(() => notify('error', 'No se pudo guardar el score'));
                setShowUpload(false); setScoreMonthSel(month);
            });
            const deleteScoreMonth = requireAdmin(month => {
                if (!window.confirm(`¿Eliminar el Excel de score de ${monthKeyLabel(month)}?`)) return;
                db.collection('safety_scores').doc(month).delete().then(() => notify('success', 'Mes eliminado'));
            });
            const doLogin = e => {
                e.preventDefault();
                if (pwd === ADMIN_PASSWORD) { setIsAdmin(true); setShowLogin(false); setPwd(''); setPwdError(false); notify('success', 'Sesión de administrador iniciada'); }
                else setPwdError(true);
            };

            const setWeek = offset => { const w = isoAddDays(thisWeek, 7 * offset); setRangeStart(w); setRangeEnd(isoAddDays(w, 6)); };
            const setMonth = offset => { const { y, m } = isoToParts(todayISO()); const first = utcToIso(new Date(Date.UTC(y, m - 1 + offset, 1))); setRangeStart(first); setRangeEnd(monthEnd(first)); };
            const shiftRange = dir => { const days = Math.round((isoToUTC(end) - isoToUTC(start)) / 86400000) + 1; setRangeStart(isoAddDays(start, dir * days)); setRangeEnd(isoAddDays(end, dir * days)); };
            const isWeek = w => start === w && end === isoAddDays(w, 6);
            const rangeTitle = weekStarts.length === 1 && start === weekStarts[0] && end === isoAddDays(start, 6)
                ? `Semana ${isoWeekNumber(start)} · ${isoShort(start)} – ${isoShort(end)} ${isoToParts(end).y}`
                : `${isoShort(start)} ${isoToParts(start).y} – ${isoShort(end)} ${isoToParts(end).y} · ${weekStarts.length} semana(s)`;

            const cfgMissing = AREA_ROWS.every(a => !num(engine.cfg.tripsPerWeek[a.plant]));
            const noCosts = totals.count > 0 && totals.amount === 0;

            const ind = indicators;
            const slStatus = statusFor(ind.sl, TARGETS.serviceLevel);
            const scoreStatus = ind.scoreEvaluated === 0 ? 'na' : ind.scorePen > 0 ? 'bad' : ind.scorePlan > 0 ? 'warn' : 'ok';
            const scoreChip = { ok: undefined, warn: 'Plan de acción', bad: 'Penaliza 10%', na: 'Sin Excel' };
            const SC_STATUS = { ok: ['ok', 'Cumple'], plan: ['warn', 'Plan de acción'], penaliza: ['bad', 'Penaliza 10%'], na: ['na', 'Sin datos'] };
            const percStatus = ind.percances === 0 ? 'ok' : 'bad';
            const calStatus = statusFor(ind.calidad, TARGETS.calidad, true, TARGETS.calidadPenalty);

            const chip = (active) => `px-2 py-1 rounded text-[11px] border ${active ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`;

            return (
                <div className="min-h-screen pb-12">
                    {/* ENCABEZADO (mismo estilo compacto que Matriz / Flota / Plantilla) */}
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row justify-between items-center gap-3">
                            <div className="flex items-center gap-2.5">
                                <div className="p-1.5 bg-rose-600 rounded-lg"><Icons.Truck /></div>
                                <div><h1 className="text-lg font-bold flex items-center gap-2">Penalizaciones {isLoading && <span className="loader"></span>}</h1><p className="text-[11px] text-slate-400">Rutas penalizables e indicadores del contrato — datos en vivo de la Matriz de Cumplimiento</p></div>
                            </div>
                            <div className="flex gap-2 items-center flex-wrap justify-center">
                                <div className="flex items-center bg-slate-800 border border-slate-700 rounded overflow-hidden text-xs">
                                    <a href="index.html" title="Inicio" className="px-2 py-1 text-slate-300 hover:bg-slate-700 border-r border-slate-700 flex items-center"><Icons.Home /></a>
                                    <a href="Matriz_Cumplimiento_Transporte.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Table /><span className="hidden sm:inline">Matriz</span></a>
                                    <a href="Flota_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Truck /><span className="hidden sm:inline">Flota</span></a>
                                    <a href="Plantilla_Stellantis.html" className="px-2 py-1 text-slate-300 hover:bg-slate-700 flex items-center gap-1"><Icons.Users /><span className="hidden sm:inline">Plantilla</span></a>
                                    <span className="px-2 py-1 bg-rose-600 text-white flex items-center gap-1"><Icons.Receipt s={16} /><span className="hidden sm:inline">Penalizaciones</span></span>
                                </div>
                                <select className="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs" value={selectedPlant} onChange={e => setSelectedPlant(e.target.value)}>
                                    {PLANTS.map(p => <option key={p} value={p}>{p === 'Todas' ? 'Todas las áreas' : p}</option>)}
                                </select>
                                {isAdmin
                                    ? <button onClick={() => setIsAdmin(false)} className="bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 px-2 py-1 rounded text-xs flex items-center gap-1" title="Cerrar sesión"><Icons.Unlock />Admin</button>
                                    : <button onClick={() => setShowLogin(true)} className="bg-slate-800 border border-slate-700 hover:bg-slate-700 px-2 py-1 rounded text-xs text-slate-300 flex items-center gap-1"><Icons.Lock />Admin</button>}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-6 space-y-6">
                        {/* PERIODO */}
                        <div className="flex items-center justify-between flex-wrap gap-3">
                            <div>
                                <h2 className="text-lg font-bold text-slate-700">{rangeTitle}</h2>
                                <p className="text-[11px] text-slate-400">{selectedPlant === 'Todas' ? 'Todas las áreas' : `${selectedPlant} (${PLANT_CODE[selectedPlant]})`} · Score de seguridad: {monthKeyLabel(periodMonth)}</p>
                            </div>
                            <div className="flex items-center gap-2 flex-wrap">
                                <div className="flex items-center bg-white border border-slate-200 rounded text-xs">
                                    <button onClick={() => shiftRange(-1)} className="px-1.5 py-1.5 text-slate-500 hover:bg-slate-50" title="Periodo anterior"><Icons.ChevronLeft /></button>
                                    <span className="text-slate-400 pl-1">Del</span>
                                    <input type="date" value={rangeStart} onChange={e => e.target.value && setRangeStart(e.target.value)} className="px-1 py-1.5 text-xs outline-none" />
                                    <span className="text-slate-400">al</span>
                                    <input type="date" value={rangeEnd} onChange={e => e.target.value && setRangeEnd(e.target.value)} className="px-1 py-1.5 text-xs outline-none" />
                                    <button onClick={() => shiftRange(1)} className="px-1.5 py-1.5 text-slate-500 hover:bg-slate-50" title="Periodo siguiente"><Icons.ChevronRight /></button>
                                </div>
                                <button onClick={() => setWeek(0)} className={chip(isWeek(thisWeek))}>Semana actual</button>
                                <button onClick={() => setWeek(-1)} className={chip(isWeek(isoAddDays(thisWeek, -7)))}>Semana anterior</button>
                                <button onClick={() => setMonth(0)} className={chip(start === monthStart(todayISO()) && end === monthEnd(todayISO()))}>Mes actual</button>
                                <div className="flex rounded border border-slate-200 overflow-hidden text-[11px] bg-white" role="group" aria-label="Unidad">
                                    <button onClick={() => setUnit('money')} className={`px-2 py-1 ${unit === 'money' ? 'bg-rose-600 text-white' : 'text-slate-600'}`}>$ Monto</button>
                                    <button onClick={() => setUnit('eq')} className={`px-2 py-1 ${unit === 'eq' ? 'bg-rose-600 text-white' : 'text-slate-600'}`}>Rutas equivalentes</button>
                                </div>
                            </div>
                        </div>

                        {/* AVISOS */}
                        {(loadError || cfgMissing || noCosts || totals.pending > 0) && (
                            <div className="space-y-2">
                                {loadError && <div className="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-3 py-2 rounded-lg flex items-center gap-2"><Icons.AlertTriangle />No fue posible conectar con la base de datos en vivo — verifica tu conexión.</div>}
                                {cfgMissing && <div className="text-xs bg-sky-50 text-sky-800 border border-sky-200 px-3 py-2 rounded-lg flex items-center justify-between gap-2 flex-wrap"><span className="flex items-center gap-2"><Icons.Info />Captura los <b>viajes programados por semana</b> de cada planta para calcular Calidad de ruta y su penalización de 10%.</span><button onClick={() => { setShowConfig(true); setTimeout(() => document.getElementById('config')?.scrollIntoView({ behavior: 'smooth' }), 50); }} className="underline font-semibold">Ir a configuración</button></div>}
                                {noCosts && <div className="text-xs bg-sky-50 text-sky-800 border border-sky-200 px-3 py-2 rounded-lg flex items-center justify-between gap-2 flex-wrap"><span className="flex items-center gap-2"><Icons.Info />Hay {totals.count} penalizaciones pero los costos están en $0. Captura el catálogo de costos por ruta (o el costo por defecto) para ver montos; mientras tanto usa "Rutas equivalentes".</span><button onClick={() => { setShowConfig(true); setTimeout(() => document.getElementById('config')?.scrollIntoView({ behavior: 'smooth' }), 50); }} className="underline font-semibold">Capturar costos</button></div>}
                                {totals.pending > 0 && <div className="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-3 py-2 rounded-lg flex items-center justify-between gap-2 flex-wrap"><span className="flex items-center gap-2"><Icons.AlertTriangle />{totals.pending} evento(s) sin ruta o sin minutos capturados — no se pueden cobrar o asignar hasta revisarlos.</span><button onClick={() => { setOnlyReview(true); setOnlyPenalized(false); setEvRule('all'); setTimeout(() => document.getElementById('eventos')?.scrollIntoView({ behavior: 'smooth' }), 50); }} className="underline font-semibold">Ver pendientes</button></div>}
                            </div>
                        )}

                        {/* RESUMEN DE PENALIZACIONES */}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <SummaryTile label="Monto a penalizar" value={fmtMoney(totals.amount)} sub={totals.defaultCost > 0 ? `${totals.defaultCost} evento(s) con costo por defecto` : 'Según catálogo de costos'} icon={() => <Icons.Receipt s={22} />} tone="rose" />
                            <SummaryTile label="Rutas penalizadas" value={totals.routes} sub={`${totals.count} evento(s) con penalización${totals.noRoute ? ` · ${totals.noRoute} sin ruta` : ''}`} icon={Icons.Route} tone="violet" />
                            <SummaryTile label="Rutas equivalentes" value={fmtEq(totals.eq)} sub="Suma de % penalizados (1 = una ruta sin pago)" icon={Icons.BarChart} tone="amber" />
                            <SummaryTile label="Eventos por revisar" value={totals.pending} sub="Sin ruta o sin minutos capturados" icon={() => <Icons.AlertTriangle s={22} />} tone="sky" />
                        </div>

                        {/* INDICADORES DEL CONTRATO */}
                        <div>
                            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                                <h3 className="text-base font-bold text-slate-700 flex items-center gap-2"><span className="bg-slate-200 p-1 rounded"><Icons.Activity /></span>Indicadores del contrato</h3>
                                <button onClick={() => { setShowRules(true); setTimeout(() => document.getElementById('reglas')?.scrollIntoView({ behavior: 'smooth' }), 50); }} className="text-[11px] text-slate-500 underline flex items-center gap-1"><Icons.Book />Ver reglas de penalización</button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                                <IndicatorCard n={1} title="Nivel de servicio" icon={Icons.Clock} color={RULES.llegada.color} period="Semanal" periodLabel={ind.slDays ? `${ind.slDays} día(s) capturados` : 'promedio del periodo'}
                                    value={fmtPct(ind.sl)} target="98%" status={slStatus}
                                    footer={<span>{ind.lateImp} llegada(s) tarde imputables · {ind.lateNoImp} no imputables (excluidas) · <b className="text-slate-700">{tramoCounts.B + tramoCounts.C} penalizadas</b></span>} />
                                <IndicatorCard n={2} title="Score de seguridad" icon={Icons.Shield} color={RULES.score.color} period="Mensual" periodLabel={`${monthKeyLabel(periodMonth)} · por planta`}
                                    value={ind.scoreOps ? fmtPct(ind.scoreBelow / ind.scoreOps * 100) : '—'} target="≤ 20% bajo 90" status={scoreStatus} statusLabel={scoreChip[scoreStatus]}
                                    footer={ind.scoreOps
                                        ? <span>{ind.scoreBelow} de {ind.scoreOps} operadores bajo 90% · {ind.scorePen} planta(s) penalizan · {ind.scorePlan} con plan de acción</span>
                                        : <span>Sin Excel de score de {monthKeyLabel(periodMonth)}. <button onClick={() => { setShowScore(true); setTimeout(() => document.getElementById('score')?.scrollIntoView({ behavior: 'smooth' }), 50); }} className="underline">Subir Excel</button></span>} />
                                <IndicatorCard n={3} title="Percances" icon={() => <Icons.AlertTriangle s={22} />} color={RULES.percance.color} period="Semanal" periodLabel="en el periodo"
                                    value={ind.percances} target="0" status={percStatus}
                                    footer={<span><b className="text-slate-700">{ind.percCR} C/R</b> (se cobran: {ind.graves} grave(s) 100%, {ind.percCR - ind.graves} no grave(s) 50%) · {ind.percSR} S/R · {ind.percPend ? <b className="text-amber-700">{ind.percPend} por clasificar</b> : '0 por clasificar'}</span>} />
                                <IndicatorCard n={4} title="Calidad de ruta" icon={Icons.Route} color={RULES.calidad.color} period="Semanal" periodLabel={ind.calP ? `${ind.calP - ind.calN} de ${ind.calP} viajes conformes` : 'configura viajes programados'}
                                    value={fmtPct(ind.calidad)} target="95%" status={calStatus} statusLabel={calStatus === 'warn' ? 'Bajo target' : (calStatus === 'bad' ? 'Penaliza 10%' : undefined)}
                                    footer={<span>{ind.calN} incumplimiento(s) imputables · umbral de penalización 85%</span>} />
                            </div>
                        </div>

                        {/* GRÁFICAS */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                            <Card title="Penalización por indicador" icon={Icons.BarChart} subtitle={unit === 'money' ? 'Monto en el periodo' : 'Rutas equivalentes en el periodo'}>
                                <CompositionBar items={byRule} unit={unit} />
                            </Card>
                            <Card title="Penalización por planta" icon={Icons.BarChart} right={<Legend items={RULE_ORDER.map(r => ({ key: r, label: RULES[r].short, color: RULES[r].color }))} />}>
                                <HStackBars rows={plantRows} unit={unit} emptyText="Sin penalizaciones en el periodo." />
                            </Card>
                            <Card title="Llegadas tarde imputables por tramo" icon={Icons.Clock} subtitle="Reglas A / B / C del indicador 1">
                                <TramoBars counts={tramoCounts} />
                            </Card>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            <Card title="Top 10 rutas penalizadas" icon={Icons.Route} right={<Legend items={RULE_ORDER.map(r => ({ key: r, label: RULES[r].short, color: RULES[r].color }))} />} subtitle="Clic en una ruta para ver su detalle">
                                <HStackBars rows={topRouteRows} unit={unit} emptyText="Ninguna ruta penalizada en el periodo."
                                    onRowClick={r => { setExpandedRoute(r.key); setTimeout(() => document.getElementById('rutas')?.scrollIntoView({ behavior: 'smooth' }), 50); }} />
                            </Card>
                            <Card title="Tendencia semanal de penalizaciones" icon={Icons.BarChart} right={<Legend items={RULE_ORDER.map(r => ({ key: r, label: RULES[r].short, color: RULES[r].color }))} />} subtitle="Últimas 8 semanas hasta el fin del periodo">
                                <WeeklyColumns weeks={trendWeeks} unit={unit} />
                            </Card>
                        </div>

                        {/* SEMÁFORO POR PLANTA */}
                        <Card title="Semáforo de indicadores por planta" icon={Icons.Table} subtitle={`Nivel de servicio, percances y calidad: periodo seleccionado · Score de seguridad: ${monthKeyLabel(periodMonth)}`}>
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs min-w-[760px]">
                                    <thead className="text-slate-500 bg-slate-50">
                                        <tr>
                                            <th className="p-2 text-left">Planta</th>
                                            <th className="p-2 text-left">Nivel de servicio <span className="font-normal text-slate-400">(98%)</span></th>
                                            <th className="p-2 text-left">Operadores bajo 90% <span className="font-normal text-slate-400">(≤20%)</span></th>
                                            <th className="p-2 text-left">Percances <span className="font-normal text-slate-400">(0)</span></th>
                                            <th className="p-2 text-left">Calidad de ruta <span className="font-normal text-slate-400">(95% · pen. &lt;85%)</span></th>
                                            <th className="p-2 text-right">Llegadas imp.</th>
                                            <th className="p-2 text-right">Penalización</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {ind.perPlant.map(p => (
                                            <tr key={p.plant} className="border-t border-slate-100">
                                                <td className="p-2 font-semibold text-slate-700"><span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{ backgroundColor: p.color }}></span>{p.code} <span className="font-normal text-slate-400">{p.plant}</span></td>
                                                <td className="p-2"><span className="num font-bold text-slate-700 mr-2 inline-block w-12">{fmtPct(p.sl)}</span><StatusChip small status={statusFor(p.sl, TARGETS.serviceLevel)} /></td>
                                                <td className="p-2"><span className="num font-bold text-slate-700 mr-2 inline-block w-12">{p.sc && p.sc.pct !== null ? fmtPct(p.sc.pct) : '—'}</span><StatusChip small status={SC_STATUS[p.sc ? p.sc.status : 'na'][0]} label={SC_STATUS[p.sc ? p.sc.status : 'na'][1]} /></td>
                                                <td className="p-2"><span className="num font-bold text-slate-700 mr-2 inline-block w-12">{p.percances}{p.percances ? <span className="text-[10px] font-normal text-slate-400"> ({p.percCR} C/R)</span> : ''}</span><StatusChip small status={p.percances === 0 ? 'ok' : 'bad'} /></td>
                                                <td className="p-2"><span className="num font-bold text-slate-700 mr-2 inline-block w-12">{fmtPct(p.calidad)}</span><StatusChip small status={statusFor(p.calidad, TARGETS.calidad, true, TARGETS.calidadPenalty)} label={p.calidad !== null && p.calidad < TARGETS.calidadPenalty ? 'Penaliza 10%' : (p.calidad !== null && p.calidad < TARGETS.calidad ? 'Bajo target' : undefined)} /></td>
                                                <td className="p-2 text-right num text-slate-600">{p.lateImp}</td>
                                                <td className="p-2 text-right num font-bold text-slate-800">{fmtU(p.penValue)}<span className="block text-[10px] font-normal text-slate-400">{p.penCount} evento(s)</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </Card>

                        {/* SCORE DE SEGURIDAD POR OPERADOR */}
                        <div id="score" className="bg-white rounded-xl border border-slate-200 shadow-sm">
                            <button onClick={() => setShowScore(v => !v)} className="w-full flex items-center justify-between px-4 py-3 text-left">
                                <span className="text-sm font-bold text-slate-700 flex items-center gap-2"><span className="text-slate-400"><Icons.Shield /></span>Score de seguridad por operador <span className="text-[11px] font-normal text-slate-400">({monthKeyLabel(scoreMonth)} · regla del 20% por planta)</span></span>
                                <span className={`text-slate-400 transition-transform ${showScore ? '' : '-rotate-90'}`}><Icons.ChevronDown /></span>
                            </button>
                            {showScore && <div className="px-4 pb-4 border-t border-slate-100 pt-4">
                                <ScoreSection isAdmin={isAdmin} scoreEval={engine.scoreEval} month={scoreMonth} setMonth={setScoreMonthSel} plantsToShow={plantsToShow} events={engine.events} unit={unit}
                                    onOpenUpload={() => isAdmin ? setShowUpload(true) : setShowLogin(true)} onDeleteMonth={deleteScoreMonth} onReview={e => isAdmin ? setReviewEv(e) : setShowLogin(true)} />
                            </div>}
                        </div>

                        {/* RUTAS PENALIZADAS */}
                        <div id="rutas">
                            <Card title={`Rutas que entran en penalización (${routeGroups.length})`} icon={Icons.Route} subtitle="Agrupadas por ruta · clic para ver cada evento"
                                right={<Legend items={RULE_ORDER.map(r => ({ key: r, label: RULES[r].short, color: RULES[r].color }))} />}>
                                <div className="overflow-x-auto max-h-[520px] overflow-y-auto border border-slate-100 rounded-lg">
                                    <table className="tbl w-full text-xs min-w-[760px]">
                                        <thead className="text-slate-500">
                                            <tr>
                                                <th className="p-2 text-left bg-slate-50">Ruta</th>
                                                <th className="p-2 text-left bg-slate-50">Planta</th>
                                                <th className="p-2 text-center bg-slate-50">Eventos</th>
                                                <th className="p-2 text-left bg-slate-50">Desglose</th>
                                                <th className="p-2 text-right bg-slate-50">Rutas equiv.</th>
                                                <th className="p-2 text-right bg-slate-50">Valor base</th>
                                                <th className="p-2 text-right bg-slate-50">Monto</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {routeGroups.map(g => (
                                                <React.Fragment key={g.key}>
                                                    <tr className={`border-t border-slate-100 cursor-pointer hover:bg-slate-50 ${expandedRoute === g.key ? 'bg-slate-50' : ''}`} onClick={() => setExpandedRoute(expandedRoute === g.key ? null : g.key)}>
                                                        <td className="p-2 font-semibold text-slate-700"><span className={`inline-block transition-transform mr-1 text-slate-400 ${expandedRoute === g.key ? '' : '-rotate-90'}`}><Icons.ChevronDown /></span>{g.key === '__sin' ? <span className="text-amber-700">Sin ruta capturada</span> : g.route}{g.noRoute && g.key !== '__sin' && <span className="block text-[9px] font-normal text-slate-400 ml-5">sin ruta en el Excel de score</span>}</td>
                                                        <td className="p-2 text-slate-600">{g.plants.map(p => `${PLANT_CODE[p] || ''} ${p}`).join(', ')}</td>
                                                        <td className="p-2 text-center num">{g.events.length}</td>
                                                        <td className="p-2"><div className="flex flex-wrap gap-1">{g.segs.filter(s => s.count > 0).map(s => <span key={s.key} className="inline-flex items-center gap-1 text-[10px] border border-slate-200 rounded px-1.5 py-0.5 text-slate-600"><span className="w-2 h-2 rounded-sm" style={{ backgroundColor: s.color }}></span>{s.label} ×{s.count}</span>)}</div></td>
                                                        <td className="p-2 text-right num font-semibold">{fmtEq(g.eq)}</td>
                                                        <td className="p-2 text-right num text-slate-500">{g.key === '__sin' ? '—' : fmtMoney2(g.tripValue)}{g.key !== '__sin' && g.events[0].valueBasis === 'mensual' && <span className="block text-[9px] text-slate-400">valor mensual</span>}{g.key !== '__sin' && g.costSource === 'defecto' && <span className="block text-[9px] text-amber-600">costo por defecto</span>}</td>
                                                        <td className="p-2 text-right num font-bold text-slate-800">{fmtMoney2(g.amount)}</td>
                                                    </tr>
                                                    {expandedRoute === g.key && (
                                                        <tr className="bg-slate-50/60"><td colSpan="7" className="px-4 pb-3 pt-1">
                                                            <table className="w-full text-[11px]">
                                                                <tbody>
                                                                    {g.events.sort((a, b) => a.iso.localeCompare(b.iso)).map(e => (
                                                                        <tr key={e.id} className="border-t border-slate-200/60">
                                                                            <td className="py-1 pr-2 whitespace-nowrap">{e.rule === 'score' ? `Cierre ${monthKeyLabel(e.month)}` : isoToDMY(e.iso)}</td>
                                                                            <td className="py-1 pr-2 whitespace-nowrap">{e.rule === 'score' ? e.operator : (SHIFT_LABELS[e.shift] || e.shift)}</td>
                                                                            <td className="py-1 pr-2 whitespace-nowrap"><span className="inline-block w-2 h-2 rounded-sm mr-1" style={{ backgroundColor: RULES[e.rule].color }}></span>{RULES[e.rule].short}</td>
                                                                            <td className="py-1 pr-2">{e.causeLabel}{e.minutes !== null && e.minutes !== undefined && e.rule === 'llegada' ? ` · ${e.minutes} min` : ''}{e.rule === 'percance' ? ` · ${e.severity === 'grave' ? 'grave' : 'no grave'} · ${e.responsibility === 'CR' ? 'C/R' : e.responsibility === 'SR' ? 'S/R' : 'por clasificar'}` : ''}</td>
                                                                            <td className="py-1 pr-2 text-slate-500">{e.reason}</td>
                                                                            <td className="py-1 text-right num font-semibold whitespace-nowrap">{e.pct}% · {fmtMoney2(e.amount)}</td>
                                                                        </tr>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </td></tr>
                                                    )}
                                                </React.Fragment>
                                            ))}
                                            {routeGroups.length === 0 && <tr><td colSpan="7" className="p-6 text-center text-slate-400">Ninguna ruta entra en penalización en el periodo seleccionado.</td></tr>}
                                        </tbody>
                                        {routeGroups.length > 0 && (
                                            <tfoot><tr className="border-t-2 border-slate-200 font-bold text-slate-800 bg-white">
                                                <td className="p-2" colSpan="2">Total</td><td className="p-2 text-center num">{totals.count}</td><td></td>
                                                <td className="p-2 text-right num">{fmtEq(totals.eq)}</td><td></td><td className="p-2 text-right num">{fmtMoney2(totals.amount)}</td>
                                            </tr></tfoot>
                                        )}
                                    </table>
                                </div>
                            </Card>
                        </div>

                        {/* DETALLE DE EVENTOS */}
                        <div id="eventos">
                            <Card title="Detalle de eventos evaluados" icon={Icons.Table} subtitle={`${tableEvents.length} evento(s) con los filtros actuales`}
                                right={<button onClick={exportCSV} className="text-[11px] px-2 py-1 rounded border border-slate-200 text-slate-600 hover:bg-slate-50 flex items-center gap-1"><Icons.Download />Exportar CSV</button>}>
                                <div className="flex items-center gap-2 flex-wrap mb-3">
                                    <div className="flex rounded border border-slate-200 overflow-hidden text-[11px]">
                                        {[['all', 'Todos'], ...RULE_ORDER.map(r => [r, RULES[r].short])].map(([k, l]) => <button key={k} onClick={() => setEvRule(k)} className={`px-2 py-1 ${evRule === k ? 'bg-slate-900 text-white' : 'bg-white text-slate-600'}`}>{l}</button>)}
                                    </div>
                                    <label className="flex items-center gap-1 text-[11px] text-slate-600"><input type="checkbox" checked={onlyPenalized} onChange={e => setOnlyPenalized(e.target.checked)} />Sólo con penalización</label>
                                    <label className="flex items-center gap-1 text-[11px] text-slate-600"><input type="checkbox" checked={onlyReview} onChange={e => setOnlyReview(e.target.checked)} />Sólo por revisar</label>
                                    <div className="flex items-center gap-1 border rounded px-2 py-1 bg-white ml-auto"><span className="text-slate-400"><Icons.Search /></span><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar ruta, causa o planta" className="text-xs outline-none w-48" /></div>
                                </div>
                                <div className="overflow-x-auto max-h-[560px] overflow-y-auto border border-slate-100 rounded-lg">
                                    <table className="tbl w-full text-xs min-w-[980px]">
                                        <thead className="text-slate-500">
                                            <tr>
                                                {['Fecha', 'Planta', 'Turno', 'Ruta', 'Indicador', 'Causa / detalle', 'Regla aplicada', '%', 'Monto', 'Estado', ''].map((h, i) => <th key={i} className={`p-2 bg-slate-50 ${['%', 'Monto'].includes(h) ? 'text-right' : 'text-left'}`}>{h}</th>)}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {tableEvents.slice(0, visibleRows).map(e => (
                                                <tr key={e.id} className={`border-t border-slate-100 ${e.status === 'descartada' ? 'text-slate-400' : ''}`}>
                                                    <td className="p-2 whitespace-nowrap num">{isoToDMY(e.iso)}{e.rule === 'score' && <span className="block text-[9px] text-slate-400">cierre de mes</span>}</td>
                                                    <td className="p-2 whitespace-nowrap">{PLANT_CODE[e.plant] || ''} <span className="text-slate-400">{e.plant}</span></td>
                                                    <td className="p-2 whitespace-nowrap">{e.rule === 'score' ? <span className="text-slate-400">Mensual</span> : (SHIFT_LABELS[e.shift] || e.shift)}</td>
                                                    <td className="p-2 whitespace-nowrap font-semibold">{e.route ? e.route : <span className={`${e.rule === 'score' ? 'text-slate-400' : 'text-amber-700'} font-normal`}>Sin ruta</span>}{e.review && e.review.route && <span className="block text-[9px] text-slate-400 font-normal">corregida</span>}</td>
                                                    <td className="p-2 whitespace-nowrap"><span className="inline-block w-2 h-2 rounded-sm mr-1" style={{ backgroundColor: RULES[e.rule].color }}></span>{RULES[e.rule].short}</td>
                                                    <td className="p-2">{e.causeLabel}{e.rule === 'llegada' && !e.imputable ? ' (no imp.)' : ''}{e.rule === 'llegada' && e.imputable ? (e.minutes !== null && !isNaN(e.minutes) ? ` · ${e.minutes} min` : <span className="text-amber-700"> · sin minutos</span>) : ''}{e.rule === 'percance' ? ` · ${e.severity === 'grave' ? 'grave' : 'no grave'} · ` : ''}{e.rule === 'percance' ? (e.responsibility === 'CR' ? <b>C/R</b> : e.responsibility === 'SR' ? 'S/R' : <span className="text-amber-700">por clasificar</span>) : ''}{e.rule === 'score' ? <span className="block text-[10px] text-slate-500">{e.operator}</span> : null}{e.unitId ? ` · U-${e.unitId}` : ''}{e.description ? <span className="block text-[10px] text-slate-400">{e.description}</span> : null}</td>
                                                    <td className="p-2 text-slate-500 min-w-[200px]">{e.reason}</td>
                                                    <td className="p-2 text-right num font-bold">{e.pct}%</td>
                                                    <td className="p-2 text-right num font-bold text-slate-800 whitespace-nowrap">{fmtMoney2(e.amount)}{e.pct > 0 && e.costSource === 'defecto' && <span className="block text-[9px] font-normal text-amber-600">costo por defecto</span>}</td>
                                                    <td className="p-2 whitespace-nowrap">{e.status === 'descartada' ? <StatusChip small status="na" label="Descartada" /> : e.review ? <StatusChip small status="ok" label="Revisada" /> : e.needsReview ? <StatusChip small status="warn" label="Por revisar" /> : <span className="text-[10px] text-slate-400">Automática</span>}</td>
                                                    <td className="p-2"><button onClick={() => isAdmin ? setReviewEv(e) : setShowLogin(true)} className="text-slate-400 hover:text-rose-600 flex items-center gap-0.5 text-[11px]" title={isAdmin ? 'Revisar / corregir' : 'Inicia sesión como admin para revisar'}><Icons.Edit />Revisar</button></td>
                                                </tr>
                                            ))}
                                            {tableEvents.length === 0 && <tr><td colSpan="11" className="p-6 text-center text-slate-400">Sin eventos con los filtros actuales.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                                {tableEvents.length > visibleRows && <div className="text-center mt-2"><button onClick={() => setVisibleRows(v => v + 100)} className="text-[11px] text-slate-600 underline">Mostrar más ({tableEvents.length - visibleRows} restantes)</button></div>}
                            </Card>
                        </div>

                        {/* CONFIGURACIÓN */}
                        <div id="config" className="bg-white rounded-xl border border-slate-200 shadow-sm">
                            <button onClick={() => setShowConfig(v => !v)} className="w-full flex items-center justify-between px-4 py-3 text-left">
                                <span className="text-sm font-bold text-slate-700 flex items-center gap-2"><span className="text-slate-400"><Icons.Settings /></span>Costos por ruta y parámetros de cálculo <span className="text-[11px] font-normal text-slate-400">({routeCosts.length} rutas en catálogo{missingRoutes.length ? ` · ${missingRoutes.length} sin costo` : ''})</span></span>
                                <span className={`text-slate-400 transition-transform ${showConfig ? '' : '-rotate-90'}`}><Icons.ChevronDown /></span>
                            </button>
                            {showConfig && <div className="px-4 pb-4 border-t border-slate-100 pt-4"><ConfigPanel isAdmin={isAdmin} cfg={engine.cfg} routeCosts={routeCosts} missingRoutes={missingRoutes} onSaveConfig={saveConfig} onSaveRoute={saveRoute} onDeleteRoute={deleteRoute} onLogin={() => setShowLogin(true)} /></div>}
                        </div>

                        {/* REGLAS */}
                        <div id="reglas" className="bg-white rounded-xl border border-slate-200 shadow-sm">
                            <button onClick={() => setShowRules(v => !v)} className="w-full flex items-center justify-between px-4 py-3 text-left">
                                <span className="text-sm font-bold text-slate-700 flex items-center gap-2"><span className="text-slate-400"><Icons.Book /></span>Reglas de penalización del contrato</span>
                                <span className={`text-slate-400 transition-transform ${showRules ? '' : '-rotate-90'}`}><Icons.ChevronDown /></span>
                            </button>
                            {showRules && <div className="px-4 pb-4 border-t border-slate-100 pt-4"><RulesPanel /></div>}
                        </div>
                    </main>

                    {/* LOGIN */}
                    {showLogin && (
                        <Modal title="Acceso de administrador" onClose={() => { setShowLogin(false); setPwdError(false); }}>
                            <form onSubmit={doLogin} className="space-y-3">
                                <p className="text-xs text-slate-500">Necesario para revisar eventos y editar costos. Es la misma contraseña del Dashboard de Transporte.</p>
                                <input type="password" autoFocus value={pwd} onChange={e => { setPwd(e.target.value); setPwdError(false); }} className={`w-full border rounded px-3 py-2 text-sm ${pwdError ? 'border-red-400' : ''}`} placeholder="Contraseña" />
                                {pwdError && <p className="text-xs text-red-600">Contraseña incorrecta.</p>}
                                <button type="submit" className="w-full bg-slate-900 text-white rounded py-2 text-sm font-semibold">Ingresar</button>
                            </form>
                        </Modal>
                    )}
                    {showUpload && <ScoreUploadModal defaultMonth={scoreMonth} existingMonths={Object.keys(engine.scoreEval)} onClose={() => setShowUpload(false)} onSave={saveScoreMonth} />}
                    {reviewEv && <ReviewModal ev={reviewEv} onClose={() => setReviewEv(null)} onSave={d => saveReview(reviewEv, d)} onClear={() => clearReview(reviewEv)} />}
                    {notification && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-lg shadow-lg text-sm text-white fade-in ${notification.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>{notification.message}</div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<PenaltiesDashboard />);
    </script>
</body>
</html>
