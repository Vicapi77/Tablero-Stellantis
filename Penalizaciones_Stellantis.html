            AlertTriangle: ({ s = 15 }) => <svg {...svgProps(s)}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,

            FileSheet: () => <svg {...svgProps(20)}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M10 9H8"/></svg>,
            Edit: () => <svg {...svgProps(14)}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
        };

        // --- FIREBASE (misma base de datos que la Matriz de Cumplimiento y el Dashboard de Transporte) ---
        const firebaseConfig = {
            apiKey: "AIzaSyB5OvYG9qGFrwQGCIIk2ps6R7tBDrhHqrY",
            authDomain: "kpis-stellantis.firebaseapp.com",
            projectId: "kpis-stellantis",
            storageBucket: "kpis-stellantis.firebasestorage.app",
            messagingSenderId: "618714680596",
            appId: "1:618714680596:web:8b7d14cb1dd4e6a9dd0601",
            measurementId: "G-WDXSRLJ6VB"
        };

        let db;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (error) { console.error("Error Firebase:", error); }

        const ADMIN_PASSWORD = 'LIPU77'; // misma contraseña de administrador que el Dashboard de Transporte

        // --- CATÁLOGOS (mismos que la Matriz) ---
        const AREA_ROWS = [
            { code: 'SNEP', plant: 'Norte', color: '#0ea5e9' },
            { code: 'SVAP', plant: 'Van', color: '#8b5cf6' },
            { code: 'LD', plant: 'Extensión', color: '#14b8a6' },
            { code: 'HD', plant: 'Camiones', color: '#f43f5e' },
            { code: 'SSEP', plant: 'Sur', color: '#f59e0b' },
        ];
        const PLANTS = ['Todas', 'Camiones', 'Extensión', 'Van', 'Norte', 'Sur'];
        const PLANT_CODE = Object.fromEntries(AREA_ROWS.map(a => [a.plant, a.code]));
        const SHIFT_LABELS = { T1: '1er turno', MM: 'Mixto Mañana', T2: '2do turno', MT: 'Mixto Tarde', T3: '3er turno' };

        const IMP_CAUSES = [
            ['causeImpSleep', 'Op. Dormido'], ['causeImpAccident', 'Siniestro'], ['causeImpRoute', 'Desvío Ruta'], ['causeImpMech', 'Falla Mec.'],
            ['causeImpSupervisor', 'Supervisor'], ['causeImpAttitude', 'Actitud de Op'], ['causeImpDriving', 'Mal Manejo'], ['causeImpFlatTire', 'Ponchadura'],
            ['causeImpAlcohol', 'Alcoholemia'], ['causeImpDiesel', 'Diesel'], ['causeImpOpTheme', 'Tema de Op.']
        ];
        const NOIMP_CAUSES = [
            ['causeNoImpTraffic', 'Tráfico'], ['causeNoImpClosed', 'Calle Cerrada'], ['causeNoImpWeather', 'Clima'], ['causeNoImpOther', 'Otros'],
            ['causeNoImpCrashNoResp', 'Percance S/R'], ['causeNoImpTrain', 'Tren'], ['causeNoImpVandalism', 'Vandalismo'], ['causeNoImpOvercapacity', 'Sobreaforo'],
            ['causeNoImpPublicEvent', 'Evento Público'], ['causeNoImpProtest', 'Manifestación'], ['causeNoImpPublicWork', 'Obra Pública'], ['causeNoImpThirdPartyCrash', 'Acc. Terceros']
        ];
        // Causas imputables que además cuentan como incumplimiento de "Calidad de ruta" (Excel, indicador 4):
        // cambio de ruta sin motivo, falla mecánica por falta de mantenimiento, no respetar límites de velocidad.
        const CALIDAD_CAUSES = [
            ['causeImpRoute', 'Desvío / cambio de ruta'],
            ['causeImpDriving', 'Mal manejo / velocidad'],
            ['causeImpMech', 'Falla mecánica (llegada tarde)'],
        ];

        // Colores por indicador penalizable (paleta categórica validada: lightness, CVD y contraste OK).
        const RULES = {
            llegada: { key: 'llegada', label: 'Nivel de servicio', short: 'Llegadas tarde', color: '#e11d48' },
            score: { key: 'score', label: 'Score de seguridad', short: 'Score seguridad', color: '#0284c7' },
            percance: { key: 'percance', label: 'Percances', short: 'Percances', color: '#d97706' },
            calidad: { key: 'calidad', label: 'Calidad de ruta', short: 'Calidad de ruta', color: '#7c3aed' },
        };
        const RULE_ORDER = ['llegada', 'score', 'percance', 'calidad'];
        // Rampa secuencial (un solo tono, claro -> oscuro) para los tramos de minutos de retraso.
        const TRAMO_COLORS = { A: '#fda4af', B: '#e11d48', C: '#881337', SM: '#94a3b8' };

        const TARGETS = { serviceLevel: 98, safety: 90, safetyOps: 20, percances: 0, calidad: 95, calidadPenalty: 85 };

        // --- REGLAS DEL CONTRATO (resumen del Excel "penalizaciones stellantis") ---
        const CONTRACT_RULES = [
            { n: 1, name: 'Nivel de servicio', color: RULES.llegada.color, desc: 'Puntualidad de llegada al destino', calc: '(Viajes a tiempo ÷ Total viajes ejecutados) × 100', target: '98%', period: 'Semanal', evidence: '—',
              consequences: ['A) Llegada tarde de 1 a 5 min: sin penalización.', 'B) Llegada tarde de 6 a 15 min: 50% de la ruta (sólo si es imputable al proveedor).', 'C) Llegada tarde de más de 15 min: NO se paga la ruta (100%).', 'Se descartan retrasos por bloqueos sociales, inundaciones, accidentes viales (ajenos a la operación).'] },
            { n: 2, name: 'Score de seguridad', color: RULES.score.color, desc: 'Comportamiento de manejo basado en telemetría', calc: 'Promedio ponderado de eventos de telemetría por operador', target: '90%', period: 'Mensual', evidence: 'Sensores y score de conductores',
              consequences: ['Si más del 20% de los operadores está por debajo de 90%: plan de acción en máximo 3 días.', 'Reincidencia: 10% de descuento sobre las rutas con score inferior a 90%.'] },
            { n: 3, name: 'Percances', color: RULES.percance.color, desc: 'Accidentes, colisiones y siniestros viales', calc: 'Conteo total de siniestros viales reportados', target: '0 percances', period: 'Semanal', evidence: 'Sensores, cámara en cabina, coordinadores',
              consequences: ['Percance grave (con lesiones) imputable al operador: sin pago de la ruta (100%).', 'Percance no grave (sin lesiones) imputable al operador: 50% de la ruta.', 'Imputable = percance registrado como C/R (con responsabilidad). Los S/R no se cobran.'] },
            { n: 4, name: 'Calidad de ruta', color: RULES.calidad.color, desc: 'Apego al croquis autorizado y parámetros operativos', calc: '(Rutas conformes ÷ Total rutas programadas) × 100', target: '95%', period: 'Semanal', evidence: 'Sensores y GPS',
              consequences: ['Si el resultado es inferior a 85% por temas imputables (cambio de ruta, falla mecánica por mantenimiento, velocidad, omisión de paradas): 10% del valor de cada ruta con incumplimiento.', 'No acumulable con otras penalizaciones.'] },
        ];

        const DEFAULT_CONFIG = {
            tripsPerWeek: { Camiones: 0, 'Extensión': 0, Van: 0, Norte: 0, Sur: 0 },
            defaultFixedMonthly: 0, defaultTripsPerMonth: 26, defaultKmPerTrip: 0, defaultCostPerKm: 0,
        };

        // --- HELPERS DE FECHA (UTC para evitar corrimientos por zona horaria) ---
        const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const MESES_LARGO = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const pad2 = n => n.toString().padStart(2, '0');
        const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
        const isoToParts = iso => { const [y, m, d] = iso.split('-').map(Number); return { y, m, d }; };
        const isoToUTC = iso => { const { y, m, d } = isoToParts(iso); return new Date(Date.UTC(y, m - 1, d)); };
        const utcToIso = dt => `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
        const isoAddDays = (iso, delta) => { const dt = isoToUTC(iso); dt.setUTCDate(dt.getUTCDate() + delta); return utcToIso(dt); };
        const isoWeekday = iso => { const w = isoToUTC(iso).getUTCDay(); return w === 0 ? 7 : w; }; // 1 = lunes
        const isoWeekStart = iso => isoAddDays(iso, 1 - isoWeekday(iso));
        const isoWeekNumber = iso => {
            const dt = isoToUTC(iso); dt.setUTCDate(dt.getUTCDate() + 4 - (dt.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
            return Math.ceil(((dt - yearStart) / 86400000 + 1) / 7);
        };
        const isoShort = iso => { const { m, d } = isoToParts(iso); return `${d} ${MESES[m - 1]}`; };
        const isoToDMY = iso => { const { y, m, d } = isoToParts(iso); return `${pad2(d)}/${pad2(m)}/${y.toString().slice(-2)}`; };
        const dmyToIso = dmy => {
            if (!dmy || typeof dmy !== 'string') return null;
            const p = dmy.split('/'); if (p.length !== 3) return null;
            const [d, m, y] = p; if (!d || !m || !y) return null;
            return `${y.length === 4 ? y : '20' + y}-${pad2(parseInt(m))}-${pad2(parseInt(d))}`;
        };
        const monthStart = iso => { const { y, m } = isoToParts(iso); return `${y}-${pad2(m)}-01`; };
        const monthEnd = iso => { const { y, m } = isoToParts(iso); return utcToIso(new Date(Date.UTC(y, m, 0))); };
        const monthLabel = iso => { const { y, m } = isoToParts(iso); return `${MESES_LARGO[m - 1]} ${y}`; };

        // --- FORMATOS ---
        const fmtMoney = n => (n || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
        const fmtMoney2 = n => (n || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fmtEq = n => (n || 0).toLocaleString('es-MX', { maximumFractionDigits: 2 });
        const fmtPct = (n, dec = 1) => n === null || n === undefined || isNaN(n) ? '—' : `${n.toFixed(dec)}%`;
        const normRoute = s => (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');
        const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

        // Valor de un viaje = parte proporcional del costo fijo mensual + km del viaje × costo por km.
        const tripValue = c => (num(c.fixedMonthly) / Math.max(1, num(c.tripsPerMonth) || 1)) + num(c.kmPerTrip) * num(c.costPerKm);

        // Valor mensual de una ruta (base del 10% del Score de seguridad, indicador mensual)
        const monthlyRouteValue = c => num(c.fixedMonthly) + num(c.kmPerTrip) * num(c.costPerKm) * Math.max(1, num(c.tripsPerMonth) || 1);

        // --- MESES (clave "YYYY-MM") ---
        const monthKeyOf = iso => iso.slice(0, 7);
        const prevMonthKey = mk => { const [y, m] = mk.split('-').map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${pad2(m - 1)}`; };
        const monthKeyLabel = mk => { const [y, m] = mk.split('-').map(Number); return `${MESES_LARGO[m - 1]} ${y}`; };
        const monthKeyEnd = mk => monthEnd(`${mk}-01`);

        // =====================================================================================
        //  SCORE DE SEGURIDAD POR OPERADOR (Excel mensual: nombre, planta, score, ruta opcional)
        //  Regla (por planta): si más del 20% de los operadores de la planta está por debajo de 90%
        //  -> plan de acción (3 días). Si el mes inmediato anterior también pasó del 20% (reincidencia)
        //  -> 10% de descuento sobre el valor mensual de cada ruta con score < 90%.
        //  El descuento se registra al cierre del mes.
        // =====================================================================================
        const stripAccents = v => (v === null || v === undefined ? '' : v.toString()).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
        const PLANT_ALIASES = [['camiones', 'Camiones'], ['hd', 'Camiones'], ['extension', 'Extensión'], ['ld', 'Extensión'], ['van', 'Van'], ['svap', 'Van'], ['norte', 'Norte'], ['snep', 'Norte'], ['sur', 'Sur'], ['ssep', 'Sur']];
        const normPlant = v => {
            const k = stripAccents(v);
            if (!k) return null;
            const exact = PLANT_ALIASES.find(([a]) => a === k);
            if (exact) return exact[1];
            const words = k.split(/[^a-z0-9]+/);
            const hit = PLANT_ALIASES.find(([a]) => words.includes(a));
            return hit ? hit[1] : null;
        };
        const normName = v => stripAccents(v).replace(/\s+/g, ' ');

        const evaluateScoreMonth = (doc, prevDoc) => {
            const plants = {};
            AREA_ROWS.forEach(a => { plants[a.plant] = { plant: a.plant, total: 0, below: 0, pct: null, exceeds: false, prevPct: null, prevExceeds: false, status: 'na', avg: null }; });
            const summarize = (d, key) => {
                const out = {};
                AREA_ROWS.forEach(a => {
                    const ops = ((d && d.operators) || []).filter(o => o.plant === a.plant);
                    const below = ops.filter(o => num(o.score) < TARGETS.safety).length;
                    out[a.plant] = { total: ops.length, below, pct: ops.length ? below / ops.length * 100 : null,
                        avg: ops.length ? ops.reduce((s, o) => s + num(o.score), 0) / ops.length : null };
                });
                return out;
            };
            const cur = summarize(doc), prev = prevDoc ? summarize(prevDoc) : null;
            AREA_ROWS.forEach(a => {
                const p = plants[a.plant], c = cur[a.plant];
                Object.assign(p, { total: c.total, below: c.below, pct: c.pct, avg: c.avg });
                p.exceeds = c.pct !== null && c.pct > TARGETS.safetyOps;
                if (prev && prev[a.plant].pct !== null) { p.prevPct = prev[a.plant].pct; p.prevExceeds = prev[a.plant].pct > TARGETS.safetyOps; }
                p.status = c.pct === null ? 'na' : !p.exceeds ? 'ok' : p.prevExceeds ? 'penaliza' : 'plan';
            });
            return plants;
        };

        const buildScoreEvents = (safetyScores) => {
            const byMonth = {};
            (safetyScores || []).forEach(d => { if (d && d.month) byMonth[d.month] = d; });
            const evaluation = {};
            const events = [];
            Object.keys(byMonth).sort().forEach(mk => {
                const doc = byMonth[mk];
                const plants = evaluateScoreMonth(doc, byMonth[prevMonthKey(mk)]);
                evaluation[mk] = { month: mk, plants, count: (doc.operators || []).length, fileName: doc.fileName || '', uploadedAt: doc.uploadedAt || '', hasPrev: !!byMonth[prevMonthKey(mk)] };
                const iso = monthKeyEnd(mk);
                const seen = {};
                (doc.operators || []).forEach(o => {
                    if (num(o.score) >= TARGETS.safety || !plants[o.plant]) return;
                    const base = `score|${mk}|${o.plant}|${normName(o.nombre)}`;
                    seen[base] = (seen[base] || 0) + 1;
                    events.push({ id: seen[base] > 1 ? `${base}|${seen[base]}` : base, rule: 'score', imputable: true, iso, plant: o.plant, shift: '—', month: mk,
                        operator: o.nombre, score: num(o.score), route: (o.route || '').toString().trim(), causeKey: 'score', causeLabel: `Score ${num(o.score).toFixed(1)}%`,
                        plantEval: plants[o.plant] });
                });
            });
            return { events, evaluation };
        };

        const classifyScoreEvent = (ev, discarded) => {
            const pe = ev.plantEval;
            if (discarded) { ev.tier = 'Desc.'; ev.reason = 'Descartado en revisión'; return; }
            const pctTxt = `${pe.below} de ${pe.total} operadores (${pe.pct.toFixed(1)}%) bajo 90% en ${ev.plant}`;
            if (pe.status === 'ok') { ev.tier = 'OK'; ev.reason = `${pctTxt} — no pasa del 20%, sin penalización`; return; }
            if (pe.status === 'plan') { ev.tier = 'Plan'; ev.reason = `${pctTxt} — primera vez: plan de acción en ≤ 3 días, sin descuento`; return; }
            ev.tier = '10%'; ev.pct = 10;
            ev.reason = `Reincidencia: ${pctTxt} y el mes anterior ${pe.prevPct.toFixed(1)}% → 10% del valor mensual de la ruta`;
        };

        // =====================================================================================
        //  MOTOR DE PENALIZACIONES
        //  1) Convierte cada reporte de incidencias en "eventos" (una llegada tarde, un percance,
        //     un incumplimiento de calidad) con su ruta, minutos y severidad.
        //  2) Aplica la revisión manual (si existe): ruta/minutos/severidad corregidos o descartado.
        //  3) Clasifica cada evento según las reglas del Excel y calcula el % de la ruta a penalizar.
        //  4) Calidad de ruta: se evalúa por planta y semana; sólo penaliza (10%) si la semana < 85%,
        //     y nunca se acumula con otra penalización del mismo viaje.
        //  5) Tope de 100% por viaje (misma fecha + turno + ruta).
        // =====================================================================================
        const buildRawEvents = (incidents) => {
            const out = [];
            incidents.forEach(inc => {
                const iso = dmyToIso(inc.date);
                if (!iso || !inc.plant) return;
                const base = { incidentId: inc.id, iso, plant: inc.plant, shift: inc.shift || '—' };
                const pushCause = (key, label, rule, imputable) => {
                    const n = parseInt(inc[key]) || 0;
                    const det = inc[key + 'Details'] || [];
                    for (let i = 0; i < n; i++) {
                        const d = det[i] || {};
                        const hasMin = d.minutes !== undefined && d.minutes !== null && d.minutes !== '';
                        out.push({ ...base, id: `${inc.id}|${key}|${i}`, rule, imputable, causeKey: key, causeLabel: label,
                            route: (d.route || '').toString().trim(), minutes: hasMin ? Number(d.minutes) : null });
                    }
                };
                IMP_CAUSES.forEach(([k, l]) => pushCause(k, l, 'llegada', true));
                NOIMP_CAUSES.forEach(([k, l]) => pushCause(k, l, 'llegada', false));

                // Percances (severidad capturada en el reporte; los registros antiguos sin detalle cuentan como "no grave")
                const nAcc = parseInt(inc.accidents) || 0;
                const accDet = inc.accidentsDetails || [];
                for (let i = 0; i < nAcc; i++) {
                    const d = accDet[i] || {};
                    out.push({ ...base, id: `${inc.id}|accidents|${i}`, rule: 'percance', imputable: true, causeKey: 'accidents', causeLabel: 'Percance',
                        route: (d.route || '').toString().trim(), severity: d.severity === 'grave' ? 'grave' : 'moderado', description: d.description || '',
                        responsibility: d.responsibility === 'CR' || d.responsibility === 'SR' ? d.responsibility : '' });
                }

                // Calidad de ruta: fallas mecánicas + causas imputables de desvío / manejo / falla mecánica
                const nMech = parseInt(inc.mechanicalFailures) || 0;
                const mechDet = inc.mechanicalFailuresDetails || [];
                for (let i = 0; i < nMech; i++) {
                    const d = mechDet[i] || {};
                    out.push({ ...base, id: `${inc.id}|mechanicalFailures|${i}`, rule: 'calidad', imputable: true, causeKey: 'mechanicalFailures', causeLabel: 'Falla mecánica',
                        route: (d.route || '').toString().trim(), unitId: d.unitId || '', description: d.description || '' });
                }
                CALIDAD_CAUSES.forEach(([k, l]) => {
                    const n = parseInt(inc[k]) || 0;
                    const det = inc[k + 'Details'] || [];
                    for (let i = 0; i < n; i++) {
                        const d = det[i] || {};
                        out.push({ ...base, id: `${inc.id}|${k}|${i}|cal`, rule: 'calidad', imputable: true, causeKey: k, causeLabel: l,
                            route: (d.route || '').toString().trim() });
                    }
                });
            });
            return out;
        };

        const computeEngine = (incidents, reviews, config, routeCosts, safetyScores = []) => {
            const cfg = { ...DEFAULT_CONFIG, ...(config || {}), tripsPerWeek: { ...DEFAULT_CONFIG.tripsPerWeek, ...((config && config.tripsPerWeek) || {}) } };
            const costMap = {};
            routeCosts.forEach(rc => { const k = normRoute(rc.route); if (k) costMap[k] = rc; });
            const defaultCost = { fixedMonthly: cfg.defaultFixedMonthly, tripsPerMonth: cfg.defaultTripsPerMonth, kmPerTrip: cfg.defaultKmPerTrip, costPerKm: cfg.defaultCostPerKm };

            // 1-2) eventos + revisión
            const events = [...buildRawEvents(incidents), ...buildScoreEvents(safetyScores).events].map(e => {
                const rv = reviews[e.id];
                const ev = { ...e, originalRoute: e.route, review: rv || null, status: (rv && rv.status) || 'auto' };
                if (rv) {
                    if (rv.route) ev.route = rv.route.toString().trim();
                    if (e.rule === 'llegada' && rv.minutes !== undefined && rv.minutes !== null && rv.minutes !== '') ev.minutes = Number(rv.minutes);
                    if (e.rule === 'percance' && rv.severity) ev.severity = rv.severity;
                    if (e.rule === 'percance' && (rv.responsibility === 'CR' || rv.responsibility === 'SR')) ev.responsibility = rv.responsibility;
                }
                ev.routeKey = normRoute(ev.route);
                ev.weekStart = isoWeekStart(ev.iso);
                ev.tripKey = ev.routeKey && ev.rule !== 'score' ? `${ev.iso}|${ev.shift}|${ev.routeKey}` : null;
                return ev;
            });

            // 3) clasificación de llegadas y percances
            events.forEach(ev => {
                ev.pct = 0; ev.tier = '—'; ev.reason = ''; ev.needsReview = false;
                const discarded = ev.status === 'descartada';
                if (ev.rule === 'llegada') {
                    if (!ev.imputable) { ev.tier = 'No imp.'; ev.reason = 'No imputable (ajena a la operación) — excluida'; return; }
                    if (discarded) { ev.tier = 'Desc.'; ev.reason = 'Descartada en revisión'; return; }
                    if (ev.minutes === null || isNaN(ev.minutes)) { ev.tier = 'S/M'; ev.reason = 'Sin minutos capturados — revisar'; ev.needsReview = true; return; }
                    if (ev.minutes <= 5) { ev.tier = 'A'; ev.reason = 'A · 1–5 min (tolerancia, sin penalización)'; return; }
                    if (ev.minutes <= 15) { ev.tier = 'B'; ev.pct = 50; ev.reason = 'B · 6–15 min → 50% de la ruta'; }
                    else { ev.tier = 'C'; ev.pct = 100; ev.reason = 'C · más de 15 min → no se paga la ruta'; }
                    if (!ev.routeKey) ev.needsReview = true;
                } else if (ev.rule === 'percance') {
                    // Sólo se cobran los percances C/R (con responsabilidad del operador = imputables)
                    ev.imputable = ev.responsibility === 'CR';
                    if (discarded) { ev.tier = 'Desc.'; ev.reason = 'Descartado en revisión'; return; }
                    if (ev.responsibility === 'SR') { ev.tier = 'S/R'; ev.reason = 'Sin responsabilidad (S/R) — no se cobra'; return; }
                    if (ev.responsibility !== 'CR') { ev.tier = 'Por clasif.'; ev.reason = 'Por clasificar: indica si fue C/R o S/R (no se cobra hasta clasificarlo)'; ev.needsReview = true; return; }
                    if (ev.severity === 'grave') { ev.tier = 'C/R grave'; ev.pct = 100; ev.reason = 'C/R grave (con lesiones) → sin pago de ruta'; }
                    else { ev.tier = 'C/R no grave'; ev.pct = 50; ev.reason = 'C/R no grave (sin lesiones) → 50% de la ruta'; }
                    if (!ev.routeKey) ev.needsReview = true;
                } else if (ev.rule === 'score') {
                    classifyScoreEvent(ev, discarded);
                }
            });

            // 4) Calidad de ruta por planta-semana (incumplimientos distintos por viaje)
            const weekCalidad = {};
            const seenCal = new Set();
            events.filter(ev => ev.rule === 'calidad' && ev.status !== 'descartada').forEach(ev => {
                const k = `${ev.plant}|${ev.weekStart}`;
                const distinct = `${k}|${ev.iso}|${ev.shift}|${ev.routeKey || ev.id}`;
                if (!weekCalidad[k]) weekCalidad[k] = { n: 0 };
                if (!seenCal.has(distinct)) { seenCal.add(distinct); weekCalidad[k].n++; ev.primaryCal = true; }
            });
            Object.keys(weekCalidad).forEach(k => {
                const [plant] = k.split('|');
                const P = num(cfg.tripsPerWeek[plant]);
                weekCalidad[k].P = P;
                weekCalidad[k].pct = P > 0 ? Math.max(0, (P - weekCalidad[k].n) / P * 100) : null;
            });
            const penalizedTrips = new Set(events.filter(e => (e.rule === 'llegada' || e.rule === 'percance') && e.pct > 0 && e.tripKey).map(e => e.tripKey));
            events.filter(ev => ev.rule === 'calidad').forEach(ev => {
                if (ev.status === 'descartada') { ev.tier = 'Desc.'; ev.reason = 'Descartado en revisión'; return; }
                if (!ev.primaryCal) { ev.tier = 'Dup.'; ev.reason = 'Mismo viaje ya contado como incumplimiento'; return; }
                const wc = weekCalidad[`${ev.plant}|${ev.weekStart}`];
                if (!ev.routeKey) ev.needsReview = true;
                if (!wc || wc.pct === null) { ev.tier = 'S/C'; ev.reason = 'Configura los viajes programados de la planta para evaluar'; return; }
                if (wc.pct >= TARGETS.calidadPenalty) { ev.tier = 'OK'; ev.reason = `Calidad semanal ${wc.pct.toFixed(1)}% (≥ 85%) — sin penalización`; return; }
                if (ev.tripKey && penalizedTrips.has(ev.tripKey)) { ev.tier = 'N/A'; ev.reason = 'No acumulable: el viaje ya tiene otra penalización'; return; }
                ev.tier = '10%'; ev.pct = 10; ev.reason = `Calidad semanal ${wc.pct.toFixed(1)}% (< 85%) → 10% de la ruta`;
            });

            // Score: una ruta se descuenta una sola vez por mes aunque tenga varios operadores bajo 90%
            const scoreRouteSeen = new Set();
            events.filter(e => e.rule === 'score' && e.pct > 0 && e.routeKey).sort((a, b) => a.score - b.score).forEach(e => {
                const k = `${e.month}|${e.routeKey}`;
                if (scoreRouteSeen.has(k)) { e.pct = 0; e.tier = 'Dup.'; e.reason = 'La ruta ya se descontó este mes por otro operador'; }
                else scoreRouteSeen.add(k);
            });

            // 5) Tope de 100% por viaje
            const byTrip = {};
            events.filter(e => e.pct > 0 && e.tripKey).forEach(e => { (byTrip[e.tripKey] = byTrip[e.tripKey] || []).push(e); });
            Object.values(byTrip).forEach(list => {
                if (list.length < 2) return;
                list.sort((a, b) => b.pct - a.pct);
                let remaining = 100;
                list.forEach(e => {
                    const applied = Math.min(e.pct, remaining);
                    if (applied < e.pct) { e.reason += ' · tope de 100% por viaje'; e.capped = true; }
                    e.pct = applied; remaining -= applied;
                });
            });

            // Costo de cada evento
            events.forEach(ev => {
                const c = ev.routeKey && costMap[ev.routeKey];
                ev.costSource = c ? 'catalogo' : 'defecto';
                ev.valueBasis = ev.rule === 'score' ? 'mensual' : 'viaje';
                ev.tripValue = ev.rule === 'score' ? monthlyRouteValue(c || defaultCost) : tripValue(c || defaultCost);
                ev.amount = ev.pct / 100 * ev.tripValue;
            });

            return { events, weekCalidad, cfg, costMap, scoreEval: buildScoreEvents(safetyScores).evaluation };
        };

        // Registros diarios de Nivel de servicio / Score de seguridad por fecha+planta.
        // Prioriza "daily_metrics" (captura por día) y usa como respaldo los reportes antiguos que traían el dato embebido.
        const buildMetricRecords = (dailyMetrics, incidents) => {
            const map = {};
            incidents.forEach(i => {
                if (i.serviceLevel === undefined && i.safetyScore === undefined) return;
                const iso = dmyToIso(i.date); if (!iso || !i.plant) return;
                const k = `${iso}|${i.plant}`;
                if (!map[k]) map[k] = { iso, plant: i.plant, legacy: [], dm: null };
                if (map[k].legacy) map[k].legacy.push(i);
            });
            dailyMetrics.forEach(dm => {
                const iso = dmyToIso(dm.date); if (!iso || !dm.plant) return;
                const k = `${iso}|${dm.plant}`;
                if (!map[k]) map[k] = { iso, plant: dm.plant, legacy: [], dm: null };
                map[k].dm = dm;
            });
            return Object.values(map).map(r => {
                if (r.dm) return { iso: r.iso, plant: r.plant, serviceLevel: r.dm.serviceLevel, safetyScore: r.dm.safetyScore };
                const L = r.legacy;
                const avg = (key, dflt) => { const v = L.filter(x => x[key] !== undefined).map(x => num(x[key])); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : dflt; };
                return { iso: r.iso, plant: r.plant, serviceLevel: avg('serviceLevel', undefined), safetyScore: avg('safetyScore', undefined) };
            });
        };
        const avgOf = (records, key) => {
            const v = records.map(r => r[key]).filter(x => x !== undefined && x !== null && !isNaN(x) && x > 0);
            return v.length ? v.reduce((a, b) => a + num(b), 0) / v.length : null;
        };

        const statusFor = (value, target, higherIsBetter = true, warnBand = null) => {
            if (value === null || value === undefined) return 'na';
            if (higherIsBetter) {
                if (value >= target) return 'ok';
                if (warnBand !== null && value >= warnBand) return 'warn';
                return 'bad';
            }
            return value <= target ? 'ok' : 'bad';
        };

        // =====================================================================================
        //  COMPONENTES DE PRESENTACIÓN
        // =====================================================================================
        const STATUS = {
            ok: { label: 'Cumple', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200', Icon: Icons.CheckCircle },
            warn: { label: 'En riesgo', cls: 'bg-amber-50 text-amber-800 border-amber-200', Icon: Icons.AlertTriangle },
            bad: { label: 'No cumple', cls: 'bg-red-50 text-red-700 border-red-200', Icon: Icons.XCircle },
            na: { label: 'Sin datos', cls: 'bg-slate-50 text-slate-500 border-slate-200', Icon: Icons.MinusCircle },
        };
        const StatusChip = ({ status, label, small = false }) => {
            const s = STATUS[status] || STATUS.na;
            return <span className={`inline-flex items-center gap-1 border rounded-full font-semibold whitespace-nowrap ${small ? 'text-[10px] px-1.5 py-0' : 'text-[11px] px-2 py-0.5'} ${s.cls}`}><s.Icon s={small ? 11 : 13} />{label || s.label}</span>;
        };

        const unitFmt = unit => unit === 'money' ? fmtMoney : (v => `${fmtEq(v)} ${Math.abs(v - 1) < 1e-9 ? 'ruta' : 'rutas'}`);

        const Card = ({ title, icon: Icon, right, children, className = '', subtitle }) => (
            <div className={`bg-white rounded-xl border border-slate-200 shadow-sm p-4 ${className}`}>
                {(title || right) && (
                    <div className="flex items-start justify-between gap-2 mb-3">
                        <div>
                            <h4 className="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">{Icon && <span className="text-slate-400"><Icon /></span>}{title}</h4>
                            {subtitle && <p className="text-[11px] text-slate-400 mt-0.5">{subtitle}</p>}
                        </div>
                        {right}
                    </div>
                )}
                {children}
            </div>
        );

        const Legend = ({ items }) => (
            <div className="flex flex-wrap gap-x-3 gap-y-1">
                {items.map(it => <span key={it.key} className="flex items-center gap-1 text-[10px] font-semibold text-slate-500"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ backgroundColor: it.color }}></span>{it.label}</span>)}
            </div>
        );

        const SummaryTile = ({ label, value, sub, icon: Icon, tone = 'slate' }) => {
            const tones = { slate: 'bg-slate-100 text-slate-600', rose: 'bg-rose-50 text-rose-600', amber: 'bg-amber-50 text-amber-700', violet: 'bg-violet-50 text-violet-600', sky: 'bg-sky-50 text-sky-700' };
            return (
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3">
                    <div className={`p-2 rounded-lg ${tones[tone]}`}><Icon /></div>
                    <div className="min-w-0">
                        <p className="text-[11px] text-slate-500 font-medium">{label}</p>
                        <p className="text-2xl font-bold text-slate-800 num leading-tight">{value}</p>
                        {sub && <p className="text-[11px] text-slate-400 mt-0.5">{sub}</p>}
                    </div>
                </div>
            );
        };

        // Tarjeta de indicador del contrato: valor real vs target, estado y periodicidad
        const IndicatorCard = ({ n, title, icon: Icon, color, value, target, status, statusLabel, period, periodLabel, footer }) => (
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex flex-col gap-2 relative overflow-hidden">
                <span className="absolute left-0 top-0 bottom-0 w-1" style={{ backgroundColor: color }}></span>
                <div className="flex items-center gap-2">
                    <span className="text-slate-400"><Icon /></span>
                    <div className="min-w-0">
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider whitespace-nowrap">Indicador {n} · {period}</p>
                        <h4 className="text-sm font-bold text-slate-700 leading-tight">{title}</h4>
                    </div>
                </div>
                <div className="flex items-center justify-between gap-2">
                    <p className="text-3xl font-bold text-slate-800 num leading-none">{value}</p>
                    <StatusChip status={status} label={statusLabel} />
                </div>
                <p className="text-[11px] text-slate-500">Target <b className="text-slate-700">{target}</b> · <span className="text-slate-400">{periodLabel}</span></p>
                {footer && <div className="text-[11px] text-slate-500 border-t border-slate-100 pt-2">{footer}</div>}
            </div>
        );

        // Barra única 100% apilada: composición del total por indicador
        const CompositionBar = ({ items, unit }) => {
            const total = items.reduce((s, i) => s + i.value, 0);
            const fmt = unitFmt(unit);
            const [hover, setHover] = useState(null);
            return (
                <div>
                    <div className="flex h-7 w-full rounded-md overflow-hidden bg-slate-100 gap-[2px]">
                        {total > 0 && items.filter(i => i.value > 0).map(i => (
                            <div key={i.key} style={{ width: `${i.value / total * 100}%`, backgroundColor: i.color, opacity: hover && hover !== i.key ? 0.45 : 1 }}
                                className="h-full transition-opacity cursor-pointer" onMouseEnter={() => setHover(i.key)} onMouseLeave={() => setHover(null)}
                                title={`${i.label}: ${fmt(i.value)} (${(i.value / total * 100).toFixed(0)}%)`}></div>
                        ))}
                    </div>
                    <div className="mt-3 space-y-1.5">
                        {items.map(i => (
                            <div key={i.key} onMouseEnter={() => setHover(i.key)} onMouseLeave={() => setHover(null)}
                                className={`flex items-center justify-between gap-2 text-xs px-1.5 py-1 rounded ${hover === i.key ? 'bg-slate-50' : ''}`}>
                                <span className="flex items-center gap-2 text-slate-600"><span className="w-2.5 h-2.5 rounded-sm" style={{ backgroundColor: i.color }}></span>{i.label}<span className="text-slate-400">({i.count} {i.count === 1 ? 'evento' : 'eventos'})</span></span>
                                <span className="font-bold text-slate-700 num whitespace-nowrap">{fmt(i.value)} <span className="font-normal text-slate-400">{total > 0 ? `${(i.value / total * 100).toFixed(0)}%` : ''}</span></span>
                            </div>
                        ))}
                    </div>
                    {total === 0 && <p className="text-[11px] text-slate-400 text-center mt-2">Sin penalizaciones en el periodo.</p>}
                </div>
            );
        };

        // Barras horizontales apiladas por indicador (por planta / por ruta), con tooltip por fila
        const HStackBars = ({ rows, unit, emptyText = 'Sin datos en el periodo.', onRowClick }) => {
            const fmt = unitFmt(unit);
            const max = Math.max(0, ...rows.map(r => r.total));
            const [hover, setHover] = useState(null);
            if (max <= 0) return <p className="text-[11px] text-slate-400 text-center py-10">{emptyText}</p>;
            return (
                <div className="space-y-1.5">
                    {rows.map((r, idx) => (
                        <div key={r.key} className={`relative flex items-center gap-2 group ${onRowClick ? 'cursor-pointer' : ''}`}
                            onMouseEnter={() => setHover(idx)} onMouseLeave={() => setHover(null)} onClick={() => onRowClick && onRowClick(r)}>
                            <div className="w-28 shrink-0 text-right">
                                <p className="text-[11px] font-semibold text-slate-700 truncate" title={r.label}>{r.label}</p>
                                {r.sub && <p className="text-[9px] text-slate-400 truncate">{r.sub}</p>}
                            </div>
                            <div className="flex-1 h-5 flex items-center">
                                <div className="h-full flex gap-[2px]" style={{ width: `${Math.max(r.total / max * 100, r.total > 0 ? 1.5 : 0)}%` }}>
                                    {r.segs.filter(s => s.value > 0).map((s, i, arr) => (
                                        <div key={s.key} className={`h-full ${i === arr.length - 1 ? 'rounded-r' : ''}`} style={{ width: `${s.value / r.total * 100}%`, backgroundColor: s.color, opacity: hover !== null && hover !== idx ? 0.5 : 1 }}></div>
                                    ))}
                                </div>
                                <span className="ml-1.5 text-[10px] font-bold text-slate-600 num whitespace-nowrap">{r.total > 0 ? fmt(r.total) : ''}</span>
                            </div>
                            {hover === idx && r.total > 0 && (
                                <div className="absolute z-20 left-32 -top-1 translate-y-[-100%] bg-slate-900 text-white rounded-lg shadow-lg px-3 py-2 text-[11px] pointer-events-none min-w-[180px]">
                                    <p className="font-bold mb-1">{r.label}{r.sub ? <span className="font-normal text-slate-400"> · {r.sub}</span> : null}</p>
                                    {r.segs.filter(s => s.value > 0).map(s => (
                                        <p key={s.key} className="flex items-center justify-between gap-3"><span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm" style={{ backgroundColor: s.color }}></span>{s.label}</span><span className="num">{fmt(s.value)}{s.count !== undefined ? ` · ${s.count} ev.` : ''}</span></p>
                                    ))}
                                    <p className="flex justify-between gap-3 border-t border-slate-700 mt-1 pt-1 font-bold"><span>Total</span><span className="num">{fmt(r.total)}</span></p>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        };

        // Columnas apiladas por semana (tendencia), eje Y visible y tooltip por columna
        const WeeklyColumns = ({ weeks, unit }) => {
            const fmt = unitFmt(unit);
            const fmtAxis = v => unit === 'money' ? (v >= 1000 ? `$${(v / 1000).toFixed(v >= 10000 ? 0 : 1)}k` : `$${Math.round(v)}`) : fmtEq(v);
            const width = 640, height = 210, mT = 14, mB = 34, mL = 46, mR = 10;
            const [hover, setHover] = useState(null);
            const maxT = Math.max(0, ...weeks.map(w => w.total));
            const domainMax = maxT > 0 ? maxT * 1.15 : 1;
            const plotH = height - mT - mB;
            const yAt = v => height - mB - (v / domainMax) * plotH;
            const slot = (width - mL - mR) / Math.max(1, weeks.length);
            const barW = Math.min(38, slot * 0.55);
            const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => ({ y: mT + f * plotH, v: domainMax * (1 - f) }));
            return (
                <div className="relative">
                    <svg width="100%" viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
                        {ticks.map((t, i) => <line key={i} x1={mL} x2={width - mR} y1={t.y} y2={t.y} stroke="#f1f5f9" />)}
                        <line x1={mL} x2={mL} y1={mT} y2={height - mB} stroke="#cbd5e1" />
                        <line x1={mL} x2={width - mR} y1={height - mB} y2={height - mB} stroke="#cbd5e1" />
                        {maxT > 0 && ticks.map((t, i) => <text key={i} x={mL - 6} y={t.y + 3} textAnchor="end" fontSize="9" fill="#94a3b8">{fmtAxis(t.v)}</text>)}
                        {weeks.map((w, i) => {
                            const cx = mL + slot * i + slot / 2; const x = cx - barW / 2;
                            let cum = 0;
                            const segs = w.segs.filter(s => s.value > 0);
                            return (
                                <g key={w.key} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)} style={{ cursor: 'pointer' }}>
                                    <rect x={mL + slot * i} y={mT} width={slot} height={plotH} fill={hover === i ? '#f8fafc' : 'transparent'} />
                                    {segs.map((s, j) => {
                                        const y0 = yAt(cum); cum += s.value; const y1 = yAt(cum);
                                        const isTop = j === segs.length - 1;
                                        const h = Math.max(0, y0 - y1 - (j > 0 ? 2 : 0));
                                        return <rect key={s.key} x={x} y={y1} width={barW} height={h} rx={isTop ? 3 : 0} fill={s.color} />;
                                    })}
                                    <text x={cx} y={height - mB + 13} textAnchor="middle" fontSize="9.5" fontWeight="600" fill={w.current ? '#334155' : '#94a3b8'}>{w.label}</text>
                                    <text x={cx} y={height - mB + 24} textAnchor="middle" fontSize="8.5" fill="#94a3b8">{w.sub}</text>
                                </g>
                            );
                        })}
                    </svg>
                    {hover !== null && weeks[hover] && (
                        <div className="absolute z-20 bg-slate-900 text-white rounded-lg shadow-lg px-3 py-2 text-[11px] pointer-events-none min-w-[170px]"
                            style={(() => { const xp = (mL + slot * hover + slot / 2) / width * 100; return xp > 50 ? { right: `${100 - xp + 4}%`, top: 0 } : { left: `${xp + 4}%`, top: 0 }; })()}>
                            <p className="font-bold mb-1">{weeks[hover].label} <span className="font-normal text-slate-400">{weeks[hover].range}</span></p>
                            {weeks[hover].segs.map(s => (
                                <p key={s.key} className="flex items-center justify-between gap-3"><span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm" style={{ backgroundColor: s.color }}></span>{s.label}</span><span className="num">{fmt(s.value)}</span></p>
                            ))}
                            <p className="flex justify-between gap-3 border-t border-slate-700 mt-1 pt-1 font-bold"><span>Total</span><span className="num">{fmt(weeks[hover].total)}</span></p>
                        </div>
                    )}
                </div>
            );
        };

        // Llegadas tarde imputables por tramo de minutos (A/B/C del contrato + sin minutos)
        const TramoBars = ({ counts }) => {
            const items = [
                { key: 'A', label: 'A · 1–5 min', note: 'Sin penalización', color: TRAMO_COLORS.A },
                { key: 'B', label: 'B · 6–15 min', note: '50% de la ruta', color: TRAMO_COLORS.B },
                { key: 'C', label: 'C · +15 min', note: '100% de la ruta', color: TRAMO_COLORS.C },
                { key: 'SM', label: 'Sin minutos', note: 'Por revisar', color: TRAMO_COLORS.SM },
            ];
            const max = Math.max(1, ...items.map(i => counts[i.key] || 0));
            const total = items.reduce((s, i) => s + (counts[i.key] || 0), 0);
            if (total === 0) return <p className="text-[11px] text-slate-400 text-center py-10">Sin llegadas tarde imputables en el periodo.</p>;
            return (
                <div className="flex items-end justify-around gap-3 h-44 pt-4">
                    {items.map(i => {
                        const v = counts[i.key] || 0;
                        return (
                            <div key={i.key} className="flex-1 flex flex-col items-center justify-end h-full" title={`${i.label}: ${v} (${i.note})`}>
                                <span className="text-xs font-bold text-slate-700 num mb-1">{v}</span>
                                <div className="w-full max-w-[44px] rounded-t" style={{ height: `${v / max * 100}%`, minHeight: v > 0 ? 3 : 0, backgroundColor: i.color }}></div>
                                <div className="w-full border-t border-slate-200 mt-0"></div>
                                <span className="text-[10px] font-semibold text-slate-600 mt-1 text-center leading-tight">{i.label}</span>
                                <span className="text-[9px] text-slate-400 text-center leading-tight">{i.note}</span>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const Modal = ({ title, onClose, children, wide = false }) => (
            <div className="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
                <div className={`bg-white rounded-xl shadow-2xl w-full ${wide ? 'max-w-3xl' : 'max-w-md'} max-h-[90vh] overflow-y-auto fade-in`}>
                    <div className="flex items-center justify-between px-5 py-3 border-b border-slate-100 sticky top-0 bg-white">
                        <h3 className="font-bold text-slate-700">{title}</h3>
                        <button onClick={onClose} className="text-slate-400 hover:text-slate-700"><Icons.X /></button>
                    </div>
                    <div className="p-5">{children}</div>
                </div>
            </div>
        );

        // =====================================================================================
        //  REVISIÓN DE UN EVENTO (admin): corregir ruta / minutos / severidad o descartar
        // =====================================================================================
        const ReviewModal = ({ ev, onClose, onSave, onClear }) => {
            const [route, setRoute] = useState(ev.review && ev.review.route ? ev.review.route : ev.originalRoute || '');
            const [minutes, setMinutes] = useState(ev.review && ev.review.minutes !== undefined && ev.review.minutes !== null ? ev.review.minutes : (ev.minutes !== null && ev.minutes !== undefined ? ev.minutes : ''));
            const [severity, setSeverity] = useState(ev.severity || 'moderado');
            const [responsibility, setResponsibility] = useState(ev.responsibility || '');
            const [status, setStatus] = useState(ev.status === 'descartada' ? 'descartada' : 'auto');
            const [note, setNote] = useState((ev.review && ev.review.note) || '');
            const rule = RULES[ev.rule];
            return (
                <Modal title="Revisar evento" onClose={onClose}>
                    <div className="space-y-4 text-sm">
                        <div className="bg-slate-50 rounded-lg p-3 text-xs text-slate-600 space-y-1">
                            <p><span className="inline-block w-2.5 h-2.5 rounded-sm mr-1.5 align-middle" style={{ backgroundColor: rule.color }}></span><b>{rule.label}</b> · {ev.causeLabel}{ev.imputable ? '' : ' (no imputable)'}</p>
                            <p>{ev.rule === 'score' ? `Cierre de ${monthKeyLabel(ev.month)}` : isoToDMY(ev.iso)} · {ev.plant} ({PLANT_CODE[ev.plant] || '—'}){ev.rule === 'score' ? '' : ` · ${SHIFT_LABELS[ev.shift] || ev.shift}`}</p>
                            {ev.rule === 'score' && <p>Operador: <b>{ev.operator}</b> · score {ev.score.toFixed(1)}%</p>}
                            <p>Ruta capturada: <b>{ev.originalRoute || 'sin ruta'}</b>{ev.unitId ? ` · Unidad ${ev.unitId}` : ''}</p>
                            {ev.description && <p>Descripción: {ev.description}</p>}
                            <p>Resultado actual: <b>{ev.reason}</b></p>
                        </div>
                        <label className="block">
                            <span className="text-xs font-semibold text-slate-600">Ruta</span>
                            <input value={route} onChange={e => setRoute(e.target.value)} placeholder="Nombre de la ruta" className="mt-1 w-full border rounded px-2 py-1.5 text-sm" />
                        </label>
                        {ev.rule === 'llegada' && ev.imputable && (
                            <label className="block">
                                <span className="text-xs font-semibold text-slate-600">Minutos de retraso</span>
                                <input type="number" min="0" value={minutes} onChange={e => setMinutes(e.target.value)} className="mt-1 w-32 border rounded px-2 py-1.5 text-sm" />
                                <span className="text-[11px] text-slate-400 ml-2">1–5 sin penalización · 6–15 = 50% · +15 = 100%</span>
                            </label>
                        )}
                        {ev.rule === 'percance' && (
                            <label className="block">
                                <span className="text-xs font-semibold text-slate-600">Responsabilidad</span>
                                <select value={responsibility} onChange={e => setResponsibility(e.target.value)} className="mt-1 block border rounded px-2 py-1.5 text-sm bg-white">
                                    <option value="">Por clasificar (no se cobra)</option>
                                    <option value="CR">C/R · Con responsabilidad → se cobra</option>
                                    <option value="SR">S/R · Sin responsabilidad → no se cobra</option>
                                </select>
                            </label>
                        )}
                        {ev.rule === 'percance' && (
                            <label className="block">
                                <span className="text-xs font-semibold text-slate-600">Severidad</span>
                                <select value={severity} onChange={e => setSeverity(e.target.value)} className="mt-1 block border rounded px-2 py-1.5 text-sm bg-white">
                                    <option value="grave">Grave (con lesiones) → 100%</option>
                                    <option value="moderado">No grave (sin lesiones) → 50%</option>
                                </select>
                            </label>
                        )}
                        <div>
                            <span className="text-xs font-semibold text-slate-600">¿Aplica la penalización?</span>
                            <div className="mt-1 flex gap-2">
                                <button onClick={() => setStatus('auto')} className={`flex-1 text-xs border rounded px-2 py-2 ${status === 'auto' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600'}`}>Sí, según las reglas</button>
                                <button onClick={() => setStatus('descartada')} className={`flex-1 text-xs border rounded px-2 py-2 ${status === 'descartada' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600'}`}>No, descartar (no imputable / justificada)</button>
                            </div>
                        </div>
                        <label className="block">
                            <span className="text-xs font-semibold text-slate-600">Nota (evidencia / motivo)</span>
                            <textarea value={note} onChange={e => setNote(e.target.value)} rows="2" className="mt-1 w-full border rounded px-2 py-1.5 text-sm" placeholder="Ej. bloqueo en Av. Industria, evidencia GPS..." />
                        </label>
                        <div className="flex justify-between gap-2 pt-1">
                            {ev.review ? <button onClick={onClear} className="text-xs text-slate-500 hover:text-red-600 underline">Quitar revisión</button> : <span></span>}
                            <div className="flex gap-2">
                                <button onClick={onClose} className="text-xs border rounded px-3 py-2 text-slate-600">Cancelar</button>
                                <button onClick={() => onSave({ route: route.trim(), minutes: minutes === '' ? null : Number(minutes), severity, responsibility, status, note: note.trim() })} className="text-xs rounded px-3 py-2 bg-rose-600 text-white font-semibold hover:bg-rose-700">Guardar revisión</button>
                            </div>
                        </div>
                    </div>
                </Modal>
            );
        };

        // =====================================================================================
        //  CONFIGURACIÓN: viajes programados por planta, costos por defecto y catálogo de rutas
        // =====================================================================================
        const CostInputs = ({ value, onChange, disabled }) => (
            <>
                {[['fixedMonthly', 'w-28'], ['tripsPerMonth', 'w-16'], ['kmPerTrip', 'w-16'], ['costPerKm', 'w-20']].map(([k, w]) => (
                    <td key={k} className="p-1.5"><input type="number" min="0" step="any" disabled={disabled} value={value[k]} onChange={e => onChange({ ...value, [k]: e.target.value })} className={`${w} border rounded px-1.5 py-1 text-xs num disabled:bg-slate-50 disabled:text-slate-500`} /></td>
                ))}
            </>
        );

        const RouteCostRow = ({ rc, isAdmin, onSave, onDelete }) => {
            const [draft, setDraft] = useState(rc);
            useEffect(() => setDraft(rc), [rc]);
            const dirty = JSON.stringify(draft) !== JSON.stringify(rc);
            return (
                <tr className="border-t border-slate-100">
                    <td className="p-1.5"><input disabled={!isAdmin} value={draft.route} onChange={e => setDraft({ ...draft, route: e.target.value })} className="w-32 border rounded px-1.5 py-1 text-xs disabled:bg-slate-50" /></td>
                    <td className="p-1.5">
                        <select disabled={!isAdmin} value={draft.plant} onChange={e => setDraft({ ...draft, plant: e.target.value })} className="border rounded px-1 py-1 text-xs bg-white disabled:bg-slate-50">
                            {PLANTS.filter(p => p !== 'Todas').map(p => <option key={p}>{p}</option>)}
                        </select>
                    </td>
                    <CostInputs value={draft} onChange={setDraft} disabled={!isAdmin} />
                    <td className="p-1.5 text-right font-bold text-slate-700 num text-xs whitespace-nowrap">{fmtMoney2(tripValue(draft))}</td>
                    <td className="p-1.5 whitespace-nowrap">
                        {isAdmin && <>
                            <button disabled={!dirty} onClick={() => onSave(draft)} className="text-[11px] px-2 py-1 rounded bg-slate-900 text-white disabled:bg-slate-200 disabled:text-slate-400 mr-1">Guardar</button>
                            <button onClick={() => onDelete(rc)} className="text-slate-300 hover:text-red-600 align-middle" title="Eliminar ruta"><Icons.Trash /></button>
                        </>}
                    </td>
                </tr>
            );
        };

        const ConfigPanel = ({ isAdmin, cfg, routeCosts, missingRoutes, onSaveConfig, onSaveRoute, onDeleteRoute, onLogin }) => {
            const [draft, setDraft] = useState(cfg);
            useEffect(() => setDraft(cfg), [cfg]);
            const emptyRoute = { route: '', plant: 'Camiones', fixedMonthly: '', tripsPerMonth: cfg.defaultTripsPerMonth || 26, kmPerTrip: '', costPerKm: cfg.defaultCostPerKm || '' };
            const [newRoute, setNewRoute] = useState(emptyRoute);
            const [q, setQ] = useState('');
            const sorted = [...routeCosts].sort((a, b) => (a.plant || '').localeCompare(b.plant || '') || (a.route || '').localeCompare(b.route || '', 'es', { numeric: true }));
            const shown = sorted.filter(r => !q || normRoute(r.route).includes(normRoute(q)) || normRoute(r.plant).includes(normRoute(q)));
            const cfgDirty = JSON.stringify(draft) !== JSON.stringify(cfg);
            return (
                <div className="space-y-5">
                    {!isAdmin && (
                        <div className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-600">
                            <span className="flex items-center gap-1.5"><Icons.Lock /> Sólo lectura. Inicia sesión como administrador para editar costos y parámetros.</span>
                            <button onClick={onLogin} className="px-2 py-1 rounded bg-slate-900 text-white">Iniciar sesión</button>
                        </div>
                    )}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        <div>
                            <h5 className="text-xs font-bold text-slate-600 mb-1">Viajes programados por semana</h5>
                            <p className="text-[11px] text-slate-400 mb-2">Denominador de <b>Calidad de ruta</b> (rutas conformes ÷ rutas programadas). Sin este dato no se puede evaluar el umbral de 85%.</p>
                            <div className="grid grid-cols-5 gap-2">
                                {AREA_ROWS.map(a => (
                                    <label key={a.plant} className="text-[11px] text-slate-500">
                                        <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full" style={{ backgroundColor: a.color }}></span>{a.code}</span>
                                        <input type="number" min="0" disabled={!isAdmin} value={draft.tripsPerWeek[a.plant] ?? 0}
                                            onChange={e => setDraft({ ...draft, tripsPerWeek: { ...draft.tripsPerWeek, [a.plant]: e.target.value } })}
                                            className="mt-0.5 w-full border rounded px-1.5 py-1 text-xs num disabled:bg-slate-50" />
                                    </label>
                                ))}
                            </div>
                        </div>
                        <div>
                            <h5 className="text-xs font-bold text-slate-600 mb-1">Costo por defecto (rutas sin costo en el catálogo)</h5>
                            <p className="text-[11px] text-slate-400 mb-2">Valor del viaje = costo fijo mensual ÷ viajes al mes + km del viaje × costo por km.</p>
                            <div className="grid grid-cols-4 gap-2">
                                {[['defaultFixedMonthly', 'Costo fijo mensual $'], ['defaultTripsPerMonth', 'Viajes al mes'], ['defaultKmPerTrip', 'Km por viaje'], ['defaultCostPerKm', 'Costo por km $']].map(([k, l]) => (
                                    <label key={k} className="text-[11px] text-slate-500">{l}
                                        <input type="number" min="0" step="any" disabled={!isAdmin} value={draft[k]} onChange={e => setDraft({ ...draft, [k]: e.target.value })} className="mt-0.5 w-full border rounded px-1.5 py-1 text-xs num disabled:bg-slate-50" />
                                    </label>
                                ))}
                            </div>
                            <p className="text-[11px] text-slate-500 mt-2">Valor por defecto de un viaje: <b className="num">{fmtMoney2(tripValue({ fixedMonthly: draft.defaultFixedMonthly, tripsPerMonth: draft.defaultTripsPerMonth, kmPerTrip: draft.defaultKmPerTrip, costPerKm: draft.defaultCostPerKm }))}</b></p>
                        </div>
                    </div>
                    {isAdmin && (
                        <div className="flex justify-end">
                            <button disabled={!cfgDirty} onClick={() => onSaveConfig(draft)} className="text-xs px-3 py-1.5 rounded bg-rose-600 text-white font-semibold disabled:bg-slate-200 disabled:text-slate-400">Guardar parámetros</button>
                        </div>
                    )}

                    <div>
                        <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                            <h5 className="text-xs font-bold text-slate-600">Catálogo de costos por ruta <span className="font-normal text-slate-400">({routeCosts.length} rutas)</span></h5>
                            <div className="flex items-center gap-1 border rounded px-2 py-1 bg-white"><span className="text-slate-400"><Icons.Search /></span><input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar ruta o planta" className="text-xs outline-none w-40" /></div>
                        </div>
                        {missingRoutes.length > 0 && (
                            <div className="mb-3 bg-amber-50 border border-amber-200 rounded-lg p-2.5">
                                <p className="text-[11px] text-amber-800 font-semibold mb-1.5 flex items-center gap-1"><Icons.AlertTriangle s={13} /> {missingRoutes.length} ruta(s) con penalización usan el costo por defecto{isAdmin ? ' — haz clic para agregarlas al catálogo:' : ':'}</p>
                                <div className="flex flex-wrap gap-1.5">
                                    {missingRoutes.map(m => (
                                        <button key={m.routeKey} disabled={!isAdmin} onClick={() => setNewRoute({ ...emptyRoute, route: m.route, plant: m.plant })}
                                            className="text-[11px] bg-white border border-amber-300 rounded-full px-2 py-0.5 text-amber-900 hover:bg-amber-100 disabled:cursor-default">{m.route} <span className="text-amber-600">· {PLANT_CODE[m.plant] || m.plant}</span></button>
                                    ))}
                                </div>
                            </div>
                        )}
                        <div className="overflow-x-auto border border-slate-200 rounded-lg max-h-[420px] overflow-y-auto">
                            <table className="tbl w-full text-xs">
                                <thead className="bg-slate-50 text-slate-500">
                                    <tr>
                                        <th className="p-2 text-left bg-slate-50">Ruta</th><th className="p-2 text-left bg-slate-50">Planta</th>
                                        <th className="p-2 text-left bg-slate-50">Costo fijo mensual $</th><th className="p-2 text-left bg-slate-50">Viajes/mes</th>
                                        <th className="p-2 text-left bg-slate-50">Km/viaje</th><th className="p-2 text-left bg-slate-50">$/km</th>
                                        <th className="p-2 text-right bg-slate-50">Valor del viaje</th><th className="p-2 bg-slate-50"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {isAdmin && (
                                        <tr className="bg-rose-50/40">
                                            <td className="p-1.5"><input value={newRoute.route} onChange={e => setNewRoute({ ...newRoute, route: e.target.value })} placeholder="Nueva ruta" className="w-32 border rounded px-1.5 py-1 text-xs" /></td>
                                            <td className="p-1.5"><select value={newRoute.plant} onChange={e => setNewRoute({ ...newRoute, plant: e.target.value })} className="border rounded px-1 py-1 text-xs bg-white">{PLANTS.filter(p => p !== 'Todas').map(p => <option key={p}>{p}</option>)}</select></td>
                                            <CostInputs value={newRoute} onChange={setNewRoute} disabled={false} />
                                            <td className="p-1.5 text-right font-bold text-slate-700 num whitespace-nowrap">{fmtMoney2(tripValue(newRoute))}</td>
                                            <td className="p-1.5"><button disabled={!newRoute.route.trim()} onClick={() => { onSaveRoute(newRoute); setNewRoute(emptyRoute); }} className="text-[11px] px-2 py-1 rounded bg-rose-600 text-white flex items-center gap-1 disabled:bg-slate-200 disabled:text-slate-400"><Icons.Plus />Agregar</button></td>
                                        </tr>
                                    )}
                                    {shown.map(rc => <RouteCostRow key={rc.id} rc={rc} isAdmin={isAdmin} onSave={onSaveRoute} onDelete={onDeleteRoute} />)}
                                    {shown.length === 0 && <tr><td colSpan="8" className="p-4 text-center text-slate-400">{routeCosts.length === 0 ? 'Aún no hay rutas en el catálogo.' : 'Sin coincidencias.'}</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const RulesPanel = () => (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {CONTRACT_RULES.map(r => (
                    <div key={r.n} className="border border-slate-200 rounded-lg p-3 relative overflow-hidden">
                        <span className="absolute left-0 top-0 bottom-0 w-1" style={{ backgroundColor: r.color }}></span>
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Indicador {r.n} · {r.period} · Target {r.target}</p>
                        <h5 className="font-bold text-slate-700 text-sm">{r.name} <span className="font-normal text-slate-400 text-xs">— {r.desc}</span></h5>
                        <p className="text-[11px] text-slate-500 mt-1"><b>Cálculo:</b> {r.calc} · <b>Evidencia:</b> {r.evidence}</p>
                        <ul className="mt-1.5 space-y-0.5 text-[11px] text-slate-600 list-disc pl-4">{r.consequences.map((c, i) => <li key={i}>{c}</li>)}</ul>
                    </div>
                ))}
                <div className="md:col-span-2 text-[11px] text-slate-500 bg-slate-50 rounded-lg p-3 space-y-1">
                    <p><b>En todos los casos</b> el monto se calcula con la parte proporcional del costo fijo mensual + costo por kilómetro de la ruta afectada, por cada ruta incumplida en la semana.</p>
                    <p><b>Cómo lo calcula este tablero:</b> cada llegada tarde, percance o incumplimiento capturado en el Dashboard de Transporte (con su ruta y minutos) se evalúa contra estas reglas. Las llegadas tarde no imputables se excluyen. Los percances se consideran imputables salvo que se descarten en revisión. La calidad de ruta se evalúa por planta y semana, y su 10% no se acumula con otra penalización del mismo viaje. Un viaje nunca se penaliza por más del 100%.</p>
                    <p><b>Percances:</b> sólo se cobran los registrados como <b>C/R</b> (con responsabilidad). Los S/R no se cobran y los que no tienen clasificación quedan "por clasificar" hasta que un administrador los revise.</p>
                    <p><b>Score de seguridad:</b> se calcula con el Excel mensual de score por operador, <b>planta por planta</b>. Si más del 20% de los operadores de una planta está por debajo de 90%, se pide plan de acción (3 días). Si el mes inmediato anterior esa planta también pasó del 20% (reincidencia), se descuenta 10% del valor mensual de la ruta de cada operador bajo 90% (costo fijo mensual + km × costo por km × viajes al mes). Si el Excel no trae la ruta del operador se usa el costo por defecto. El descuento se registra al cierre del mes.</p>
                </div>
            </div>
        );

        // =====================================================================================
        //  SCORE DE SEGURIDAD POR OPERADOR: lectura del Excel, plantilla y sección del tablero
        // =====================================================================================
        const parseScoreNumber = v => {
            if (typeof v === 'number') return v;
            const t = (v === null || v === undefined ? '' : v.toString()).replace('%', '').replace(',', '.').trim();
            return t ? parseFloat(t) : NaN;
        };
        const parseScoreSheet = (rows) => {
            let hIdx = -1, c = null;
            for (let i = 0; i < Math.min(15, rows.length); i++) {
                const hs = (rows[i] || []).map(stripAccents);
                const name = hs.findIndex(h => /nombre|operador/.test(h) && !/ruta/.test(h));
                const plant = hs.findIndex(h => /planta|area/.test(h));
                const score = hs.findIndex(h => /score|calificacion|puntaje|puntuacion|resultado/.test(h));
                const route = hs.findIndex(h => /ruta/.test(h));
                if (name >= 0 && plant >= 0 && score >= 0) { hIdx = i; c = { name, plant, score, route }; break; }
            }
            if (hIdx < 0) return { error: 'No encontré los encabezados. El Excel debe tener las columnas Nombre, Planta y Score (Ruta es opcional).' };
            const raw = [], errors = [];
            rows.slice(hIdx + 1).forEach((r, k) => {
                const rowN = hIdx + k + 2;
                const nombre = (r[c.name] === undefined || r[c.name] === null ? '' : r[c.name].toString()).trim();
                if (!nombre) return;
                const plantRaw = r[c.plant];
                const plant = normPlant(plantRaw);
                const score = parseScoreNumber(r[c.score]);
                const route = c.route >= 0 && r[c.route] !== undefined && r[c.route] !== null ? r[c.route].toString().trim() : '';
                if (!plant) { errors.push(`Fila ${rowN}: planta "${plantRaw}" no reconocida (${nombre})`); return; }
                if (isNaN(score)) { errors.push(`Fila ${rowN}: score vacío o inválido (${nombre})`); return; }
                raw.push({ nombre: nombre.toUpperCase(), plant, score, route });
            });
            const scaled = raw.length > 0 && raw.every(o => o.score <= 1);
            const operators = [];
            raw.forEach(o => {
                const score = Math.round((scaled ? o.score * 100 : o.score) * 10) / 10;
                if (score < 0 || score > 100) { errors.push(`${o.nombre}: score ${score} fuera de rango (0–100)`); return; }
                operators.push({ ...o, score });
            });
            return { operators, errors, scaled, hasRouteCol: c.route >= 0 };
        };
        const downloadScoreTemplate = () => {
            if (typeof XLSX === 'undefined') { alert('No se pudo cargar la librería de Excel. Verifica tu conexión.'); return; }
            const ws = XLSX.utils.aoa_to_sheet([['Nombre', 'Planta', 'Score', 'Ruta (opcional)'], ['PÉREZ LÓPEZ JUAN', 'Camiones', 94.5, 'Ruta 8'], ['GARCÍA RUIZ MARÍA', 'Norte', 87, '']]);
            ws['!cols'] = [{ wch: 34 }, { wch: 12 }, { wch: 8 }, { wch: 16 }];
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Score');
            XLSX.writeFile(wb, 'Plantilla_Score_Operadores.xlsx');
        };

        const ScoreUploadModal = ({ defaultMonth, existingMonths, onClose, onSave }) => {
            const [month, setMonth] = useState(defaultMonth);
            const [fileName, setFileName] = useState('');
            const [parsed, setParsed] = useState(null);
            const [err, setErr] = useState('');
            const onFile = e => {
                const f = e.target.files && e.target.files[0];
                setParsed(null); setErr('');
                if (!f) return;
                if (typeof XLSX === 'undefined') { setErr('No se pudo cargar la librería de Excel. Verifica tu conexión.'); return; }
                setFileName(f.name);
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
                        const res = parseScoreSheet(rows);
                        if (res.error) setErr(res.error); else setParsed(res);
                    } catch (x) { console.error(x); setErr('No se pudo leer el archivo. Usa un Excel (.xlsx / .xls) o CSV.'); }
                };
                reader.readAsArrayBuffer(f);
            };
            const preview = parsed ? evaluateScoreMonth({ operators: parsed.operators }, null) : null;
            return (
                <Modal title="Subir Excel de score por operador" onClose={onClose} wide>
                    <div className="space-y-4 text-sm">
                        <p className="text-xs text-slate-500">Columnas: <b>Nombre</b>, <b>Planta</b> y <b>Score</b> (0–100 o en %). <b>Ruta</b> es opcional: si viene, el descuento usa el costo de esa ruta; si no, el costo por defecto. <button onClick={downloadScoreTemplate} className="underline text-slate-700">Descargar plantilla</button></p>
                        <div className="flex flex-wrap items-end gap-3">
                            <label className="text-xs font-semibold text-slate-600">Mes
                                <input type="month" value={month} onChange={e => e.target.value && setMonth(e.target.value)} className="mt-1 block border rounded px-2 py-1.5 text-sm" />
                            </label>
                            <label className="text-xs font-semibold text-slate-600 flex-1 min-w-[220px]">Archivo
                                <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} className="mt-1 block w-full text-xs file:mr-2 file:px-3 file:py-1.5 file:rounded file:border-0 file:bg-slate-900 file:text-white" />
                            </label>
                        </div>
                        {existingMonths.includes(month) && <p className="text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded px-3 py-2">Ya hay un Excel cargado para {monthKeyLabel(month)}. Si guardas, se reemplazará.</p>}
                        {err && <p className="text-xs bg-red-50 border border-red-200 text-red-700 rounded px-3 py-2">{err}</p>}
                        {parsed && (
                            <div className="space-y-3">
                                <p className="text-xs text-slate-600"><b>{parsed.operators.length}</b> operadores leídos de <b>{fileName}</b>{parsed.scaled ? ' (score convertido de fracción a %)' : ''}{parsed.hasRouteCol ? ' · con columna Ruta' : ' · sin columna Ruta (se usará el costo por defecto)'}.</p>
                                <table className="w-full text-xs border border-slate-200 rounded">
                                    <thead className="bg-slate-50 text-slate-500"><tr><th className="p-1.5 text-left">Planta</th><th className="p-1.5 text-right">Operadores</th><th className="p-1.5 text-right">Bajo 90%</th><th className="p-1.5 text-right">% bajo 90</th><th className="p-1.5 text-left">¿Pasa del 20%?</th></tr></thead>
                                    <tbody>{AREA_ROWS.map(a => { const pp = preview[a.plant]; return (
                                        <tr key={a.plant} className="border-t border-slate-100"><td className="p-1.5">{a.code} <span className="text-slate-400">{a.plant}</span></td><td className="p-1.5 text-right num">{pp.total}</td><td className="p-1.5 text-right num">{pp.below}</td><td className="p-1.5 text-right num font-bold">{fmtPct(pp.pct)}</td>
                                            <td className="p-1.5">{pp.pct === null ? <span className="text-slate-400">Sin operadores</span> : pp.exceeds ? <StatusChip small status="warn" label="Sí, más del 20%" /> : <StatusChip small status="ok" label="No" />}</td></tr>); })}</tbody>
                                </table>
                                {parsed.errors.length > 0 && (
                                    <div className="text-xs bg-amber-50 border border-amber-200 text-amber-800 rounded px-3 py-2">
                                        <p className="font-semibold mb-1">{parsed.errors.length} fila(s) no se importarán:</p>
                                        <ul className="list-disc pl-4 space-y-0.5 max-h-32 overflow-y-auto">{parsed.errors.slice(0, 50).map((x, i) => <li key={i}>{x}</li>)}</ul>
                                    </div>
                                )}
                            </div>
                        )}
                        <div className="flex justify-end gap-2">
                            <button onClick={onClose} className="text-xs border rounded px-3 py-2 text-slate-600">Cancelar</button>
                            <button disabled={!parsed || parsed.operators.length === 0} onClick={() => onSave({ month, operators: parsed.operators, fileName })} className="text-xs rounded px-3 py-2 bg-rose-600 text-white font-semibold disabled:bg-slate-200 disabled:text-slate-400">Guardar score de {monthKeyLabel(month)}</button>
                        </div>
                    </div>
                </Modal>
            );
        };

        const SC_STATUS_MAP = { ok: ['ok', 'Cumple'], plan: ['warn', 'Plan de acción'], penaliza: ['bad', 'Penaliza 10%'], na: ['na', 'Sin datos'] };
        const ScoreSection = ({ isAdmin, scoreEval, month, setMonth, plantsToShow, events, unit, onOpenUpload, onDeleteMonth, onReview }) => {
            const ev = scoreEval[month];
            const plantSetLocal = new Set(plantsToShow.map(p => p.plant));
            const opsBelow = events.filter(e => e.rule === 'score' && e.month === month && plantSetLocal.has(e.plant)).sort((a, b) => a.score - b.score);
            const months = Object.keys(scoreEval).sort().reverse();
            const fmtU = unitFmt(unit);
            const penOf = mk => events.filter(e => e.rule === 'score' && e.month === mk && e.pct > 0 && plantSetLocal.has(e.plant));
            return (
                <div className="space-y-4">
                    <div className="flex items-center gap-2 flex-wrap">
